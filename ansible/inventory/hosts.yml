all:
  children:
    hypervisors:
      hosts:
        asela-k8s:
          ansible_host: 10.0.1.101
    k3s_nodes:
      children:
        k3s_control:
          hosts:
            k3s-control-01:
              ansible_host: 10.0.1.50
        k3s_workers:
          hosts:
            k3s-worker-01:
              ansible_host: 10.0.1.5
            k3s-worker-02:
              ansible_host: 10.0.1.108
