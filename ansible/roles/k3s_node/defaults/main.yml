---
k3s_node_netplan_file: /etc/netplan/50-cloud-init.yaml
k3s_node_interface: enp1s0
# Set false where there is no networkd to talk to (the test container).
k3s_node_netplan_apply: true
# Refuse to pin a static address unless the host's MAC, address and interface match host_vars.
# Tests set false: the container's network is not the worker's.
k3s_node_verify_host: true
