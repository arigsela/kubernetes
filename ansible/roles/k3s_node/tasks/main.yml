---
# The control plane's kube-apiserver authn files live in files/authn/ so this role is the single
# source for node-level k3s config, but ONLY playbooks/k3s-authn.yml installs them: installing
# restarts the API server and needs the validation that playbook does first.

- name: Pin the address as static netplan (hosts that define k3s_node_static_ip)
  when: k3s_node_static_ip is defined
  block:
    - name: The host must be the one host_vars describes
      ansible.builtin.assert:
        that:
          - ansible_facts['default_ipv4']['macaddress'] == k3s_node_mac
          - ansible_facts['default_ipv4']['address'] == (k3s_node_static_ip | split('/') | first)
          - ansible_facts['default_ipv4']['interface'] == k3s_node_interface
        fail_msg: >-
          REFUSED: host_vars do not match this host. k3s_node_mac={{ k3s_node_mac }} vs
          {{ ansible_facts['default_ipv4']['macaddress'] | default('none') }},
          k3s_node_static_ip={{ k3s_node_static_ip }} vs {{ ansible_facts['default_ipv4']['address'] | default('none') }},
          k3s_node_interface={{ k3s_node_interface }} vs {{ ansible_facts['default_ipv4']['interface'] | default('none') }}.
          Nothing was written.
        quiet: true
      when: k3s_node_verify_host | bool

    - name: Stop cloud-init from regenerating the netplan file
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Write the static netplan config
      ansible.builtin.template:
        src: netplan-static.yaml.j2
        dest: "{{ k3s_node_netplan_file }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      register: k3s_node_netplan

    - name: Validate, then apply
      when: k3s_node_netplan.changed and not ansible_check_mode
      block:
        - name: Netplan must accept the rendered config
          ansible.builtin.command: netplan generate  # noqa: command-instead-of-module
          changed_when: false

        - name: Apply (the address does not change, so the session survives)
          ansible.builtin.command: netplan apply  # noqa: command-instead-of-module
          changed_when: true
          when: k3s_node_netplan_apply | bool

        - name: The host must still answer
          ansible.builtin.wait_for_connection:
            delay: 5
            timeout: 90
          when: k3s_node_netplan_apply | bool
      rescue:
        - name: Restore the previous netplan file
          ansible.builtin.copy:
            remote_src: true
            src: "{{ k3s_node_netplan.backup_file }}"
            dest: "{{ k3s_node_netplan_file }}"
            owner: root
            group: root
            mode: "0600"
          when: k3s_node_netplan.backup_file is defined

        - name: Remove the rejected file (there was no previous one to restore)
          ansible.builtin.file:
            path: "{{ k3s_node_netplan_file }}"
            state: absent
          when: k3s_node_netplan.backup_file is not defined

        - name: Fail loudly
          ansible.builtin.fail:
            msg: >-
              netplan rejected the rendered config on {{ inventory_hostname }}; nothing was applied and
              {{ 'the previous file was restored' if k3s_node_netplan.backup_file is defined
              else 'the rejected file was removed (there was no previous one)' }}.
              Check k3s_node_static_ip / k3s_node_mac in host_vars.
