---
# ate-image-credentials.yml — the ECR credential provider that Substrate's atelet runs to pull private
# sandbox images (SPEC §T.129, §V.100; design and spike:
# docs/superpowers/specs/2026-10-18-substrate-ecr-pulls.md). On every worker (atelet runs only there)
# it lays down atelet's credential-provider bin dir:
#   /opt/ate-image-credential-provider/   root 0700. atelet mounts it read-only (atelet.imageCredentialProviderBinDir
#                                         in base-apps/substrate.yaml). It must stay OUTSIDE /var/lib/ate,
#                                         which every Substrate worker pod mounts read-write (§V.100).
#     ecr-credential-provider             root 0755, kubernetes/cloud-provider-aws, pinned by version + sha256
#     aws-credentials                     root 0600, profile [docs-checker-pull]: the pull-only IAM key
# It then runs the provider once on each worker, with only the environment atelet's config gives it,
# and checks that it returns credentials for the registry. The registry token stays inside that pipe.
#
# Run it through scripts/provision-docs-checker-pull.sh. The script reads the key from Vault
# (k8s-secrets/docs-checker-pull) and passes it in DOCS_CHECKER_PULL_AWS_ACCESS_KEY_ID and
# DOCS_CHECKER_PULL_AWS_SECRET_ACCESS_KEY. The key is never in git, on a command line, or in the play
# output (no_log). It is not part of site.yml for that reason.
#
#   scripts/provision-docs-checker-pull.sh --check                    # preview (--check --diff)
#   scripts/provision-docs-checker-pull.sh                            # install, or re-install from Vault
#   scripts/provision-docs-checker-pull.sh --limit k3s-worker-02      # one (new or rebuilt) worker
#
# The directory must exist on a worker BEFORE atelet starts there: the chart mounts it as a hostPath of
# type Directory, so atelet stays ContainerCreating without it.
#
# Bumping the binary: set ate_cp_version, and ate_cp_sha256 from "<ate_cp_url>.sha256", then re-run.
# Changing the key: the provider reads the file on every run, but atelet caches each token for about
# 6 h; `kubectl -n ate-system rollout restart ds/atelet` makes the new key take effect at once.
- name: Install atelet's ECR credential provider on the workers
  hosts: k3s_workers
  become: true
  gather_facts: true
  gather_subset: [min]
  vars:
    ate_cp_dir: /opt/ate-image-credential-provider
    ate_cp_binary: ecr-credential-provider   # = the provider name in the config
    ate_cp_credentials_file: aws-credentials
    ate_cp_profile: docs-checker-pull
    ate_cp_version: v1.37.0
    ate_cp_url: "https://artifacts.k8s.io/binaries/cloud-provider-aws/{{ ate_cp_version }}/linux/amd64/ecr-credential-provider-linux-amd64"
    ate_cp_sha256: 842e0fd8159f5ed8df2f38e6521e1e4f0a1ee80cf1e1ac119bbf20bf9c20681c
    ate_cp_expected_arch: x86_64   # ate_cp_url is the linux/amd64 build
    ate_cp_registry: 852893458518.dkr.ecr.us-east-2.amazonaws.com
    ate_cp_verify_image: "{{ ate_cp_registry }}/docs-checker"
    ate_cp_verify_retries: 6   # a just-created IAM key can take a few seconds to work
    ate_cp_verify_delay: 5
    # The provider's environment exactly as the config in base-apps/substrate.yaml sets it
    # (tests/substrate checks that they match), except the credentials file's path: atelet sees the bin
    # dir at /run/image-credential-provider/bin.
    ate_cp_env:
      AWS_SHARED_CREDENTIALS_FILE: "{{ ate_cp_dir }}/{{ ate_cp_credentials_file }}"
      AWS_PROFILE: "{{ ate_cp_profile }}"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_WEB_IDENTITY_TOKEN_FILE: ""
      AWS_ROLE_ARN: ""
      AWS_CONFIG_FILE: ""
      AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    # A stand-in for what atelet itself passes down (rustfs's variables, chart templates/atelet.yaml), with a
    # dummy key and an endpoint nothing answers on. The verify applies ate_cp_env ON TOP of it, as atelet
    # does, so if the config ever stops blanking one, the real binary picks up the dummy and the verify fails.
    ate_cp_inherited_env:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://127.0.0.1:9"
      AWS_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: AKIADUMMYINHERITED00
      AWS_SECRET_ACCESS_KEY: dummy-inherited-secret
    ate_cp_key_id: "{{ lookup('ansible.builtin.env', 'DOCS_CHECKER_PULL_AWS_ACCESS_KEY_ID') }}"
    ate_cp_secret: "{{ lookup('ansible.builtin.env', 'DOCS_CHECKER_PULL_AWS_SECRET_ACCESS_KEY') }}"
  tasks:
    - name: REFUSED unless the key came from the provisioning script
      ansible.builtin.assert:
        that:
          - ate_cp_key_id is match('^AKIA[0-9A-Z]{16}$')
          - ate_cp_secret | length == 40
        fail_msg: >-
          REFUSED: no pull key in the environment. Run scripts/provision-docs-checker-pull.sh, which reads
          it from Vault (k8s-secrets/docs-checker-pull) and runs this play. Nothing changed.
        quiet: true

    - name: REFUSED on another architecture
      ansible.builtin.assert:
        that: ansible_facts['architecture'] == ate_cp_expected_arch
        fail_msg: >-
          REFUSED: {{ inventory_hostname }} is {{ ansible_facts['architecture'] }}, but ate_cp_url is the
          {{ ate_cp_expected_arch }} build. Nothing changed.
        quiet: true

    - name: Is the bin dir there yet?
      ansible.builtin.stat:
        path: "{{ ate_cp_dir }}"
      register: ate_cp_dir_stat

    - name: The bin dir (root only; atelet mounts it read-only)
      ansible.builtin.file:
        path: "{{ ate_cp_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # get_url and copy fail in check mode when their directory does not exist yet, so a dry run on a
    # fresh worker only says what it would do.
    - name: DRY RUN on a worker without the bin dir
      ansible.builtin.debug:
        msg: >-
          (dry run) would create {{ ate_cp_dir }}, download {{ ate_cp_binary }} {{ ate_cp_version }}
          (sha256 {{ ate_cp_sha256 }}), write {{ ate_cp_credentials_file }} (0600) for key {{ ate_cp_key_id }},
          then verify credentials for {{ ate_cp_registry }}
      when: ansible_check_mode and not ate_cp_dir_stat.stat.exists

    - name: Install and verify
      when: not (ansible_check_mode and not ate_cp_dir_stat.stat.exists)
      block:
        - name: The provider binary, pinned by checksum
          ansible.builtin.get_url:
            url: "{{ ate_cp_url }}"
            dest: "{{ ate_cp_dir }}/{{ ate_cp_binary }}"
            checksum: "sha256:{{ ate_cp_sha256 }}"
            owner: root
            group: root
            mode: "0755"

        - name: The pull key (the provider reads it through AWS_SHARED_CREDENTIALS_FILE)
          ansible.builtin.copy:
            dest: "{{ ate_cp_dir }}/{{ ate_cp_credentials_file }}"
            content: |
              [{{ ate_cp_profile }}]
              aws_access_key_id = {{ ate_cp_key_id }}
              aws_secret_access_key = {{ ate_cp_secret }}
            owner: root
            group: root
            mode: "0600"
          register: ate_cp_key_file
          no_log: true

        # As atelet runs it: the request on stdin, and an environment built the way exec.go builds it, the
        # inherited variables (the stand-in) first, then the config's, the later assignment winning (env(1),
        # like Go's os/exec). Nothing from the host or the play gets in (env -i). So the real binary's SDK
        # proves, on each worker, that the blanks beat inherited keys and endpoint. Only the registry names
        # leave the pipe, never the token. Skipped in check mode.
        - name: Verify — the provider returns credentials for the registry
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              set -euo pipefail;
              printf '%s' '{"apiVersion":"credentialprovider.kubelet.k8s.io/v1","kind":"CredentialProviderRequest","image":"{{ ate_cp_verify_image }}"}'
              | env -i
              {% for k, v in ate_cp_inherited_env.items() %}{{ k }}={{ v | quote }} {% endfor %}
              {% for k, v in ate_cp_env.items() %}{{ k }}={{ v | quote }} {% endfor %}{{ ate_cp_dir }}/{{ ate_cp_binary }}
              | python3 -c 'import json, sys; auth = json.load(sys.stdin).get("auth") or {};
              print(" ".join(sorted(k for k, v in auth.items() if v.get("username") and v.get("password"))))'
          register: ate_cp_verify
          until: ate_cp_verify.rc == 0 and ate_cp_registry in ate_cp_verify.stdout.split()
          retries: "{{ ate_cp_verify_retries }}"
          delay: "{{ ate_cp_verify_delay }}"
          changed_when: false
          when: not ansible_check_mode   # explicit: `until` must not be evaluated on a check-mode skip

        - name: Verified
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: the provider returned credentials for {{ ate_cp_registry }}"
          when: not ansible_check_mode

        - name: The key changed
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} now holds key {{ ate_cp_key_id }}. atelet keeps tokens from the previous
              key for up to ~6 h; `kubectl -n ate-system rollout restart ds/atelet` switches now.
          when: ate_cp_key_file is changed and not ansible_check_mode
