# hk-demo's HTTP API (OpenAPI 3.0.3), shown in Backstage as API hk-demo-api (catalog/api-entities.yaml).
# A COPY of openapi.yaml in arigsela/hk-demo, where tests/test_openapi.py checks it against the app's
# code. Do not edit it here: change it in hk-demo and copy it over in the release PR that bumps the
# image (hk-demo README, Releasing). It is a file, not fetched live like the other API specs, because
# the app listens only behind its login sidecar, so Backstage cannot fetch it from the service.
openapi: 3.0.3
info:
  title: hk-demo
  version: 0.7.1
  description: |
    The API behind the hk demo page. Ask the homelab-knowledge (hk) agent a question, then
    follow the run as server-sent events: the agent's progress, its answer, then eight evidence
    boxes (Gateway, Login, hk demo, Identity check, kagent, Sandbox, Model API, Tools) built from
    the run's own trace, log lines and metrics.

    **Conversations.** Each run is one turn of a conversation. Send `conversation_id` to follow
    up: the turn continues its agent's session. A question that starts with `implementer:` goes
    to the implementer agent (it opens a pull request on arigsela/kubernetes; a human merges)
    instead of hk, and carries hk's latest answer as evidence. hk stays read-only.

    **On its own.** `/api/journeys` lists alerts the platform handled by itself (the dispatcher
    handed them to the implementer, which usually opened a pull request); a journey's events give
    ten boxes and the run's steps. `POST /api/journeys/demo` starts a real demo run on the
    cluster's alert-demo workload.

    **Who can call it.** The host answers only addresses on the Gateway's allow-list. An
    oauth2-proxy sidecar sits in front of the app: a request without a session is redirected
    (302) to Dex for a GitHub login, and only emails on the sidecar's list get through. The
    sidecar passes the email to the app as `X-Forwarded-Email`; without it the app answers 401.
    There is no API key: this API is for the page, not for scripts.

    **How the app calls the agent.** Over A2A, with its own service-account token (audience
    `kagent`), so kagent sees `system:serviceaccount:hk-demo:hk-demo`. The person who asked is
    recorded in the app's log line for the run.

    **One question at a time.** A second question before the running one has its answer gets 409.
    The earlier run's boxes keep filling after its answer. The app keeps its last 20 runs in
    memory; runs from the last 7 days are replayed from its own log lines, the agent's task and the
    trace, and their conversations can be continued.

    **What never reaches the client.** Emails are shown as `a•••@domain`, client IPs as /24,
    tokens are hidden, tool responses are dropped and log lines are cut at 600 characters.
servers:
  - url: https://hk-demo.arigsela.com
tags:
  - name: runs
    description: Ask a question and follow its run.
  - name: journeys
    description: On its own, alerts the platform handled by itself, and the demo trigger.
  - name: page
    description: The page itself.
  - name: health
    description: Health checks.
paths:
  /:
    get:
      tags: [page]
      summary: The demo page
      operationId: getPage
      responses:
        "200":
          description: The page. Its script and styles are served under `/static/`.
          content:
            text/html:
              schema:
                type: string
  /api/ask:
    post:
      tags: [runs]
      summary: Ask a question, or follow up in a conversation
      operationId: ask
      description: |
        Starts a run and returns its id at once. The answer and the evidence come on the run's
        event stream (`GET /api/runs/{run_id}/events`). Without `conversation_id` it starts a new
        conversation; with one it is the conversation's next turn. `implementer: <request>` sends
        the request to the implementer agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAccepted"
        "400":
          description: >-
            The body is not `{"question": "..."}` (with an optional `conversation_id` of 32 hex
            characters), the question is empty or longer than 2000 characters, or nothing follows
            `implementer:`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "404":
          description: >-
            `conversation_id` is not a conversation in memory or in the app's log lines of the last
            7 days (`no such conversation (the app keeps 7 days)`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A question is already running (`a question is already running`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The conversation is not in memory and the app's log lines (Loki) could not be read
            within 10 s. Nothing was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/conversations:
    get:
      tags: [runs]
      summary: Recent conversations
      operationId: listConversations
      description: >-
        Up to 15 conversations, the one with the newest turn first, each with its turns in order.
        A run logged before conversations existed is a one-turn hk conversation whose id is its
        run id.
      responses:
        "200":
          description: The conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/LoginRequired"
  /api/runs:
    get:
      tags: [runs]
      summary: Recent runs
      operationId: listRuns
      description: Up to 20 runs, newest first, from memory and from the app's log lines (7 days).
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"
        "401":
          $ref: "#/components/responses/LoginRequired"
  /api/runs/{run_id}/events:
    get:
      tags: [runs]
      summary: Follow a run
      operationId: runEvents
      description: |
        Server-sent events. Each message is `event: <name>` and `data: <JSON>`; the schema below
        is one message. A run starts with `question` (which turn of which conversation, and the
        agent), then `ids`, then `progress` while the agent works, then `answer`, then `boxes`
        (more than once, as evidence arrives; the last one is final). A run from Recent runs is
        replayed the same way. `failed` reports a failure
        and is still followed by `boxes` where there is evidence. `done` is always last, and the
        server then closes the stream. A run the app has no record of gives `failed` then `done`.
      parameters:
        - name: run_id
          in: path
          required: true
          description: The id from `POST /api/ask` or `GET /api/runs`.
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/QuestionEvent"
                  - $ref: "#/components/schemas/IdsEvent"
                  - $ref: "#/components/schemas/ProgressEvent"
                  - $ref: "#/components/schemas/AnswerEvent"
                  - $ref: "#/components/schemas/BoxesEvent"
                  - $ref: "#/components/schemas/FailedEvent"
                  - $ref: "#/components/schemas/DoneEvent"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "404":
          description: The run id is not 32 hex characters (`no such run`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/journeys:
    get:
      tags: [journeys]
      summary: Alerts the platform handled by itself
      operationId: listJourneys
      description: >-
        The On its own tab's list: the dispatcher's investigations by the implementer from the
        last 7 days, newest first, joined from the dispatcher's own log lines, each with the pull
        request the run opened (from GitHub; null when GitHub did not answer or there is none).
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JourneySummary"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "503":
          description: Loki did not answer (`could not read the dispatcher's log (Loki); try again`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/journeys/demo:
    get:
      tags: [journeys]
      summary: The demo workload's status
      operationId: demoStatus
      description: >-
        The alert-demo workload (kubernetes base-apps/alert-demo) and whether Start would be
        accepted now, with the reason in words when not.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/LoginRequired"
    post:
      tags: [journeys]
      summary: Start a demo run
      operationId: startDemo
      description: >-
        Asks the demo workload to hold its memory near its limit for 30 minutes, so the real
        "Container near memory limit" alert fires (about 16 minutes later) and the dispatcher
        hands it to the implementer. A real alert, finding and pull request follow. The app logs
        who started it. Refused while a run is on, while the implementer has 3 open pull
        requests (the dispatcher would skip the alert), or within 6 hours of the dispatcher last
        looking at the same pod.
      responses:
        "202":
          description: Started; the status after the fill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "403":
          description: Sent from another site (`Sec-Fetch-Site` other than `same-origin`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused, with the reason (a run is on, open pull requests, the 6 h repeat).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The workload answered something other than 202 or 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The demo workload did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/journeys/demo/stop:
    post:
      tags: [journeys]
      summary: Stop a demo run
      operationId: stopDemo
      description: >-
        Ends a demo run early (a Start pressed by mistake): the workload lets its memory go, so the
        alert does not fire, or resolves. The app logs who stopped it.
      responses:
        "200":
          description: Stopped; the status after.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "403":
          description: Sent from another site (`Sec-Fetch-Site` other than `same-origin`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The demo workload did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/journeys/{journey_id}/events:
    get:
      tags: [journeys]
      summary: Follow an alert the platform handled
      operationId: journeyEvents
      description: |
        Server-sent events, as for a run: `journey` (the run's summary and its steps in order),
        then `boxes` and `journey` again after each piece of evidence arrives (the memory series,
        the waypoint's line, the implementer's trace, the pull request); the last of each is
        final. `done` is always last. An unknown id gives `failed` then `done`.
      parameters:
        - name: journey_id
          in: path
          required: true
          description: The id from `GET /api/journeys` (the alert's fingerprint and the dispatch time).
          schema:
            type: string
            pattern: "^[0-9a-f]{8,32}-[0-9]{9,11}$"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JourneyEvent"
                  - $ref: "#/components/schemas/BoxesEvent"
                  - $ref: "#/components/schemas/FailedEvent"
                  - $ref: "#/components/schemas/DoneEvent"
        "401":
          $ref: "#/components/responses/LoginRequired"
        "404":
          description: The id is not in the journey id format (`no such run`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /healthz:
    get:
      tags: [health]
      summary: The app's health check
      operationId: healthz
      description: >-
        Used by the pod's own probes, inside the pod. Through the Gateway it needs a
        login like every other path.
      responses:
        "200":
          description: The app is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
  /ping:
    get:
      tags: [health]
      summary: The login sidecar's health check
      operationId: ping
      description: >-
        Answered by the oauth2-proxy sidecar without a login; the homelab monitor
        checks it. It says nothing about the app behind the sidecar.
      responses:
        "200":
          description: The sidecar is up.
          content:
            text/plain:
              schema:
                type: string
                example: OK
components:
  responses:
    LoginRequired:
      description: >-
        No `X-Forwarded-Email`: the request did not come through the login sidecar
        (`login required`). Through the sidecar, a request without a session gets a 302 to Dex
        instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in plain words.
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            The question. Starting it with `implementer:` sends the rest to the implementer agent.
          example: Which namespaces run more than one Deployment?
        conversation_id:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{32}$"
          description: The conversation to follow up in; omit it to start a new one.
    AskAccepted:
      type: object
      required: [run_id, conversation_id, agent, turn, question]
      properties:
        question:
          type: string
          description: The question as the app recorded it, emails and IPs masked.
        run_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        conversation_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        agent:
          $ref: "#/components/schemas/AgentRef"
        turn:
          type: integer
          minimum: 1
    AgentRef:
      type: string
      pattern: "^[a-z0-9-]+/[a-z0-9-]+$"
      example: kagent/implementer
      description: >-
        The agent the turn went to, `<namespace>/<name>`: hk (`HK_AGENT`, by default
        kagent/homelab-knowledge) or the implementer (`IMPLEMENTER_AGENT`, by default
        kagent/implementer). The page calls an agent named `implementer` "implementer", any other
        "hk".
    Conversation:
      type: object
      required: [conversation_id, started, updated, turns]
      properties:
        conversation_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        started:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
          description: When its latest turn started.
        turns:
          type: array
          items:
            $ref: "#/components/schemas/ConversationTurn"
    ConversationTurn:
      type: object
      required: [run_id, agent, turn, question, state, started]
      properties:
        run_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        agent:
          $ref: "#/components/schemas/AgentRef"
        turn:
          type: integer
          minimum: 1
        question:
          type: string
        state:
          type: string
          nullable: true
        started:
          type: string
          format: date-time
    RunSummary:
      type: object
      required: [run_id, started, question, state, agent, conversation_id, turn]
      properties:
        run_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        started:
          type: string
          format: date-time
        question:
          type: string
        state:
          type: string
          nullable: true
          description: The A2A task state, such as `TASK_STATE_COMPLETED`; null while it runs.
        agent:
          $ref: "#/components/schemas/AgentRef"
        conversation_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        turn:
          type: integer
          minimum: 1
    QuestionEvent:
      type: object
      description: The run's question, the agent it went to and its turn (first event).
      required: [event, data]
      properties:
        event:
          type: string
          enum: [question]
        data:
          type: object
          required: [question, agent, conversation_id, turn]
          properties:
            question:
              type: string
            agent:
              $ref: "#/components/schemas/AgentRef"
            conversation_id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            turn:
              type: integer
              minimum: 1
    IdsEvent:
      type: object
      description: The agent accepted the run.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [ids]
        data:
          type: object
          required: [context_id, task_id]
          properties:
            context_id:
              type: string
              description: The kagent session (A2A context) id.
            task_id:
              type: string
              description: The A2A task id.
    ProgressEvent:
      type: object
      description: >-
        What the agent is doing. Tool calls carry their arguments (each string masked
        and cut); tool responses are never sent. A replay rebuilds this feed from the trace,
        without arguments.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [progress]
        data:
          type: object
          required: [kind, text, tool, args]
          properties:
            kind:
              type: string
              enum: [status, tool]
            text:
              type: string
              example: calling k8s_get_resources
            tool:
              type: string
              nullable: true
            args:
              type: object
              nullable: true
              additionalProperties: true
    AnswerEvent:
      type: object
      description: The agent's answer.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [answer]
        data:
          type: object
          required: [text, state]
          properties:
            text:
              type: string
            state:
              type: string
              example: TASK_STATE_COMPLETED
    BoxesEvent:
      type: object
      description: >-
        The evidence boxes, in map order: eight for a run, ten for an alert the platform handled
        (On its own). Sent more than once as the trace and log lines arrive; the last one is final.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [boxes]
        data:
          type: object
          required: [boxes]
          properties:
            boxes:
              type: array
              minItems: 8
              maxItems: 10
              items:
                $ref: "#/components/schemas/Box"
    FailedEvent:
      type: object
      description: The run, or reading its evidence, failed. `done` still follows.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [failed]
        data:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              example: "HTTP 401 from kagent: ..."
    DoneEvent:
      type: object
      description: The last event. The server closes the stream after it.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [done]
        data:
          type: object
          additionalProperties: false
    JourneySummary:
      type: object
      required: [journey_id, fired, alertname, rule, target, verdict, state, pr]
      properties:
        journey_id:
          type: string
          example: c61debdd8f53759f-1792765632
        fired:
          type: string
          format: date-time
          description: When the dispatcher received the alert from Grafana.
        alertname:
          type: string
        rule:
          type: string
          description: The dispatch table's row.
        target:
          type: string
          nullable: true
          example: alert-demo/alert-demo-6d5f9c7b8-x2kqp (alert-demo)
        verdict:
          type: string
          nullable: true
          enum: [limit-too-low, leak, contention, rollout-pending, inconclusive, null]
        state:
          type: string
          nullable: true
          description: The implementer's task state; null while it is investigating.
        pr:
          type: object
          nullable: true
          required: [number, state, merged]
          properties:
            number:
              type: integer
            state:
              type: string
              enum: [open, closed]
            merged:
              type: boolean
    JourneyStep:
      type: object
      required: [at, who, text, boxes, state]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
        who:
          type: string
          enum: [Grafana, Dispatcher, Implementer, Slack, Human]
        text:
          type: string
          description: Masked. The implementer's answer step carries the pull request's title and body.
        boxes:
          type: array
          description: The boxes this step touched.
          items:
            type: string
        state:
          type: string
          enum: [ok, failed, waiting, human]
    JourneyEvent:
      type: object
      description: The run's summary and its steps. Sent first, then again with each `boxes`.
      required: [event, data]
      properties:
        event:
          type: string
          enum: [journey]
        data:
          type: object
          required: [journey, steps]
          properties:
            journey:
              $ref: "#/components/schemas/JourneySummary"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/JourneyStep"
    DemoStatus:
      type: object
      required: [workload, reachable, open_prs, last_investigated, can_start, reason, alert_expected]
      properties:
        workload:
          type: object
          nullable: true
          description: The workload's own `/status` (state idle or holding, times, bytes, pod).
          additionalProperties: true
        reachable:
          type: boolean
        open_prs:
          type: integer
          nullable: true
          description: The implementer's open pull requests; null when GitHub did not answer.
        last_investigated:
          type: string
          format: date-time
          nullable: true
          description: When the dispatcher last investigated this pod.
        can_start:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Why Start would be refused now, in words.
        alert_expected:
          type: string
          format: date-time
          nullable: true
          description: While a run is on, about when the alert should fire.
    Box:
      type: object
      description: >-
        One piece of the platform the request went through, with what this run's
        evidence shows about it.
      required: [id, title, what, checks, numbers, logs, spans, config, state, grafana_url,
                 failed_lines, link_text]
      properties:
        id:
          type: string
          enum: [gateway, login, app, identity, kagent, sandbox, model, tools, alert, dispatcher, pr,
                 slack, human]
          description: >-
            The Ask hk tab's eight boxes, and the On its own tab's ten (alert, dispatcher, identity,
            kagent, sandbox, model, tools, pr, slack, human).
        title:
          type: string
        what:
          type: string
          description: What this piece does, in one or two sentences.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        numbers:
          type: object
          description: Figures for this run, such as calls, cost or tool time.
          additionalProperties:
            type: string
          example:
            calls: "9"
            tool time: "5.9 s"
            failed: "1"
        logs:
          type: array
          maxItems: 200
          description: This run's log lines for this piece, masked and cut at 600 characters.
          items:
            type: string
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        config:
          type: array
          description: Excerpts of the settings in arigsela/kubernetes that apply here.
          items:
            $ref: "#/components/schemas/ConfigExcerpt"
        state:
          type: string
          enum: [waiting, partial, done, failed, human, decided]
          description: "`failed` when any check saw a failure. On its own only: `human` waits for a
            person (an open pull request, a restart to approve); `decided`: a person merged or
            closed it (never a platform ✓)."
        grafana_url:
          type: string
          description: >-
            Where the box's link goes: Grafana, opened on this run's trace and log lines, or for
            the On its own tab's pull request and human boxes, the pull request.
        link_text:
          type: string
          description: The link's label, such as "Open in Grafana →".
        failed_lines:
          type: array
          description: Indexes into `logs` of the lines that report a failure.
          items:
            type: integer
    Check:
      type: object
      required: [kind, text, ok]
      properties:
        kind:
          type: string
          enum: [observed, configured]
          description: "`observed`: seen in this run's trace, log lines or metrics. `configured`:
            a setting that applies to every request."
        text:
          type: string
        ok:
          type: boolean
          nullable: true
          description: >-
            true when seen and fine, false when seen and failed, null while the
            evidence is on its way.
    Span:
      type: object
      required: [name, service, duration_ms, attrs]
      properties:
        name:
          type: string
          example: execute_tool k8s_get_resources
        service:
          type: string
        duration_ms:
          type: number
        attrs:
          type: object
          description: >-
            An allow-list of the span's attributes (model, tokens, cost, tool name,
            caller identity).
          additionalProperties: true
        error:
          type: string
          description: The span's status message, only when the span ended in error.
    ConfigExcerpt:
      type: object
      required: [source, text]
      properties:
        source:
          type: string
          description: The file in arigsela/kubernetes.
        text:
          type: string
