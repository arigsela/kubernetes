# base-apps/substrate/cert-restart-cronjob.yaml
# Twice-daily restart of atenet-router and atenet-egress (SPEC T114).
#
# WHY: their pod certificates (podidentity/servicedns.podcert.ate.dev) are issued for 24 h, the
# signer caps them there (no Helm knob), and the kubelet does refresh them at 23.5 h, but the
# agentgateway inside both pods never reloads the rotated file (agentgateway#3751, fix #3794;
# substrate#2329). On 2026-10-13 every new agent session failed with `-32004` for an hour
# after the certificates ran out ("received fatal alert: CertificateExpired" in the router).
# A restart reissues the certificate; twice a day keeps every process well inside 24 h.
# Sessions survive (actors resume from snapshots); a turn in flight at that moment is retried
# by the client (KAGENT_SEND_NOT_ACCEPTED). Remove this when the chart ships an agentgateway
# with the fix (0.5.0-alpha3 exists; check its digest against #3794 at the next lockstep bump).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-cert-restart
  namespace: ate-system
  labels:
    app.kubernetes.io/name: substrate-cert-restart
    app.kubernetes.io/part-of: substrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-cert-restart
  namespace: ate-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["atenet-router", "atenet-egress"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-cert-restart
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: substrate-cert-restart
subjects:
  - kind: ServiceAccount
    name: substrate-cert-restart
    namespace: ate-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: substrate-cert-restart
  namespace: ate-system
  labels:
    app.kubernetes.io/name: substrate-cert-restart
    app.kubernetes.io/part-of: substrate
spec:
  # 03:23 and 15:23 UTC: twelve hours apart, so a certificate is never older than ~12 h.
  schedule: "23 3,15 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: substrate-cert-restart
            app.kubernetes.io/name: substrate-cert-restart
            app.kubernetes.io/part-of: substrate
        spec:
          serviceAccountName: substrate-cert-restart
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: application
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532   # distroless nonroot
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              # The official kubectl image (distroless, no shell): one kubectl invocation restarts
              # both deployments. bitnami/kubectl tags were removed from Docker Hub in 2025 and
              # 1.30 no longer pulls (SPEC T115 for the other user of that tag).
              image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
              args:
                - -n
                - ate-system
                - rollout
                - restart
                - deployment/atenet-router
                - deployment/atenet-egress
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
