# Substrate's seven CA/JWT pool Secrets, from Vault key k8s-secrets/substrate-cas.
#
# `kagent install` generates these imperatively (substrate_init.go @ kagent v1.0.0-alpha11);
# scripts/provision-kagent-1-0-vault.sh generates the same material in the same formats and
# stores it in Vault, and these ExternalSecrets rebuild the exact Secrets the CLI would create:
#
#   Secret (namespace)                                   type               keys        key type
#   actor-id-jwt-pool    (ate-system)                    Opaque             pool        ES256 (P-256)
#   actor-id-ca-pool     (ate-system)                    kubernetes.io/tls  pool, tls.* ED25519
#   actor-id-ca-certs    (ate-system)                    Opaque             ca.crt      (actor-id CA cert)
#   egress-mitm-ca-pool  (ate-system)                    kubernetes.io/tls  pool, tls.* ECDSA P-256
#   service-dns-ca-pool  (podcertificate-controller-sys) kubernetes.io/tls  pool, tls.* ED25519
#   pod-identity-ca-pool (podcertificate-controller-sys) kubernetes.io/tls  pool, tls.* ED25519
#   postgres-ca-pool     (podcertificate-controller-sys) kubernetes.io/tls  pool, tls.* ED25519
#
# `pool` is the JSON the Substrate signers load (internal/localca, internal/localjwtauthority):
#   {"CAs":[{"ID":"1","SigningKeyPKCS8":<b64 DER>,"RootCertificateDER":<b64 DER>}],"ActiveForSigning":"1"}
# tls.crt / tls.key are the same CA as PEM (CERTIFICATE / PKCS#8 "PRIVATE KEY"); atenet-egress
# mounts them for egress-mitm-ca-pool, the signers read only `pool`.
#
# The CAs are valid 365 days and nothing renews them. ca-expiry-cronjob.yaml + the Grafana rule
# `substrate-ca-expiry` warn 30 days ahead; rotation is in runbook.md (needs restarts,
# substrate#1931). Vault property names: <secret>, <secret>-crt, <secret>-key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-jwt-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: actor-id-jwt-pool
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        pool: "{{ .pool }}"
  data:
    - secretKey: pool
      remoteRef:
        key: substrate-cas
        property: actor-id-jwt-pool
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: actor-id-ca-pool
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        pool: "{{ .pool }}"
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: pool
      remoteRef:
        key: substrate-cas
        property: actor-id-ca-pool
    - secretKey: crt
      remoteRef:
        key: substrate-cas
        property: actor-id-ca-pool-crt
    - secretKey: key
      remoteRef:
        key: substrate-cas
        property: actor-id-ca-pool-key
---
# The actor-id CA's certificate on its own, for atenet-egress to verify actor identities.
# substrate_init.go derives it from actor-id-ca-pool (one PEM block per CA in the pool); the
# pool holds one CA, so it is that CA's tls.crt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-certs
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: actor-id-ca-certs
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        ca.crt: "{{ .crt }}"
  data:
    - secretKey: crt
      remoteRef:
        key: substrate-cas
        property: actor-id-ca-pool-crt
---
