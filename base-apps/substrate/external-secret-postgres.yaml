# Substrate's two Postgres connection strings, in the Secrets and keys the chart reads by default
# (postgres.readWriteConnectionStringSecretRef / ownerConnectionStringSecretRef).
#
# Database `substrate` on the shared pgvector Postgres (postgresql.postgresql.svc), prepared by
# base-apps/postgresql/init-substrate-db.yaml: NOLOGIN roles substrate_owner / substrate_readwrite,
# schema `substrate` owned by substrate_owner, one login user per role. ateapi runs
# `SET ROLE <role>` after connecting and pins search_path itself, so the strings carry neither.
#
# Password auth (postgres.clientCertificates.enabled=false in base-apps/substrate.yaml): this
# Postgres has no TLS and does not trust Substrate's postgres CA, hence sslmode=disable.
# The passwords are 64 hex characters (the provisioning script), so they need no URL escaping.
#
# pool_max_conns=5 on the read/write string: the pgxpool default is max(4, NumCPU) = 10 per
# replica on these nodes, and ate-api-server runs 2 replicas (+2 owner, +3 watch connections
# each) against a Postgres with max_connections=100 shared with n8n and kagent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-readwrite
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: substrate-postgres-readwrite
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        readWriteConnectionString: >-
          postgres://{{ .user }}:{{ .password }}@postgresql.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=disable&pool_max_conns=5
  data:
    - secretKey: user
      remoteRef:
        key: substrate-db
        property: readwrite-user
    - secretKey: password
      remoteRef:
        key: substrate-db
        property: readwrite-password
    - secretKey: db
      remoteRef:
        key: substrate-db
        property: db-name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-postgres-owner
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: substrate-postgres-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ownerConnectionString: >-
          postgres://{{ .user }}:{{ .password }}@postgresql.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=disable
  data:
    - secretKey: user
      remoteRef:
        key: substrate-db
        property: owner-user
    - secretKey: password
      remoteRef:
        key: substrate-db
        property: owner-password
    - secretKey: db
      remoteRef:
        key: substrate-db
        property: db-name
