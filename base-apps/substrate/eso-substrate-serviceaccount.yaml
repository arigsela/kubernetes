# Dedicated ESO ServiceAccount for Substrate's Vault material. The Vault kubernetes-auth role
# `substrate` is bound to THIS name in ate-system, podcertificate-controller-system and
# postgresql (the postgresql copy lives in base-apps/postgresql/), and its policy reads exactly
# two keys: k8s-secrets/data/substrate-db and k8s-secrets/data/substrate-cas.
# Provisioned by scripts/provision-kagent-1-0-vault.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-substrate
  namespace: ate-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-substrate
  namespace: podcertificate-controller-system
