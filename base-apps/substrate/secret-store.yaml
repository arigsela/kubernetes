# Path-scoped SecretStores for Substrate, one per namespace that needs Vault material. Both
# authenticate as eso-substrate against the Vault kubernetes-auth role `substrate`, whose policy
# reads only k8s-secrets/data/substrate-db and k8s-secrets/data/substrate-cas.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-substrate
  namespace: ate-system
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: substrate
          serviceAccountRef:
            name: eso-substrate
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-substrate
  namespace: podcertificate-controller-system
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: substrate
          serviceAccountRef:
            name: eso-substrate
