# kagent 1.0.0-alpha14 (§T.128; plan docs/superpowers/plans/2026-10-18-kagent-alpha14-migration.md).
# Needs, already in place:
#   * Agent Substrate (base-apps/substrate*.yaml): agents run as Substrate actors.
#   * database kagent_v1 and Secrets kagent-postgres-owner / kagent-postgres-readwrite
#     (base-apps/postgresql/init-kagent-v1-db.yaml, base-apps/kagent/kagent-postgres-{owner,readwrite}-external-secret.yaml).
#   * kagent-crds 1.0.0-alpha14 (base-apps/kagent-crds.yaml). The kmcp subchart is gone since alpha14.
# The agents themselves (AgentTemplates, Harnesses, Agents, ModelConfigs) live in
# base-apps/kagent/ and are synced by the kagent-secrets app; none is rendered by this chart.
#
# Images are pinned by digest through each `tag` ("<version>@sha256:..."), because the chart's
# image helpers take a tag but no digest key. Renovate does not see these (Helm valuesObject):
# its kagent-substrate group PR note says to re-pin them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kagent
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    chart: kagent
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 1.0.0-alpha14
    helm:
      valuesObject:
        # Two logins since alpha14 (kagent#3160): the owner migrates at startup and owns the
        # schema; the read/write login serves every runtime query. Both Secrets come from the
        # same scoped Vault key (kagent-postgres-{owner,readwrite}-external-secret.yaml).
        # The roles, schema and pgvector location live under config.database below.
        # pgvector is pre-installed in schema extensions (the controller checks, and refuses to
        # start if it is missing). The 0.10 database `kagent` is the read-only archive.
        database:
          postgres:
            ownerConnectionStringSecretRef:
              name: kagent-postgres-owner
              key: ownerConnectionString
            readWriteConnectionStringSecretRef:
              name: kagent-postgres-readwrite
              key: readWriteConnectionString

        # Application settings (alpha13, kagent#3153): rendered into the mounted
        # /etc/kagent/controller.yaml; nothing is read from env any more. Durations are seconds.
        # Standalone sandboxes (config.sandboxes.guestImage) stay unset on purpose: nothing here uses them.
        config:
          server:
            auth:
              # Callers as principals (V91): the mesh is the identity authority. The waypoint in
              # base-apps/kagent/ verifies every caller's token and sets x-user-id from the claim;
              # the controller reads that header, so `insecure` here is exact, not an omission.
              # `trusted-proxy` would need every caller, the UI included, to carry a JWT: that is
              # the UI-login follow-up (oauth2-proxy + Dex).
              mode: insecure
          database:
            owner:
              role: kagent_owner
            readWrite:
              role: kagent_readwrite
            schema: kagent
            vectorSchema: extensions
            vectorEnabled: true
          gateway:
            # The A2A base advertised in agent cards (JSON-RPC <url>/agents/<ns>/<name>, gRPC <url>)
            # and the push-notification JWT issuer. External clients ("ask hk", Backstage) reach the
            # agents through the kagent-mcp HTTPRoute (/agents/kagent/ -> kagent-controller:8083),
            # behind the IP allow-list. Agent pods do not use this: the controller injects the
            # in-cluster http://kagent-controller.kagent:8083 into them.
            publicUrl: https://kagent-mcp.arigsela.com
          sessions:
            # Sessions idle for 30 days are deleted (chart default 7 days). A homelab agent is often
            # picked up again weeks later, and an idle session costs only rows in kagent_v1: its
            # actor is suspended and its snapshot sits in rustfs. Running tasks and turns waiting
            # for approval never expire; audit history and memory are kept either way.
            idleTtl: 2592000s
          # Agents run as Agent Substrate actors (base-apps/substrate.yaml). These are the names
          # the substrate release (named `substrate`, in ate-system) renders; `kagent install`
          # uses the same two values.
          substrate:
            apiEndpoint: dns:///api.ate-system.svc:443
            routerUrl: http://atenet-router.ate-system.svc:80
          # Traces → the cluster collector (gRPC 4317; http:// = no TLS), which keeps every kagent
          # trace (service.namespace=kagent) and forwards to Tempo and Coroot (§V.104). Not straight
          # to Coroot: kagent's exporters gzip and Coroot's receiver refuses gzip, so nothing ever
          # arrived (§B.37). No OTLP logs: the controller's stdout reaches Loki through Alloy and a
          # session's through ateom. Metrics stay with Prometheus. The same for the agent runtimes
          # (runtimeDefaults), which on alpha11 inherited the single otel block.
          telemetry:
            traces:
              endpoint: http://otel-collector.tracing.svc.cluster.local:4317
              protocol: grpc
          runtimeDefaults:
            telemetry:
              traces:
                endpoint: http://otel-collector.tracing.svc.cluster.local:4317
                protocol: grpc

        controller:
          image:
            tag: "1.0.0-alpha14@sha256:7f9958d696623b04332519e2a0a22c756724539c9e269f6ee626e0aeb102cd42"
          # alpha11's `controller.substrate.enabled: true` did two things: configure the
          # Substrate endpoints (now config.substrate above) AND project the Substrate
          # ServiceDNS trust bundle and the PodIdentity certificate into the controller
          # (/run/substrate-servicedns, /run/substrate-podidentity). alpha14 splits the
          # second half into this switch, default false. Without it the controller has no
          # client certificate for ate-api-server and every agent run fails (Codex review
          # of this plan, 2026-10-18; chart templates/controller-deployment.yaml).
          substrateClientCertificate:
            enabled: true

        # The WorkerPool every Harness references (substrate.workerPoolRef: kagent-default).
        # ate-controller runs it as a Deployment of gVisor workers in `kagent` (UID 0, 13
        # capabilities, seccomp/AppArmor Unconfined; see base-apps/substrate.yaml). Workers are
        # shared: actors from every agent land on any free worker, and the worker's limits are
        # the envelope its sandboxes share (Substrate docs/api-guide.md, "Worker Capacity").
        # Sizing: the 0.10 agents each ran at 100m-1000m CPU and 256Mi-1Gi memory; two workers
        # of up to 2 CPU / 4Gi each cover several concurrent sessions, and idle actors are
        # suspended to free their worker. Workers cannot run on k3s-control-01 (tainted, no
        # toleration), so they spread over the two workers. Revisit after the Phase 5 acceptance.
        # Since alpha12 the chart also creates the ServiceAccount `kagent-default` for the worker
        # pods (kagent#3067); nothing binds it.
        substrateWorkerPool:
          create: true
          name: kagent-default
          replicas: 2
          sandboxClass: gvisor
          workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.5.0-alpha2@sha256:5869cdace628f93d39d913e41f91f2862db8bb7ca8ae2c6c756ee31015b3d719
          template:
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi

        ui:
          image:
            tag: "1.0.0-alpha14@sha256:3795ceebd70e3e17d2fb6500ffab1eb8d1f366c4c605ba90d90c9f811ef0344d"

        # The chart ALWAYS renders `default-model-config`: Argo drops a `null` value, so
        # `providers: null` left the chart default in place (OpenAI gpt-4.1-mini, no key) on
        # 2026-10-11. Point it at Anthropic Haiku 5.5 on the Vault-backed key instead, so the
        # default for UI-created agents is a reviewed, working model. No agent in git uses it:
        # they reference base-apps/kagent/model-configs/.
        providers:
          default: anthropic
          anthropic:
            provider: Anthropic
            model: claude-haiku-5-5
            # Through the model gateway (§T.137): budget group ui-default
            # (base-apps/model-gateway/budgets.yaml). `config` renders into spec.anthropic.
            apiKeySecretRef: model-gateway-key-ui-default
            apiKeySecretKey: ANTHROPIC_API_KEY
            config:
              baseUrl: http://model-gateway.model-gateway.svc.cluster.local:8080

        # The tool server's RBAC is NOT the chart's. rbac.create=false keeps the kagent-tools
        # ServiceAccount and drops the chart's `*` ClusterRole and binding;
        # base-apps/cluster-rbac/kagent-tools.yaml binds "cluster-admin minus Secrets" instead.
        # Why: one SA serves every agent's tools, and on 2026-07-15 the read-only k8s-reader
        # listed every Secret through it. Verify: tests/agent-capability/test_kagent_tools_rbac.py.
        kagent-tools:
          rbac:
            create: false
          # Tool calls and failures per tool (kagent_tools_mcp_invocations_total, ..._failure_total)
          # for the MCP Tool Calls dashboard. One container, no init container (§V.103).
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8085"
            prometheus.io/path: /metrics
          tools:
            image:
              tag: "0.3.0@sha256:cb89eb76216195a90cac73846b447525b6e6e33e45154d1ded9621bf11340315"

        # grafana-mcp never worked here (it pointed at grafana.kagent:3000; Grafana lives in
        # `logging`) and nothing binds it.
        grafana-mcp:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
