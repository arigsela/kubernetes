# kagent 1.0's database connection: Secret `kagent-postgres`, key `connectionString`, the chart's
# default database.postgres.connectionStringSecretRef (1.0 removed url/urlFile). Unused until
# the cutover installs kagent 1.0; it exists earlier so the database and this string are proven
# before the agents depend on them.
#
# Database kagent_v1 on the shared pgvector Postgres, prepared by
# base-apps/postgresql/init-kagent-v1-db.yaml. The controller assumes role kagent_owner and
# schema kagent itself (database.postgres.role / schema values), so the string carries neither.
# No TLS on that Postgres, hence sslmode=disable. The v1 password is 64 hex characters
# (scripts/provision-kagent-1-0-vault.sh), so it needs no URL escaping.
#
# Credential-scoped per the agent-identity contract: the existing vault-kagent-db store (ESO SA
# eso-kagent-db -> Vault role kagent-db, which reads only k8s-secrets/data/kagent-db), new v1-*
# properties on that same key. No new Vault role for kagent 1.0.
# kagent reads the Secret once at startup: after a password change, restart the controller.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kagent-db
    kind: SecretStore
  target:
    name: kagent-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connectionString: >-
          postgres://{{ .user }}:{{ .password }}@postgresql.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=disable
  data:
    - secretKey: user
      remoteRef:
        key: kagent-db
        property: v1-user
    - secretKey: password
      remoteRef:
        key: kagent-db
        property: v1-password
    - secretKey: db
      remoteRef:
        key: kagent-db
        property: v1-db-name
