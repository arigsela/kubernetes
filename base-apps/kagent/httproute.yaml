# Gateway API replacement for this app's nginx Ingress (T56).
# Lives in the app namespace so the backendRef is same-namespace and needs no
# second ReferenceGrant. Backend read from the LIVE Ingress, not inferred.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Kagent
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-robot
    gethomepage.dev/description: Agent platform UI
    # This route backends kagent-ui, so select that pod specifically. Omitting
    # pod-selector does NOT skip the lookup — Homepage guesses
    # app.kubernetes.io/name=<service> and logs an error every refresh when it
    # misses. The kagent namespace runs many independently-labelled agents.
    gethomepage.dev/pod-selector: app.kubernetes.io/component=ui
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-kagent
  hostnames:
    - kagent.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-ui
          port: 8080
