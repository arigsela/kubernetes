# kagent >= 1.0.0-alpha14 (kagent#3160) reads two database connection strings. This one is the
# read/write login: every runtime query the controller serves runs with it, as role
# kagent_readwrite (database.postgres.readwrite values). It cannot change the schema.
#
# Database kagent_v1, prepared by base-apps/postgresql/init-kagent-v1-db.yaml. Its Vault
# properties are v1-readwrite-user / v1-readwrite-password (written by
# scripts/provision-kagent-1-0-vault.sh before the Job runs). The string carries no role: kagent
# assumes kagent_readwrite itself. No TLS on that Postgres, hence sslmode=disable.
# Same scoped store and Vault role as kagent-postgres (eso-kagent-db -> kagent-db); a new
# Secret name, not a new credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-readwrite
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kagent-db
    kind: SecretStore
  target:
    name: kagent-postgres-readwrite
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        readWriteConnectionString: >-
          postgres://{{ .user }}:{{ .password }}@postgresql.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=disable
  data:
    - secretKey: user
      remoteRef:
        key: kagent-db
        property: v1-readwrite-user
    - secretKey: password
      remoteRef:
        key: kagent-db
        property: v1-readwrite-password
    - secretKey: db
      remoteRef:
        key: kagent-db
        property: v1-db-name
