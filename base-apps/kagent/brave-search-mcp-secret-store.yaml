# Per-consumer SecretStore for the Brave Search MCP server's API key
# (templates/agent-identity/README.md). Vault role kagent-brave-search-mcp is bound to
# the eso-brave-search-mcp ServiceAccount only and reads one path:
# k8s-secrets/brave-search-mcp. Provisioned by scripts/provision-brave-search-vault.sh.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-brave-search-mcp
  namespace: kagent
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "k8s-secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "kagent-brave-search-mcp"
          serviceAccountRef:
            name: "eso-brave-search-mcp"
