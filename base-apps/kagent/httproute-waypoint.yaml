# base-apps/kagent/httproute-waypoint.yaml
# Attached to the controller Service, so the waypoint applies it to every caller. In insecure
# mode the controller reads `?user_id=` BEFORE the x-user-id header the mesh set, so a token
# holder could name someone else in the query string. No such request reaches the controller:
# it is routed to `refused` (refused-service.yaml: a Service with no endpoints, so the route
# still resolves and the waypoint answers 503). The last rule is the normal path.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-controller-waypoint
  namespace: kagent
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: kagent-controller
  rules:
    # Both rules spell out the `path: /` match the API server would default (a rule with no
    # path, or no matches at all, gets it); otherwise Argo CD's diff is never empty, since the
    # Application's ignoreDifferences list covers the other HTTPRoute defaults but not this one.
    - matches:
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - type: RegularExpression
              name: user_id
              value: ".*"
      backendRefs:
        - name: refused
          port: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-controller
          port: 8083
