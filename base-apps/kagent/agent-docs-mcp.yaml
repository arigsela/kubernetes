# Read the agent-docs from arigsela/kubernetes@main over MCP. Read-only, single-repo (token
# scope) — see agent-docs-mcp-external-secret.yaml.
#
# A plain Deployment since §T.126. Until then kmcp's MCPServer CR rendered exactly this shape:
# an init container copies the agentgateway binary into an emptyDir, and the main container
# runs agentgateway, which starts the stdio server as its child and serves it as Streamable
# HTTP on :3000 (/mcp and /sse). kagent 1.0.0-alpha14 removed kmcp (kagent#3223), so the shape
# is declared here instead. The names kmcp used (Deployment, Service, ServiceAccount,
# ConfigMap, container `mcp-server`) are kept: the RemoteMCPServer `agent-docs`
# (agent-docs-mcp-remote.yaml) binds http://agent-docs-mcp.kagent:3000/mcp, and the Grafana
# memory alerts key on the container name.
#
# agentgateway reads local.yaml once at start, and a ConfigMap change alone restarts nothing
# (kmcp rolled the pod through a template checksum). The pod template therefore carries
# checksum/config = sha256 of the local.yaml text; CI fails when it is stale
# (tests/agent-identity/test_mcp_server_manifests.py), so every config edit in git rolls the pod.
# Recompute: python3 -m pytest tests/agent-identity/test_mcp_server_manifests.py -q -k checksum  (a stale value fails with the expected hash in the message)
# The stdio child inherits the container environment, which is how the token (envFrom the
# ExternalSecret's Secret) reaches it without appearing in this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-docs-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: agent-docs-mcp
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-docs-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: agent-docs-mcp
data:
  local.yaml: |
    binds:
      - port: 3000
        listeners:
          - name: default
            protocol: HTTP
            routes:
              - name: mcp
                matches:
                  - path:
                      pathPrefix: /sse
                  - path:
                      pathPrefix: /mcp
                # Exactly the tools the AgentTemplates bind from this server (§T.134,
                # tests/agent-identity): tools/list shows only these, and any other call is
                # refused as "Unknown tool" before it reaches the server.
                policies:
                  mcpAuthorization:
                    rules:
                      - allow: >-
                          mcp.tool.name in ["get_commit", "get_file_contents", "list_commits", "search_code"]
                backends:
                  - weight: 100
                    mcp:
                      targets:
                        - name: agent-docs-mcp
                          stdio:
                            cmd: ./github-mcp-server
                            args:
                              - stdio
                              - --read-only
                              - --toolsets
                              - repos
    config: {}
    # Spans to the cluster collector, as service agent-docs-mcp (a CEL string). Sample everything
    # here; the collector's tail sampling cuts the volume (beacon §V.43). frontendPolicies, not
    # config.tracing: 1.6 logs that one as deprecated. /metrics stays on the default :15020.
    frontendPolicies:
      tracing:
        host: otel-collector.tracing.svc.cluster.local:4317
        protocol: grpc
        randomSampling: "true"
        resources:
          service.name: '"agent-docs-mcp"'
---
apiVersion: v1
kind: Service
metadata:
  name: agent-docs-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: agent-docs-mcp
spec:
  # Both keys exactly as kmcp set them: a Deployment selector is immutable and Argo applies this onto the live object (§T.126).
  selector:
    app.kubernetes.io/instance: agent-docs-mcp
    app.kubernetes.io/name: agent-docs-mcp
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
      # What kmcp set; the waypoint has served it under this value since 2026-10-11.
      appProtocol: kgateway.dev/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-docs-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: agent-docs-mcp
spec:
  replicas: 1
  # Both keys exactly as kmcp set them: a Deployment selector is immutable and Argo applies this onto the live object (§T.126).
  selector:
    matchLabels:
      app.kubernetes.io/instance: agent-docs-mcp
      app.kubernetes.io/name: agent-docs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kagent
        app.kubernetes.io/instance: agent-docs-mcp
        app.kubernetes.io/name: agent-docs-mcp
      annotations:
        # sha256 of the ConfigMap's local.yaml text (see the header); CI checks it.
        checksum/config: "b70a90cdfeaa0b7cca44a7b56c0adbf1b01d2f2c9ed7b39eead1563000a33c21"
        # agentgateway's /metrics (default statsAddr). Annotation only: a 15020
        # containerPort would make the kubernetes-pods job scrape the pod twice.
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent-docs-mcp
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: infrastructure
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      initContainers:
        - name: copy-binary
          # Built here from the pinned static release binary (images/agentgateway/,
          # scripts/build-agentgateway-image.sh, §T.133): upstream publishes no musl image after
          # v1.3.1, and only a musl build has --copy-self. Same tag in all three servers.
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/agentgateway:v1.6.0@sha256:083adf216093ed57813debcfdbb5f6aa9cb119741b373455233f6c0605faca2d
          args: ["--copy-self", "/adapterbin/agentgateway"]
          volumeMounts:
            - name: binary
              mountPath: /adapterbin
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: mcp-server
          image: ghcr.io/github/github-mcp-server:v1.14.0@sha256:7aaeeec9ae4fe9a736d100c1ff0798f3c219b5009e05f5d3945fcacb13cc196b
          command: ["/adapterbin/agentgateway"]
          args: ["-f", "/config/local.yaml"]
          ports:
            - name: http
              containerPort: 3000
          # Injects GITHUB_PERSONAL_ACCESS_TOKEN (agent-docs-mcp-external-secret.yaml).
          envFrom:
            - secretRef:
                name: agent-docs-github-mcp-token
          volumeMounts:
            - name: config
              mountPath: /config
            - name: binary
              mountPath: /adapterbin
          # Thin stdio proxy; bounded so it never runs BestEffort on infra nodes.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: agent-docs-mcp
        - name: binary
          emptyDir: {}
