        data = _git(app_dir, "archive", "--format=tar", tree, binary=True)
        r = subprocess.run(["tar", "-x", "-C", dest], input=data, capture_output=True, timeout=120)
        if r.returncode != 0:
            raise CommandError(f"tar: {r.stderr.decode(errors='replace')[:200]}")


