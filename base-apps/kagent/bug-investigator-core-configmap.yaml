            try:
                runner(["gh", "api", "-X", "POST", f"repos/{repo}/issues/{issue}/labels", "-f", f"labels[]={label}", "--silent"])
            except CommandError as e:
                print(f"could not add label {label}: {e}", file=sys.stderr)
