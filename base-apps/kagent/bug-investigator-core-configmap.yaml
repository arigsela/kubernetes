            fh.write(to_markdown(facts))
        print(f"facts: {len(facts.get('merged_prs', []))} PRs, {len(facts.get('deploys', []))} deploys, "
              f"{len(facts.get('past_bugs', []))} past bugs, {len(facts.get('docs', []))} docs; problems: {facts['problems']}")
