    def check_test_command(cmd: str) -> str | None:
        """The test command goes into --allowedTools and the hook: plain words only."""
        if not isinstance(cmd, str) or not SAFE_COMMAND.match(cmd.strip()):
            return f"test-command {cmd!r} must be plain words (letters, digits, _ . / = : + -), no shell syntax"
        return None


    def run_tests_command(action_path: str, app_dir: str, test_command: str) -> str:
        """The one test command the fix agent may run: the sandbox script with fixed arguments."""
        cmd = f"bash {os.path.join(action_path, 'run-tests.sh')} {app_dir} {test_command.strip()}"
        problem = check_test_command(cmd)
        if problem:
            raise ValueError(problem)
        return cmd


    def build_settings(run_py: str, mode: str, roots: list[str], namespace: str, deny_dirs: list[str],
                       run_command: str | None = None) -> dict:
        allow = (run_command,) if mode == "fix" and run_command else ()
        cmd = hook_command(run_py, mode, roots, namespace, allow)
        entry = {"type": "command", "command": cmd, "timeout": 10}
        # Read rules also cover Grep and Glob. A leading // means an absolute path.
        deny = [f"Read(/{d.rstrip('/')}/**)" for d in deny_dirs if d]
        hooks = [
            {"matcher": "mcp__.*", "hooks": [entry]},
            {"matcher": "Bash", "hooks": [entry]},
            {"matcher": "Read|Grep|Glob", "hooks": [entry]},
        ]
        if mode == "fix":
            app = roots[0].rstrip("/")
            for tool in ("Edit", "Write"):
                deny += [f"{tool}(/{d.rstrip('/')}/**)" for d in deny_dirs if d]
                # The hook checks every protected path; these rules are a second layer for the main ones.
                deny += [f"{tool}(/{app}/{p}/**)" for p in scope.PROTECTED_DIRS + (".git",)]
                deny += [f"{tool}(/{app}/{p})" for p in sorted(scope.PROTECTED_NAMES)]
            hooks.append({"matcher": "Edit|Write|MultiEdit|NotebookEdit", "hooks": [entry]})
        return {"permissions": {"blockReadsOutsideWorkingDirectories": True, "deny": deny},
                "hooks": {"PreToolUse": hooks}}


    def build_mcp_config(binary: str, grafana_url: str, token_file: str, namespace: str) -> dict:
        return {"mcpServers": {"grafana": {
            "command": binary,
            "args": ["-t", "stdio", "--disable-write", "--disable-api", "--disable-rendering",
                     "--enabled-tools", "loki,prometheus", "--max-loki-log-limit", "100",
                     "--loki-enforced-matchers", f'namespace="{namespace}"', "--usage-stats=disabled"],
            "env": {"GRAFANA_URL": grafana_url, "GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE": token_file},
        }}}


    def build_claude_args(mode: str, model: str, max_turns: int, schema: dict, mcp_config: str | None,
                          add_dirs: list[str], run_command: str | None = None) -> str:
        schema_json = json.dumps(schema, separators=(",", ":"))
        if "'" in schema_json:
            raise ValueError("findings schema must not contain single quotes (claude_args quoting)")
        if mode == "fix":
            tools, disallowed = list(FIX_TOOLS), FIX_DISALLOWED
            if run_command:
                if check_test_command(run_command):
                    raise ValueError(check_test_command(run_command))
                tools.append(f"Bash({run_command})")  # exact: no other arguments
            mcp_config, add_dirs = None, []  # the fix agent gets no MCP servers and no other directories
        else:
            tools, disallowed = (FULL_TOOLS if mode == "full" else N8N_TOOLS), DISALLOWED
        args = [f"--model {shlex.quote(model)}", f"--max-turns {int(max_turns)}",
                f'--allowedTools "{",".join(tools)}"', f'--disallowedTools "{",".join(disallowed)}"',
                f"--json-schema '{schema_json}'"]
        if mcp_config:
            args.append(f"--mcp-config {shlex.quote(mcp_config)}")
        for d in add_dirs:
            args.append(f"--add-dir {shlex.quote(d)}")
        return "\n".join(args)


    def build_prompt(template: str, mode: str, issue: int, repo: str, facts_md: str, deploy_dir: str | None,
                     namespace: str) -> str:
        if mode == "full":
            notes = FULL_NOTES.format(
                deploy_note=f", and the deploy repo checkout at `{deploy_dir}` (Read/Grep it by absolute path)"
                if deploy_dir else "",
                deploy_dir=deploy_dir or "<deploy dir>", loki=scope.LOKI_UID, prom=scope.PROM_UID, ns=namespace)
        else:
            notes = N8N_NOTES
        return (template.replace("{{ISSUE}}", str(issue)).replace("{{REPO}}", repo)
                .replace("{{MODE_NOTES}}", notes.strip()).replace("{{FACTS}}", facts_md.strip()))


    def set_output(path: str | None, name: str, value: str) -> None:
        if not path:
            print(f"{name}={value}")
            return
        delim = f"ghadelimiter_{uuid.uuid4().hex}"
        with open(path, "a") as f:
            f.write(f"{name}<<{delim}\n{value}\n{delim}\n")


    def main(argv: list[str] | None = None) -> int:
        p = argparse.ArgumentParser(prog="prep")
        p.add_argument("--mode", choices=("full", "n8n"), required=True)
        p.add_argument("--issue", type=int, required=True)
        p.add_argument("--repo", required=True)
        p.add_argument("--app-dir", required=True)
        p.add_argument("--deploy-dir")
        p.add_argument("--action-path", required=True)
        p.add_argument("--work-dir", required=True, help="outside every working dir; holds settings, facts, outputs")
        p.add_argument("--deny-dir", action="append", default=[])
        p.add_argument("--token-file")
        p.add_argument("--grafana-url", default="")
        p.add_argument("--mcp-binary")
        p.add_argument("--model", default="claude-sonnet-5-5")
        p.add_argument("--max-turns", type=int, default=40)
        p.add_argument("--namespace", default=scope.NAMESPACE)
        a = p.parse_args(argv)

        run_py = os.path.join(a.action_path, "run.py")
        roots = [a.app_dir] + ([a.deploy_dir] if a.mode == "full" and a.deploy_dir else [])
        deny = [a.action_path, a.work_dir] + a.deny_dir
        settings_path = os.path.join(a.work_dir, "claude-settings.json")
        write_json(settings_path, build_settings(run_py, a.mode, roots, a.namespace, deny))

        mcp_path = None
        if a.mode == "full":
            if not (a.mcp_binary and a.token_file and a.grafana_url):
                print("full mode needs --mcp-binary, --token-file and --grafana-url", file=sys.stderr)
                return 2
            mcp_path = os.path.join(a.work_dir, "mcp-config.json")
            write_json(mcp_path, build_mcp_config(a.mcp_binary, a.grafana_url, a.token_file, a.namespace))

        with open(os.path.join(a.action_path, "findings.schema.json")) as f:
            schema = json.load(f)
        claude_args = build_claude_args(a.mode, a.model, a.max_turns, schema, mcp_path, roots[1:])
        with open(os.path.join(a.action_path, "prompt.md")) as f:
            template = f.read()
        with open(os.path.join(a.work_dir, "facts.md")) as f:
            facts_md = f.read()
        prompt = build_prompt(template, a.mode, a.issue, a.repo, facts_md, roots[1] if len(roots) > 1 else None, a.namespace)
        with open(os.path.join(a.work_dir, "prompt.txt"), "w") as f:
            f.write(prompt)

        out = os.environ.get("GITHUB_OUTPUT")
        set_output(out, "settings", settings_path)
        set_output(out, "claude_args", claude_args)
        set_output(out, "prompt", prompt)
        set_output(out, "hook_command", hook_command(run_py, a.mode, roots, a.namespace))
        print(f"prep: mode={a.mode} roots={roots} prompt={len(prompt)} chars")
        return 0


    # ---------------------------------------------------------------------------------- selftest

    PROM = scope.PROM_UID


    def selftest(hook_cmd: str, mode: str, token: str, env: dict, namespace: str = scope.NAMESPACE) -> list[str]:
        other = "kube-system" if namespace != "kube-system" else "default"
        scoped = {"tool_name": "mcp__grafana__query_loki_logs", "tool_input": {
            "datasourceUid": scope.LOKI_UID, "logql": f'{{namespace="{namespace}"}} | json'}}
        cases = [
            ({"tool_name": "mcp__grafana__query_prometheus", "tool_input": {
                "datasourceUid": PROM, "expr": "sum(rate(container_cpu_usage_seconds_total[5m]))", "endTime": "now"}}, 2),
            ({"tool_name": "mcp__grafana__query_loki_logs", "tool_input": {
                "datasourceUid": scope.LOKI_UID, "logql": f'{{namespace="{other}"}}'}}, 2),
            ({"tool_name": "Bash", "tool_input": {"command": "env"}}, 2),
            ({"tool_name": "Read", "tool_input": {"file_path": "/etc/passwd"}}, 2),
            # Full mode must allow a scoped query; n8n mode must block every telemetry call.
            (scoped, 0 if mode == "full" else 2),
        ]
        problems = []
        for payload, want in cases:
            r = subprocess.run(["bash", "-c", hook_cmd], input=json.dumps(payload), capture_output=True, text=True, timeout=30)
            if r.returncode != want:
                problems.append(f"hook returned {r.returncode}, want {want}, for {payload['tool_name']}: {r.stderr.strip()}")
        if token:
            leaked = sorted(k for k, v in env.items() if token in v)
            if leaked:
                problems.append(f"the Grafana token is in environment variables: {', '.join(leaked)}")
        return problems


    def selftest_main(argv: list[str] | None = None) -> int:
        p = argparse.ArgumentParser(prog="selftest")
        p.add_argument("--hook-command", required=True)
        p.add_argument("--mode", required=True)
        p.add_argument("--token-file")
        p.add_argument("--namespace", default=scope.NAMESPACE)
        a = p.parse_args(argv)
        problems = selftest(a.hook_command, a.mode, read_secret(a.token_file), dict(os.environ), a.namespace)
        for x in problems:
            print(f"selftest: {x}", file=sys.stderr)
        if problems:
            return 1
        print("selftest: hook blocks out-of-scope calls; token not in the environment")
        return 0
  telemetry.py: |
    """Telemetry adapter that talks to Loki and Prometheus directly, with no Grafana and no token.

    The kagent version runs inside the cluster, where Loki and Prometheus answer anyone who can reach
    them. So the scope check is the boundary here too: every function below runs it before any HTTP
    call, whatever the caller already checked.

    - `query()` has the same signature (after the URLs) and returns the same shape as `grafana.query`
      (Grafana's /api/ds/query data frames), so verify's `Ctx(gquery=...)` can swap it in and
      `grafana.count_results` counts it the same way.
    - The other functions back the stdio MCP server (`mcp_server.py`): Loki query_range, index stats,
      label names and values; Prometheus instant and range queries.

    Base URLs: env LOKI_URL and PROMETHEUS_URL, defaulting to the in-cluster services.
    """

    from __future__ import annotations

    import json
    import math
    import os
    import re
    import urllib.error
    import urllib.parse
    import urllib.request

    from bug_investigator import grafana, scope

    DEFAULT_LOKI_URL = "http://loki.logging.svc.cluster.local:3100"
    DEFAULT_PROMETHEUS_URL = "http://prometheus.logging.svc.cluster.local:9090"
    MAX_LINES = 100          # what grafana.query_body asks Grafana for (maxLines)
    MAX_POINTS = 1000        # Grafana's maxDataPoints in grafana.query_body
    MIN_STEP_S = 15          # Grafana's intervalMs in grafana.query_body
    LABEL_RE = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")


    class TelemetryError(grafana.GrafanaError):
        """A failed or refused query. A GrafanaError subclass, so verify's handler catches it."""


    def loki_url() -> str:
        return (os.environ.get("LOKI_URL") or DEFAULT_LOKI_URL).rstrip("/")


    def prometheus_url() -> str:
        return (os.environ.get("PROMETHEUS_URL") or DEFAULT_PROMETHEUS_URL).rstrip("/")


    # ---------------------------------------------------------------------------------- HTTP


    def _get(url: str, params: dict, opener=None, timeout: int = 30):
        qs = urllib.parse.urlencode({k: v for k, v in params.items() if v is not None})
        req = urllib.request.Request(url + ("?" + qs if qs else ""), method="GET",
                                     headers={"Accept": "application/json", "User-Agent": "bug-investigator/1"})
        try:
            with (opener or urllib.request.urlopen)(req, timeout=timeout) as r:
                body = json.loads(r.read().decode())
        except urllib.error.HTTPError as e:
            raise TelemetryError(f"HTTP {e.code} {_error_detail(e)}".strip()) from None
        except (urllib.error.URLError, TimeoutError, ValueError, OSError) as e:
            raise TelemetryError(str(e)) from None
        if isinstance(body, dict) and body.get("status") == "error":
            raise TelemetryError(str(body.get("error") or "query failed")[:300])
        return body


    def _error_detail(e: urllib.error.HTTPError) -> str:
        """Loki answers errors in plain text, Prometheus in JSON ({"error": ...})."""
        try:
            raw = e.read().decode("utf-8", errors="replace")
        except OSError as err:
            return f"(error body unreadable: {err})"
        try:
            body = json.loads(raw)
        except ValueError:
            return raw.strip()[:200]
        if isinstance(body, dict) and (body.get("error") or body.get("message")):
            return str(body.get("error") or body.get("message"))[:200]
        return raw.strip()[:200]


    def _data(body) -> dict:
        data = body.get("data") if isinstance(body, dict) else None
        if not isinstance(data, dict) and not isinstance(data, list):
            raise TelemetryError("unexpected response: no data")
        return data


    def _ns(ms: int) -> str:
        return str(int(ms) * 1_000_000)


    def step_seconds(start_ms: int, end_ms: int) -> int:
        """Grafana's step for a range query: the interval, or range / maxDataPoints if larger."""
        return max(MIN_STEP_S, math.ceil(max(0, end_ms - start_ms) / 1000 / MAX_POINTS))


    def _refuse(problem: str | None) -> None:
        if problem:
            raise TelemetryError(f"out of scope: {problem}")


    # ---------------------------------------------------------------------------------- Loki


    def loki_query_range(logql: str, start_ms: int, end_ms: int, *, limit: int = MAX_LINES,
                         direction: str = "backward", step_s: int | None = None,
                         namespace: str = scope.NAMESPACE, opener=None) -> dict:
        """Loki /query_range: {"resultType": "streams"|"matrix", "result": [...]}."""
        _refuse(scope.check_logql(logql, namespace))
        params = {"query": logql, "start": _ns(start_ms), "end": _ns(end_ms), "limit": int(limit),
                  "direction": direction, "step": f"{step_s or step_seconds(start_ms, end_ms)}s"}
        return _data(_get(loki_url() + "/loki/api/v1/query_range", params, opener))


    def loki_query_instant(logql: str, at_ms: int, *, limit: int = MAX_LINES, direction: str = "backward",
                           namespace: str = scope.NAMESPACE, opener=None) -> dict:
        """Loki /query (metric queries at one instant)."""
        _refuse(scope.check_logql(logql, namespace))
        params = {"query": logql, "time": _ns(at_ms), "limit": int(limit), "direction": direction}
        return _data(_get(loki_url() + "/loki/api/v1/query", params, opener))


    def loki_stats(logql: str, start_ms: int, end_ms: int, *, namespace: str = scope.NAMESPACE, opener=None) -> dict:
        """Loki /index/stats: {"streams", "chunks", "entries", "bytes"} for a stream selector."""
        _refuse(scope.check_logql(logql, namespace))
        params = {"query": logql, "start": _ns(start_ms), "end": _ns(end_ms)}
        body = _get(loki_url() + "/loki/api/v1/index/stats", params, opener)
        if not isinstance(body, dict):
            raise TelemetryError("unexpected stats response")
        return body


    def loki_label_names(matcher: str, start_ms: int, end_ms: int, *, namespace: str = scope.NAMESPACE,
                         opener=None) -> list:
        _refuse(scope.is_scoped_stream_selector(matcher, namespace))
        params = {"query": matcher, "start": _ns(start_ms), "end": _ns(end_ms)}
        return _data(_get(loki_url() + "/loki/api/v1/labels", params, opener)) or []


    def loki_label_values(label: str, matcher: str, start_ms: int, end_ms: int, *,
                          namespace: str = scope.NAMESPACE, opener=None) -> list:
        _refuse(scope.is_scoped_stream_selector(matcher, namespace))
        if not isinstance(label, str) or not LABEL_RE.fullmatch(label):
            raise TelemetryError(f"labelName {label!r} is not a label name")
        params = {"query": matcher, "start": _ns(start_ms), "end": _ns(end_ms)}
        path = "/loki/api/v1/label/" + urllib.parse.quote(label, safe="") + "/values"
        return _data(_get(loki_url() + path, params, opener)) or []


    # ---------------------------------------------------------------------------------- Prometheus


    def prom_query_range(expr: str, start_ms: int, end_ms: int, *, step_s: int | None = None,
                         namespace: str = scope.NAMESPACE, opener=None) -> dict:
        """Prometheus /query_range: {"resultType": "matrix", "result": [...]}."""
        _refuse(scope.check_promql(expr, namespace))
        params = {"query": expr, "start": f"{start_ms / 1000:.3f}", "end": f"{end_ms / 1000:.3f}",
                  "step": f"{step_s or step_seconds(start_ms, end_ms)}s"}
        return _data(_get(prometheus_url() + "/api/v1/query_range", params, opener))


    def prom_query_instant(expr: str, at_ms: int, *, namespace: str = scope.NAMESPACE, opener=None) -> dict:
        _refuse(scope.check_promql(expr, namespace))
        params = {"query": expr, "time": f"{at_ms / 1000:.3f}"}
        return _data(_get(prometheus_url() + "/api/v1/query", params, opener))


    # ---------------------------------------------------------------------------------- Grafana frames


    def _num(v):
        """A Prometheus/Loki sample value ("1.5", "NaN", "+Inf") as a float; NaN becomes None."""
        try:
            f = float(v)
        except (TypeError, ValueError):
            return None
        return None if math.isnan(f) else f


    def _series_frames(result: list, single: bool) -> list[dict]:
        frames = []
        for s in result or []:
            labels = s.get("metric") or {}
            points = [s["value"]] if single and "value" in s else (s.get("values") or [])
            times = [int(float(p[0]) * 1000) for p in points]
            vals = [_num(p[1]) for p in points]
            frames.append({"schema": {"fields": [{"name": "Time", "type": "time"},
                                                 {"name": "Value", "type": "number", "labels": labels}]},
                           "data": {"values": [times, vals]}})
        return frames


    def _stream_frame(result: list) -> dict:
        labels, times, lines, ts_ns = [], [], [], []
        for s in result or []:
            stream = s.get("stream") or {}
            for ts, line in s.get("values") or []:
                labels.append(stream)
                times.append(int(ts) // 1_000_000)
                lines.append(line)
                ts_ns.append(str(ts))
        return {"schema": {"meta": {"type": "log-lines"},
                           "fields": [{"name": "labels", "type": "other"}, {"name": "Time", "type": "time"},
                                      {"name": "Line", "type": "string"}, {"name": "tsNs", "type": "string"}]},
                "data": {"values": [labels, times, lines, ts_ns]}}


    def to_frames(data: dict) -> dict:
        """Loki/Prometheus `data` as Grafana's /api/ds/query response for refId A."""
        rtype = data.get("resultType")
        result = data.get("result") or []
        if rtype == "streams":
            frames = [_stream_frame(result)] if result else []
        elif rtype in ("matrix", "vector"):
            frames = _series_frames(result, single=rtype == "vector")
        elif rtype == "scalar":
            frames = _series_frames([{"metric": {}, "value": result}], single=True) if result else []
        else:
            raise TelemetryError(f"unexpected resultType {rtype!r}")
        return {"results": {"A": {"status": 200, "frames": frames}}}


    def query(kind: str, expr: str, start_ms: int, end_ms: int, namespace: str = scope.NAMESPACE,
              opener=None) -> dict:
        """Drop-in for `grafana.query` without the URL and token: same checks, same response shape."""
        bad = scope.check_query(kind, expr, namespace)
        if bad:
            raise TelemetryError(f"out of scope: {bad}")
        if kind == "logql":
            data = loki_query_range(expr, start_ms, end_ms, limit=MAX_LINES, namespace=namespace, opener=opener)
        else:
            data = prom_query_range(expr, start_ms, end_ms, namespace=namespace, opener=opener)
        return to_frames(data)
