# kagent >= 1.0.0-alpha14 (kagent#3160) reads two database connection strings. This one is the
# owner login: the controller runs migrations with it at startup, as role kagent_owner in schema
# `kagent` (database.postgres.owner values). Its Vault properties are the same v1-user /
# v1-password the alpha11 controller uses via kagent-postgres, so the owner login is unchanged.
#
# Database kagent_v1, prepared by base-apps/postgresql/init-kagent-v1-db.yaml. The string carries
# no role: kagent assumes kagent_owner itself. No TLS on that Postgres, hence sslmode=disable.
# Same scoped store and Vault role as kagent-postgres (eso-kagent-db -> kagent-db); a new
# Secret name, not a new credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-postgres-owner
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kagent-db
    kind: SecretStore
  target:
    name: kagent-postgres-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ownerConnectionString: >-
          postgres://{{ .user }}:{{ .password }}@postgresql.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=disable
  data:
    - secretKey: user
      remoteRef:
        key: kagent-db
        property: v1-user
    - secretKey: password
      remoteRef:
        key: kagent-db
        property: v1-password
    - secretKey: db
      remoteRef:
        key: kagent-db
        property: v1-db-name
