# The identity the implementer's SecretStore presents to Vault (role implementer-mcp binds
# exactly this ServiceAccount in this namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-implementer-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    arigsela.com/idp-managed: "true"
