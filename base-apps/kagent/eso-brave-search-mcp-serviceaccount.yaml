# The ServiceAccount External Secrets Operator uses to log in to Vault as role
# kagent-brave-search-mcp (brave-search-mcp-secret-store.yaml). One SA per credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-brave-search-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    arigsela.com/idp-managed: "true"
