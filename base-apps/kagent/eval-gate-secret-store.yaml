# Path-scoped SecretStore for the evaluation gate: the credential boundary for the judge
# keys (Anthropic, Jev) and the GitHub status token, readable by nothing else.
# Authenticates as eso-eval-gate against the Vault kubernetes-auth role "eval-gate", whose
# policy reads only k8s-secrets/data/eval-gate. The ExternalSecret that uses it is added once
# the owner has run scripts/provision-eval-gate-vault.sh (plan Task 6); until then the gate
# runs rubric-only and says judge=none.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-eval-gate
  namespace: kagent
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "k8s-secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eval-gate"
          serviceAccountRef:
            name: "eso-eval-gate"
