# Path-scoped SecretStore for the evaluation gate: the credential boundary for the judge
# keys (Anthropic, Jev) and the GitHub status token, readable by nothing else.
# Authenticates as eso-eval-gate against the Vault kubernetes-auth role "eval-gate", whose
# policy reads only k8s-secrets/data/eval-gate. Landed only after the owner provisioned Vault:
# a store whose role does not exist is Degraded, and a Degraded resource fails the whole
# kagent-secrets sync before the PostSync hook runs (seen 2026-10-13).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-eval-gate
  namespace: kagent
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "k8s-secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eval-gate"
          serviceAccountRef:
            name: "eso-eval-gate"
