# The model gateway's virtual keys, one Secret per budget group (§T.137, spec §3.3). GENERATED by
# scripts/gen-model-budgets.py from base-apps/model-gateway/budgets.yaml.
#
# A group's ModelConfigs name its Secret (apiKeySecret); kagent turns it into an ate-secret://
# credential and Substrate's egress injects it as x-api-key on the group's model calls, so a
# sandbox never holds a key and cannot present another group's. The value is worth nothing outside
# the gateway: it maps to the group's daily budget there. Vault role model-gateway-keys reads only
# k8s-secrets/model-gateway-keys (scripts/provision-model-gateway-vault.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-model-gateway-keys
  namespace: kagent
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-model-gateway-keys
  namespace: kagent
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: model-gateway-keys
          serviceAccountRef:
            name: eso-model-gateway-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-gateway-key-hk
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-model-gateway-keys
    kind: SecretStore
  target:
    name: model-gateway-key-hk
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: model-gateway-keys
        property: hk
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-gateway-key-build
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
