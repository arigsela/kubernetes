# base-apps/kagent/request-authentication.yaml
# Who a caller is (V91, V92). Two issuers, nothing else:
#   * Dex, client `kubernetes` (the token kubectl already caches with kubelogin): a human; the
#     identity is the verified `email` claim.
#   * the Kubernetes service account issuer, audience `kagent` (projected tokens, <= 1 h): an
#     automation; the identity is `sub` = system:serviceaccount:<ns>:<name>.
# The verified claim is WRITTEN into x-user-id, replacing anything the client sent, which is
# what the controller (insecure mode) reads. A request with no token passes this object (it only
# rejects invalid tokens) and is then refused by authorization-policy.yaml unless it comes from
# the UI or the worker principal.
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: kagent-callers
  namespace: kagent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kagent-waypoint
  jwtRules:
    - issuer: https://dex.arigsela.com
      jwksUri: https://dex.arigsela.com/keys
      audiences: ["kubernetes"]
      forwardOriginalToken: true
      outputClaimToHeaders:
        - header: x-user-id
          claim: email
    - issuer: https://kubernetes.default.svc.cluster.local
      # INLINE on purpose (2026-10-13): istiod cannot fetch https://kubernetes.default.svc/openid/v1/jwks
      # ("x509: certificate signed by unknown authority": the API server's CA is not in istiod's
      # trust store). These are the PUBLIC keys of the service account issuer, safe in git.
      # They change only when k3s rotates its service-account signing key: refresh with
      #   kubectl get --raw /openid/v1/jwks
      # (runbook "Agents unreachable after an identity change"; tests/identity checks the shape).
      jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"BBNzB3N5yJuPKQs3OHZwaoUun7YR66d0OdoSgXsIwzg","alg":"RS256","n":"wcgYlH31ADlLEonXo1Hga-ZjBK7sg3bFgcuFrTblCKFp3QuIt0N_ew4UWnzZcigQ7Xav4XHFgLnWUDFoMNqPkI0eqrH8r0rJCbsDR9N5yHPLcJUXsZo8sQln41_uDCEq1sc7rbdZWIpb-S7Jl07_V9tlu0RIKtS10NjeOsHFf1W9aM4kysR0DXuRQDxoL_5gTTwgPNlUwWMkWL0JN--etn4Qj2Q0QPGQZA_cwV6xDJBoRU_RoZIEzqFUfbwDkpGglLajlwiKiw2o-qEwVKLXgSXEweAvgeR3uURCCjzg4bkEQKeCMAvnH7b03MSnQVi1BTrjFR7uRVHhYTOpd-Td-Q","e":"AQAB"}]}'
      audiences: ["kagent"]
      forwardOriginalToken: true
      outputClaimToHeaders:
        - header: x-user-id
          claim: sub
