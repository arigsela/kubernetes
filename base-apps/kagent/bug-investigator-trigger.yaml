# base-apps/kagent/bug-investigator-trigger.yaml
# The bug investigator's trigger: every 2 minutes the CronJob runs
# scripts/bug_investigator_trigger.py (code: the generated bug-investigator-trigger-code
# ConfigMap; the bug-investigator package it imports: the generated bug-investigator-core
# ConfigMap, the code the GitHub Action runs). One run:
#   a. alert-first: Prometheus 5xx-by-route on Taskboard (the Grafana rule "Taskboard server
#      errors" has the same expression); a route with errors and no open `from-alert` issue gets
#      one, labelled `bug`;
#   b. picks the oldest open `bug` issue on arigsela/taskboard without `investigated`,
#      `rehearsal` or `investigation-failed`, labelled by someone with write access or the App;
#   c. clones taskboard and the taskboard folder of this repo (the deploy timeline) into /work;
#   d. gathers the facts, asks kagent/bug-investigator over A2A as service account
#      kagent/bug-investigator-trigger (projected token, audience kagent; the waypoint admits any
#      service-account token on /agents/*, authorization-policy.yaml rule 2; the controller's
#      NetworkPolicy already admits namespace kagent);
#   e. verifies every evidence link (telemetry re-run against Loki/Prometheus directly; `ui` steps
#      replayed by the taskboard-browser tool server at BROWSER_URL, §T.153), commits the replays'
#      screenshots to Taskboard's `bug-investigator-evidence` branch, posts one comment showing them
#      and labels the issue `investigated` (a failed upload: the comment goes out without images);
#   f. hands a verified likely cause to kagent/implementer for one fix pull request on Taskboard
#      (with a verified UI reproduction as ui-tests/repros/issue-<N>.json, which Taskboard's
#      ui-check replays on the PR), then comments the PR link and labels `fix-proposed`. A person
#      merges.
# The agent holds no credential. This pod holds one: a Taskboard-only GitHub installation token
# (issues and contents write, pull requests read; contents only for the screenshots, see the
# GithubAccessToken below) that External Secrets mints from the arigsela-implementer App every 20
# minutes (ExternalSecret below). It never reaches the agent.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bug-investigator-trigger
  namespace: kagent
  labels:
    app: bug-investigator-trigger
# No automounted token. The pod gets two projected ones below: audience kagent (the A2A calls) and
# the API server's (one call pair per run: get/update ConfigMap bug-investigator-memory, §T.148).
automountServiceAccountToken: false
---
# The trigger's memory of verified outcomes (§T.148): outcomes.json, the newest 60 investigations
# a script verified (issue, title, verdict, cause or rule, fix PR, verified n/m, one summary line).
# Before asking the agent, the trigger adds the outcomes that share terms with the new report to
# the facts as "Remembered outcomes" (leads, never evidence); after verify it saves the new one.
# Git declares NO data on purpose: the kagent-secrets app syncs with ServerSideApply, so Argo CD
# owns only the fields written here and selfHeal never reverts what the trigger writes (the
# docs-checker-memory pattern). To reset the memory, delete the ConfigMap; Argo CD recreates it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bug-investigator-memory
  namespace: kagent
  labels:
    app: bug-investigator-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bug-investigator-trigger
  namespace: kagent
  labels:
    app: bug-investigator-trigger
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bug-investigator-memory"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bug-investigator-trigger
  namespace: kagent
  labels:
    app: bug-investigator-trigger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bug-investigator-trigger
subjects:
  - kind: ServiceAccount
    name: bug-investigator-trigger
    namespace: kagent
---
# An installation token for arigsela-implementer (App ID 5316560, installation 171383761: not
# secrets, docs/platform/implementer.md), narrowed to one repository and four permissions. ESO
# signs the App JWT with the private key already in Secret implementer-github-app (Vault
# k8s-secrets/implementer-github-app, implementer-mcp-external-secret.yaml); the key never leaves
# the ESO controller. Installation tokens live 1 h, so the token is re-minted every 20 minutes.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: bug-investigator-trigger
  namespace: kagent
  labels:
    app: bug-investigator-trigger
spec:
  appID: "5316560"
  installID: "171383761"
  repositories:
    - taskboard
  permissions:
    issues: write
    # write (§T.153): the trigger commits the browser replays' screenshots to the
    # bug-investigator-evidence branch, and only there: it writes through the core's
    # evidence.Uploader, which takes no branch argument (verify, render and the clones only read).
    # Residual: the token itself could push to any branch, and Taskboard is private on GitHub Free,
    # so main has no branch protection to refuse it (§V.113).
    contents: write
    pull_requests: read
    metadata: read
  auth:
    privateKey:
      secretRef:
        name: implementer-github-app
        key: GITHUB_APP_PRIVATE_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bug-investigator-trigger-github
  namespace: kagent
  labels:
    app: bug-investigator-trigger
  annotations:
    # The generator's spec.permissions as sorted key=value (a test holds them together). ESO
    # re-mints when this ExternalSecret's generation, labels or annotations change, or when
    # refreshInterval elapses, never because the GithubAccessToken CR changed: a permissions change
    # must change this value too, so the merge that ships it also re-mints the token.
    bug-investigator.arigsela.com/token-permissions: "contents=write,issues=write,metadata=read,pull_requests=read"
spec:
  # The token lives 1 h and the trigger reads it once at pod start, when it is at most 20 min old
  # plus the Secret's propagation: 20m leaves >= ~35 min of it for a run of up to 25 min
  # (activeDeadlineSeconds 1500).
  refreshInterval: 20m
  target:
    name: bug-investigator-trigger-github
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: bug-investigator-trigger
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bug-investigator-trigger
  namespace: kagent
  labels:
    app: bug-investigator-trigger
spec:
  schedule: "*/2 * * * *"
  timeZone: Etc/UTC
  # One run at a time: a run that investigates (minutes) makes the next ones skip, not queue.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # No retry: a failed investigation labels the issue `investigation-failed` (or is retried by
      # the next scheduled run when it failed before the agent was asked).
      backoffLimit: 0
      # The investigation (AGENT_TIMEOUT 480 s) and the implementer's pull request (FIX_TIMEOUT
      # 480 s) plus the clones and verify, with time left to log before the pod is killed. Verify
      # replays `ui` evidence in the browser: each replay may take up to ~120 s (the engine's 75 s
      # deadline plus the client's timeout), at most two per investigation (UI_REPLAYS_MAX,
      # ruling R18), so 300 s more than before (§T.153).
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels:
            app: bug-investigator-trigger
          annotations:
            # sha256 (first 16 hex) over the bug-investigator-trigger-code ConfigMap's values,
            # sorted by key; written by scripts/gen-bug-investigator-trigger-configmap.py.
            checksum/code: 387fd3ce1920d0c2
        spec:
          serviceAccountName: bug-investigator-trigger
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: application
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              # The FULL python image (not -slim): it ships git, which gather and verify run on the
              # clones. gh is fetched at a pinned version and sha256-checked by the script itself,
              # only when a run investigates.
              image: python:3.12@sha256:98d8fe4e28bb2efeed9d9bce6a4705e80a6764367b65aea1dc4b96ded7b05620
              command: ["python", "-u", "-B", "/opt/bug-investigator-trigger/bug_investigator_trigger.py"]
              env:
                - name: RUN_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: KAGENT_A2A_BASE
                  value: http://kagent-controller.kagent.svc.cluster.local:8083
                - name: KAGENT_TOKEN_FILE
                  value: /var/run/kagent/token
                - name: GH_TOKEN_FILE
                  value: /var/run/github/token
                - name: PROMETHEUS_URL
                  value: http://prometheus.logging.svc.cluster.local:9090
                # The browser tool server (taskboard-browser-mcp.yaml) that replays `ui` evidence
                # during verify (§T.153): the same namespace, through the waypoint.
                - name: BROWSER_URL
                  value: http://taskboard-browser-mcp.kagent.svc.cluster.local:3000/mcp
                # `failure` sends only the failing (else the last) step's screenshot: use it if
                # agentgateway refuses multi-MB tool results.
                - name: BROWSER_SCREENSHOTS
                  value: all
                # `false` turns browser verification off: `ui` items then drop as "the browser is
                # not available in this run".
                - name: BROWSER_ENABLED
                  value: "true"
                - name: LOKI_URL
                  value: http://loki.logging.svc.cluster.local:3100
                - name: NAMESPACE
                  value: taskboard
                - name: CORE_DIR
                  value: /core
                - name: PYTHONPATH
                  value: /core/src
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: WORK_DIR
                  value: /work
                # git and gh write their config and caches under these (the root filesystem is read-only).
                - name: HOME
                  value: /work/home
                - name: GH_CONFIG_DIR
                  value: /work/gh
                - name: XDG_CACHE_HOME
                  value: /work/cache
                - name: AGENT_TIMEOUT
                  value: "480"
                - name: FIX_TIMEOUT
                  value: "480"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: code
                  mountPath: /opt/bug-investigator-trigger
                  readOnly: true
                # The core ConfigMap's keys are basenames: the package mounts whole, the two data
                # files beside it at /core (gen-bug-investigator-core.py, mount contract).
                - name: core
                  mountPath: /core/src/bug_investigator
                  readOnly: true
                - name: core
                  mountPath: /core/prompt.md
                  subPath: prompt.md
                  readOnly: true
                - name: core
                  mountPath: /core/findings.schema.json
                  subPath: findings.schema.json
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: kagent-token
                  mountPath: /var/run/kagent
                  readOnly: true
                - name: kube-token
                  mountPath: /var/run/kube
                  readOnly: true
                - name: github-token
                  mountPath: /var/run/github
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: bug-investigator-trigger-code
            - name: core
              configMap:
                name: bug-investigator-core
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: kagent-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: kagent
                      expirationSeconds: 3600
                      path: token
            # The API server's audience (none given), for the memory ConfigMap only (Role above).
            - name: kube-token
              projected:
                sources:
                  - serviceAccountToken:
                      expirationSeconds: 3600
                      path: token
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
            - name: github-token
              secret:
                secretName: bug-investigator-trigger-github
                items:
                  - key: token
                    path: token
