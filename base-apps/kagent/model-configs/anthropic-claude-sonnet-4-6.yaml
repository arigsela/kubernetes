# The name still says 4-6; the model is claude-sonnet-5. Renaming is not a
# one-line change: the apiKeySecret below was created by the kagent UI with an
# ownerReference to THIS ModelConfig, and it is not in Vault. Renaming means
# Argo prunes this object, the garbage collector deletes that Secret, and the
# dedicated API key is gone. Move the key into Vault + ESO first, then rename.
#
# Requires kagent >= 0.10: 0.9.11's google-adk raises NotImplementedError on
# thinking blocks in non-streaming calls, and claude-sonnet-5 thinks by default.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: anthropic-claude-sonnet-4-6
  namespace: kagent
spec:
  provider: Anthropic
  anthropic: {}
  apiKeySecret: anthropic-claude-sonnet-4-6
  apiKeySecretKey: ANTHROPIC_API_KEY
  model: claude-sonnet-5
