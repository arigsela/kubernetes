# Claude Sonnet 5.5 for the agents that reason over several tools
# (homelab-knowledge, k8s-agent, istio-agent, build-orchestrator, implementer, restarter), and
# the config docs-checker's template binds.
#
# kagent 1.0 (api.kagent.dev/v1alpha3). Every agent but docs-checker runs the Go ADK (the
# `kagent` runtime of the Harnesses in ../harnesses/), which maps only text and tool_use blocks:
# a 5.x model's thinking is dropped rather than replayed (kagent#3026, open; SPEC §R.45).
# docs-checker is the one `byo` runtime (../harnesses/docs-checker.yaml) and calls the API
# itself, choosing Haiku or Sonnet 5.5 per graph node. From this config it gets the key (injected
# by the egress gateway) and reads promptCaching and cacheTTL; maxTokens and the Go adapter notes
# below do not apply to it.
#
# maxTokens: the Go adapter's default is 8192 (defaultAnthropicMaxTokens in
# go/adk/pkg/models/anthropic_adk.go). It caps thinking plus answer together and a truncated
# answer is still reported as completed (kagent#2895, open). 16000 leaves headroom.
#
# promptCaching: the Go adapter marks cache breakpoints on the tools, the system prompt and the
# last message, so each turn of a tool loop reads the previous prefix from the cache. "5m" is
# the default TTL and the cheaper cache-write rate; "1h" only pays off for idle gaps > 5 min.
#
# No temperature/topP/topK: the 5.5 models reject non-default sampling parameters (400).
# The key is the Vault-backed kagent-anthropic Secret (kagent-anthropic-external-secret.yaml).
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: anthropic-claude-sonnet-5-5
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
spec:
  provider: Anthropic
  model: claude-sonnet-5-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  stream: true
  anthropic:
    maxTokens: 16000
    promptCaching: true
    cacheTTL: "5m"
