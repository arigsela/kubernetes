# Claude Sonnet 5.5 for the Declarative agents that reason over several tools
# (homelab-knowledge, k8s-agent, istio-agent, build-orchestrator).
#
# Agents on this config ! run `runtime: go`. Every 5.x model thinks by default,
# and kagent 0.10's python runtime (google-adk 1.x, pinned <2) cannot send a
# thinking block back on the next tool-loop turn: NotImplementedError on every
# multi-step question (tried 2026-09-25, #603). The Go ADK maps only text and
# tool_use blocks, so it drops thinking instead of crashing. The fix upstream is
# google-adk 2.6+, which only kagent 1.x takes (SPEC §R.45, §T.94).
#
# maxTokens: the Go runtime sends it (python ignores it). Its default is 8192,
# which caps thinking plus answer together and truncates silently while the
# task still reports completed (kagent#2895). 16000 leaves headroom and stays
# under the Go SDK's non-streaming timeout.
#
# No temperature/topP/topK: the 5.5 models reject non-default sampling (400).
# The key is the Vault-backed kagent-anthropic Secret (kagent-anthropic-external-secret.yaml).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: anthropic-claude-sonnet-5-5
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-sonnet-5-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic:
    maxTokens: 16000
