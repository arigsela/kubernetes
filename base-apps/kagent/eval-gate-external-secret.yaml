# The evaluation gate's Secret (eval-gate-job.yaml reads every key as OPTIONAL):
#   anthropic-api-key  the Claude tier of the judge
#   typesafe-api-key   Jev, the first tier (both present -> the cascade; one -> that judge)
#   github-token       optional: commit statuses `eval/<agent>` on the synced revision
# Source: k8s-secrets/eval-gate, written by scripts/provision-eval-gate-vault.sh. A property
# missing in Vault is simply absent from the Secret (the job then runs without that tier).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eval-gate
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-eval-gate
    kind: SecretStore
  target:
    name: eval-gate
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: eval-gate
        property: anthropic-api-key
    - secretKey: typesafe-api-key
      remoteRef:
        key: eval-gate
        property: typesafe-api-key
    - secretKey: github-token
      remoteRef:
        key: eval-gate
        property: github-token
