# The evaluation gate's Secret (eval-gate-job.yaml reads every key as OPTIONAL):
#   anthropic-api-key  the Claude tier of the judge
#   typesafe-api-key   Jev, the first tier (both present -> the cascade; one -> that judge)
#   github-token       optional: commit statuses `eval/<agent>` on the synced revision
# Source: k8s-secrets/eval-gate, written by scripts/provision-eval-gate-vault.sh (owner, 2026-10-13:
# anthropic-api-key + typesafe-api-key present; github-token when a PAT is minted, SPEC T113). A property
# missing in Vault is simply absent from the Secret (the job then runs without that tier):
# that is why this uses dataFrom/extract and not a `data` list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eval-gate
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-eval-gate
    kind: SecretStore
  target:
    name: eval-gate
    creationPolicy: Owner
  # dataFrom/extract: the Secret gets every property that EXISTS in Vault. A listed `data`
  # entry whose property is missing (github-token until the owner mints a PAT) is a
  # SecretSyncedError, which Argo reports Degraded and which fails the whole sync (2026-10-13).
  dataFrom:
    - extract:
        key: eval-gate
