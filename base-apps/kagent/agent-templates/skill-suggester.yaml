# skill-suggester — suggests A2A skills for a new kagent agent from a one-line description.
# Called by the Backstage New App/agent wizard (`kagent-suggest`).
#
# AgentTemplate = WHAT (api.kagent.dev/v1alpha3); its Agent (../agents/skill-suggester.yaml)
# runs it on ../harnesses/kagent-chat.yaml (memory + compaction, as on 0.10).
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: skill-suggester
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: skill-suggester
    arigsela.com/idp-managed: "true"
    # Pure LLM, no tools. Nothing to gate.
    capability.homelab/class: read
spec:
  description: Suggests A2A skills for new kagent agents based on a one-line description
  # Haiku 5.5: one short structured answer per call.
  modelConfig:
    # Through the model gateway (§T.137): group skill-suggester's daily budget, base-apps/model-gateway/budgets.yaml.
    name: anthropic-claude-haiku-5-5-skill-suggester
  systemPrompt: |
    You receive an agent description. Respond with ONLY a JSON array of exactly 3 skills, each shaped {id (kebab-case), name
      (Title Case), description (one sentence)}. No prose, no markdown.

    ## Memory tools
    `load_memory` requires a `query` argument: a short phrase describing what to recall
    (for example "kagent cutover date"). Never call it with no arguments; that call fails.
    `save_memory` takes the fact to remember as text.
