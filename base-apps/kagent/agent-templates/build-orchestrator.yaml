# build-orchestrator — a router in front of k8s-agent and istio-agent.
#
# HAND-OFF, NOT DELEGATION. On kagent 0.10 a `type: Agent` tool called another agent and got
# its answer back. In 1.0 a subAgent binding compiles the child template INTO this agent's
# runtime (a Shared subagent, run under this agent's Harness) and routing to it transfers the
# conversation: the child answers the user directly and this agent never sees the child's
# answer (SPEC §R.45). So it can route a request but cannot combine two specialists' results.
# Its prompt says so. kagent also rejects a subagent that has subagents of its own ("consecutive
# Shared AgentTemplate tools exceed the kagent runtime boundary"); k8s-agent and istio-agent
# have none.
#
# The children keep their own bindings inside this runtime, approval gates included, so every
# mutating call still pauses for a human.
#
# AgentTemplate = WHAT (api.kagent.dev/v1alpha3); its Agent (../agents/build-orchestrator.yaml)
# runs it on ../harnesses/kagent-memory.yaml. Was base-apps/kagent/build-orchestrator.yaml.
# Its 0.10 compaction (interval 5, overlap 2) is not carried over: kagent-memory has none, and
# the 0.10 Go runtime ignored it anyway (kagent#2728).
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: build-orchestrator
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/name: build-orchestrator
    arigsela.com/idp-managed: "true"
    # Binds no MCP tool of its own, but its subagents are admin (and run inside it). Effective
    # capability is admin, so it is declared admin: agent-capability-delegation denies a
    # subagent whose class is above this label.
    capability.homelab/class: admin
spec:
  description: >-
    Routes a Kubernetes or Istio request to the right specialist agent (k8s-agent or
    istio-agent), which then takes over the conversation and answers directly. Hand-off, not
    delegation: it does not get the specialist's answer back.
  modelConfig:
    name: anthropic-claude-sonnet-5-5
  systemPrompt: |
    You are a Kubernetes operations router in front of two specialist agents.
    Read each request and hand it to the one specialist best suited to it.

    ## Specialists

    - **k8s-agent**: general Kubernetes resource management, pod operations,
      deployments, troubleshooting.
    - **istio-agent**: Istio service mesh configuration, traffic management,
      waypoints, mTLS and authorization policy.

    ## How hand-off works

    Handing off TRANSFERS the conversation: the specialist answers the user
    directly and you do not get its answer back. You cannot run two specialists
    and combine their results.

    ## Rules

    1. Hand off to the single most specific specialist for the request.
    2. If unsure, hand off to k8s-agent for general cluster operations.
    3. For a request that spans both domains, hand off to the specialist for
       the FIRST step and tell the user, before you do, which part the other
       specialist covers so they can ask it next.
    4. Never attempt operations yourself: you hold no tools of your own.

    ## Memory tools
    `load_memory` requires a `query` argument: a short phrase describing what to recall
    (for example "kagent cutover date"). Never call it with no arguments; that call fails.
    `save_memory` takes the fact to remember as text.
  tools:
    - subAgent:
        name: k8s-agent
        description: Kubernetes resource management, pod operations, deployments and troubleshooting. Mutating calls need human approval.
        templateRef:
          name: k8s-agent
    - subAgent:
        name: istio-agent
        description: Istio service mesh configuration, traffic management, waypoints, mTLS and authorization policy. Mutating calls need human approval.
        templateRef:
          name: istio-agent
