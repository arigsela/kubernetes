# Brave Search API key for the brave-search-mcp MCPServer (brave-search-mcp.yaml), which
# reads it as BRAVE_API_KEY (kmcp injects secretRefs with envFrom). The value lives only in
# Vault: k8s-secrets/brave-search-mcp, property api-key. Until it is written there this
# ExternalSecret stays SecretSyncedError and the MCP server pod cannot start; the agents that
# bind its tools still run, they just cannot search.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brave-search-mcp-api-key
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-brave-search-mcp
    kind: SecretStore
  target:
    name: brave-search-mcp-api-key
    creationPolicy: Owner
  data:
    - secretKey: BRAVE_API_KEY
      remoteRef:
        key: brave-search-mcp
        property: api-key
