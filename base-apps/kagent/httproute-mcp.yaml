# kagent MCP endpoint (T56).
#
# HTTP basic auth is NOT carried over - Istio has no equivalent and T52's options
# were ext_authz, dex OIDC, or dropping it. Decision 2026-07-31: keep the host,
# drop the credential, retain the IP allow-list. Weaker than today, but this
# endpoint backs a live MCP client (~/.claude.json points at
# https://kagent-mcp.arigsela.com/mcp) so removing the host would have broken it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-mcp
  namespace: kagent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Kagent MCP
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-connection
    gethomepage.dev/description: Kagent MCP endpoint
    # This route backends kagent-controller, a different pod from the UI above.
    gethomepage.dev/pod-selector: app.kubernetes.io/component=controller
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-kagent-mcp
  hostnames:
    - kagent-mcp.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-controller
          port: 8083
    # A2A for the kagent namespace's Agents (kagent 1.0). 1.0 has no per-agent
    # Service: the controller serves every Agent at POST /agents/<ns>/<name>
    # (JSON-RPC, A2A v1) and GET .../.well-known/agent-card.json. Its /mcp has no
    # create-session or invoke-by-agent tool, so scripts/ask-hk and
    # scripts/capture-eval-answers.py send A2A here instead.
    #
    # Scoped to /agents/kagent/ on purpose: other namespaces' Agents stay
    # unreachable from outside (PathPrefix matches whole path segments, and Go's
    # mux splits on the escaped path, so %2F cannot climb into another namespace).
    # A2A is unauthenticated (insecure mode: X-User-Id is the identity), so the
    # host-wide allow-list in istio-ingress/authorizationpolicy.yaml is the only
    # control here, exactly as for /mcp. Its rule matches this host with no path,
    # so it already covers this rule. No timeout: answers take minutes, and Istio
    # sets none by default.
    - matches:
        - path:
            type: PathPrefix
            value: /agents/kagent/
      backendRefs:
        - name: kagent-controller
          port: 8083
