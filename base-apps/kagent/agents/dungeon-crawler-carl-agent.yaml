# dungeon-crawler-carl-agent — chat agent.
#
# kagent 1.0 (api.kagent.dev/v1alpha3) splits an agent in three. This Agent only binds:
#   WHAT  AgentTemplate dungeon-crawler-carl-agent (../agent-templates/dungeon-crawler-carl-agent.yaml): model, prompt, tools, and the
#         capability.homelab/class label the admission policies check
#   HOW   Harness kagent-chat (../harnesses/kagent-chat.yaml): runtime image, memory, Substrate
# An Agent must reference both by name. An inline spec.template / spec.harness is denied at
# admission (agent-capability-refs) and in CI: it would bypass the checks on AgentTemplates and
# Harnesses.
#
# The Backstage annotations live here, on the object users chat with.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: dungeon-crawler-carl-agent
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/managed-by: kagent
    app.kubernetes.io/name: dungeon-crawler-carl-agent
    app: kagent
    arigsela.com/idp-managed: "true"
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/component-type: kagent-agent
    # The entity's Kubernetes tab: the Agent and its AgentTemplate both carry this label.
    terasky.backstage.io/kubernetes-label-selector: app.kubernetes.io/name=dungeon-crawler-carl-agent
    # 0.10 UI chat path, carried over verbatim; check it against the 1.0 UI at cutover.
    terasky.backstage.io/links: '[{"url":"https://kagent.arigsela.com/agents/kagent/dungeon-crawler-carl-agent/chat","title":"Chat with this agent","icon":"chat"}]'
    backstage.io/managed-by-location: url:https://github.com/arigsela/kubernetes/blob/main/base-apps/kagent/agents/dungeon-crawler-carl-agent.yaml
    backstage.io/owner: group:default/platform-engineering
spec:
  templateRef:
    name: dungeon-crawler-carl-agent
  harnessRef:
    name: kagent-chat
