# restarter — the dispatcher's gated restart (§T.118). Called by the dispatcher after a `leak`
# verdict, or by hand: `scripts/ask-hk --agent kagent/restarter "Restart exactly one pod: ns/pod …"`.
#
# kagent 1.0 (api.kagent.dev/v1alpha3) splits an agent in three. This Agent only binds:
#   WHAT  AgentTemplate restarter (../agent-templates/restarter.yaml): model, prompt, tools, and the
#         capability.homelab/class label the admission policies check
#   HOW   Harness kagent-stateless (../harnesses/kagent-stateless.yaml): runtime image, no memory, Substrate
# An Agent must reference both by name. An inline spec.template / spec.harness is denied at
# admission (agent-capability-refs) and in CI: it would bypass the checks on AgentTemplates and
# Harnesses.
#
# The Backstage annotations live here, on the object users chat with.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: restarter
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/managed-by: kagent
    app.kubernetes.io/name: restarter
    app: kagent
    arigsela.com/idp-managed: "true"
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/component-type: kagent-agent
    # The entity's Kubernetes tab: the Agent and its AgentTemplate both carry this label.
    terasky.backstage.io/kubernetes-label-selector: app.kubernetes.io/name=restarter
    backstage.io/managed-by-location: url:https://github.com/arigsela/kubernetes/blob/main/base-apps/kagent/agents/restarter.yaml
    backstage.io/owner: group:default/platform-engineering
spec:
  templateRef:
    name: restarter
  harnessRef:
    name: kagent-stateless
