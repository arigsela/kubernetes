# bug-investigator — Taskboard's bug investigator, no memory.
#
# kagent 1.0 (api.kagent.dev/v1alpha3) splits an agent in three. This Agent only binds:
#   WHAT  AgentTemplate bug-investigator (../agent-templates/bug-investigator.yaml): model, prompt,
#         tools, and the capability.homelab/class label the admission policies check
#   HOW   Harness kagent-stateless (../harnesses/kagent-stateless.yaml): runtime image, memory, Substrate
# An Agent must reference both by name. An inline spec.template / spec.harness is denied at
# admission (agent-capability-refs) and in CI.
#
# Caller: the bug-investigator trigger (service account kagent/bug-investigator-trigger), or a
# human with ask-hk for a rehearsal. The Backstage annotations live here, on the object users chat with.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: bug-investigator
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/managed-by: kagent
    app.kubernetes.io/name: bug-investigator
    app: kagent
    arigsela.com/idp-managed: "true"
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/component-type: kagent-agent
    # The entity's Kubernetes tab: the Agent and its AgentTemplate both carry this label.
    terasky.backstage.io/kubernetes-label-selector: app.kubernetes.io/name=bug-investigator
    backstage.io/managed-by-location: url:https://github.com/arigsela/kubernetes/blob/main/base-apps/kagent/agents/bug-investigator.yaml
    backstage.io/owner: group:default/platform-engineering
spec:
  template:
    ref:
      name: bug-investigator
  harnessRef:
    name: kagent-stateless
