# ESO identity for the evaluation gate's credentials (judge API keys, the GitHub status token).
#
# Vault binds the kubernetes-auth role "eval-gate" to THIS ServiceAccount, and that role's
# policy grants read on exactly one path: k8s-secrets/data/eval-gate
# (scripts/provision-eval-gate-vault.sh). Part of the agent-identity contract:
# templates/agent-identity/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-eval-gate
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent
    arigsela.com/idp-managed: "true"
