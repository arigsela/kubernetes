apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: backstage
        image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/backstage-portal:v1.5.2@sha256:10c465e5c3b60b5978b4cca0c5353296f0e46451c8a4d0dbb280e1f590781c78
        imagePullPolicy: Always
        ports:
        - containerPort: 7007
        envFrom:
        - configMapRef:
            name: backstage-config
        - secretRef:
            name: backstage-secrets
        env:
        # Callers as principals (kubernetes SPEC V91/T110): the kagent plugin reads this
        # projected token on every call and sends it as a bearer instead of X-User-Id;
        # the mesh in front of the controller verifies it, so the portal's sessions are
        # owned by system:serviceaccount:backstage:default.
        - name: KAGENT_TOKEN_FILE
          value: /var/run/kagent/token
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 7007
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 7007
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Raised 2026-09-25 (plan Task 2.5) from 250m/256Mi -> 1/512Mi. Over 15 days the
        # container ran at CPU p95 696m / max 732m against a 1-core limit, and was
        # CFS-throttled in 60% of periods: its limit, not the node, was the bottleneck
        # (Grafana Cluster Overview -> Pod pressure: ~24% CPU stall, the "Pod CPU starved"
        # alert). Memory peaked at 468Mi = 91% of the old 512Mi limit.
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        volumeMounts:
        - name: kagent-token
          mountPath: /var/run/kagent
          readOnly: true
      volumes:
      # Projected token, audience kagent, rotated by the kubelet before it expires (V92).
      - name: kagent-token
        projected:
          sources:
          - serviceAccountToken:
              audience: kagent
              expirationSeconds: 3600
              path: token
