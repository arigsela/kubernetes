# base-apps/dispatcher/external-secret.yaml
---
# The oauth2-proxy sidecar's three files (§V.97). allowed-emails is THE access control: Dex
# admits any GitHub account. All three are written by scripts/provision-dispatcher-web-vault.sh
# and never appear in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcher-web-oauth2
  namespace: dispatcher
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-dispatcher-web
    kind: SecretStore
  target:
    name: dispatcher-web-oauth2
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: dispatcher-web
        property: oauth2-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: dispatcher-web
        property: oauth2-cookie-secret
    - secretKey: allowed-emails
      remoteRef:
        key: dispatcher-web
        property: allowed-emails
