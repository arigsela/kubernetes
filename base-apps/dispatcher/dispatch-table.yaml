# base-apps/dispatcher/dispatch-table.yaml
---
# Dispatch table — THE single place that says which signal an agent looks at (ADP path 1).
#
# Humans get every alert regardless: Grafana's contact point delivers to n8n → Slack on its
# own integration (V86). This table only ADDS agent investigations. Rules are checked in
# order; the first whose `match` keys all equal the alert's labels wins. `route` is `none`
# or `agent:<AgentTemplate>`; agent routes need a `prompt`, and may only name templates whose
# every tool is `read` or `propose` in the capability taxonomy with no requireApproval binding
# (V87, tests/dispatch/test_table.py). A row whose agent may open a pull request carries
# `"proposes": true` and is skipped (`skip-open-prs`) while the implementer has
# `limits.open_prs_max` pull requests open. Every Grafana rule title must have a row: `none`
# with a `why` is a decision, a missing row fails CI.
#
# A row may also carry `remediate` (§T.118, §V.96): `{"on": [<verdict>...], "agent": <template>,
# "prompt": ...}`. The implementer ends its answer with `verdict: limit-too-low | leak |
# contention | rollout-pending | inconclusive`; when the verdict is in `on`, and `limits.restarts_per_day` and the
# once-per-alert-per-day rule admit it, the dispatcher opens a SECOND session with that agent
# (`restarter`: one gated pod delete) and Slack gets the pending call and the ask-hk command to
# approve or reject it. `remediate.agent` is the one place a template with a gated binding may
# appear: every ungated tool must be read-class and every gated one write/destructive-class
# (tests/dispatch/test_table.py). The dispatcher never answers the approval (V88).
#
# Placeholders in prompts: {alertname} {status} {starts_at} {labels[<name>]} {annotations[<name>]};
# a remediation prompt also has {verdict} and {session} (the investigation's session id);
# a missing key renders as `?`. A prompt is a string, or a list of strings joined with spaces
# (JSON has no line continuation; the list keeps lines under 200 characters).
#
# JSON, not YAML, so the dispatcher needs no pip install (python:3.12-slim, stdlib only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-table
  namespace: dispatcher
  labels:
    app: dispatcher
data:
  dispatch.json: |
    {
      "version": 1,
      "limits": {"investigations_per_hour": 4, "repeat_after_hours": 6, "open_prs_max": 3, "restarts_per_day": 2},
      "rules": [
        {
          "id": "pod-cpu-starved",
          "source": "grafana",
          "match": {"alertname": "Pod CPU starved"},
          "route": "agent:implementer",
          "proposes": true,
          "prompt": [
            "Grafana alert '{alertname}' is firing for pod {labels[namespace]}/{labels[pod]}: {annotations[summary]}",
            "Investigate with your read-only tools: describe the pod, read its recent events and the last 100 log lines,",
            "find where its CPU request and limit are declared in git, and decide between 'limit too low'",
            "(throttled with steady demand, no restarts) and 'contention' (node pressure, other pods).",
            "Only for 'limit too low': first list your open pull requests and, if one already touches the same file, update that",
            "branch instead; otherwise open one pull request raising the CPU limit (and request, same ratio) by half, rounded,",
            "with a comment naming this alert and today's date, on branch agent/pod-cpu-starved-{labels[namespace]}-<workload>",
            "where <workload> is the pod's owner workload (Deployment, StatefulSet or DaemonSet name), never the pod name.",
            "Otherwise answer with the evidence and 'no pull request: <reason>'. Runbook hint: {annotations[runbook]}",
            "Never quote values that look like tokens, keys or passwords, even from logs or YAML; name the line instead.",
            "The last line of your answer is the verdict: 'verdict: limit-too-low', 'verdict: contention',",
            "'verdict: rollout-pending' (the raise is already in git but the live pod lags) or 'verdict: inconclusive'."
          ],
          "remediate": {
            "on": ["rollout-pending"],
            "agent": "restarter",
            "prompt": [
              "Restart exactly one pod: {labels[namespace]}/{labels[pod]}. The implementer's verdict was {verdict}",
              "(session {session}, Grafana alert '{alertname}'): the CPU change is merged but has not reached the live pod.",
              "Confirm the pod exists and has a Deployment, StatefulSet or DaemonSet owner, then delete that pod once;",
              "its owner recreates it from the current template. Delete nothing else."
            ]
          },
          "why": "The investigation usually ended in 'raise the limit'; that is one number in one file, which is what a pull request a human merges is for (ADP path 8, the first unprompted write)."
        },
        {
          "id": "container-near-memory-limit",
          "source": "grafana",
          "match": {"alertname": "Container near memory limit"},
          "route": "agent:implementer",
          "proposes": true,
          "prompt": [
            "Grafana alert '{alertname}' is firing for {labels[namespace]}/{labels[pod]} container {labels[container]}: {annotations[summary]}",
            "Investigate with your read-only tools: describe the pod, check for OOMKilled in its last state and events,",
            "read the last 100 log lines, find where the container's memory limit is declared in git, and decide between",
            "'limit too low' (steady use near the limit, no OOMKilled, no restart growth) and 'leak' (growth over time or OOMKilled).",
            "Only for 'limit too low': first list your open pull requests and, if one already touches the same file, update that",
            "branch instead; otherwise open one pull request raising the memory limit (and request, same ratio) by half, rounded,",
            "with a comment naming this alert and today's date, on branch agent/container-near-memory-limit-{labels[namespace]}-<workload>-{labels[container]}",
            "where <workload> is the pod's owner workload (Deployment, StatefulSet or DaemonSet name), never the pod name.",
            "Otherwise answer with the evidence and 'no pull request: <reason>'. Runbook hint: {annotations[runbook]}",
            "Never quote values that look like tokens, keys or passwords, even from logs or YAML; name the line instead.",
            "The last line of your answer is the verdict: 'verdict: limit-too-low', 'verdict: leak',",
            "'verdict: rollout-pending' (the raise is already in git but the live pod lags) or 'verdict: inconclusive'."
          ],
          "remediate": {
            "on": ["leak", "rollout-pending"],
            "agent": "restarter",
            "prompt": [
              "Restart exactly one pod: {labels[namespace]}/{labels[pod]}. The implementer's verdict was {verdict}",
              "(session {session}, Grafana alert '{alertname}'): leak = a restart clears it; rollout-pending = the raised",
              "limit is merged but the live pod lags. Confirm the pod exists and has a Deployment, StatefulSet or DaemonSet",
              "owner, then delete that pod once; its owner recreates it from the current template. Delete nothing else."
            ]
          },
          "why": "Only 'limit too low' is a manifest number and becomes a pull request. A leak, or a merged raise the pod has not picked up, is a restart the owner approves; one a day per workload."
        },
        {
          "id": "deployment-unavailable",
          "source": "grafana",
          "match": {"alertname": "Deployment has no available replicas"},
          "route": "none",
          "why": "New 2026-10-27 (hk-demo readiness review). A human reads the pod's events and the app's runbook first; once a few have fired, decide whether an investigation adds anything."
        },
        {
          "id": "container-crash-looping",
          "source": "grafana",
          "match": {"alertname": "Container crash-looping"},
          "route": "none",
          "why": "Same as above: the previous container's logs say why it exits, and a crash loop is a code, config or dependency fault more often than a manifest number."
        },
        {
          "id": "agent-ungated-tool",
          "source": "grafana",
          "match": {"alertname": "Agent invoked a gated tool with NO approval"},
          "route": "none",
          "why": "A security finding about the agents themselves. A human reads the record behind the SELECT-only credential; no agent investigates the agents."
        },
        {
          "id": "agent-audit-risk-high",
          "source": "grafana",
          "match": {"alertname": "Agent session scored high risk"},
          "route": "none",
          "why": "Same as above: the risk UI and the acknowledged file are the human's tools, and the record is not readable by any in-cluster agent."
        },
        {
          "id": "agent-eval-regression",
          "source": "grafana",
          "match": {"alertname": "Agent eval regression"},
          "route": "none",
          "why": "A regression names corpus ids and a commit; a human reads the diff. An agent grading an agent change is the loop this gate exists to break."
        },
        {
          "id": "substrate-certificate-expired",
          "source": "grafana",
          "match": {"alertname": "Substrate pod certificate expired"},
          "route": "none",
          "why": "The agents themselves are down when this fires; only a human (or the CronJob) can restart the Substrate pods."
        },
        {
          "id": "falco-sensitive-detection",
          "source": "grafana",
          "match": {"alertname": "Falco detected a sensitive-file read or unexpected API access"},
          "route": "none",
          "why": "Falco output can name sensitive paths; until a redaction rule for its lines is agreed, no summary of them goes to Slack through an agent. Next source candidate."
        },
        {
          "id": "substrate-ca-expiry",
          "source": "grafana",
          "match": {"alertname": "Substrate CA expires in under 30 days"},
          "route": "none",
          "why": "The runbook is deterministic (rotate the CAs); there is nothing to investigate."
        },
        {
          "id": "beacon-notifier-not-traced",
          "source": "grafana",
          "match": {"alertname": "Beacon notifier not traced"},
          "route": "none",
          "why": "The runbook is a two-step check (init container present? operator ready?); a rollout of the notifier fixes it."
        },
        {
          "id": "beacon-enterprise-signup-pending",
          "source": "grafana",
          "match": {"alertname": "Beacon enterprise signup pending"},
          "route": "none",
          "why": "Not a fault: an approval for the owner, who opens the XTenant PR; nothing for an agent to investigate (beacon §V.54)."
        },
        {
          "id": "taskboard-server-errors",
          "source": "grafana",
          "match": {"alertname": "Taskboard server errors"},
          "route": "none",
          "why": "The bug-investigator trigger files and investigates it: same expression, a `bug` issue on arigsela/taskboard (base-apps/kagent/bug-investigator-trigger.yaml)."
        },
        {
          "id": "agent-budget-near",
          "source": "grafana",
          "match": {"alertname": "Agent near its daily budget"},
          "route": "none",
          "why": "An investigation would spend from the budgets this alert is about; the owner reads the Agent Platform dashboard and raises the budget by a pull request if it is a busy day (§T.137)."
        },
        {
          "id": "agent-budget-over",
          "source": "grafana",
          "match": {"alertname": "Agent over its daily budget"},
          "route": "none",
          "why": "Same as above: an investigation would spend from the budgets this alert is about, and the over-budget group's own agent may be refused (§T.137)."
        },
        {
          "id": "agent-budget-blocked",
          "source": "grafana",
          "match": {"alertname": "Agent blocked by its daily budget"},
          "route": "none",
          "why": "The gateway already stopped the group; an investigation would spend from the budgets this alert is about. The owner decides whether to raise the budget by a pull request (§T.137)."
        },
        {
          "id": "model-gateway-down",
          "source": "grafana",
          "match": {"alertname": "Model gateway down"},
          "route": "none",
          "why": "An investigation needs model calls, and the agents' model calls go through the gateway that is down; the runbook is the path (§T.137)."
        }
      ]
    }
