# base-apps/dispatcher/certificate.yaml
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dispatcher-web-tls
  namespace: dispatcher
spec:
  secretName: dispatcher-web-tls
  dnsNames:
    - dispatcher.arigsela.com
  issuerRef:
    name: letsencrypt-route53
    kind: ClusterIssuer
