# base-apps/dispatcher/httproute.yaml
---
# dispatcher.arigsela.com → the oauth2-proxy sidecar (4180), never the webhook (8080) and never
# the approvals server itself (8081, localhost). Two layers in front: the edge IP allow-list
# (base-apps/istio-ingress/authorizationpolicy.yaml) and the sidecar's Dex login (§V.97).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dispatcher-web
  namespace: dispatcher
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Restart approvals
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-restart-alert
    gethomepage.dev/description: Approve or reject a restart an agent proposed
    gethomepage.dev/pod-selector: app=dispatcher
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-dispatcher
  hostnames:
    - dispatcher.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dispatcher
          port: 4180
