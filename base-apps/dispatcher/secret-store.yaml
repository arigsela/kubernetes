# base-apps/dispatcher/secret-store.yaml
---
# One store, one role, one key (§T.119): dispatcher-web → k8s-secrets/dispatcher-web only.
# The role must exist before this merges (scripts/provision-dispatcher-web-vault.sh): a
# SecretStore whose role does not exist fails the whole app sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-dispatcher-web
  namespace: dispatcher
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: dispatcher-web
          serviceAccountRef:
            name: eso-dispatcher-web
