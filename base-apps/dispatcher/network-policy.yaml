# Who may POST to the dispatcher (review finding I1, 2026-10-14). Since the resource rows route
# to the implementer, a forged alert is a write-capable prompt under the dispatcher's own
# verified identity (§V.91): the agent would open a pull request for whatever the alert said.
# Grafana's webhook is the only legitimate sender, and Grafana runs OUTSIDE the mesh (namespace
# logging is not ambient, ServiceAccount default), so an Istio AuthorizationPolicy by principal
# would deny it; the gate is a NetworkPolicy on the pod (k3s enforces NetworkPolicy; ambient's
# in-pod capture keeps the client pod as the source). The second rule admits a replay pod in
# this namespace labelled `dispatcher/replay: "true"` (runbook.md). Nothing else: the dispatcher
# holds no credential, so the only thing to protect is its prompt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcher-ingress
  namespace: dispatcher
  labels:
    app: dispatcher
spec:
  podSelector:
    matchLabels:
      app: dispatcher
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
          podSelector:
            matchLabels:
              # The chart's own label; the pod has no app.kubernetes.io/name.
              app: grafana
        - podSelector:
            matchLabels:
              dispatcher/replay: "true"
      ports:
        - port: 8080
          protocol: TCP
        # An in-mesh source (the replay pod lives in this ambient namespace) reaches the pod
        # over HBONE on 15008; NetworkPolicy is enforced before ztunnel unwraps it.
        - port: 15008
          protocol: TCP
