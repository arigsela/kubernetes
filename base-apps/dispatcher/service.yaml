# base-apps/dispatcher/service.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: dispatcher
  labels:
    app: dispatcher
spec:
  selector:
    app: dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The approvals page's sidecar (§T.119); 8081 is never exposed (localhost only).
    - name: web
      port: 4180
      targetPort: web
