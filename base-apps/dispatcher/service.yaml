# base-apps/dispatcher/service.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: dispatcher
  labels:
    app: dispatcher
spec:
  selector:
    app: dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The approvals page's sidecar (§T.119); 8081 is never exposed (localhost only).
    - name: web
      port: 4180
      targetPort: web
---
# The decide door (§T.120): a Service of its own so the public HTTPRoute (Service `dispatcher`)
# can never reach 8082, even by a wrong backend edit. Only the Slack bridge resolves it.
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-decide
  namespace: dispatcher
  labels:
    app: dispatcher
spec:
  selector:
    app: dispatcher
  ports:
    - name: decide
      port: 8082
      targetPort: decide
