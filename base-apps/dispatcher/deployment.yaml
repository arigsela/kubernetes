# base-apps/dispatcher/deployment.yaml
---
# One replica: the budget and the repeat window are in memory (scripts/dispatch.py, Budget).
# A second replica would double the budget; a restart forgets it, which errs toward looking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: dispatcher
  labels:
    app: dispatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
      annotations:
        # The pod reads both ConfigMaps once at start. Argo CD updates a ConfigMap in place and
        # nothing restarts the pod, so these checksums change the pod template instead (the same
        # pattern as Grafana's checksum/alerting). scripts/gen-dispatcher-configmap.py writes both;
        # tests/dispatch/test_manifests.py fails if either is stale.
        checksum/table: "4098a69e1178d81f2101d0ab370c855300eea81b5a66ae883396e410d969d30b"
        checksum/code: "a046b42a424d9ba53904e4808e2d7c299f45ef9188a3373e62fde8a80be7f1cb"
    spec:
      serviceAccountName: dispatcher
      automountServiceAccountToken: false   # never talks to the API server; the projected token below is for kagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          # Renovate pins the digest on its next run (kubernetes manager, pinDigests for base-apps).
          image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          command: ["python", "-u", "/opt/dispatch/dispatch.py"]
          env:
            - name: DISPATCH_TABLE
              value: /etc/dispatch/dispatch.json
            - name: KAGENT_A2A_BASE
              value: http://kagent-controller.kagent.svc.cluster.local:8083
            - name: N8N_WEBHOOK_BASE
              value: http://n8n.n8n.svc.cluster.local:5678/webhook
            - name: INVESTIGATION_TIMEOUT
              value: "300"
            # The implementer App's login as GitHub reports PR authors; the open-PR cap counts
            # its open PRs on the public repo, unauthenticated (§T.117, limits.open_prs_max).
            - name: IMPLEMENTER_LOGIN
              value: "arigsela-implementer[bot]"
            - name: PORT
              value: "8080"
            # The approvals page (§T.119): a second server on 127.0.0.1:8081, reachable only
            # through the oauth2-proxy sidecar below. Slack links to APPROVALS_URL.
            - name: APPROVALS_PORT
              value: "8081"
            - name: APPROVALS_URL
              value: https://dispatcher.arigsela.com/approvals
            # The Slack bridge's decide door (§T.120): the same claimed decision path as the
            # page, JSON, admitted only from the bridge (network-policy.yaml,
            # authorization-policy.yaml).
            - name: DECIDE_PORT
              value: "8082"
          ports:
            - name: http
              containerPort: 8080
            - name: decide
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /opt/dispatch
              readOnly: true
            - name: table
              mountPath: /etc/dispatch
              readOnly: true
            - name: kagent-token
              mountPath: /var/run/kagent
              readOnly: true
            - name: eval-release
              mountPath: /etc/eval-release
              readOnly: true
        # The only way to the approvals page (§V.97): OIDC via Dex, PKCE, and ONE email from
        # Vault as the allow-list (Dex admits any GitHub account). Same image and flags as
        # agent-audit-web. It sets X-Forwarded-Email on what it forwards; the approvals server
        # trusts that header because nothing else can reach 127.0.0.1:8081.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8081/
            - --provider=oidc
            - --provider-display-name=GitHub (via Dex)
            - --oidc-issuer-url=https://dex.arigsela.com
            # No OIDC discovery at startup: a sidecar that cannot start takes the whole pod out of
            # the Service and with it the alert webhook (review 2026-10-14). Dex's endpoints are
            # fixed; the JWKS is still fetched when a token is verified.
            - --skip-oidc-discovery
            - --login-url=https://dex.arigsela.com/auth
            - --redeem-url=https://dex.arigsela.com/token
            - --oidc-jwks-url=https://dex.arigsela.com/keys
            - --client-id=dispatcher
            - --client-secret-file=/etc/oauth2-proxy/secrets/client-secret
            - --cookie-secret-file=/etc/oauth2-proxy/secrets/cookie-secret
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --redirect-url=https://dispatcher.arigsela.com/oauth2/callback
            - --authenticated-emails-file=/etc/oauth2-proxy/secrets/allowed-emails
            - --cookie-name=_dispatcher
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --skip-provider-button=true
            - --silence-ping-logging=true
          ports:
            - containerPort: 4180
              name: web
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: oauth2
              mountPath: /etc/oauth2-proxy/secrets
              readOnly: true
      volumes:
        - name: oauth2
          secret:
            secretName: dispatcher-web-oauth2
        # Written by the eval-gate Job after each scored run (V99, base-apps/kagent/eval-release-
        # rbac.yaml): release.json names the agents held after an eval regression. Optional so the
        # pod starts before the first run; absent = unknown = route, logged. The kubelet refreshes
        # the mount within about a minute of a write.
        - name: eval-release
          configMap:
            name: eval-release
            optional: true
        - name: code
          configMap:
            name: dispatcher-code
        - name: table
          configMap:
            name: dispatcher-table
        # Projected token, audience kagent, rotated by the kubelet before it expires; the mesh
        # verifies it and sets X-User-Id to this service account (V91, V92). Read on every
        # send, never cached.
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent
                  expirationSeconds: 3600
                  path: token
