apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: argo-rollouts
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.40.5
    helm:
      values: |
        controller:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        dashboard:
          enabled: true
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  # The API server rewrites every CRD the chart ships, so Argo can never converge:
  #   preserveUnknownFields  chart sets false; the API strips it (v1beta1 field,
  #                          removed in apiextensions.k8s.io/v1)
  #   conversion             chart omits it; the API defaults {strategy: None}
  # Verified against all five CRDs by rendering argo-rollouts 2.40.5 and diffing.
  # See docs/plans/argocd-drift-diagnosis.md (SPEC.md §V.47).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.preserveUnknownFields
        - .spec.conversion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
