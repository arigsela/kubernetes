apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weather-kitchen-tls
  namespace: weather-kitchen
spec:
  secretName: weather-kitchen-tls
  dnsNames:
    - weather-kitchen.arigsela.com
  issuerRef:
    # Not letsencrypt-prod: its only solver is http01.ingress.class=nginx, which
    # nothing satisfies since the Istio cutover.
    name: letsencrypt-route53
    kind: ClusterIssuer
