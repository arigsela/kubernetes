apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: external-secrets
  namespace: argo-cd
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    # FINAL stage of the ESO walk (T33). 0.20.4 -> 2.8.0, crossing two majors.
    #
    # Checked rather than assumed: 1.0.0 documents no breaking changes, and 2.0.0's
    # only breaking change is the removal of the Alibaba and Device42 providers.
    # All 30 SecretStores here use the vault provider, so neither applies.
    #
    # Kubernetes support (upstream docs/introduction/stability-support.md): 2.10-2.13
    # list 1.36, and 2.14 is the first to list 1.37, this cluster's version.
    #
    # Since 2.14 (#7149) ExternalSecret and SecretStore Events and status carry a
    # sanitized message; the provider's error (Vault 403, missing key) is only in the
    # controller log: kubectl -n external-secrets logs deploy/external-secrets | grep <name>
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      values: |
        nodeSelector:
          node.kubernetes.io/workload: infrastructure
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        webhook:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        certController:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is REQUIRED here, not a preference. The SecretStore and
      # ClusterSecretStore CRDs are ~1.1MB each - their schema covers every
      # provider - and client-side apply stores the whole previous object in the
      # kubectl.kubernetes.io/last-applied-configuration annotation. That
      # annotation had reached 255KB against Kubernetes' 262144-byte limit, so
      # the next sync was rejected outright:
      #
      #   CustomResourceDefinition "secretstores.external-secrets.io" is invalid:
      #   metadata.annotations: Too long: may not be more than 262144 bytes
      #
      # SSA does not use that annotation, so the limit does not apply.
      #
      # NB this is the OPPOSITE conclusion to istio-ingress, where SSA was
      # REMOVED because it surfaced API-server-defaulted fields as permanent
      # drift. Neither is a general rule: SSA is right for objects too large for
      # the annotation, wrong for small objects with heavy schema defaulting.
      - ServerSideApply=true
