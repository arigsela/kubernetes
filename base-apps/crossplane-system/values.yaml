crossplane:
  # Resource limits for Crossplane
  # Memory raised 256Mi/512Mi -> 384Mi/768Mi: alert "Container near memory limit"
  # (crossplane-system/crossplane, 96% of limit, no OOMKilled), 2026-11-11.
  resourcesCrossplane:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # RBAC manager resources
  resourcesRBACManager:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Enable metrics
  metrics:
    enabled: true
