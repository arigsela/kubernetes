apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: openshell-secrets
  namespace: argo-cd
  annotations:
    # Sync-wave -2: must land before the openshell chart Application (-1)
    # so the StatefulSet's sandbox-jwt volume finds Secret/openshell-jwt-keys
    # on first mount attempt. (Wave -2 is also shared with istio-base — no
    # ordering dependency between the two, just informational.)
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/openshell
    # Intentionally not recursive: this directory is limited to the
    # SecretStore + ExternalSecret pair. If you add a subdirectory
    # (e.g., overlays, patches), add `directory: {recurse: true}` here.
    #
    # `recurse: false` is NOT declared explicitly. Argo normalises an explicit
    # false for a field that already defaults to false, so the live object omits
    # it — git says false, live says nothing, and master-app reports this
    # Application permanently OutOfSync. See docs/plans/argocd-drift-diagnosis.md.
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell
  # The External Secrets admission webhook stamps defaults onto every remoteRef
  # (conversionStrategy, decodingStrategy, metadataPolicy) and sets
  # target.deletionPolicy. None of them are in git, so this app sat permanently
  # OutOfSync (SPEC.md §V.47, docs/plans/argocd-drift-diagnosis.md).
  #
  # Note for §T.31: this is the same ESO webhook that will rewrite v1beta1 objects
  # to v1 during the migration. Expect more of this then, not less.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
