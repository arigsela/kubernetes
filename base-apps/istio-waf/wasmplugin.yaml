# Coraza WAF filter for the main Gateway.
#
# WHAT THIS PROTECTS: the three hostnames that are public by design and so are
# NOT covered by the ipBlocks in base-apps/istio-ingress/authorizationpolicy.yaml:
#   grafana.arigsela.com   - read from mobile, carrier IPs unlistable
#   oncall.arigsela.com    - Slack Events API callbacks
#   n8n.arigsela.com       - /webhook* from arbitrary external services
# The other 16 hostnames are IP-restricted and get SecRuleEngine Off (rule 9000).
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza
  namespace: istio-ingress
spec:
  # targetRefs, NOT selector. Coraza's upstream example uses
  #   selector: matchLabels: {app: istio-ingressgateway, istio: ingressgateway}
  # which are IstioOperator-era labels. This Gateway is Gateway API-generated and
  # its pods DO NOT carry them, so the upstream example attaches to NOTHING - and
  # a plugin attached to nothing looks exactly like a plugin finding no attacks.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
  # Pinned. An untagged oci:// URL means :latest, which flips imagePullPolicy to
  # Always and lets the gateway's behaviour change with no commit.
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
  imagePullPolicy: IfNotPresent
  # STATS = after Istio's authorization filters, so the ipBlocks allow-list culls
  # traffic before Coraza spends CPU on it.
  phase: STATS
  # FAIL_OPEN, against Istio's FAIL_CLOSE default. This filter is in the chain for
  # ALL 19 hostnames; under FAIL_CLOSE a ghcr.io outage or one Coraza panic returns
  # 5xx for everything - including the Argo CD UI needed to roll it back. The
  # security boundary is the AuthorizationPolicy; this is defence in depth on top,
  # and fails back to the posture that exists without it.
  # COST: a crashed WAF stops enforcing SILENTLY. That is what the "Wasm load
  # errors" dashboard panel exists to catch (see base-apps/logging).
  failStrategy: FAIL_OPEN
  pluginConfig:
    default_directives: default
    directives_map:
      default:
        - SecRuleEngine On

        # ── SCOPE ──────────────────────────────────────────────────────────
        # Anything outside the protected set gets the engine turned off.
        # The (:\d+)? is LOAD-BEARING: Envoy strips the port when matching
        # routes but Coraza's authority lookup is an exact string match
        # (wafmap.go getWAFOrDefault). Without it, "Host: grafana.arigsela.com:443"
        # reaches Grafana completely uninspected.
        #
        # EXPANDING THE WAF TO A NEW HOST = ADDING IT TO THIS REGEX.
        - SecRule REQUEST_HEADERS:Host "!@rx ^(grafana|oncall|n8n)\.arigsela\.com(:\d+)?$" "id:9000,phase:1,pass,nolog,ctl:ruleEngine=Off"

        # ── ENFORCEMENT MODE ───────────────────────────────────────────────
        # ENFORCING on all three protected hosts since 2026-08-11. A request
        # scoring >= 5 on the CRS anomaly scale now gets 403 from Coraza and
        # never reaches the app.
        #
        # TO ROLL A HOST BACK, re-add its line here - that is the whole fix:
        #   - SecRule REQUEST_HEADERS:Host "@rx ^grafana\.arigsela\.com(:\d+)?$" "id:9001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
        #   - SecRule REQUEST_HEADERS:Host "@rx ^oncall\.arigsela\.com(:\d+)?$"  "id:9002,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
        #   - SecRule REQUEST_HEADERS:Host "@rx ^n8n\.arigsela\.com(:\d+)?$"     "id:9003,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
        # Rule IDs 9001-9003 stay reserved for exactly that purpose.
        #
        # KNOWN, UNFIXED FALSE POSITIVE - accepted deliberately, not overlooked.
        # An n8n webhook whose JSON body carries a filesystem path is blocked:
        #   {"file":"../reports/x.csv","dir":"/var/log/app"}
        #     930110 Path Traversal   matched `../`     in ARGS_POST:json.file
        #     930120 OS File Access   matched `var/log` in ARGS_POST:json.dir
        #     949110 anomaly score 15, threshold 5  -> 403
        # Measured 2026-08-11 before enforcing. A blocked webhook fails SILENTLY
        # from the sender's side, so if an automation stops working with no error
        # anywhere, look here first. The fix when wanted is a scoped exclusion
        # after the CRS include, NOT raising the anomaly threshold:
        #   SecRuleUpdateTargetById 930110 "!ARGS_POST:json.file"
        #
        # Enforcement was enabled without the 7-day observation window the plan
        # calls for. That was a deliberate, informed decision; the window's
        # purpose is to find false positives like the one above from real traffic
        # rather than from invented payloads, and it has not run.

        # ── BODY INSPECTION ────────────────────────────────────────────────
        # Off by default; on only where an external party controls the payload.
        #
        # 9010 IS DELIBERATELY NOT A CHAINED RULE. It was, and the chain did not
        # bind: Gate B4 (2026-08-11, live) showed a SQL-injection POST body to
        # n8n's /rest/login firing 942100 via ARGS_POST_NAMES, i.e. body
        # inspection was active on the WHOLE n8n host including the admin UI -
        # exactly what the path guard existed to prevent. The chain starter fired
        # standalone; Coraza's parser appears to treat each directives_map entry
        # as its own directive, so `chain` never bound to the following SecRule.
        # Control case that isolates it: the same body sent to grafana (which has
        # no body rule) fired NOTHING, proving SecRequestBodyAccess Off works and
        # the chain specifically was the broken part.
        #
        # The replacement matches on REQUEST_URI alone, with no host predicate,
        # which is safe because rule 9000 has already turned the engine OFF for
        # every host outside the protected set. Within that set: n8n's webhook
        # paths get bodies and its admin UI does not; grafana has no /webhook*
        # path; and oncall turns bodies on wholesale via 9011 regardless.
        # DO NOT reintroduce `chain` here without re-running Gate B4.
        - SecRequestBodyAccess Off
        - SecRequestBodyLimit 1048576
        - SecRequestBodyLimitAction ProcessPartial
        - SecRule REQUEST_URI "@rx ^/(webhook|webhook-test|mcp-server)" "id:9010,phase:1,pass,nolog,t:lowercase,ctl:requestBodyAccess=On"
        - SecRule REQUEST_HEADERS:Host "@rx ^oncall\.arigsela\.com(:\d+)?$" "id:9011,phase:1,pass,nolog,ctl:requestBodyAccess=On"
        # JSON bodies must be parsed AS JSON. Without this, Coraza processes them
        # as URL-encoded form data: Gate B4 observed the entire JSON document
        # arriving as a single form parameter NAME
        # (`ARGS_POST_NAMES:{"q":"' OR 1`). That is wrong in both directions - it
        # can miss a real JSON-borne injection, and it manufactures nonsense
        # matches out of ordinary payloads. Both of the hosts that get body
        # inspection here (n8n webhooks, oncall/Slack) send JSON.
        - SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" "id:9012,phase:1,pass,nolog,t:lowercase,ctl:requestBodyProcessor=JSON"

        # ── LOGGING ────────────────────────────────────────────────────────
        # 3 logs rule matches. Upstream's example uses 9 = every internal
        # decision for every request; on a continuously-scanned internet-facing
        # gateway that floods Loki, which backs to S3.
        - SecDebugLogLevel 3

        # ── RULES ──────────────────────────────────────────────────────────
        - Include @crs-setup-conf
        - Include @owasp_crs/*.conf

        # ── EXCLUSIONS ─────────────────────────────────────────────────────
        # Populated during the tuning window. MUST stay after the CRS include:
        # SecRuleRemoveById / SecRuleUpdateTargetById only act on loaded rules.
        # Every exclusion carries a comment naming the request that triggered it
        # and why it is legitimate.
