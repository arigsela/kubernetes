apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jupyter-secrets
  namespace: jupyter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jupyter-secrets
    creationPolicy: Owner
  data:
    # The Jupyter server token: the inner layer behind both ways in (design
    # §3.2, amended 2026-10-08). Claude Code presents it over the port-forward;
    # oauth2-proxy injects it for the browser (jupyter-oauth2 below). Rotating
    # it needs a pod restart, since both containers read it only at startup.
    - secretKey: token
      remoteRef:
        key: jupyter
        property: token
    # Fine-grained PAT scoped to arigsela/notebooks only.
    - secretKey: github-token
      remoteRef:
        key: jupyter
        property: github-token
---
# oauth2-proxy's secrets (the sidecar in deployments.yaml), all from
# k8s-secrets/jupyter: the Dex client secret, the cookie secret and the email
# allow-list. The email lives only in Vault: this repo is public.
# oauth2-client-secret must equal jupyter-client-secret in k8s-secrets/dex;
# rotate both together.
#
# upstream-authorization is the header the proxy injects into every request it
# forwards to Jupyter, built from the same token as jupyter-secrets above. It is
# templated here because oauth2-proxy sends a file's bytes verbatim and the
# header needs the "token " scheme in front.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jupyter-oauth2
  namespace: jupyter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jupyter-oauth2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .client_secret }}"
        cookie-secret: "{{ .cookie_secret }}"
        allowed-emails: "{{ .allowed_emails }}"
        upstream-authorization: "token {{ .jupyter_token }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: jupyter
        property: oauth2-client-secret
    - secretKey: cookie_secret
      remoteRef:
        key: jupyter
        property: oauth2-cookie-secret
    - secretKey: allowed_emails
      remoteRef:
        key: jupyter
        property: allowed-emails
    - secretKey: jupyter_token
      remoteRef:
        key: jupyter
        property: token
