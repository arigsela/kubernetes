apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jupyter
  namespace: jupyter
  annotations:
    agent-docs/path: docs.md
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'app=jupyter'
    backstage.io/kubernetes-namespace: jupyter
  tags: [python, notebooks, jupyter]
spec:
  type: service
  lifecycle: production
  # Fully qualified, matching the other 21 apps. A bare `platform` resolves
  # against this entity's own namespace (`jupyter`) rather than `default`, so
  # validate-catalog-refs.py cannot find it. The agent-docs template still
  # carries the bare form.
  owner: group:default/platform
  system: default/platform-tooling
  dependsOn: []
