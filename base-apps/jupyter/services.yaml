apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: jupyter
  labels:
    app: jupyter
spec:
  type: ClusterIP
  ports:
    # oauth2-proxy. Jupyter's own port (8888, loopback) is deliberately absent;
    # Claude Code reaches it with `kubectl port-forward deploy/jupyter 8888`.
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
  selector:
    app: jupyter
