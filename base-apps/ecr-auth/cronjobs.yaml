apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credentials-sync
  namespace: kube-system
spec:
  # Every 15 min: this is also how a NEW namespace gets ecr-registry (Kyverno's
  # generate-ecr-secret used to clone it at creation; deleted in plan Task 3.6). ECR tokens
  # last 12h. Need it now? kubectl create job -n kube-system --from=cronjob/ecr-credentials-sync ecr-sync-now
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3  # Keep last 3 successful jobs
  failedJobsHistoryLimit: 3       # Keep last 3 failed jobs
  concurrencyPolicy: Forbid        # Don't run concurrent jobs
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600  # Delete job 1 hour after completion
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
          serviceAccountName: ecr-credentials-sync
          containers:
          - name: ecr-credentials-sync
            image: heyvaldemar/aws-kubectl:latest@sha256:33dc31831e4ae88c88bdb306e8eefce92fbd564b44ad4e2eb912a45fa8eca88f
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_REGION
            command:
            - /bin/sh
            - -c
            - |
              # Get a fresh ECR token
              TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
              DOCKER_SERVER="852893458518.dkr.ecr.$AWS_REGION.amazonaws.com"
              EXCLUDE="kube-public kube-node-lease default kyverno"

              # kube-system first (excluded by the pull-secret policy, kept fresh for
              # anything there that references it)
              echo "Syncing ECR credentials in kube-system"
              kubectl create secret docker-registry ecr-registry \
                --docker-server=$DOCKER_SERVER \
                --docker-username=AWS \
                --docker-password=$TOKEN \
                -n kube-system \
                --dry-run=client -o yaml | kubectl apply -f -

              # Refresh all other namespaces
              NAMESPACES=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
              for NS in $NAMESPACES; do
                echo "$EXCLUDE" | grep -qw "$NS" && continue
                [ "$NS" = "kube-system" ] && continue

                echo "Syncing ECR credentials in namespace $NS"
                kubectl create secret docker-registry ecr-registry \
                  --docker-server=$DOCKER_SERVER \
                  --docker-username=AWS \
                  --docker-password=$TOKEN \
                  -n $NS \
                  --dry-run=client -o yaml | kubectl apply -f -
              done
          restartPolicy: OnFailure
