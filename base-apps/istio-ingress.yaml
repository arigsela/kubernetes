# The north-south ingress Gateway that replaces ingress-nginx (SPEC.md T43/T55).
#
# Staged on :8080/:8443 deliberately. ingress-nginx holds :80/:443 on
# k3s-control-01 via hostNetwork and the two cannot share those ports (V55), so
# every host is validated on the alternate ports first and the swap to :80/:443
# happens inside the maintenance window T54 authorised.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: istio-ingress
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/istio-ingress
    directory:
      # catalog-info.yaml is a Backstage entity, not a Kubernetes manifest.
      # Exclude it so Argo CD does not try to apply it and fail sync.
      exclude: '{catalog-info.yaml,mkdocs.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply deliberately NOT set. With SSA, Argo compares the full
      # live object, so every field the API server defaults on Gateway API types
      # shows as drift and the app sits permanently OutOfSync:
      #   HTTPRoute  parentRefs[].group/kind, rules[].matches,
      #              backendRefs[].group/kind/weight
      #   Gateway    listeners[].tls.certificateRefs[].group
      # With client-side apply Argo compares against last-applied-configuration
      # and never sees them. The correlation was exact - every route-hosting app
      # without SSA was Synced, both apps with it were OutOfSync. See V47: the
      # remedy for defaulted-field drift is not blanket SSA (R19).
