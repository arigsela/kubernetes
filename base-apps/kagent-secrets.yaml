apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kagent-secrets
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  # The External Secrets admission webhook stamps schema defaults onto every
  # ExternalSecret it admits (conversionStrategy=Default, decodingStrategy=None,
  # metadataPolicy=None, deletionPolicy=Retain, template.mergePolicy=Replace).
  # Git does not spell those out, so Argo saw fields present live but absent from
  # the desired state and reported this app OutOfSync forever — even though no
  # field's VALUE ever differed and every ExternalSecret was SecretSynced.
  #
  # A permanently-OutOfSync app is worse than cosmetic: it trains you to ignore
  # sync status, which is how a real regression (the kagent HITL approval gates
  # being silently stripped) went unnoticed. Ignore only the defaulted paths so
  # that OutOfSync means something again.
  #
  # NOTE: ignoreDifferences suppresses drift DETECTION, not overwrites — see
  # argoproj/argo-cd#8970. That is fine here and only here: these values are
  # re-applied by the ESO webhook after every sync, so there is nothing of ours
  # for a sync to clobber. Do NOT reach for this pattern to protect
  # hand-applied values; own the resource in Git instead.
  ignoreDifferences:
    # Gateway API types default group/kind/weight when omitted, and with
    # ServerSideApply Argo compares the FULL live object - so every defaulted
    # field reads as drift. Same cause as the external-secrets.io entry below,
    # and the same fix already applied to the istio-ingress app.
    # Scoped narrowly: real changes to hostnames, paths, backends or ports
    # still surface as drift.
    # The kagent operator GENERATES a ServiceAccount per Agent (ownerReferences
    # point at the Agent, so it is garbage-collected with it) and copies the
    # Agent's annotations onto it - including Argo's tracking-id. That makes Argo
    # adopt a resource git never declared: the repo contains only the Agent.
    #
    # T42 concluded this needed an upstream kagent fix rather than an ignore rule.
    # That was based on the SA being a git resource whose annotation was being
    # overwritten. It is not - it is operator-owned and owner-referenced, so the
    # annotation is the ONLY thing making Argo look at it. Ignoring it is
    # therefore correct rather than a workaround.
    - group: ''
      kind: ServiceAccount
      jsonPointers:
        - /metadata/annotations/argocd.argoproj.io~1tracking-id
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - '.spec.parentRefs[]?.group'
        - '.spec.parentRefs[]?.kind'
        - '.spec.rules[]?.backendRefs[]?.group'
        - '.spec.rules[]?.backendRefs[]?.kind'
        - '.spec.rules[]?.backendRefs[]?.weight'
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.mergePolicy
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/kagent
    directory:
      recurse: true
      exclude: '{catalog-info.yaml,mkdocs.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
