# base-apps/tracing/collector.yaml (beacon §T.19)
# The OpenTelemetry Collector: every trace source in the cluster sends here (OTLP gRPC 4317,
# HTTP 4318), and it forwards to Tempo and to Coroot. kagent and Substrate too: nothing else
# exports OTLP to Coroot, whose receiver refuses gzip (tests/agent-capability/test_agent_traces.py).
#
#   beacon §V.41  memory_limiter first in every traces pipeline
#   beacon §V.42  transform/scrub before every exporter: no query strings, no notifier
#                 delivery paths (tests/beacon/test_collector.py runs this config)
#   beacon §V.43  tail sampling here, not at the Gateway: keep errors and beacon, 10% of the rest
#   (this repo)   tail sampling also keeps every kagent trace (tests/agent-capability/test_agent_traces.py)
#   beacon §V.9   the span count per service (port 8889) is the signal the notifier alert reads
#
# For the Agents dashboards (tests/agent-capability/test_agent_traces.py):
#   - kagent's TaskStore UpdateTask spans are dropped: one per streamed status update, ~500 in a
#     78 s run, which buried the run in Tempo.
#   - kagent's runtime puts each tool's whole output on its execute_tool span even with content
#     capture off; transform/scrub deletes it, so no tool output is stored or shown.
#   - Each model call gets an estimated cost (transform/genai-cost), which Tempo sums like tokens.
#   - Two small metric sets on :8889, read before sampling: the service graph of the agent
#     platform (Tempo's service map in Grafana) and the start time of each agent run, by trace
#     id, so the Agent Platform dashboard opens on the latest run.
#
# One replica on purpose: tail sampling needs every span of a trace on the same instance.
# contrib, not the k8s distribution, for transform and tail_sampling.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: tracing
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: tracing
  labels:
    app: otel-collector
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # First in every traces pipeline (beacon §V.41): refuse data before the pod is OOM-killed.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      # kagent's streaming status updates: one TaskStore UpdateTask call per streamed event (524
      # of a 617-span run). They carry no information a dashboard uses.
      filter/noise:
        error_mode: ignore
        trace_conditions:
          - span.name == "kagent.runtime.v1.TaskStoreService/UpdateTask"

      # An estimated cost on each model call of a kagent agent (agent.cost.estimate_usd), so Tempo
      # can sum cost like tokens. $/MTok: base input, cache write (5 min), cache read, output, from
      # Anthropic's API pricing as of 2026-10-06; Haiku's is its rate for prompts up to 100K tokens.
      # Input tokens include the cached ones (kagent's telemetry contract), so uncached input is
      # input - cache read - cache write. A model not listed gets no cost; its tokens still count.
      transform/genai-cost:
        error_mode: ignore
        trace_statements:
          - context: span
            conditions:
              - IsMatch(name, "^generate_content ") and attributes["gen_ai.usage.input_tokens"] != nil
            statements:
              - set(cache["input"], Double(attributes["gen_ai.usage.input_tokens"]))
              - set(cache["output"], 0.0)
              - set(cache["output"], Double(attributes["gen_ai.usage.output_tokens"])) where attributes["gen_ai.usage.output_tokens"] != nil
              - set(cache["cache_read"], 0.0)
              - set(cache["cache_read"], Double(attributes["gen_ai.usage.cache_read.input_tokens"])) where attributes["gen_ai.usage.cache_read.input_tokens"] != nil
              - set(cache["cache_write"], 0.0)
              - set(cache["cache_write"], Double(attributes["gen_ai.usage.cache_write.input_tokens"])) where attributes["gen_ai.usage.cache_write.input_tokens"] != nil
              - set(attributes["agent.cost.estimate_usd"], ((cache["input"] - cache["cache_read"] - cache["cache_write"]) * 2.0 + cache["cache_write"] * 2.5 + cache["cache_read"] * 0.2 + cache["output"] * 10.0) / 1000000.0) where attributes["gen_ai.request.model"] == "claude-sonnet-5-5"
              - set(attributes["agent.cost.estimate_usd"], ((cache["input"] - cache["cache_read"] - cache["cache_write"]) * 4.0 + cache["cache_write"] * 5.0 + cache["cache_read"] * 0.2 + cache["output"] * 20.0) / 1000000.0) where attributes["gen_ai.request.model"] == "claude-opus-5-5"
              - set(attributes["agent.cost.estimate_usd"], ((cache["input"] - cache["cache_read"] - cache["cache_write"]) * 0.1 + cache["cache_write"] * 0.125 + cache["cache_read"] * 0.01 + cache["output"] * 0.5) / 1000000.0) where attributes["gen_ai.request.model"] == "claude-haiku-5-5"

      # beacon §V.42: no query string and no notifier delivery path leaves this collector.
      # Envoy's http.url keeps the query (beacon §R.42), so the Gateway's spans would carry OAuth
      # code/state and search text; the notifier's httpx spans would carry Slack webhook paths,
      # which are the credential. `$$` is the config escape for a literal `$`.
      transform/scrub:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - replace_pattern(attributes["http.url"], "\\?.*$$", "")
              - replace_pattern(attributes["url.full"], "\\?.*$$", "")
              - replace_pattern(attributes["http.target"], "\\?.*$$", "")
              - delete_key(attributes, "url.query")
              # kagent's runtime (ADK) copies each tool's output onto its execute_tool span.
              - delete_key(attributes, "gcp.vertex.agent.tool_response")
          - context: span
            conditions:
              - resource.attributes["service.name"] == "beacon-notifier" and kind == SPAN_KIND_CLIENT
            statements:
              - replace_pattern(attributes["url.full"], "^(https?://[^/]+).*$$", "$$1")
              - delete_key(attributes, "url.path")
              - delete_key(attributes, "http.target")

      # beacon §V.43: the Gateway samples 100% so apps that follow its decision (kagent,
      # Substrate) keep their own traces; volume is cut here instead.
      tail_sampling:
        decision_wait: 10s
        num_traces: 20000
        expected_new_traces_per_sec: 50
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: beacon
            type: string_attribute
            string_attribute:
              key: service.name
              values: ["beacon-.*"]
              enabled_regex_matching: true
          # Every kagent trace: an agent run is rare and only useful whole. kagent sets
          # service.namespace=kagent on the controller and on every session; a match keeps the
          # whole trace, so the MCP adapter and Substrate spans of that run stay with it.
          - name: kagent
            type: string_attribute
            string_attribute:
              key: service.namespace
              values: ["kagent"]
          - name: everything-else
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

      batch:
        send_batch_size: 512
        timeout: 5s

      # The span-count pipeline keeps only service.name, so the metric's labels stay bounded
      # (beacon §V.29).
      # The count connector emits deltas and the Prometheus exporter shows only the latest one;
      # this keeps a running total, so rate() and absence alerts mean something (beacon §B.14).
      deltatocumulative: {}

      transform/count:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name"])

      # The agent platform's spans only: kagent (controller and every agent), Substrate (ateapi,
      # atelet, its agentgateway router), the MCP adapters, and the ingress Gateway's spans for
      # requests into kagent. Everything else in the cluster stays off the service graph, and so
      # do the UpdateTask stream (dropped from Tempo too) and each MCP adapter's calls to its own
      # stdio server.
      filter/agent-platform:
        error_mode: ignore
        trace_conditions:
          - >-
            not (resource.attributes["service.namespace"] == "kagent"
            or IsMatch(resource.attributes["service.name"], "^(ateapi|atelet|agentgateway|agent-docs-mcp|brave-search-mcp|implementer-mcp)$")
            or (resource.attributes["service.name"] == "main-istio.istio-ingress"
            and IsMatch(span.attributes["upstream_cluster"], "[.]kagent[.]svc[.]")))
          - span.name == "kagent.runtime.v1.TaskStoreService/UpdateTask"
          - >-
            span.kind == SPAN_KIND_CLIENT
            and IsMatch(resource.attributes["service.name"], "^(agent-docs-mcp|brave-search-mcp|implementer-mcp)$")

      # Down to the service name, so the graph has one node per service and nothing per pod or
      # session. A call whose server sends no span here (the model API, kagent-tools, ollama) or
      # whose server span lost its parent (the controller's TaskStore, the MCP adapters) is named
      # by peer.service, which the graph turns into a node: the short service name, never an IP.
      # Each agent run's invoke_agent span gets its trace id as an attribute for the run metric.
      transform/agent-platform:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name"])
          - context: span
            conditions:
              - kind == SPAN_KIND_CLIENT
            statements:
              - set(attributes["peer.service"], "kagent-controller") where IsMatch(attributes["rpc.method"], "^kagent[.]runtime[.]")
              - set(attributes["peer.service"], attributes["server.address"]) where attributes["peer.service"] == nil and attributes["server.address"] != nil and not IsMatch(attributes["server.address"], "^[0-9.]+$$")
              - replace_pattern(attributes["peer.service"], "^([^.]+)[.][^.]+([.]svc([.]cluster[.]local)?)?$$", "$$1")
          - context: span
            conditions:
              - IsMatch(name, "^invoke_agent ")
            statements:
              - set(attributes["service.name"], resource.attributes["service.name"])
              - set(attributes["trace.id"], trace_id.string)

    connectors:
      # Spans received per service, before sampling: the beacon §V.9 alert signal (the
      # notifier's 2 s DB poll keeps its count steady while it is instrumented and healthy).
      count:
        spans:
          tracing.spans.received:
            description: Spans received by the collector, by service, before sampling.
            attributes:
              - key: service.name

      # Who calls whom across the agent platform: traces_service_graph_request_total{client,
      # server} and its failures and latency, which Grafana's Tempo datasource draws as a
      # service map. An agent run's two sides arrive in different batches, seconds apart, so
      # spans wait 30 s for their pair.
      service_graph:
        latency_histogram_buckets: [100ms, 500ms, 1s, 5s, 15s, 60s, 300s]
        virtual_node_peer_attributes: [peer.service]
        store:
          ttl: 30s
          max_items: 5000
        metrics_flush_interval: 30s

      # agent_run_start_seconds{service_name, trace_id, gen_ai_conversation_id}: the start time of
      # each agent run. The landing dashboard takes the newest trace id (and its session) from it. One series per run; Prometheus keeps
      # 15 days, a few thousand series.
      signal_to_metrics:
        spans:
          - name: agent.run.start
            description: Start time of an agent run (an invoke_agent span), in Unix seconds, by trace id.
            unit: s
            conditions:
              - span.attributes["trace.id"] != nil
            include_resource_attributes:
              - key: service.name
            attributes:
              - key: service.name
              - key: trace.id
              - key: gen_ai.conversation.id
                optional: true
            gauge:
              value: Double(span.start_time_unix_nano) / 1000000000.0

    exporters:
      otlp/tempo:
        endpoint: tempo.tracing.svc.cluster.local:4317
        tls:
          insecure: true
      # Uncompressed: Coroot's OTLP gRPC receiver has no gzip decompressor and refuses every
      # gzipped batch, which is this exporter's default (beacon §B.13, beacon §V.46).
      otlp/coroot:
        endpoint: coroot-coroot.coroot.svc.cluster.local:4317
        compression: none
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/noise, transform/genai-cost, transform/scrub, tail_sampling, batch]
          exporters: [otlp/tempo, otlp/coroot]
        traces/count:
          receivers: [otlp]
          processors: [memory_limiter, transform/count]
          exporters: [count]
        metrics/count:
          receivers: [count]
          processors: [deltatocumulative]
          exporters: [prometheus]
        # Spans of the agent platform, before sampling, to the service graph and the run metric.
        # Neither exports a span, so transform/scrub is not needed here (beacon §V.42).
        traces/agent-platform:
          receivers: [otlp]
          processors: [memory_limiter, filter/agent-platform, transform/agent-platform]
          exporters: [service_graph, signal_to_metrics]
        metrics/agent-platform:
          receivers: [service_graph, signal_to_metrics]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: tracing
  labels:
    app: otel-collector
spec:
  replicas: 1
  # Never two: tail sampling would split a trace's spans between them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # sha256 of otel-collector-config's `data` (json.dumps, sort_keys); the collector reads
        # its config only at startup. tests/beacon/test_tracing.py fails if it is stale.
        checksum/config: d09dcf24a7a7fe1529139c9de3fae8699634c67306c09d98e664969f6328ae5c
        # The span count (one series per service, beacon §V.29), the agent platform's service
        # graph and its run start times.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          args:
            - --config=/conf/collector.yaml
          env:
            # Below the 512Mi limit and above memory_limiter's 400MiB, so the limiter acts first.
            - name: GOMEMLIMIT
              value: 440MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: span-counts
              containerPort: 8889
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: tracing
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  # appProtocol: Istio picks a port's protocol from it (or a grpc-/http- name prefix). The
  # Gateway and beacon's waypoint send OTLP gRPC here; without it Istio reads the port as TCP,
  # Envoy's gRPC client speaks HTTP/1.1 and every export fails (beacon §B.15, beacon §V.47).
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      appProtocol: http
