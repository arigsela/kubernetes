apiVersion: v1
kind: Service
metadata:
  name: hk-demo
  namespace: hk-demo
  labels:
    app: hk-demo
    app.kubernetes.io/name: hk-demo
spec:
  type: ClusterIP
  selector:
    app: hk-demo
  ports:
    # oauth2-proxy. The app's own port (8000, loopback) is deliberately absent.
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
