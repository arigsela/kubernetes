---
# The app's identity for kagent: its token comes only from the projected volume in
# deployment.yaml (audience kagent), never the default mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hk-demo
  namespace: hk-demo
automountServiceAccountToken: false
---
# External Secrets reads Vault k8s-secrets/hk-demo as this account (Vault role hk-demo,
# scripts/provision-hk-demo-vault.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-hk-demo
  namespace: hk-demo
