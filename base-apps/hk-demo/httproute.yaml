apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hk-demo
  namespace: hk-demo
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: hk demo
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-map-marker-path
    gethomepage.dev/description: One question to hk, shown end to end (checks, cost, logs, trace)
    gethomepage.dev/pod-selector: app=hk-demo
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-hk-demo
  hostnames:
    - hk-demo.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hk-demo
          port: 4180
