# The oauth2-proxy sidecar's files: Dex client secret (Dex holds the same value in
# k8s-secrets/dex:hk-demo-client-secret), the cookie secret (32 raw bytes) and the one email
# the page admits (Dex admits any GitHub account; this list is the access control).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hk-demo-oauth2
  namespace: hk-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-hk-demo
    kind: SecretStore
  target:
    name: hk-demo-oauth2
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: hk-demo
        property: oauth2-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: hk-demo
        property: oauth2-cookie-secret
    - secretKey: allowed-emails
      remoteRef:
        key: hk-demo
        property: allowed-emails
