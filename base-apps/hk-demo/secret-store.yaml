# Vault role hk-demo must exist before this syncs (scripts/provision-hk-demo-vault.sh): a
# SecretStore whose role is missing fails the whole app sync.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-hk-demo
  namespace: hk-demo
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: hk-demo
          serviceAccountRef:
            name: eso-hk-demo
