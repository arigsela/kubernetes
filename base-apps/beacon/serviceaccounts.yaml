# base-apps/beacon/serviceaccounts.yaml (beacon §T.15)
# One identity per workload, so the mesh can tell them apart (authorization-policy.yaml
# admits only beacon-checker to the notifier). None of them calls the Kubernetes API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-api
  namespace: beacon
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-web
  namespace: beacon
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-checker
  namespace: beacon
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-notifier
  namespace: beacon
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-scheduler
  namespace: beacon
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beacon-migrate
  namespace: beacon
automountServiceAccountToken: false
---
# ESO identities, one per Vault key (scripts/provision-beacon-vault.sh binds them).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-beacon
  namespace: beacon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-beacon-db
  namespace: beacon
---
# ESO's identity for enterprise tenants' DSNs (beacon §T.45, beacon §V.52): Vault role beacon-tenants
# (scripts/provision-beacon-tenants-vault.sh) lists k8s-secrets/tenants/ and reads only each
# tenant's `api` key. Separate from eso-beacon so that role can never read anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-beacon-tenants
  namespace: beacon
