# base-apps/beacon/deployments.yaml (beacon §T.15)
# Images: IMMUTABLE ECR repos, pushed only by arigsela/beacon's release workflow from a v*
# tag on main, pinned here by digest (beacon §V.17). Promotion is a PR: runbook.md,
# "Promote a release" (beacon §T.41). The PreSync smoke Job in jobs.yaml runs every image on
# a node first (beacon §V.18).
#
# SDK services (api, checker; scheduler in cronjobs.yaml) carry their own OpenTelemetry SDK
# and opt out of operator injection with inject-python "false" (beacon §V.32). The
# notifier has no OTel code at all (beacon §V.9): it gets traced only through the
# namespace's otel opt-in once the operator exists (beacon §T.22), so it carries no
# annotation and no OTEL_* variable here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-api
  namespace: beacon
  annotations:
    # After the migrate Job (jobs.yaml, wave 1).
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: beacon-api
    app.kubernetes.io/name: beacon-api
    app.kubernetes.io/part-of: beacon
    backstage.io/kubernetes-id: beacon-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-api
  template:
    metadata:
      labels:
        app: beacon-api
        app.kubernetes.io/name: beacon-api
        app.kubernetes.io/part-of: beacon
        backstage.io/kubernetes-id: beacon-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
        # Opt in to scraping (the platform default is "false", beacon §V.44): only the api
        # serves /metrics. Labels stay bounded (beacon §V.29).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: beacon-api
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-api:v0.2.3@sha256:ad35a0cfb29ff17fadac7c6fc16c35673ef8f502f7b5159a6ad0be902b1faa33
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beacon-db-app
                  key: DATABASE_URL
            - name: DEX_ISSUER
              value: https://dex.arigsela.com
            - name: DEX_CLIENT_ID
              value: beacon
            - name: FLAGS_PATH
              value: /etc/beacon/flags/beacon-flags.json
            - name: SIGNING_KEY_REF
              value: /etc/beacon/signing/signing-key
            # Slugs nobody may sign up as (the platform seeds homelab, beacon §T.17).
            - name: SSRF_EXEMPT_TENANTS
              value: homelab
            - name: BEACON_DB_POOL_MAX
              value: "4"
            # Traces to the collector over OTLP/HTTP (beacon §V.41; the SDK ships the http exporter).
            # 100% of root traces, explicit: the collector samples (beacon §V.43).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.tracing.svc.cluster.local:4318
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # 503 while the database is unreachable: the route stops sending requests.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: flags
              mountPath: /etc/beacon/flags
              readOnly: true
            - name: signing
              mountPath: /etc/beacon/signing
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: flags
          configMap:
            name: beacon-flags
        - name: signing
          secret:
            secretName: beacon-signing
            # Group-readable, and the pod's fsGroup makes the group 10001: kubelet makes
            # volume files root-owned, so 0400 alone is unreadable to this non-root user
            # (beacon §V.39, beacon §B.10). Nobody else in the pod exists to read it.
            defaultMode: 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-web
  namespace: beacon
  annotations:
    # After the migrate Job (jobs.yaml, wave 1).
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: beacon-web
    app.kubernetes.io/name: beacon-web
    app.kubernetes.io/part-of: beacon
    backstage.io/kubernetes-id: beacon-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-web
  template:
    metadata:
      labels:
        app: beacon-web
        app.kubernetes.io/name: beacon-web
        app.kubernetes.io/part-of: beacon
        backstage.io/kubernetes-id: beacon-web
      annotations:
        # nginx, not Python: opt out of the namespace's Python instrumentation, which the
        # platform's defaulting policy would otherwise turn on here (beacon §V.44).
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      serviceAccountName: beacon-web
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged's own user.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-web:v0.2.3@sha256:902375f303dadc2a5defc91202beca3e56fedebf4bbbd0ea1f93c21471917a52
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged keeps its pid and temp files in /tmp.
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: config
          configMap:
            name: beacon-web-config
---
# Claims due checks from the jobs table (FOR UPDATE SKIP LOCKED) and probes tenant targets.
# Tenant-supplied URLs: the SSRF guard (beacon §V.5) refuses private, cluster and home
# addresses after DNS, and network-policies.yaml denies the same ranges at L3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-checker
  namespace: beacon
  annotations:
    # After the migrate Job (jobs.yaml, wave 1).
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: beacon-checker
    app.kubernetes.io/name: beacon-checker
    app.kubernetes.io/part-of: beacon
    backstage.io/kubernetes-id: beacon-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-checker
  template:
    metadata:
      labels:
        app: beacon-checker
        app.kubernetes.io/name: beacon-checker
        app.kubernetes.io/part-of: beacon
        backstage.io/kubernetes-id: beacon-checker
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      serviceAccountName: beacon-checker
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-checker:v0.2.3@sha256:47e84f028fa949692e03d27f96af58541c704c67747fd5e5bf2d5ee4aece55c1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beacon-db-app
                  key: DATABASE_URL
            - name: NOTIFIER_URL
              value: http://beacon-notifier.beacon.svc.cluster.local:8080
            - name: FLAGS_PATH
              value: /etc/beacon/flags/beacon-flags.json
            # Names whose A records are the home WAN address, so the guard learns it
            # without config (beacon §V.5). dex resolves even before beacon's own record.
            - name: SSRF_SELF_HOSTS
              value: dex.arigsela.com,beacon.arigsela.com
            - name: SSRF_EXEMPT_TENANTS
              value: homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.tracing.svc.cluster.local:4318
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: flags
              mountPath: /etc/beacon/flags
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: flags
          configMap:
            name: beacon-flags
---
# POST /internal/v1/notify (from the checker only: authorization-policy.yaml,
# network-policies.yaml) persists one delivery per channel and answers 202; webhook, Slack
# and email delivery retry from the database. No SMTP_URL yet: email deliveries dead-letter
# until a relay exists (runbook.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-notifier
  namespace: beacon
  annotations:
    # After the migrate Job (jobs.yaml, wave 1).
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: beacon-notifier
    app.kubernetes.io/name: beacon-notifier
    app.kubernetes.io/part-of: beacon
    backstage.io/kubernetes-id: beacon-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-notifier
  template:
    metadata:
      labels:
        app: beacon-notifier
        app.kubernetes.io/name: beacon-notifier
        app.kubernetes.io/part-of: beacon
