# base-apps/beacon/configmaps.yaml (beacon §T.15)
---
# Fault flags (beacon §I.flags), read through the OpenFeature flagd file provider. Every
# flag defaults to "off". Injecting a fault is a commit that changes one defaultVariant;
# reverting it is `git revert` (beacon §V.13), never a kubectl edit. Mounted as a DIRECTORY
# (not subPath) so a change reaches running pods without a restart.
# Faults degrade beacon only (beacon §V.26): tenantFloodIngest writes at most 50x the check
# rows, apiDbPoolExhaust exhausts beacon's own pool, never the shared cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-flags
  namespace: beacon
data:
  beacon-flags.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "checkerSlowProbe": {
          "state": "ENABLED",
          "variants": {
            "off": 0.0,
            "slow": 5.0
          },
          "defaultVariant": "off"
        },
        "checkerFalseDown": {
          "state": "ENABLED",
          "variants": {
            "off": false,
            "on": true
          },
          "defaultVariant": "off"
        },
        "notifierReceiverFail": {
          "state": "ENABLED",
          "variants": {
            "off": false,
            "on": true
          },
          "defaultVariant": "off"
        },
        "apiDbPoolExhaust": {
          "state": "ENABLED",
          "variants": {
            "off": false,
            "on": true
          },
          "defaultVariant": "off"
        },
        "apiSlowQuery": {
          "state": "ENABLED",
          "variants": {
            "off": 0.0,
            "slow": 2.0
          },
          "defaultVariant": "off"
        },
        "tenantFloodIngest": {
          "state": "ENABLED",
          "variants": {
            "off": 0.0,
            "flood": 10.0
          },
          "defaultVariant": "off"
        },
        "schedulerStall": {
          "state": "ENABLED",
          "variants": {
            "off": false,
            "on": true
          },
          "defaultVariant": "off"
        }
      }
    }
---
# The SPA's runtime config (web/src/config.ts), served as /config.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-web-config
  namespace: beacon
data:
  config.json: |
    {"dexIssuer": "https://dex.arigsela.com", "dexClientId": "beacon"}
---
# The homelab dogfood tenant (beacon §T.17): beacon monitors every host on the shared Gateway.
# Applied by the beacon-seed-homelab PostSync Job (jobs.yaml) with `beacon-api seed-tenant`:
# idempotent, upserts by name, never deletes. homelab is the one tenant exempt from the SSRF
# block on the platform's own hosts and the home WAN address (beacon §V.5), which is what lets
# it probe these at all; its slug is reserved, so it cannot be signed up for.
#
# ADDING A HOST TO THE GATEWAY MEANS ADDING IT HERE (tests/beacon/test_homelab_seed.py fails
# otherwise). "/" unless it answers >= 400 there: oauth2-proxy hosts use their unauthenticated
# /ping (/ would redirect through Dex to github.com), kagent-mcp serves only A2A paths so it is
# a TCP check on 443. Not here: the *.arigsela.com wildcard and the LAN-only vault names.
#
# owners: the owner's Dex subject (GitHub user 2475907 via the github connector), the same
# value the API server pins (ansible/roles/k3s_node/files/authn/authn-config.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-homelab-seed
  namespace: beacon
data:
  homelab.json: |
    {
      "slug": "homelab",
      "tier": "free",
      "owners": [
        "CgcyNDc1OTA3EgZnaXRodWI"
      ],
      "monitors": [
