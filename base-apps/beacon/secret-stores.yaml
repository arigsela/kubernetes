# base-apps/beacon/secret-stores.yaml (beacon §T.15)
# Roles and policies come from scripts/provision-beacon-vault.sh (beacon §T.40), which must
# have run before this app first syncs: a SecretStore whose role is missing fails the sync.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-beacon
  namespace: beacon
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: beacon
          serviceAccountRef:
            name: eso-beacon
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-beacon-db
  namespace: beacon
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: beacon-db
          serviceAccountRef:
            name: eso-beacon-db
