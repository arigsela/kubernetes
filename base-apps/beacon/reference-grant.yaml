# base-apps/beacon/reference-grant.yaml (beacon §T.15)
# Lets the shared Gateway's https-beacon listener (beacon §T.16) read this one Secret.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-beacon-tls
  namespace: beacon
  annotations:
    # Last wave, after the workloads (beacon §V.38, beacon §B.9): its health is decided by
    # another app (the shared Gateway, ACME), and a Degraded object in an earlier wave stops
    # the whole sync, migrate and rollout included.
    argocd.argoproj.io/sync-wave: "3"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-ingress
  to:
    - group: ""
      kind: Secret
      name: beacon-tls
