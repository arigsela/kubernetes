# base-apps/beacon/external-secrets.yaml (beacon §T.15)
# Every value comes from Vault (scripts/provision-beacon-vault.sh); nothing here is a secret.
---
# The AES-GCM key that seals webhook channel secrets in the database (beacon §V.4). Mounted
# as a file; SIGNING_KEY_REF names it. Losing it makes every stored webhook secret
# unreadable (runbook.md), so it is never rotated by a Vault write.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-signing
  namespace: beacon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-beacon
    kind: SecretStore
  target:
    name: beacon-signing
    creationPolicy: Owner
  data:
    - secretKey: signing-key
      remoteRef:
        key: beacon
        property: signing-key
---
# beacon_app: the runtime role of every service. Row-level security applies to it.
# Passwords are hex (provision script), so they need no URL escaping here. CONNECTION
# LIMIT 20 (beacon §V.26) covers api 4 + notifier 4 + checker + scheduler with room for a
# rolling update.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-db-app
  namespace: beacon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-beacon-db
    kind: SecretStore
  target:
    name: beacon-db-app
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .user }}:{{ .password }}@postgresql-cluster-rw.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=require"
  data:
    - secretKey: user
      remoteRef:
        key: beacon-db
        property: app-user
    - secretKey: password
      remoteRef:
        key: beacon-db
        property: app-password
    - secretKey: db
      remoteRef:
        key: beacon-db
        property: db-name
---
# beacon_owner: owns the schema and runs the migrations (jobs.yaml). Only the migrate Job
# mounts it; no long-running pod holds this credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-db-owner
  namespace: beacon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-beacon-db
    kind: SecretStore
  target:
    name: beacon-db-owner
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://{{ .user }}:{{ .password }}@postgresql-cluster-rw.postgresql.svc.cluster.local:5432/{{ .db }}?sslmode=require"
  data:
    - secretKey: user
      remoteRef:
        key: beacon-db
        property: owner-user
    - secretKey: password
      remoteRef:
        key: beacon-db
        property: owner-password
    - secretKey: db
      remoteRef:
        key: beacon-db
        property: db-name
---
# One key per enterprise tenant, named by its slug, holding {"dsn", "signing_key"}: what each
# tenant's composition pushes to k8s-secrets/tenants/tenant-<slug>/api (beacon §V.52, beacon §V.55).
# Mounted on beacon-api as TENANT_DSN_DIR; a new tenant appears within a refresh, no restart.
# `find` lists the tenants/ folder and reads only the names the regexp matches, so the role's
# read on tenants/+/api is enough (beacon §R.47). Last wave, like its store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-tenant-dsns
  namespace: beacon
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-beacon-tenants
    kind: SecretStore
  target:
    name: beacon-tenant-dsns
    creationPolicy: Owner
  dataFrom:
    - find:
        path: tenants
        name:
          regexp: "^tenants/tenant-[a-z][a-z0-9-]{2,30}/api$"
      rewrite:
        - regexp:
            source: "^tenants/tenant-(.+)/api$"
            target: "$1"
