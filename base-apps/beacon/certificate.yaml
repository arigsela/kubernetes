# base-apps/beacon/certificate.yaml (beacon §T.15)
# Route 53 DNS-01, so it issues before beacon.arigsela.com has an A record (beacon §T.16).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: beacon-tls
  namespace: beacon
  annotations:
    # Last wave, after the workloads (beacon §V.38, beacon §B.9): its health is decided by
    # another app (the shared Gateway, ACME), and a Degraded object in an earlier wave stops
    # the whole sync, migrate and rollout included.
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: beacon-tls
  dnsNames:
    - beacon.arigsela.com
  issuerRef:
    name: letsencrypt-route53
    kind: ClusterIssuer
