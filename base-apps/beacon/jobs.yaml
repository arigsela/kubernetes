# base-apps/beacon/jobs.yaml (beacon §T.15)
---
# beacon §T.14, beacon §V.18: run every beacon image on a real node before anything rolls out.
# The nodes are Xeon E5-2670 (Sandy Bridge-EP: AVX, no AVX2). CI already runs each image
# under Sandy Bridge emulation, but only a node proves it. --self-check imports every native
# extension the service loads, so a wheel built for x86-64-v3 dies here with SIGILL instead
# of in a Deployment.
#
# PreSync: it runs before every sync of this app, so a new digest never reaches a
# Deployment without passing here first, and a failure stops the whole sync. On the FIRST
# sync it may wait in ImagePullBackOff for up to 15 minutes: a new namespace gets its
# ecr-registry pull secret from kube-system/ecr-credentials-sync (runbook.md).
# BeforeHookCreation keeps the last run's pod and logs for inspection until the next sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-smoke
  namespace: beacon
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: beacon-smoke
        app.kubernetes.io/part-of: beacon
    spec:
      # The default ServiceAccount: PreSync runs before this app's ServiceAccounts exist.
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # beacon §V.18: the operator's Python layer, copied exactly as the operator does it
      # (cp -r /autoinstrumentation/. /otel-auto-instrumentation-python), for notifier-otel-layer.
      initContainers:
        - name: otel-layer
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b1@sha256:fcfd4588cbf2c68ae6a5b67501d8aa4a1c58c0b89e664c8eee71952ac12430ff
          command: ["cp", "-r", "/autoinstrumentation/.", "/otel-auto-instrumentation-python"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: otel-layer
              mountPath: /otel-auto-instrumentation-python
      containers:
        - name: cpu
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-api:v0.3.0@sha256:b0f291037c23dae671d59c64482e9f9acc2fc44d996559888421751447a7e550
          command: ["/bin/sh", "-c"]
          args:
            - |
              grep -m1 "model name" /proc/cpuinfo
              grep -qw avx /proc/cpuinfo || { echo "no AVX on this node: beacon images need it" >&2; exit 1; }
              if grep -qw avx2 /proc/cpuinfo; then echo "AVX2 present"; else echo "AVX2 absent (x86-64-v2 node, as expected)"; fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: api
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-api:v0.3.0@sha256:b0f291037c23dae671d59c64482e9f9acc2fc44d996559888421751447a7e550
          args: ["--self-check"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: scheduler
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-scheduler:v0.3.0@sha256:230c73a6dc6e3b01cdff9cd7e7e1caa57820452d57f4d6789bb643d33ef41d21
          args: ["--self-check"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: checker
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-checker:v0.3.0@sha256:6f33631de90e28387e77ef09b843c905f7bf2a584c0e27668dc817f7e768d6f4
          args: ["--self-check"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: notifier
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-notifier:v0.3.0@sha256:79db1a801dc89aeddd8adf22effd981d7664d3717e27d38f964ab9d64ee6203d
          args: ["--self-check"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: mcp
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-mcp:v0.3.0@sha256:45a89a3c48982323fadb5e0e76180ef2f2b066f89aa8609fffc1262214cc7ffd
          args: ["--self-check"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # beacon §V.9 on the image that actually ships: no opentelemetry distribution.
        - name: notifier-no-otel
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-notifier:v0.3.0@sha256:79db1a801dc89aeddd8adf22effd981d7664d3717e27d38f964ab9d64ee6203d
          command: ["python", "-c"]
          args:
            - |
              import importlib.metadata as m, sys
              bad = sorted(d.metadata["Name"] for d in m.distributions() if d.metadata["Name"].lower().startswith("opentelemetry"))
              print("opentelemetry distributions:", bad or "none")
              sys.exit(1 if bad else 0)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # beacon §V.18, beacon §T.22: the notifier image under the operator's Python layer, with the
        # PYTHONPATH the operator injects. The layer is built on python:3.14 and the notifier
        # runs 3.13 (beacon §R.25): its C extensions may not load, and pure-Python fallbacks
        # must. sitecustomize runs at startup; this checks it instrumented what the notifier uses.
        - name: notifier-otel-layer
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-notifier:v0.3.0@sha256:79db1a801dc89aeddd8adf22effd981d7664d3717e27d38f964ab9d64ee6203d
          command: ["python", "-c"]
          args:
            - |
              import sys
              from opentelemetry.instrumentation.httpx import HTTPXClientInstrumentor
              from opentelemetry.instrumentation.psycopg import PsycopgInstrumentor
              from opentelemetry.instrumentation.starlette import StarletteInstrumentor
              import beacon_notifier.app  # noqa: F401  the notifier itself imports under the layer
              try:
                  import wrapt._wrappers  # noqa: F401
                  wrapt_c = "C extension"
              except ImportError:
                  wrapt_c = "pure Python"
              from google.protobuf.internal import api_implementation
              print("python", sys.version.split()[0], "| wrapt:", wrapt_c, "| protobuf:", api_implementation.Type())
              off = [n for n, i in (("starlette", StarletteInstrumentor()), ("httpx", HTTPXClientInstrumentor()),
                                    ("psycopg", PsycopgInstrumentor())) if not i.is_instrumented_by_opentelemetry]
              if off:
                  sys.exit(f"not instrumented under the layer: {off}")
              print("notifier under the operator's python layer: starlette, httpx, psycopg instrumented")
          env:
            - name: PYTHONPATH
              value: /otel-auto-instrumentation-python/opentelemetry/instrumentation/auto_instrumentation:/otel-auto-instrumentation-python
            - name: OTEL_SERVICE_NAME
              value: beacon-smoke
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: otel-layer
              mountPath: /otel-auto-instrumentation-python
              readOnly: true
        - name: web
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-web:v0.3.0@sha256:51298066b4fdf677e411c20109124cd467889e23b10c1fc9a178b95a92393ba1
          command: ["/bin/sh", "-c"]
          args:
            - nginx -t && test -s /usr/share/nginx/html/index.html && echo "web smoke ok"
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # The enterprise tenants' dump uploader (beacon §T.46, composition-tenant.yaml AWS_CLI):
        # third-party, so it runs on a node here before any tenant needs it (beacon §V.18).
        - name: aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:2.37.13@sha256:d32864c20087d486f5988c3e70817d67a73f584a47535cada9ad97e0ea1e5196
          command: ["/bin/sh", "-c"]
          args:
            - aws --version && echo "aws-cli smoke ok"
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: otel-layer
          emptyDir:
            sizeLimit: 256Mi
---
# Alembic migrations as beacon_owner, after the secrets exist (wave 0) and before any
# Deployment or CronJob (wave 2). Idempotent: on a sync with no new migration it is a
# no-op. Roles and the database itself come from the postgresql app
# (base-apps/postgresql/init-beacon-roles.yaml, beacon-database.yaml); on the very first
# sync this Job retries until they exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-migrate
  namespace: beacon
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: beacon-migrate
        app.kubernetes.io/part-of: beacon
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      serviceAccountName: beacon-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-api:v0.3.0@sha256:b0f291037c23dae671d59c64482e9f9acc2fc44d996559888421751447a7e550
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beacon-db-owner
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# beacon §T.17: apply the homelab tenant (configmaps.yaml, beacon-homelab-seed) once the
# workloads are healthy. Runs as beacon_app under the tenant's RLS context; idempotent, so
# every sync re-applies the file and a new host's monitor appears on the next sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-seed-homelab
  namespace: beacon
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: beacon-seed-homelab
        app.kubernetes.io/part-of: beacon
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      serviceAccountName: beacon-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/beacon-api:v0.3.0@sha256:b0f291037c23dae671d59c64482e9f9acc2fc44d996559888421751447a7e550
          args: ["seed-tenant"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beacon-db-app
                  key: DATABASE_URL
            - name: BEACON_SEED_FILE
              value: /etc/beacon/seed/homelab.json
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /etc/beacon/seed
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: seed
          configMap:
            name: beacon-homelab-seed
