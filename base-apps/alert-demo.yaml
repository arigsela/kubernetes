# base-apps/alert-demo.yaml
---
# alert-demo: the hk demo's workload. Idle until the hk demo page's Start button asks; a demo run
# then holds a fixed amount of memory near its limit for 30 minutes, so the real "Container near
# memory limit" alert fires and the platform handles it end to end (dispatcher → implementer → PR).
# Design: docs/superpowers/specs/2026-10-24-hk-demo-on-its-own-design.md. §T.140.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: alert-demo
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/alert-demo
    directory:
      # The agent-docs contract: catalog-info.yaml and the generated mkdocs.yml are not manifests.
      exclude: '{catalog-info.yaml,mkdocs.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: alert-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
