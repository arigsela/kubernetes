# Gateway API replacement for this app's nginx Ingress (T56).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oncall-agent
  namespace: oncall-agent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Oncall Agent
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-bell-alert
    gethomepage.dev/description: AI on-call incident agent
    gethomepage.dev/pod-selector: app=oncall-agent-api
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-oncall
  hostnames:
    - oncall.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oncall-agent-api
          port: 80
