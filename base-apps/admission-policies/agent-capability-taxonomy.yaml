---
# Agent capability taxonomy — THE single source of truth for what every kagent
# tool is allowed to DO. Edit the classification here and nowhere else.
#
# Three consumers, all reading this exact content:
#
#   - scripts/gen-agent-capability-policy.py  compiles it INTO the native admission
#     policy base-apps/admission-policies/agent-capability.yaml. CI fails if that
#     policy drifts from this file (`--check`).
#   - scripts/validate-agent-capability.py    the CI contract gate.
#   - humans, in-cluster: `kubectl get cm -n kube-system agent-capability-taxonomy`
#
# NOTE: nothing reads this ConfigMap at admission time. The policy embeds the lists
# inline instead. A runtime lookup would be DRYer but is a dependency evaluated for
# EVERY AgentTemplate, and with failurePolicy Fail any lookup failure (RBAC, sync ordering,
# schema) would deny ALL AgentTemplate writes, wedging the kagent app. Inlining makes the
# artifact we test byte-for-byte the artifact that ships. See the generator.
#
# Four classifications, ordered read < propose < write < destructive:
#
#   read         observes state; cannot change anything. Tools that RENDER a
#                manifest but do not apply it (k8s_generate_resource,
#                istio_generate_manifest, istio_generate_waypoint) are `read` —
#                they return YAML to the caller.
#   propose      changes a PROPOSAL surface only: a branch or a pull request on
#                arigsela/kubernetes, never a cluster, an account or a merge. May be
#                bound without requireApproval; the merge is the human gate (§V.94).
#                A `read` template may not bind it; `propose`, `write` and `admin` may.
#   write        mutates state. May only be bound in an MCP binding with
#                requireApproval: true (kagent 1.0 gates per binding, not per tool).
#   destructive  removes state, or is an arbitrary-code escape hatch whose blast
#                radius is not bounded by its name (k8s_execute_command). Must
#                be in a requireApproval: true binding, and only an `admin` agent may bind it.
#
# FAIL-CLOSED: a tool bound by an AgentTemplate but absent from all four lists is
# DENIED. This is deliberate. A chart upgrade that introduces new tools cannot
# silently widen any agent's capability — the new tools must be triaged and
# classified here first. If a sync fails with "tool not in taxonomy", that is
# the control working, not a bug.
#
# Three more lists are not tool classes: runtime-images, byo-images and read-only-servers
# (at the bottom) decide which runtimes run at all, and the one exception for a `byo`
# runtime (SPEC §V.101).
#
# The lists are JSON arrays (a Kyverno parse_json() legacy); the generator, the CI
# validator and the agent-audit scripts all json.loads() them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-capability-taxonomy
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: agent-guardrails
data:
  # ---------------------------------------------------------------- read (60)
  read: |
    [
      "k8s_get_resources",
      "k8s_get_pod_logs",
      "k8s_describe_resource",
      "k8s_get_events",
      "k8s_get_resource_yaml",
      "k8s_get_cluster_configuration",
      "k8s_get_available_api_resources",
      "k8s_check_service_connectivity",
      "k8s_generate_resource",

      "istio_proxy_status",
      "istio_proxy_config",
      "istio_version",
      "istio_analyze_cluster_configuration",
      "istio_ztunnel_config",
      "istio_waypoint_status",
      "istio_list_waypoints",
      "istio_remote_clusters",
      "istio_generate_manifest",
      "istio_generate_waypoint",

      "search_dashboards",
      "get_dashboard_by_uid",
      "get_dashboard_panel_queries",
      "query_prometheus",
      "query_loki_logs",
      "query_loki_stats",
      "list_prometheus_metric_names",
      "list_prometheus_metric_metadata",
      "list_prometheus_label_names",
      "list_prometheus_label_values",
      "list_loki_label_names",
      "list_loki_label_values",
      "list_datasources",
      "get_datasource",
      "list_alert_rules",
      "get_alert_rule_by_uid",
      "list_contact_points",
      "list_incidents",
      "get_incident",
      "list_teams",
      "list_oncall_users",
      "list_oncall_teams",
      "list_oncall_schedules",
      "get_oncall_shift",
      "get_current_oncall_users",
      "list_sift_investigations",
      "get_sift_investigation",
      "get_sift_analysis",
      "get_assertions",
      "find_slow_requests",
      "find_error_pattern_logs",

      "get_file_contents",
      "search_code",
      "list_commits",
      "get_commit",
      "list_branches",
      "list_pull_requests",
      "pull_request_read",
      "get-catalog-entity",

      "brave_web_search",
      "brave_news_search"
    ]

  # ------------------------------------------------------------- propose (4)
  # Branches and pull requests on arigsela/kubernetes, through the implementer GitHub MCP
  # server (base-apps/kagent/implementer-mcp.yaml). Nothing here touches a cluster or merges
  # anything: merge_pull_request, update_pull_request (close/retarget), delete_file and the
  # review tools are never loaded there.
  propose: |
    [
      "create_branch",
      "create_or_update_file",
      "push_files",
      "create_pull_request"
    ]
  # --------------------------------------------------------------- write (13)
  # Every tool here MUST be in a requireApproval: true binding wherever it is bound.
  # The four k8s label/annotation mutators matter more than they look: Argo CD
  # sync behaviour and Kyverno matching are both label/annotation-driven, so an
  # agent holding them can disable the very controls that hold it in.
  write: |
    [
      "k8s_patch_resource",
      "k8s_apply_manifest",
      "k8s_create_resource",
      "k8s_create_resource_from_url",
      "k8s_annotate_resource",
      "k8s_remove_annotation",
      "k8s_label_resource",
      "k8s_remove_label",

      "istio_apply_waypoint",
      "istio_install_istio",

      "update_dashboard",
      "create_incident",
      "add_activity_to_incident"
    ]

  # ---------------------------------------------------------- destructive (3)
  # Only an `admin` agent may bind these, and only in a requireApproval: true binding.
  destructive: |
    [
      "k8s_delete_resource",
      "k8s_execute_command",
      "istio_delete_waypoint"
    ]

  # ------------------------------------------------------ runtime images (2)
  # Not a tool class: the image repositories a kagent 1.0 Harness may run. Everything above is
  # enforced INSIDE the runtime: the per-binding tool selection and requireApproval gate are
  # honoured by kagent's own ADK runtimes, and a byo/claude/codex Harness or any other image
  # may expose a whole MCP server and never pause (SPEC §R.45). So a Harness must use the
  # `kagent` runtime and one of these repositories (pin by digest, the CRD requires it), or
  # be the byo exception below.
  #   golang-adk  the Go ADK, the chart's default runtime (harnesses/*.yaml)
  #   kagent-adk  the Python ADK, the documented fallback via a workload.command override
  runtime-images: |
    [
      "ghcr.io/kagent-dev/kagent/golang-adk",
      "ghcr.io/kagent-dev/kagent/kagent-adk"
    ]

  # --------------------------------------------------------- byo images (2)
  # Not a tool class: the EXACT images (repository@sha256:digest) a `byo` Harness may run
  # (SPEC §V.101, §T.130). A byo runtime need not honour tool selection or requireApproval,
  # so the exception is narrow, and it is held in two places:
  #   admission  agent-capability-runtime admits spec.byo only on an image EQUAL to an entry.
  #              Never a repository or a tag: that would admit every digest pushed later.
  #   CI         scripts/validate-agent-capability.py (invariant 7): every Agent on a byo
  #              Harness uses a class `read` AgentTemplate that binds only read-only-servers,
  #              with only read tools and no subAgent. Admission sees one object at a time and
  #              cannot check that; agent-definitions-from-git.yaml makes git, where CI runs,
  #              the only way these objects reach the cluster.
  # Each entry is a reviewed image. A new digest is a new entry in a reviewed change: the
  # admission-policies runbook, "Pin a byo image digest". An entry ending in
  # @sha256:REPLACE_WITH_DIGEST is an image not pushed yet: the CRD rejects it and the
  # validator fails on it, so nothing deploys on it.
  #   docs-checker  the stale-docs checker (LangGraph on kagent 1.0's byo contract), built in
  #                 arigsela/claude-agents docs-checker/; repository terraform ecr.tf
  byo-images: |
    [
      "852893458518.dkr.ecr.us-east-2.amazonaws.com/docs-checker@sha256:1a2a11aaf0197dad6248d8fff5df248b87eafd33accf879edf33b02496604558",
      "852893458518.dkr.ecr.us-east-2.amazonaws.com/docs-checker@sha256:7b24827f54686adf0824910955fd7c40bb0c20ad6c748888a573fbf479ff3cc9"
    ]

  # -------------------------------------------------- read-only servers (1)
  # Not a tool class: the RemoteMCPServers a byo agent may bind, by name in namespace kagent
  # (where byo Agents must live). Egress opens per ORIGIN, not per tool, so a byo runtime can
  # call EVERY tool a bound server has, whatever its binding lists. A server belongs here only
  # if it is read-only ON THE SERVER SIDE, proved per server in tests/agent-capability
  # (test_real_read_only_servers_are_read_only_on_the_server_side). Changing such a server's
  # url, or the Deployment behind it, is a security change.
  #   agent-docs  github-mcp-server --read-only --toolsets repos (agent-docs-mcp.yaml)
  # Never kagent-tool-server (write tools, no auth) or kagent-api (invoke_session).
  read-only-servers: |
    [
      "agent-docs"
    ]
