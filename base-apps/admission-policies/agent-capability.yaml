---
# Agent capability guardrails, natively in the API server.
#
# !!! GENERATED FILE — DO NOT EDIT BY HAND !!!
# Source of truth: base-apps/kyverno-policies/agent-capability-taxonomy.yaml
# Regenerate:      ./scripts/gen-agent-capability-policy.py
# CI fails if this file drifts from the taxonomy. Tests: tests/admission-policies/.
#
# Native replacement for ClusterPolicy/agent-capability (same rules 1-7, same taxonomy,
# generated by the same script). WHY NATIVE: the Kyverno webhook fails open
# (forceFailurePolicyIgnore) and has one replica, so these Enforce rules stop enforcing
# whenever Kyverno is down; a ValidatingAdmissionPolicy is evaluated inside the API server.
#
#   agent-capability             rules 1-5: declared class, every bound tool classified
#                                (fail-closed), class permits the tools, mutating tools
#                                behind requireApproval
#   agent-capability-delegation  rules 6-7: no delegating to a higher class. The policy takes
#                                the Agent kind as its PARAMETER and binds with
#                                paramRef.selector {}: the API server evaluates it once per
#                                Agent in the request's namespace (each one a potential
#                                delegate) and ANDs the results. A delegate whose class label
#                                is missing or not read/write counts as admin — stricter than
#                                Kyverno, which let an unrecognised value through.
#
# ROLLOUT STATE: SHADOW. [Warn, Audit] with failurePolicy Ignore, next to the still-enforcing
# Kyverno policy. The Deny flip (plan 3E) sets [Deny] + Fail and deletes the Kyverno policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-capability
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - v1alpha2
      resources:
      - agents
      operations:
      - CREATE
      - UPDATE
  variables:
  - name: cls
    expression: object.metadata.?labels[?'capability.homelab/class'].orValue('')
  - name: mcp
    expression: object.spec.?declarative.?tools.orValue([]).filter(t, t.type == 'McpServer')
  - name: classified
    expression: '["k8s_get_resources", "k8s_get_pod_logs", "k8s_describe_resource", "k8s_get_events", "k8s_get_resource_yaml", "k8s_get_cluster_configuration", "k8s_get_available_api_resources", "k8s_check_service_connectivity", "k8s_generate_resource", "istio_proxy_status", "istio_proxy_config", "istio_version", "istio_analyze_cluster_configuration", "istio_ztunnel_config", "istio_waypoint_status", "istio_list_waypoints", "istio_remote_clusters", "istio_generate_manifest", "istio_generate_waypoint", "search_dashboards", "get_dashboard_by_uid", "get_dashboard_panel_queries", "query_prometheus", "query_loki_logs", "query_loki_stats", "list_prometheus_metric_names", "list_prometheus_metric_metadata", "list_prometheus_label_names", "list_prometheus_label_values", "list_loki_label_names", "list_loki_label_values", "list_datasources", "get_datasource", "list_alert_rules", "get_alert_rule_by_uid", "list_contact_points", "list_incidents", "get_incident", "list_teams", "list_oncall_users", "list_oncall_teams", "list_oncall_schedules", "get_oncall_shift", "get_current_oncall_users", "list_sift_investigations", "get_sift_investigation", "get_sift_analysis", "get_assertions", "find_slow_requests", "find_error_pattern_logs", "get_file_contents", "search_code", "get-catalog-entity", "k8s_patch_resource", "k8s_apply_manifest", "k8s_create_resource", "k8s_create_resource_from_url", "k8s_annotate_resource", "k8s_remove_annotation", "k8s_label_resource", "k8s_remove_label", "istio_apply_waypoint", "istio_install_istio", "update_dashboard", "create_incident", "add_activity_to_incident", "k8s_delete_resource", "k8s_execute_command", "istio_delete_waypoint"]'
  - name: mutating
    expression: '["k8s_patch_resource", "k8s_apply_manifest", "k8s_create_resource", "k8s_create_resource_from_url", "k8s_annotate_resource", "k8s_remove_annotation", "k8s_label_resource", "k8s_remove_label", "istio_apply_waypoint", "istio_install_istio", "update_dashboard", "create_incident", "add_activity_to_incident", "k8s_delete_resource", "k8s_execute_command", "istio_delete_waypoint"]'
  - name: destructive
    expression: '["k8s_delete_resource", "k8s_execute_command", "istio_delete_waypoint"]'
  validations:
  - expression: variables.cls in ['read', 'write', 'admin']
    messageExpression: '"Agent ''" + object.metadata.name + "'' must declare a capability class: the label capability.homelab/class must be one of read, write, admin. There is no default."'
    reason: Forbidden
  - expression: variables.mcp.all(t, t.mcpServer.?toolNames.orValue([]).all(n, n in variables.classified))
    messageExpression: '"Agent ''" + object.metadata.name + "'' binds tools that are not in the capability taxonomy. Classify them in base-apps/kyverno-policies/agent-capability-taxonomy.yaml first: unclassified tools are denied by design (fail-closed)."'
    reason: Forbidden
  - expression: variables.cls != 'read' || variables.mcp.all(t, t.mcpServer.?toolNames.orValue([]).all(n, !(n in variables.mutating)))
    messageExpression: '"Agent ''" + object.metadata.name + "'' is class read but binds mutating tools. A read agent may bind only read-classified tools."'
    reason: Forbidden
  - expression: variables.cls != 'write' || variables.mcp.all(t, t.mcpServer.?toolNames.orValue([]).all(n, !(n in variables.destructive)))
    messageExpression: '"Agent ''" + object.metadata.name + "'' is class write but binds destructive tools. Only an admin agent may bind destructive tools."'
    reason: Forbidden
  - expression: variables.mcp.all(t, t.mcpServer.?toolNames.orValue([]).all(n, !(n in variables.mutating) || n in t.mcpServer.?requireApproval.orValue([])))
    messageExpression: '"Agent ''" + object.metadata.name + "'' binds mutating tools that are not in that tool ref''s requireApproval list. Every write/destructive tool must be gated behind human approval."'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-capability
spec:
  policyName: agent-capability
  validationActions:
  - Warn
  - Audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-capability-delegation
spec:
  failurePolicy: Ignore
  paramKind:
    apiVersion: kagent.dev/v1alpha2
    kind: Agent
  matchConstraints:
    resourceRules:
    - apiGroups:
      - kagent.dev
      apiVersions:
      - v1alpha2
      resources:
      - agents
      operations:
      - CREATE
      - UPDATE
    objectSelector:
      matchExpressions:
      - key: capability.homelab/class
        operator: In
        values:
        - read
        - write
  variables:
  - name: mine
    expression: object.metadata.?labels[?'capability.homelab/class'].orValue('')
  - name: delegates
    expression: object.spec.?declarative.?tools.orValue([]).filter(t, t.type == 'Agent').map(t, t.agent.name)
  - name: theirs
    expression: 'params.metadata.?labels[?''capability.homelab/class''].orValue(''admin'') in [''read'', ''write''] ? params.metadata.labels[''capability.homelab/class''] : ''admin'''
  - name: delegatesToParam
    expression: params.metadata.name in variables.delegates
  validations:
  - expression: '!(variables.mine == ''read'' && variables.delegatesToParam) || variables.theirs == ''read'''
    messageExpression: '"Agent ''" + object.metadata.name + "'' is class read but delegates to ''" + params.metadata.name + "'' (class " + variables.theirs + "). Delegation is capability-transitive, so this is a privilege escalation. Delegate to a read-class agent instead (see k8s-reader)."'
    reason: Forbidden
  - expression: '!(variables.mine == ''write'' && variables.delegatesToParam) || variables.theirs != ''admin'''
    messageExpression: '"Agent ''" + object.metadata.name + "'' is class write but delegates to admin agent ''" + params.metadata.name + "''. Delegation is capability-transitive, so this is a privilege escalation."'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-capability-delegation
spec:
  policyName: agent-capability-delegation
  validationActions:
  - Warn
  - Audit
  paramRef:
    selector: {}
    parameterNotFoundAction: Allow
