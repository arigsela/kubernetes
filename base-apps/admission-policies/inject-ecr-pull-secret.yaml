# Add the ECR pull secret to every Pod that pulls from ECR, natively in the API server.
#
# Native replacement for the Kyverno ClusterPolicy base-apps/kyverno-policies/inject-ecr-pull-secret.yaml
# (docs/plans/k8s-136-features-implementation-plan.md, Task 3.5). MutatingAdmissionPolicy is GA
# in 1.36. Two differences from the Kyverno version, both deliberate:
#   * image volumes (GA 1.36) count as ECR references too: Phase 4 ships model weights as OCI
#     images from ECR, and those pulls need the secret as much as containers do.
#   * no webhook: Kyverno's mutation needs its admission pod up (and fails open without it).
#
# The mutation is a JSONPatch that appends ecr-registry unless it is already listed, keeping any
# other secrets. Two things that look simpler do NOT work on 1.36 (found in the harness):
#   * ApplyConfiguration: imagePullSecrets entries are LocalObjectReference, an ATOMIC struct,
#     and ApplyConfiguration refuses to touch them ("may not mutate atomic arrays, maps or
#     structs"). With failurePolicy Ignore that is a silent no-op.
#   * One patch adding the whole list, value: [Object.spec.imagePullSecrets{...}]: a LIST of
#     typed objects as a JSONPatch value PANICS the API server's request handler (cel-go
#     ConvertToNative) and the pod create fails with a 500, failurePolicy Ignore or not.
#   So: add an empty list if the field is missing, then append ONE typed object.
# tests/admission-policies creates real pods to prove the result.
#
# ROLLOUT STATE: TEST NAMESPACE ONLY. A mutation has no shadow mode, so the binding matches only
# the admission-test namespace until the live behaviour is verified (Task 3.5 step 3). The next
# change widens it to every non-system namespace and deletes the Kyverno policy. Both mutate
# idempotently by name, so running them side by side is safe.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-ecr-pull-secret
spec:
  # Ignore: a CEL error must not block pod creation. The failure mode is then a pod without the
  # secret (ImagePullBackOff unless the image is cached), not a rejected pod. It does NOT cover
  # an API-server panic (see above), which fails the request regardless.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: pulls-from-ecr
      expression: >-
        object.spec.containers.exists(c, has(c.image) && c.image.contains('.dkr.ecr.'))
        || (has(object.spec.initContainers)
            && object.spec.initContainers.exists(c, has(c.image) && c.image.contains('.dkr.ecr.')))
        || (has(object.spec.volumes)
            && object.spec.volumes.exists(v, has(v.image) && has(v.image.reference)
                                             && v.image.reference.contains('.dkr.ecr.')))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.imagePullSecrets)
            ? [] : [JSONPatch{op: "add", path: "/spec/imagePullSecrets", value: []}])
          + (has(object.spec.imagePullSecrets)
             && object.spec.imagePullSecrets.exists(s, has(s.name) && s.name == "ecr-registry")
            ? [] : [JSONPatch{op: "add", path: "/spec/imagePullSecrets/-",
                              value: Object.spec.imagePullSecrets{name: "ecr-registry"}}])
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: inject-ecr-pull-secret
spec:
  policyName: inject-ecr-pull-secret
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: admission-test   # test namespace only; widened next
---
# The test namespace the binding is limited to. Removed when the binding is widened.
apiVersion: v1
kind: Namespace
metadata:
  name: admission-test
  labels:
    app.kubernetes.io/name: admission-test
    app.kubernetes.io/part-of: admission-policies
