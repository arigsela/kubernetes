# base-apps/admission-policies/xtenant-guard.yaml (beacon §T.25)
# Guards beacon's enterprise tenants (XTenant, base-apps/crossplane-compositions/xrd-tenant.yaml).
# Deleting an XTenant deletes its namespace and its database, so:
#
#   CREATE  the name is the tenant slug (beacon §V.30): it becomes namespace tenant-<slug>, the
#           bucket name and the Vault folder.
#   DELETE  only an offboarded tenant with a verified backup (beacon §V.12): spec.offboard true
#           (its workers are stopped and its database dumped) and status.backup an s3:// URI,
#           which the composition sets only after the dump Job verified the dump.
#
# Enforcing from the start: no XTenant exists before this lands, so nothing can be caught by it
# unintentionally. failurePolicy Fail: an evaluation error must refuse a delete, not allow it.
# Scope: xtenants only, nothing else in the cluster (beacon §V.25).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: xtenant-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["platform.arigsela.com"]
        apiVersions: ["*"]
        resources: ["xtenants"]
        operations: ["CREATE", "DELETE"]
  validations:
    - expression: >-
        request.operation != 'CREATE'
        || object.metadata.name.matches('^[a-z][a-z0-9-]{2,30}$')
      messageExpression: >-
        "XTenant '" + object.metadata.name + "' is not a tenant slug (^[a-z][a-z0-9-]{2,30}$,
        beacon §V.30): it names the namespace, bucket and Vault folder."
      reason: Invalid
    - expression: >-
        request.operation != 'DELETE'
        || (has(oldObject.spec.offboard) && oldObject.spec.offboard
            && has(oldObject.status) && has(oldObject.status.backup)
            && oldObject.status.backup.startsWith('s3://'))
      messageExpression: >-
        "XTenant '" + oldObject.metadata.name + "' has no verified backup: set spec.offboard: true
        and wait for status.backup before deleting it (beacon §V.12, base-apps/beacon-tenants/runbook.md)."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: xtenant-guard
spec:
  policyName: xtenant-guard
  validationActions: [Deny]
