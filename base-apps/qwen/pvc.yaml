apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-models
  namespace: qwen
  labels:
    app: qwen
  annotations:
    # local-path reclaims Delete, so an Argo prune of this PVC destroys the data
    # with it (SPEC.md §V.19). Opt out of pruning — removing this volume must be a
    # deliberate act, not a side effect of a manifest rename or a failed render.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  # NOTE: the only StorageClass (local-path) has allowVolumeExpansion=false, so
  # this cannot be grown in place — size it up front. ~0.6GB weights + the F16
  # vision projector + headroom fit comfortably in 5Gi.
  resources:
    requests:
      storage: 5Gi
