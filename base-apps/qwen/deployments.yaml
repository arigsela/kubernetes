apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: qwen
  labels:
    app: qwen
    app.kubernetes.io/name: qwen
spec:
  replicas: 1
  # The weights are a read-only image volume (below), not a ReadWriteOnce PVC, so a new
  # pod can start next to the old one: a rollout (new model digest, new llama.cpp) keeps
  # serving until the replacement is Ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: qwen
  template:
    metadata:
      labels:
        app: qwen
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      containers:
        - name: llama-server
          # CPU-only llama.cpp OpenAI-compatible server (the :server tag is the CPU
          # build; :server-cuda is the GPU one). This cluster has no GPU.
          # Pinned by digest for reproducible GitOps — this is the exact build
          # verified to load the Qwen3.5 architecture (was :server). To upgrade:
          # pull the tag, confirm it still loads the model + mmproj, then re-pin.
          image: ghcr.io/ggml-org/llama.cpp@sha256:e10504c7f5c5bacece7e7e5957760eee53868642d853fe5ecfe8611065929a24
          args:
            - --model
            - /models/Qwen3.5-0.8B-UD-Q4_K_XL.gguf
            - --mmproj
            - /models/mmproj-F16.gguf
            # No GPU: keep the vision projector on CPU instead of trying to offload it.
            - --no-mmproj-offload
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # 32K context: fits agent frameworks' large system prompts (OpenClaw's
            # is ~20K tokens). The model supports 262K, but a bigger KV cache is
            # impractical on CPU; 32K balances headroom vs memory on the 0.8B.
            - --ctx-size
            - "32768"
            - --threads
            - "6"
            # Default thinking OFF: this GGUF's chat template defaults to reasoning,
            # which on a 0.8B burns the token budget (and can loop) before answering.
            # Applies the request-level kwarg we verified, as a server-wide default;
            # callers can still re-enable per request by sending
            # chat_template_kwargs {"enable_thinking": true}. (--jinja is on by
            # default, which this flag requires.)
            - --chat-template-kwargs
            - '{"enable_thinking":false}'
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              # Generation and the CLIP/vision pass are CPU-bound; workers have
              # ample idle cores. Memory headroom covers the F16 vision projector
              # plus per-image tensors during multimodal requests.
              cpu: "6"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        # The GGUF + vision projector as an OCI image, mounted read-only at /models
        # (image volumes, GA in k8s 1.36). Built by scripts/build-model-image.sh qwen from a
        # pinned Hugging Face revision with sha256-verified files; pinned here by digest, so
        # the weights change only through a PR. Pulled from ECR with the ecr-registry secret
        # the native inject-ecr-pull-secret policy adds. Update: runbook "Model update".
        - name: models
          image:
            reference: 852893458518.dkr.ecr.us-east-2.amazonaws.com/models/qwen3.5-0.8b@sha256:c46700a737b05e38c9b228efd05e3cc4accdf2ddd42b800491911f967cef7a22
            pullPolicy: IfNotPresent
