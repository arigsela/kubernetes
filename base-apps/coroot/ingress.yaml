apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coroot
  namespace: coroot
  annotations:
    # TLS/SSL Configuration
    # DNS-01 via Route 53, not HTTP-01 via nginx. HTTP-01 solves through
    # ingress.class: nginx, so it breaks the moment ingress-nginx is retired --
    # and it breaks silently, ~30 days later at renewal. SPEC.md §V.52 / §T.49.
    cert-manager.io/cluster-issuer: letsencrypt-route53
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # IP Whitelist - Only allow home IP
    nginx.ingress.kubernetes.io/whitelist-source-range: "73.7.190.154/32,170.85.56.189/32,170.85.130.202/32,104.28.177.82/32,10.0.0.0/8"

    # Timeouts (longer for dashboard loading)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - coroot.arigsela.com
      secretName: coroot-tls
  rules:
    - host: coroot.arigsela.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coroot-coroot
                port:
                  number: 8080
