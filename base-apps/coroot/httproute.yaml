# Gateway API replacement for this app's nginx Ingress (SPEC.md T56).
#
# Deliberately lives in the app namespace rather than beside the Gateway: the
# backendRef is then same-namespace and needs no ReferenceGrant, and the route
# stays with the thing it routes to. Attaching across namespaces is allowed by
# the Gateway's allowedRoutes.namespaces.from: All.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coroot
  namespace: coroot
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Coroot
    gethomepage.dev/group: Observability
    gethomepage.dev/icon: mdi-radar
    gethomepage.dev/description: eBPF observability
    # coroot-coroot-0 only; the cluster-agent and node-agent carry
    # component=coroot-cluster-agent / -node-agent and must not match.
    gethomepage.dev/pod-selector: app.kubernetes.io/component=coroot
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-coroot
  hostnames:
    - coroot.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coroot-coroot
          port: 8080
