apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coroot-tls
  namespace: coroot
spec:
  secretName: coroot-tls
  dnsNames:
    - coroot.arigsela.com
  issuerRef:
    # Not letsencrypt-prod: its only solver is http01.ingress.class=nginx, which
    # nothing satisfies since the Istio cutover.
    name: letsencrypt-route53
    kind: ClusterIssuer
