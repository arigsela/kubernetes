apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-secrets
  namespace: donetick
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: donetick-secrets
    creationPolicy: Owner
  data:
    # Must be >= 32 chars or donetick panics at startup. Rotating logs everyone
    # out — see runbook.md.
    - secretKey: jwt-secret
      remoteRef:
        key: donetick
        property: jwt-secret
