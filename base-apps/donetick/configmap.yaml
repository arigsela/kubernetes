# Mounted over the image's /config. Secrets are deliberately absent and injected
# as DT_* env vars instead; see deployments.yaml and docs.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: donetick-config
  namespace: donetick
data:
  selfhosted.yaml: |
    name: "selfhosted"
    is_done_tick_dot_com: false

    # Closed 2026-08-03 once the first account existed. Turning this back on is
    # the ONLY way to add a user — there is no bootstrap admin and no CLI.
    is_user_creation_disabled: true

    database:
      type: "postgres"
      migration: true
      host: "postgresql-cluster-rw.postgresql.svc.cluster.local"
      port: 5432
      user: "donetick"
      name: "donetick"

    jwt:
      session_time: 168h
      max_refresh: 1440h

    server:
      port: 2021
      read_timeout: 10s
      write_timeout: 10s
      rate_period: 60s
      rate_limit: 300
      cors_allow_origins:
        - "https://chores.arigsela.com"
        # What the Android/iOS Capacitor shell sends as its Origin.
        - "https://localhost"
        - "http://localhost"
        - "capacitor://localhost"
      serve_frontend: true
      # Upstream defaults this on; the Swagger UI is unauthenticated.
      serve_swagger: false
      public_host: "https://chores.arigsela.com"

    logging:
      level: "info"
      encoding: "json"
      development: false

    scheduler_jobs:
      due_job: 30m
      overdue_job: 3h
      pre_due_job: 3h

    email:
      # No SMTP relay in this cluster, so password reset prints its URL to the
      # pod log instead of mailing it. Recovery path is in runbook.md.
      log_raw_url: true

    realtime:
      enabled: true
      sse_enabled: true
      heartbeat_interval: 60s
      connection_timeout: 120s
      max_connections: 1000
      max_connections_per_user: 5
      event_queue_size: 2048
      cleanup_interval: 2m
      stale_threshold: 5m
      enable_compression: true
      allowed_origins:
        - "https://chores.arigsela.com"
