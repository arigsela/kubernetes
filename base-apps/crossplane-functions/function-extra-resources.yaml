# base-apps/crossplane-functions/function-extra-resources.yaml
# Reads existing K8s resources during Composition rendering. Its only consumer,
# the XSmokeTestApp Composition (which read vcluster's generated kubeconfig
# secret), was deleted on 2026-07-20, so nothing uses this Function today.
# See docs/platform/crossplane.md.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-extra-resources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-extra-resources:v0.3.0
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
