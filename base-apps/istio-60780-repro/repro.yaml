# base-apps/istio-60780-repro/repro.yaml (beacon §T.21) — TEMPORARY.
# Gateway -> Service labelled istio.io/ingress-use-waypoint -> waypoint -> a static echo pod.
# Both the Gateway (base-apps/istio-ingress/telemetry.yaml) and this waypoint (below) trace at
# 100% to the collector, so if istio#60780 holds on this Istio, their spans for
# /__istio-60780 never arrive; beacon's own path (no such label) is the control.
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-60780-repro
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: repro-waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: repro-waypoint
  namespace: istio-60780-repro
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: repro-waypoint-tracing
  namespace: istio-60780-repro
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: repro-waypoint
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100
---
# busybox httpd from an image a node already ran (base-apps/tracing/smoke-job.yaml, beacon §V.18).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: istio-60780-repro
  labels:
    app: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b1@sha256:fcfd4588cbf2c68ae6a5b67501d8aa4a1c58c0b89e664c8eee71952ac12430ff
          command: ["httpd", "-f", "-p", "8080", "-h", "/autoinstrumentation"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: istio-60780-repro
  labels:
    # The label under test. Never on beacon (beacon §V.8).
    istio.io/ingress-use-waypoint: "true"
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
---
# One path on beacon's host; the listener admits routes from any namespace, and this prefix is
# longer than any of beacon's own, so nothing of beacon's is routed here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: istio-60780-repro
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-beacon
  hostnames:
    - beacon.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__istio-60780
      backendRefs:
        - name: echo
          port: 8080
