# TEMPORARY (2026-09-27): restored so the deleted ClusterPolicy generate-ecr-secret can finish
# deleting. Kyverno's policy webhook re-validates the policy on the garbage collector's
# finalizer-removal UPDATE and denies it without this grant, deadlocking foreground deletion.
# Delete this file again once `kubectl get clusterpolicy generate-ecr-secret` is NotFound.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-secrets
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
