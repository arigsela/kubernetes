# Lets Kyverno's REPORTS controller — and only that one — read kagent Agents.
#
# Why: Kyverno's reports controller writes the PolicyReports for the native agent admission
# policies (base-apps/admission-policies: agent-capability, agent-identity-mcp-toolnames). To
# evaluate them in the background it must LIST and WATCH the Agents. Without this grant it
# asks for it by name and reports nothing for Agents:
#
#     Warning: system:serviceaccount:kyverno:kyverno-reports-controller
#     requires permissions get,list,watch for resource kagent.dev/v1alpha2/Agent
#
# The admission controller used to be granted this too: the Kyverno ClusterPolicy
# agent-capability made an `apiCall` to read a delegate Agent's class, and when that call was
# denied Kyverno SKIPPED the rule, so delegation escalations were silently ADMITTED. That
# policy is gone (plan Phase 3E); the native agent-capability-delegation reads delegates as
# policy PARAMETERS inside the API server and needs no RBAC. The admission grant was removed
# with it. Admission never needed RBAC to validate an object: the API server sends it.
#
# The background controller is not granted: it reconciles generate/mutate-existing rules, and
# nothing generates or mutates Agents. Read-only verbs: nothing here writes an Agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:read-kagent-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]
