# The reconciler script. This ConfigMap is its ONLY home - tests/wan_ip/
# load reconcile.py out of this file rather than a copy, so the two cannot
# drift apart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wan-ip-reconcile
  namespace: wan-ip-monitor
data:
  reconcile.py: |
    """Reconcile the home WAN address into Route 53 and the Istio allow-list.

    This is a RECONCILER, not a change-detector. Every run compares reality
    against two desired states INDEPENDENTLY and fixes whichever drifted:

      1. Route 53 - every hostname in MANAGED_HOSTNAMES must have a single-value
         A record equal to the address detected right now. No GitHub involved.
      2. The Istio allow-list - the arigsela.com/wan-ip annotation on main must
         name that same address; if it does not, open a PR and let a human merge.

    Neither half is a precondition for the other. That is not stylistic: the
    annotation only advances when a human merges, DNS advances in seconds, so
    any design that uses the annotation to decide what Route 53 should do
    strands records the moment the two diverge. See reconcile() for the exact
    sequence that used to break.
    """
    import base64
    import ipaddress
    import json
    import os
    import urllib.error
    import urllib.request

    import yaml

    WAN_IP_ANNOTATION = "arigsela.com/wan-ip"


    def is_valid_public_ipv4(value):
        """True only for a single, routable, public IPv4 address.

        Deliberately strict. This value ends up in a security allow-list and in
        public DNS, so an error page, a captive-portal redirect, an RFC1918
        address from a misbehaving detector, or a carrier-NAT address must never
        get through.

        WHY is_global INSTEAD OF AN ENUMERATION of is_private/is_loopback/
        is_reserved/is_multicast/is_link_local/is_unspecified: that enumeration
        silently ACCEPTED RFC 6598 CGNAT space (100.64.0.0/10). Verified:
        IPv4Address("100.64.1.5").is_private is False, and so is every other
        flag in that list, so a carrier-NAT address passed. The runbook names
        CGNAT as a live possibility for this residential line ("Detected address
        flapping"), and writing one into 21 public A records - let alone
        proposing to allow-list it - would hand the security boundary to every
        other subscriber sitting behind that same carrier NAT. is_global is
        precisely "not 100.64.0.0/10 and not private", which is the property
        actually wanted.

        The explicit `not addr.is_multicast` is NOT redundant: CPython does not
        list 224.0.0.0/4 among its private networks (checked on 3.12, the
        image's interpreter, and on 3.14), so a bare `is_global` returns True
        for 224.0.0.1. Dropping this clause re-admits multicast.

        NOTE for anyone writing tests against this: Python treats the RFC 5737
        documentation ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) as
        is_private, so the usual "example IP" habit produces addresses this
        rejects. That is correct behaviour - a documentation address is never a
        real WAN address - so pick a genuinely public one in fixtures instead.
        """
        try:
            addr = ipaddress.IPv4Address(str(value).strip())
        except (ipaddress.AddressValueError, ValueError):
            return False
        return addr.is_global and not addr.is_multicast


    def read_declared_wan_ip(policy_yaml):
        """The WAN address the allow-list currently claims to be built around."""
        doc = yaml.safe_load(policy_yaml)
        annotations = (doc.get("metadata") or {}).get("annotations") or {}
        value = annotations.get(WAN_IP_ANNOTATION)
        if not value:
            raise KeyError("%s annotation missing from the policy" % WAN_IP_ANNOTATION)
        return value


    def rewrite_policy(policy_yaml, old_ip, new_ip):
        """Swap exactly the declared WAN /32, and move the annotation with it.

        Line-wise text substitution rather than a YAML round-trip or a blanket
        string replace, on purpose. This file is heavily commented and the
        comments are load-bearing documentation:

        - A blanket substring replace would also rewrite a comment shaped like
          "# historical: was - <old_ip>/32", corrupting a dated historical
          record into a lie.
        - It would also MISS a comment that names the address without the
          "- <ip>/32" list-item shape (e.g. "# <old_ip>/32 covers the hairpin
          path"), leaving stale documentation with no signal that it drifted.

        So a line is only ever rewritten when its stripped form is EXACTLY the
        ipBlocks entry or EXACTLY the annotation line - comments are never
        touched, no matter what they contain. See stale_comment_lines for the
        lines this deliberately leaves alone.
        """
        if not is_valid_public_ipv4(new_ip):
            raise ValueError("refusing to write non-public address %r" % new_ip)
        if old_ip == new_ip:
            return policy_yaml

        old_block = "- %s/32" % old_ip
        new_block = "- %s/32" % new_ip
        old_annotation = '%s: "%s"' % (WAN_IP_ANNOTATION, old_ip)
        new_annotation = '%s: "%s"' % (WAN_IP_ANNOTATION, new_ip)

        lines = policy_yaml.split("\n")
        blocks_replaced = 0
        for i, line in enumerate(lines):
            stripped = line.strip()
            indent = line[: len(line) - len(line.lstrip())]
            if stripped == old_block:
                lines[i] = indent + new_block
                blocks_replaced += 1
            elif stripped == old_annotation:
                lines[i] = indent + new_annotation

        if blocks_replaced == 0:
            raise ValueError(
                "old_ip %r not found as an ipBlocks entry; refusing a rewrite "
                "that would silently no-op against a stale caller view" % old_ip
            )

        return "\n".join(lines)


    def stale_comment_lines(policy_yaml, old_ip):
        """1-based line numbers of comments that still mention old_ip.

        rewrite_policy deliberately never edits a comment, so after a rotation
        any comment naming the old address is left exactly as it was - whether
        that is a dated historical record worth keeping or documentation that
        has gone stale. This lists those lines so a human reviewing the PR can
        tell the difference; it does not judge which is which.
        """
        stale = []
        for lineno, line in enumerate(policy_yaml.split("\n"), start=1):
            stripped = line.strip()
            if stripped.startswith("#") and old_ip in stripped:
                stale.append(lineno)
        return stale


    HOSTED_ZONE_ID = os.environ.get("HOSTED_ZONE_ID", "Z0524483LR4JCFNLS7N0")


    def aws_json(args):
        """Run a Route 53 operation via boto3 and return its JSON-shaped result.

        Talks to AWS via boto3, not the `aws` CLI. amazon/aws-cli:2.17.0 (the
        image this app tried first) bundles the CLI's own internal Python
        interpreter but exposes no `python3` on PATH to run this script under
        - confirmed live: `aws --version` succeeds in that image, `python3
        --version` reports "command not found". See docs.md ("Container image
        choice") for both options considered and why this one was picked.
        cronjob.yaml runs python:3.12-slim with boto3/pyyaml pip-installed at
        container start instead.

        `args` stays the same argv-shaped list the AWS-CLI-backed version
        accepted (e.g. ["route53", "list-resource-record-sets",
        "--hosted-zone-id", ID, "--output", "json"]), so route53_json, main()'s
        two call sites, and the test suite's `aws_json` monkeypatches all
        needed no change - only what happens inside this function changed.

        boto3 is imported here, not at module level, so importing this module
        - which every test in tests/wan_ip/ does - never requires boto3 to be
        installed locally; every test path that reaches this function replaces
        it first via monkeypatch.

        list-resource-record-sets is PAGINATED. The `aws` CLI this replaced
        auto-paginated; a single client.list_resource_record_sets() call does
        not - it silently returns at most one page (default 100 records) and
        sets IsTruncated rather than raising. Missing this would mean records
        past the boundary never get corrected: main() would still print
        "updated N records" and exit 0, having silently never looked at the
        rest of the zone. get_paginator() is used specifically to make that
        failure mode impossible rather than trusting the zone to always stay
        under one page.
        """
        import boto3

        client = boto3.client("route53")
        if args[:2] == ["route53", "list-resource-record-sets"]:
            zone_id = args[args.index("--hosted-zone-id") + 1]
            paginator = client.get_paginator("list_resource_record_sets")
            record_sets = []
            for page in paginator.paginate(HostedZoneId=zone_id):
                record_sets.extend(page.get("ResourceRecordSets", []))
            return {"ResourceRecordSets": record_sets}
        if args[:2] == ["route53", "change-resource-record-sets"]:
            zone_id = args[args.index("--hosted-zone-id") + 1]
            batch = json.loads(args[args.index("--change-batch") + 1])
            return client.change_resource_record_sets(HostedZoneId=zone_id, ChangeBatch=batch)
        raise ValueError("aws_json: unsupported args %r" % (args,))


    def normalise_hostname(name):
        """Route 53 returns names fully qualified ("argocd.arigsela.com.") and
        case-insensitively; MANAGED_HOSTNAMES is hand-maintained. Normalise both
        sides before comparing so a trailing dot or a capital letter can never
        make a managed record look unmanaged (and therefore never get fixed)."""
        return str(name).strip().rstrip(".").lower()


    def managed_hostnames(raw=None):
        """The hostnames this job owns, from MANAGED_HOSTNAMES (comma-separated).

        An EXPLICIT list, not "whatever currently points at the previous
        address". Selecting by previous value cannot work here: the only thing
        the job can read back as "previous" is the allow-list annotation, which
        does not move until a human merges the PR. Route 53 moves in seconds,
        the annotation moves on merge, so after the very first rotation the two
        diverge and a value-based selector matches nothing - stranding every
        record on a dead address while the run still reports success.

        An explicit list is deterministic and still never touches a record this
        job does not own. A hostname missing from the list is simply never
        touched, which fails safe and visibly (that host stops resolving to
        home) rather than silently mis-selecting someone else's record.

        Adding a host to the homelab means adding it here - the list lives in
        cronjob.yaml's MANAGED_HOSTNAMES env var. See docs.md, "Which Route 53
        records it owns".
        """
        if raw is None:
            raw = os.environ.get("MANAGED_HOSTNAMES", "")
        return [normalise_hostname(part) for part in raw.split(",") if part.strip()]


    def records_needing_update(recordsets, current_ip, managed):
        """Managed A records that are not already sitting on current_ip.

        Two hard safety rules, both carried over unchanged from the original
        selector - they are what keeps a wrong answer from being destructive:

        - Type must be A. Nothing else is ever rewritten.
        - The value list must have EXACTLY one entry. A multi-value record is
          not ours to rewrite from a single-address signal, and an ALIAS record
          (AliasTarget, with no ResourceRecords at all) would otherwise read as
          "zero values, therefore not current" and get flattened into a plain A
          record pointing at the WAN address.

        On top of those, the record's name must appear in `managed`.
        """
        wanted = {normalise_hostname(name) for name in managed}
        out = []
        for record in recordsets:
            if record.get("Type") != "A":
                continue
            if normalise_hostname(record.get("Name", "")) not in wanted:
                continue
            values = [v["Value"] for v in record.get("ResourceRecords", [])]
            if len(values) != 1:
                continue
            if values[0] != current_ip:
                out.append(record)
        return out


    def build_change_batch(records, new_ip):
        """UPSERT each record onto the new address, preserving its own TTL."""
        changes = []
        for record in records:
            updated = dict(record)
            updated["ResourceRecords"] = [{"Value": new_ip}]
            changes.append({"Action": "UPSERT", "ResourceRecordSet": updated})
        return {"Comment": "wan-ip-monitor: rotate to %s" % new_ip, "Changes": changes}


    REPO = os.environ.get("GITHUB_REPO", "arigsela/kubernetes")
    POLICY_PATH = "base-apps/istio-ingress/authorizationpolicy.yaml"
    N8N_WEBHOOK = os.environ.get(
        "N8N_WEBHOOK",
        "http://n8n.n8n.svc.cluster.local:5678/webhook/wan-ip-rotated",
    )
    IP_SOURCES = ["https://checkip.amazonaws.com", "https://ifconfig.me/ip"]
    DRY_RUN = os.environ.get("DRY_RUN", "").lower() in ("1", "true", "yes")


    def http_get(url):
        request = urllib.request.Request(url, headers={"User-Agent": "wan-ip-monitor"})
        with urllib.request.urlopen(request, timeout=15) as response:
            return response.read().decode()


    def detect_wan_ip(fetch=http_get):
        """First source that yields a usable public address wins.

        Two sources because a single detector having a bad day should not look
        like a rotation. Anything unusable is skipped rather than trusted.
        """
        for url in IP_SOURCES:
            try:
                candidate = fetch(url).strip()
            except Exception:
                continue
            if is_valid_public_ipv4(candidate):
                return candidate
        raise RuntimeError("no source returned a usable public IPv4")


    def branch_name(new_ip):
        return "automation/wan-ip-%s" % new_ip


    def github(method, path, body=None):
        url = "https://api.github.com/repos/%s%s" % (REPO, path)
        data = json.dumps(body).encode() if body is not None else None
        request = urllib.request.Request(url, data=data, method=method)
        request.add_header("Authorization", "Bearer %s" % os.environ["GITHUB_TOKEN"])
        request.add_header("Accept", "application/vnd.github+json")
        request.add_header("User-Agent", "wan-ip-monitor")
        if data:
            request.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(request, timeout=30) as response:
            payload = response.read().decode()
        return json.loads(payload) if payload.strip() else {}


    def open_allowlist_pr(old_ip, new_ip):
        """Branch, commit the rewritten policy, open a PR.

        Returns (url, created). `created` is False when this rotation already
        had a PR, which is what keeps a rotation that sits unmerged for a day
        from opening 288 of them - and what keeps the notification quiet.

        This never merges or approves the PR it opens - a human always merges.
        """
        branch = branch_name(new_ip)
        owner = REPO.split("/")[0]
        existing = github("GET", "/pulls?state=open&head=%s:%s" % (owner, branch))
        if existing:
            return existing[0]["html_url"], False

        main_sha = github("GET", "/git/ref/heads/main")["object"]["sha"]
        branch_exists = False
        try:
            github("POST", "/git/refs", {"ref": "refs/heads/%s" % branch, "sha": main_sha})
        except urllib.error.HTTPError as exc:
            if exc.code != 422:  # 422 = ref already exists, which is fine
                raise
            branch_exists = True

        # WHICH REF THE BLOB SHA COMES FROM IS LOAD-BEARING. PUT /contents needs
        # the SHA of the blob it is replacing ON THE TARGET BRANCH. Reading it
        # from main unconditionally works only while the branch still points at
        # main's tree; the moment the branch carries its own commit to this path
        # GitHub answers 409 Conflict, and since that leaves the PR uncreated,
        # the existing-PR short-circuit above never engages either - so the next
        # run repeats it, forever. Two real ways to land there: a partial
        # failure (branch + commit succeed, POST /pulls fails), and a
        # closed-but-not-merged PR whose branch survives until the ISP hands the
        # same address back. Read from the branch when it already exists.
        ref = branch if branch_exists else "main"
        current = github("GET", "/contents/%s?ref=%s" % (POLICY_PATH, ref))
        text = base64.b64decode(current["content"]).decode()

        # Rewrite against what THAT ref actually declares, not against what main
        # declared. On a pre-existing branch they differ by construction - the
        # branch is usually already rewritten to new_ip, in which case
        # rewrite_policy is a no-op and there is simply nothing left to commit.
        try:
            base_ip = read_declared_wan_ip(text)
        except KeyError:
            base_ip = old_ip
        rewritten = rewrite_policy(text, base_ip, new_ip)

        if rewritten == text and not branch_exists:
            # main already declares new_ip: nothing to propose.
            return None, False

        if rewritten != text:
            github(
                "PUT",
                "/contents/%s" % POLICY_PATH,
                {
                    "message": "istio-ingress: follow the WAN IP rotation %s -> %s" % (old_ip, new_ip),
                    "content": base64.b64encode(rewritten.encode()).decode(),
                    "sha": current["sha"],
                    "branch": branch,
                },
            )

        stale_lines = stale_comment_lines(text, old_ip)
        body = (
            "Opened automatically by `wan-ip-monitor`.\n\n"
            "The ISP moved the home WAN address from `%s` to `%s`.\n\n"
            "**Route 53 has already been updated** - DNS is correct right now. "
            "Until this merges, the allow-listed hosts resolve correctly and "
            "answer `403`, because the Istio policy still trusts the old "
            "address.\n\nMerging is all that is required; Argo CD syncs it.\n"
        ) % (old_ip, new_ip)
        if stale_lines:
            body += (
                "\n**Heads up:** comment(s) on line(s) %s still mention `%s` and "
                "were left untouched - rewrite_policy never edits comments, since "
                "some are dated historical record. Check whether they need a "
                "manual update.\n" % (", ".join(str(n) for n in stale_lines), old_ip)
            )

        pr = github(
            "POST",
            "/pulls",
            {
                "title": "istio-ingress: follow the WAN IP rotation %s -> %s" % (old_ip, new_ip),
                "head": branch,
                "base": "main",
                "body": body,
            },
        )
        return pr["html_url"], True


    def post_json(payload):
        request = urllib.request.Request(
            N8N_WEBHOOK,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        urllib.request.urlopen(request, timeout=15).close()


    def notify(payload, post=post_json):
        """Best effort. Never let a missing alert fail an otherwise good run."""
        try:
            post(payload)
        except Exception as exc:
            print("notify failed (continuing): %s" % exc)


    def read_policy_from_main():
        """The allow-list as it exists on main.

        main IS the desired state - Argo CD syncs from it, and the PR targets
        it - so reading from there keeps the comparison and the eventual commit
        anchored to the same revision. Reading a mounted copy instead would add
        a second source of truth that can silently drift.
        """
        current = github("GET", "/contents/%s?ref=main" % POLICY_PATH)
        return base64.b64decode(current["content"]).decode()


    def route53_json(args):
        """aws_json, with the failure logged before it propagates.

        botocore exceptions already include the error code and message in
        str(exc) - unlike the AWS CLI's CalledProcessError, whose default
        traceback drops stderr - so this mostly exists to guarantee the
        auth/throttle/zone error is printed before it ends an unattended run.
        """
        try:
            return aws_json(args)
        except Exception as exc:
            print("route53 call failed: %s" % exc)
            raise


    def reconcile_route53(current):
        """Point every managed A record at `current`. Returns how many moved.

        Deliberately knows NOTHING about GitHub, the annotation, or the PR. The
        desired state of a managed A record is "whatever detect_wan_ip just
        observed", full stop, so this half keeps working when GitHub is down,
        when GITHUB_TOKEN has expired, and when the allow-list PR has been
        sitting unmerged for a week. It also cannot be fooled by the annotation
        lagging: the selector is the managed-name list, never a value that has
        to be read back from somewhere slower than DNS.
        """
        managed = managed_hostnames()
        if not managed:
            print("MANAGED_HOSTNAMES is empty - no Route 53 records are managed, "
                  "skipping the DNS half")
            return 0

        zone = route53_json(
            ["route53", "list-resource-record-sets", "--hosted-zone-id", HOSTED_ZONE_ID,
             "--output", "json"]
        )
        stale = records_needing_update(zone.get("ResourceRecordSets", []), current, managed)
        if not stale:
            print("route53: %d managed hostname(s) already on %s" % (len(managed), current))
            return 0

        names = ", ".join(record["Name"] for record in stale)
        if DRY_RUN:
            print("DRY_RUN: would move %d Route 53 record(s) to %s: %s"
                  % (len(stale), current, names))
            return 0

        batch = build_change_batch(stale, current)
        route53_json(
            ["route53", "change-resource-record-sets",
             "--hosted-zone-id", HOSTED_ZONE_ID,
             "--change-batch", json.dumps(batch), "--output", "json"]
        )
        print("route53: updated %d record(s) to %s: %s" % (len(stale), current, names))
        return len(stale)


    def reconcile_allowlist(current):
        """Propose the allow-list change if it has not been merged yet.

        Returns (pr_url, created). The annotation on main is the desired state
        for THIS half only - it is what the allow-list claims to trust, and it
        legitimately lags reality until a human merges the PR.
        """
        declared = read_declared_wan_ip(read_policy_from_main())
        print("allow-list: declared=%s detected=%s" % (declared, current))
        if declared == current:
            print("allow-list: already trusts %s, nothing to propose" % current)
            return None, False
        if DRY_RUN:
            print("DRY_RUN: would open an allow-list PR %s -> %s" % (declared, current))
            return None, False
        return open_allowlist_pr(declared, current)


    def reconcile():
        """The two halves, in order, independent of one another.

        THE ORDER AND THE INDEPENDENCE ARE THE POINT. An earlier version keyed
        both halves off `declared == current` and returned early when they
        matched, which made the annotation - a value that only advances when a
        human merges a PR - both the change signal and the Route 53 selector.
        Once they diverged, the code could not notice: a WAN address that went
        A -> B (records moved, PR opened) and then flapped back to A hit
        `detected == declared == A`, printed "in sync, nothing to do", and left
        every record stranded on B permanently. Keeping these two halves
        independent is what makes that unrepresentable.
        """
        current = detect_wan_ip()
        print("detected=%s dry_run=%s" % (current, DRY_RUN))

        updated = reconcile_route53(current)

        try:
            pr_url, pr_created = reconcile_allowlist(current)
        except Exception:
            # DNS is already correct at this point; say so explicitly, because
            # the two failures need very different responses and the traceback
            # alone does not distinguish them.
            print("route53 was reconciled onto %s, but the allow-list PR could "
                  "NOT be opened - the Istio policy still trusts the old "
                  "address, so protected hosts resolve and answer 403 until "
                  "this is fixed" % current)
            raise

        print("allow-list PR: %s (new=%s)" % (pr_url, pr_created))

        # Only speak up when something actually happened. Between the rotation
        # and the merge this runs every 5 minutes with the PR already open and
        # DNS already fixed; alerting on each of those would train the operator
        # to ignore the notification.
        if updated or pr_created:
            notify({
                "event": "wan-ip-reconciled",
                "new": current,
                "records_updated": updated,
                "pr_url": pr_url,
                "dry_run": DRY_RUN,
            })
        return 0


    def main():
        """reconcile(), with any crash turned into a notification.

        Without this the only failure signal is a non-zero pod exit in a
        namespace nobody watches, so a broken run is invisible until a host
        times out. notify() is best effort by construction, so a webhook that
        is itself down cannot mask the original exception - which is always
        re-raised, keeping the pod's exit status honest.
        """
        try:
            return reconcile()
        except Exception as exc:
            notify({
                "event": "wan-ip-monitor-failed",
                "error_type": type(exc).__name__,
                "error": str(exc),
                "dry_run": DRY_RUN,
            })
            raise


    if __name__ == "__main__":
        raise SystemExit(main())
