# Runs every 5 minutes. Steady state is two read-only API calls, so the cost of
# checking often is negligible and the reward is that a rotation is caught
# before it is noticed.
#
# The allow-list is read from GitHub `main` via the API
# (reconcile.py's read_policy_from_main), NOT from a mounted copy of the live
# cluster object - there is no policy volume below on purpose. `main` is the
# exact revision Argo CD syncs and the PR targets, so the comparison and the
# eventual commit stay anchored to the same source of truth, and this also
# avoids granting the job RBAC to read the live Istio AuthorizationPolicy
# object. See docs.md, "Where config lives".
#
# Image: python:3.12-slim, not amazon/aws-cli:2.17.0. The aws-cli image was
# tried first (Step 1 of task-5-brief.md) and rejected: it has a working `aws`
# binary but no `python3` on PATH to run reconcile.py under - the CLI bundles
# its own internal interpreter without exposing it for scripting. boto3 and
# PyYAML are installed at container start instead of baked into a custom image,
# trading a few seconds of startup (negligible on a 5-minute schedule) for not
# maintaining a bespoke image. See docs.md ("Container image choice").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wan-ip-monitor
  namespace: wan-ip-monitor
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: wan-ip-monitor
        spec:
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          containers:
            - name: reconcile
              image: python:3.12-slim
              command:
                - sh
                - -c
                - "pip install --quiet boto3==1.35.99 pyyaml==6.0.2 && python3 /app/reconcile.py"
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: DRY_RUN
                  value: "true"
                # The Route 53 A records this job owns. This list is the
                # SELECTOR for the DNS half - a record is moved onto the newly
                # detected address because its name is here, never because its
                # current value happens to match some previously-known address.
                # That distinction is the whole reason this env var exists: the
                # only "previous address" the job can read back is the
                # allow-list annotation, which does not move until a human
                # merges the PR, so a value-based selector stops matching as
                # soon as DNS and the annotation diverge - and silently strands
                # every record on a dead address (see configmap-reconcile.yaml,
                # managed_hostnames()).
                #
                # A hostname NOT listed here is never touched. That fails safe
                # and visibly: the host simply stops resolving to home after a
                # rotation, rather than this job guessing at records it does not
                # own. ADDING A HOST TO THE HOMELAB MEANS ADDING IT HERE.
                #
                # Seeded with the 21 A records in zone Z0524483LR4JCFNLS7N0 that
                # point at the WAN address. Trailing dots are optional and case
                # does not matter - both sides are normalised before comparison.
                - name: MANAGED_HOSTNAMES
                  value: >-
                    agent.arigsela.com,
                    argo-workflows.arigsela.com,
                    argocd.arigsela.com,
                    atlantis.arigsela.com,
                    backstage.arigsela.com,
                    chores.arigsela.com,
                    coroot.arigsela.com,
                    dex.arigsela.com,
                    grafana.arigsela.com,
                    home.arigsela.com,
                    kagent-mcp.arigsela.com,
                    kagent.arigsela.com,
                    langflow.arigsela.com,
                    n8n.arigsela.com,
                    oncall-crewai.arigsela.com,
                    oncall.arigsela.com,
                    overseerr.arigsela.com,
                    rollouts.arigsela.com,
                    vault.arigsela.com,
                    weather-kitchen.arigsela.com,
                    whoami.arigsela.com
              envFrom:
                - secretRef:
                    name: wan-ip-monitor
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  # 128Mi was sized for the old aws-cli image, which installed
                  # nothing at runtime. pip resolving/unpacking botocore plus
                  # boto3.client("route53") loading its service model sits
                  # close to that ceiling, so this is sized for the current
                  # python:3.12-slim + pip-install-on-start image instead.
                  # cpu: 200m (there was previously no CPU limit at all) is
                  # sized for that same pip install: it is CPU-bound at
                  # container start and, throttled to 0.2 core, takes on the
                  # order of a minute or two - comfortably inside the 5-minute
                  # schedule, and concurrencyPolicy: Forbid means a slow start
                  # here delays the next run rather than overlapping it.
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: wan-ip-reconcile
