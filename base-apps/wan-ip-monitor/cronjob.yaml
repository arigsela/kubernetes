# Runs every 5 minutes. Steady state is two read-only API calls, so the cost of
# checking often is negligible and the reward is that a rotation is caught
# before it is noticed.
#
# The policy file is mounted from the live cluster object rather than fetched
# from GitHub, so the job reconciles against what is actually enforced.
#
# Image: python:3.12-slim, not amazon/aws-cli:2.17.0. The aws-cli image was
# tried first (Step 1 of task-5-brief.md) and rejected: it has a working `aws`
# binary but no `python3` on PATH to run reconcile.py under - the CLI bundles
# its own internal interpreter without exposing it for scripting. boto3 and
# PyYAML are installed at container start instead of baked into a custom image,
# trading a few seconds of startup (negligible on a 5-minute schedule) for not
# maintaining a bespoke image. See docs.md ("Container image choice").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wan-ip-monitor
  namespace: wan-ip-monitor
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: wan-ip-monitor
        spec:
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          containers:
            - name: reconcile
              image: python:3.12-slim
              command:
                - sh
                - -c
                - "pip install --quiet boto3==1.35.99 pyyaml==6.0.2 && python3 /app/reconcile.py"
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: DRY_RUN
                  value: "true"
              envFrom:
                - secretRef:
                    name: wan-ip-monitor
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: wan-ip-reconcile
