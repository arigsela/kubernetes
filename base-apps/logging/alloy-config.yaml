apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: logging
data:
  config.alloy: |
    /********************************************/
    /*     LOGS COLLECTION (Loki)              */
    /********************************************/

    // Logs only, by design. Metrics collection lives in Prometheus: prometheus-config.yaml
    // already scrapes the API server, nodes, cAdvisor and annotated pods directly. Alloy used
    // to scrape those same targets and remote-write them, which duplicated every series and
    // accounted for ~160MB of the ~240MB live heap per pod. See runbook.md, "Alloy DaemonSet
    // pods CrashLooping / OOMKilled".

    // Discover Kubernetes pods for logs.
    // The field selector pins each DaemonSet pod to its own node. Without it every Alloy pod
    // tails every pod in the cluster, so each log line is shipped once per node and Loki
    // rejects the copies. HOSTNAME is the node name (alloy-daemonset.yaml sets it from
    // spec.nodeName).
    discovery.kubernetes "pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
    }

    // Relabel to extract useful Kubernetes metadata
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      // Extract namespace
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Extract pod name
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Extract container name
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Extract app label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // Set path to log files
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        target_label  = "__path__"
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    // Read container logs
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.parse_logs.receiver]
    }

    // Process and parse logs
    loki.process "parse_logs" {
      // Extract JSON fields if logs are in JSON format
      stage.json {
        expressions = {
          level = "level",
          msg   = "msg",
        }
      }

      // Add timestamp
      stage.timestamp {
        source = "time"
        format = "RFC3339"
      }

      // Label extracted fields
      stage.labels {
        values = {
          level = "",
        }
      }

      forward_to = [loki.process.filter_logs.receiver]
    }

    // Filter out noisy logs
    loki.process "filter_logs" {
      // Drop health check logs
      stage.match {
        selector = "{app=\"nginx\"}"
        stage.drop {
          expression = ".*GET /health.*"
        }
      }

      // Drop verbose debug logs from production
      stage.match {
        selector = "{namespace!=\"development\"}"
        stage.drop {
          expression = ".*\\[DEBUG\\].*"
        }
      }

      forward_to = [loki.write.loki.receiver]
    }

    // Send logs to Loki
    loki.write "loki" {
      endpoint {
        url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
      }

      external_labels = {
        cluster = "homelab",
        source  = "alloy",
      }
    }
