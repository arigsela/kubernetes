apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: logging
data:
  config.alloy: |
    /********************************************/
    /*     LOGS COLLECTION (Loki)              */
    /********************************************/

    // Logs, plus host metrics (see the end of this file) and nothing else. Metrics collection
    // lives in Prometheus: prometheus-config.yaml already scrapes the API server, nodes,
    // cAdvisor and annotated pods directly. Alloy used to scrape those same targets and
    // remote-write them, which duplicated every series and accounted for ~160MB of the
    // ~240MB live heap per pod. See runbook.md, "Alloy DaemonSet pods CrashLooping /
    // OOMKilled". The host metrics below are the one exception, because nothing else
    // collects them.

    // Discover Kubernetes pods for logs.
    // The field selector pins each DaemonSet pod to its own node. Without it every Alloy pod
    // tails every pod in the cluster, so each log line is shipped once per node and Loki
    // rejects the copies. HOSTNAME is the node name (alloy-daemonset.yaml sets it from
    // spec.nodeName).
    discovery.kubernetes "pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
    }

    // Relabel to extract useful Kubernetes metadata
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "keep"
        regex         = "Running"
      }

      // Extract namespace
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Extract pod name
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Extract container name
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Extract app label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // Set path to log files
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        target_label  = "__path__"
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    // Read container logs
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.parse_logs.receiver]
    }

    // Process and parse logs
    loki.process "parse_logs" {
      // Extract JSON fields if logs are in JSON format
      stage.json {
        expressions = {
          level = "level",
          msg   = "msg",
        }
      }

      // Add timestamp
      stage.timestamp {
        source = "time"
        format = "RFC3339"
      }

      // Label extracted fields
      stage.labels {
        values = {
          level = "",
        }
      }

      forward_to = [loki.process.filter_logs.receiver]
    }

    // Filter out noisy logs
    loki.process "filter_logs" {
      // Drop health check logs
      stage.match {
        selector = "{app=\"nginx\"}"
        stage.drop {
          expression = ".*GET /health.*"
        }
      }

      // Drop verbose debug logs from production
      stage.match {
        selector = "{namespace!=\"development\"}"
        stage.drop {
          expression = ".*\\[DEBUG\\].*"
        }
      }

      forward_to = [loki.write.loki.receiver]
    }

    // Send logs to Loki
    loki.write "loki" {
      endpoint {
        url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
      }

      external_labels = {
        cluster = "homelab",
        source  = "alloy",
      }
    }

    /********************************************/
    /*     HOST METRICS (node-exporter)        */
    /********************************************/

    // The only metrics Alloy collects, because nothing else does: there is no node-exporter,
    // and cAdvisor sees containers, not the host (root disk, load, PSI). They feed the
    // "Cluster Overview" dashboard (grafana-dashboard-cluster-overview.yaml).
    //
    // Kept small on purpose (see the heap note at the top): only the collectors that
    // dashboard uses, not node_exporter's ~40 defaults. netdev/netstat are left out because
    // without hostNetwork they would report this pod's network namespace, not the node's.
    // The host's /proc, /sys and / are mounted read-only by alloy-daemonset.yaml.
    prometheus.exporter.unix "host" {
      procfs_path    = "/host/proc"
      sysfs_path     = "/host/sys"
      rootfs_path    = "/host/root"
      set_collectors = ["cpu", "diskstats", "filesystem", "loadavg", "meminfo", "pressure", "stat", "uname"]

      filesystem {
        fs_types_exclude     = "^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|" +
                               "iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|" +
                               "squashfs|sysfs|tracefs|tmpfs)$"
        mount_points_exclude = "^/(dev|proc|run|sys|var/lib/kubelet/.+|var/lib/rancher/k3s/agent/containerd/.+)($|/)"
      }
    }

    // One series set per node, labelled with the node name so dashboards can join on it.
    discovery.relabel "host" {
      targets = prometheus.exporter.unix.host.targets

      rule {
        target_label = "node"
        replacement  = sys.env("HOSTNAME")
      }

      rule {
        target_label = "instance"
        replacement  = sys.env("HOSTNAME")
      }
    }

    prometheus.scrape "host" {
      targets         = discovery.relabel.host.output
      job_name        = "node-exporter"
      scrape_interval = "30s"
      forward_to      = [prometheus.remote_write.prometheus.receiver]
    }

    // Prometheus runs with --web.enable-remote-write-receiver (prometheus-statefulset.yaml).
    prometheus.remote_write "prometheus" {
      endpoint {
        url = "http://prometheus.logging.svc.cluster.local:9090/api/v1/write"
      }
    }
