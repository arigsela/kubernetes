apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
    - nodes
    - nodes/proxy
    - services
    - endpoints
    - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
    - configmaps
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: logging
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: logging
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  # OnDelete: a template change (e.g. resources) does not restart Prometheus by itself.
  # Resize the running pod in place first (scripts/resize-pod.sh), then merge the same
  # values here: git and the pod agree with no restart. A real restart is a deliberate
  # `kubectl delete pod prometheus-0` (docs/troubleshooting/in-place-resize.md).
  updateStrategy:
    type: OnDelete
    # Explicit null: the live object carries a defaulted rollingUpdate.partition, and
    # a client-side apply of type OnDelete alone keeps it and fails validation
    # ("only allowed for updateStrategy 'RollingUpdate'"). Deployments clear it via
    # retainKeys; StatefulSets do not.
    rollingUpdate: null
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
      - name: prometheus
        image: prom/prometheus:v3.0.1
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=15d'
          # Hard ceiling on the TSDB. The PVC is `local-path`, which is a hostPath
          # directory with no quota enforcement, so time-based retention alone let the
          # TSDB grow past its 50Gi request and eat worker-01's root disk. 40GB is
          # powers-of-2 here (Prometheus size units are base-2), i.e. ~43 GB on disk.
          - '--storage.tsdb.retention.size=40GB'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.enable-lifecycle'
          - '--web.enable-remote-write-receiver'
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
        # Sized from 15 days of cAdvisor data (2026-09-25): working set peaked at 1982Mi
        # (97% of the old 2Gi limit), RSS 1688Mi, CPU p95 247m / max 557m. Prometheus
        # sets GOMEMLIMIT once at startup to 0.9 x limit, so a memory raise only takes
        # full effect after a restart; an in-place raise alone removes the OOM risk but
        # not the GC pressure.
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 3Gi
        # Resize in place without restarting the container (the default, stated so the
        # intent is explicit). In-place resize is GA in k8s 1.35.
        resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: NotRequired
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: prometheus-config
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path  # K3s default storage class
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: logging
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  selector:
    app: prometheus
