          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^Line$/",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
