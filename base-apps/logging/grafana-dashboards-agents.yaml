            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"recalled\"` | json count, remembered, first=\"issues[0]\", second=\"issues[1]\" | line_format `{{ if eq .count \"0\" }}no match ({{ .remembered }} kept){{ else }}#{{ .first }}{{ if .second }}, #{{ .second }}{{ end }} ({{ .remembered }} kept){{ end }}`",
              "legendFormat": "",
              "queryType": "range",
              "maxLines": 1
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "\u2014",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^Line$/",
              "values": false
            },
            "textMode": "value",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 7,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Fix PR",
          "description": "The pull request kagent/implementer opened for the latest verified cause, or the open one it found instead of opening a duplicate. A person merges.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"fix_handoff\"` | json | line_format `{{ if .pr_url }}#{{ .pr_number }} opened{{ else if .existing_pr_url }}#{{ .existing_pr_number }} (existing){{ else }}{{ regexReplaceAll \".*/pull/\" .outcome \"#\" }}{{ end }}`",
              "legendFormat": "",
              "queryType": "range",
              "maxLines": 1
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "\u2014",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
