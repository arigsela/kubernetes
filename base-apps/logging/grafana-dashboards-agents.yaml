apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-traffic
  namespace: logging
  labels:
    grafana_dashboard: "1"
data:
  agent-traffic.json: |
    {
      "uid": "agent-traffic",
      "title": "Agent Traffic",
      "description": "The traffic between agents and everything they call: a service graph from traces and the mesh's view.",
      "tags": [
        "agents"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "Agent Platform",
          "type": "link",
          "url": "/d/agent-platform",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "The landing page"
        },
        {
          "title": "Agents",
          "type": "dashboards",
          "tags": [
            "agents"
          ],
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "targetBlank": false
        },
        {
          "title": "Cluster Overview",
          "type": "link",
          "url": "/d/cluster-overview",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false
        },
        {
          "title": "Agent KPIs",
          "type": "link",
          "url": "/d/agent-kpis",
          "icon": "dashboard",
          "keepTime": false,
          "targetBlank": false,
          "tooltip": "The playbook's eight agent-scenario KPIs (\u00a7T.144)"
        },
        {
          "title": "Bug Investigation \u00b7 live",
          "type": "link",
          "url": "/d/bug-investigation-live",
          "icon": "dashboard",
          "keepTime": false,
          "targetBlank": false,
          "tooltip": "A Taskboard bug report or alert, step by step, as the platform handles it (\u00a7T.149)"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Who calls whom: the service graph from traces (agent platform only)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "nodeGraph",
          "title": "Service graph",
          "description": "From the collector's service graph over the agent platform's traces: the ingress Gateway, kagent's controller, Substrate's router (agentgateway), each agent, and what it calls (the model API, kagent-tools, the MCP adapters). Edge numbers are requests in the time range.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "refId": "A",
              "queryType": "serviceMap",
              "filters": [],
              "limit": 20,
              "tableType": "traces"
            }
          ],
          "options": {},
          "fieldConfig": {
            "defaults": {
              "noValue": "No agent traffic in this time range"
            },
            "overrides": []
          },
          "id": 2,
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "table",
          "title": "Edges: requests and failures",
          "description": "Each edge of the graph above: requests and failed requests in the time range.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (client, server) (((last_over_time(traces_service_graph_request_total[$__range]) - last_over_time(traces_service_graph_request_total[1d] offset $__range)) >= 0) or last_over_time(traces_service_graph_request_total[$__range])) > 0",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "B",
              "expr": "sum by (client, server) (((last_over_time(traces_service_graph_request_failed_total[$__range]) - last_over_time(traces_service_graph_request_failed_total[1d] offset $__range)) >= 0) or last_over_time(traces_service_graph_request_failed_total[$__range])) or sum by (client, server) (((last_over_time(traces_service_graph_request_total[$__range]) - last_over_time(traces_service_graph_request_total[1d] offset $__range)) >= 0) or last_over_time(traces_service_graph_request_total[$__range])) * 0",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "requests",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "includeByName": {
                  "client": true,
                  "server": true,
                  "Value #A": true,
                  "Value #B": true
                },
                "indexByName": {
                  "client": 0,
                  "server": 1,
                  "Value #A": 2,
                  "Value #B": 3
                },
                "renameByName": {
                  "client": "from",
                  "server": "to",
                  "Value #A": "requests",
                  "Value #B": "failed"
                }
              }
            }
          ],
          "id": 3,
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          }
        },
        {
          "type": "row",
          "title": "Mesh traffic into kagent (Istio waypoint)",
          "id": 4,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requests per second, caller \u2192 destination",
          "description": "Every request the kagent waypoint saw, by calling and called workload.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (source_workload, destination_workload) (rate(istio_requests_total{reporter=\"waypoint\", destination_workload_namespace=\"kagent\"}[$__rate_interval]))",
              "legendFormat": "{{source_workload}} \u2192 {{destination_workload}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          }
        },
        {
          "type": "timeseries",
          "title": "p95 latency by destination",
          "description": "Agent runs are long A2A calls, so kagent-controller's p95 is a run's length.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\", destination_workload_namespace=\"kagent\"}[$__rate_interval])))",
              "legendFormat": "{{destination_workload}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          }
        },
        {
          "type": "timeseries",
          "title": "Error responses by destination and code",
          "description": "4xx and 5xx answers. A 403 at kagent-controller is the waypoint refusing a caller without a verified login.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (destination_workload, response_code) (rate(istio_requests_total{reporter=\"waypoint\", destination_workload_namespace=\"kagent\", response_code=~\"[45]..\"}[$__rate_interval]))",
              "legendFormat": "{{destination_workload}} {{response_code}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No errors"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          }
        },
        {
          "type": "table",
          "title": "Callers in the time range",
          "description": "Every caller of a kagent workload and how many requests it made.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "round(sum by (source_workload, destination_workload) (increase(istio_requests_total{reporter=\"waypoint\", destination_workload_namespace=\"kagent\"}[$__range]))) > 0",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "requests",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "includeByName": {
                  "source_workload": true,
                  "destination_workload": true,
                  "Value": true
                },
                "indexByName": {
                  "source_workload": 0,
                  "destination_workload": 1,
                  "Value": 2
                },
                "renameByName": {
                  "source_workload": "caller",
                  "destination_workload": "destination",
                  "Value": "requests"
                }
              }
            }
          ],
          "id": 8,
