              "legendFormat": "{{gen_ai_request_model}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "min": 0,
              "noValue": "0",
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 13
          }
        },
        {
          "type": "row",
          "title": "Models and tools",
          "id": 13,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Model calls per model",
          "description": "Calls per model.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (gen_ai_request_model) (((last_over_time(agent_model_calls_total[$__interval] offset -$__interval) - last_over_time(agent_model_calls_total[1h])) >= 0) or last_over_time(agent_model_calls_total[$__interval] offset -$__interval))",
              "legendFormat": "{{gen_ai_request_model}}",
              "instant": false,
              "range": true,
              "interval": "15m"
