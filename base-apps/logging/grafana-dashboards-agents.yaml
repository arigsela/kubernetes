        {
          "type": "stat",
          "title": "Evidence verified",
          "description": "Evidence links the script re-checked (commits, PRs, file lines and quotes, doc quotes, every Loki/Prometheus query re-run) out of those the agent cited.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
