              "refId": "A",
              "expr": "{namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"posted\"` | json verified, total | line_format `{{ .verified }} of {{ .total }}`",
              "legendFormat": "",
