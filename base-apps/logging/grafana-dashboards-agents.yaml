                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "max"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "transformations": [
            {
              "id": "concatenate",
              "options": {
                "frameNameMode": "drop"
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "type": "include",
                "match": "any",
                "filters": [
                  {
                    "fieldName": "operationName",
                    "config": {
                      "id": "regex",
                      "options": {
                        "value": "^invoke_agent "
