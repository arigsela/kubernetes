data:
  mcp-tool-calls.json: |
    {
      "uid": "mcp-tool-calls",
      "title": "MCP Tool Calls",
      "description": "Every tool call the agents make: the MCP adapters (allowlists, refusals, latency) and kagent-tools.",
      "tags": [
        "agents",
        "mcp",
        "agentgateway",
        "kagent"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "Agent Platform",
          "type": "link",
          "url": "/d/agent-platform",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "The landing page"
        },
        {
          "title": "Agents",
          "type": "dashboards",
          "tags": [
            "agents"
          ],
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "targetBlank": false
        },
        {
          "title": "Cluster Overview",
          "type": "link",
          "url": "/d/cluster-overview",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "MCP adapters: agent-docs-mcp, brave-search-mcp, implementer-mcp (agentgateway, \u00a7T.134)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Tool calls per minute, by tool",
          "description": "tools/call requests per server and tool, from agentgateway_mcp_requests_total. Counts refused calls too (a tool off the allowlist is counted under the name the agent asked for); see the panel on the right.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (server, resource) (rate(agentgateway_mcp_requests_total{namespace=\"kagent\", method=\"tools/call\"}[$__rate_interval])) * 60",
              "legendFormat": "{{server}} {{resource}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
