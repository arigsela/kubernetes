            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "sum by (pod) (count_over_time({namespace=\"kagent\", container=\"mcp-server\"} |= \"mcp.method.name=tools/call\" |= \"Unknown tool\" [$__interval]))",
              "legendFormat": "{{pod}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
