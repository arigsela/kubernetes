apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bug-investigation-live
  namespace: logging
  labels:
    grafana_dashboard: "1"
data:
  bug-investigation-live.json: |
    {
      "uid": "bug-investigation-live",
      "title": "Bug Investigation \u00b7 live",
      "description": "A Taskboard bug report (or a Taskboard 5xx alert), step by step, as the platform handles it: trigger, memory, the read-only agent's model and tool calls, verify, the comment, the implementer's fix PR. For a live demo: 30 minutes, refreshing every 10 s.",
      "tags": [
        "agents"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "links": [
        {
          "title": "Agent Platform",
          "type": "link",
          "url": "/d/agent-platform",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "The landing page"
        },
        {
          "title": "Agents",
          "type": "dashboards",
          "tags": [
            "agents"
          ],
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "targetBlank": false
        },
        {
          "title": "Cluster Overview",
          "type": "link",
          "url": "/d/cluster-overview",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false
        },
        {
          "title": "Agent KPIs",
          "type": "link",
          "url": "/d/agent-kpis",
          "icon": "dashboard",
          "keepTime": false,
          "targetBlank": false,
          "tooltip": "The playbook's eight agent-scenario KPIs (\u00a7T.144)"
        },
        {
          "title": "Bug Investigation \u00b7 live",
          "type": "link",
          "url": "/d/bug-investigation-live",
          "icon": "dashboard",
          "keepTime": false,
          "targetBlank": false,
          "tooltip": "A Taskboard bug report or alert, step by step, as the platform handles it (\u00a7T.149)"
        }
      ],
      "panels": [
        {
          "type": "text",
          "title": "",
          "options": {
            "mode": "markdown",
            "content": "**A Taskboard bug report, from issue to verified comment and fix pull request, as the platform runs it.** Read the journey top to bottom, left to right: the alert signal; the trigger (a CronJob, plain code, no model) picking the issue and gathering facts; its memory of verified outcomes; the read-only agent's model calls and tool calls (GitHub reads, Loki and Prometheus queries held to namespace `taskboard`); the script that verifies every evidence link before anything is posted; the fix pull request from `kagent/implementer`; the outcome remembered for the next report. Refreshes every 10 s."
          },
          "id": 1,
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "row",
          "title": "Now: the latest investigation in the time range",
          "id": 2,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Issue",
          "description": "The Taskboard issue of the trigger's latest step (its JSON lines in Loki).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "last_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} != `\"event\": \"idle\"` | json issue | __error__=\"\" | issue!=\"\" | unwrap issue [$__range]) by (app)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "-",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "prefix:#"
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 2,
            "x": 0,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Step now",
          "description": "The trigger's latest step: picked, facts gathered, memory recalled, agent answered, browser screenshots uploaded, comment posted, fix PR handed off, outcome remembered (or failed).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=\"kagent\", app=\"bug-investigator-trigger\"} != `\"event\": \"idle\"` | json event | line_format `{{ .event }}`",
              "legendFormat": "",
              "queryType": "range",
              "maxLines": 1
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "\u2014",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "alert_issue_filed": {
                      "text": "Alert filed an issue",
                      "color": "orange",
                      "index": 0
                    },
                    "investigating": {
                      "text": "Picked the issue",
                      "color": "blue",
                      "index": 1
                    },
                    "gathered": {
                      "text": "Facts gathered",
                      "color": "blue",
                      "index": 2
                    },
                    "recalled": {
                      "text": "Memory recalled",
                      "color": "blue",
                      "index": 3
                    },
                    "answered": {
                      "text": "Agent answered",
                      "color": "blue",
                      "index": 4
                    },
                    "screenshots_posted": {
                      "text": "Screenshots uploaded",
                      "color": "blue",
                      "index": 5
                    },
                    "screenshots_failed": {
                      "text": "Screenshots not uploaded",
                      "color": "orange",
                      "index": 6
                    },
                    "posted": {
                      "text": "Comment posted",
                      "color": "green",
                      "index": 7
                    },
                    "fix_handoff": {
                      "text": "Fix PR handed off",
                      "color": "green",
                      "index": 8
                    },
                    "remembered": {
                      "text": "Outcome remembered",
                      "color": "green",
                      "index": 9
                    },
                    "investigation_failed": {
                      "text": "Failed: nothing posted",
                      "color": "red",
                      "index": 10
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "/^Line$/",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 2,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Verdict",
          "description": "The verdict of the latest comment, after verify: a claim it could not re-check is dropped, and a cause left without verified evidence becomes `unclear`.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"posted\"` | json verdict | line_format `{{ .verdict }}`",
              "legendFormat": "",
