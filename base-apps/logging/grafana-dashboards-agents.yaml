          "id": 8,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 16,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Agent time",
          "description": "How long the agent took on the latest report, from the A2A request to its answer.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "last_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"answered\"` | json seconds | __error__=\"\" | seconds!=\"\" | unwrap seconds [$__range]) by (app)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "-",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "suffix: s"
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
