apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agent-quality
  namespace: logging
  labels:
    grafana_dashboard: "1"
data:
  agent-quality.json: |
    {
      "uid": "agent-quality",
      "title": "Agent Quality",
      "description": "Is each agent still good? The eval gate's scores and holds, and every agent's runs.",
      "tags": [
        "agents"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "Agent Platform",
          "type": "link",
          "url": "/d/agent-platform",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "The landing page"
        },
        {
          "title": "Agents",
          "type": "dashboards",
          "tags": [
            "agents"
          ],
          "asDropdown": true,
          "keepTime": true,
          "includeVars": false,
          "targetBlank": false
        },
        {
          "title": "Cluster Overview",
          "type": "link",
          "url": "/d/cluster-overview",
          "icon": "dashboard",
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Eval gate: scores an agent when its definition changes (last 7 days)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Agents scored",
          "description": "Agents the eval gate scored in 7 days (it skips agents whose definition did not change).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "count(count by (agent) (count_over_time({namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | pass_rate!=\"\" [7d]))) or vector(0)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Held now",
          "description": "Agents whose latest score (30 days) held their release: a regression against the baseline or a hard failure. A held agent keeps its previous version.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "sum(last_over_time({namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | pass_rate!=\"\" | label_format held_n=`{{ if eq .held \"true\" }}1{{ else }}0{{ end }}` | unwrap held_n [30d]) by (agent)) or vector(0)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Regressions",
          "description": "Scored runs whose pass rate fell below the agent's baseline.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | pass_rate!=\"\" | regression=\"true\" [7d])) or vector(0)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Scored runs with a hard failure",
          "description": "A hard failure (for example a leaked canary) holds the agent whatever its pass rate.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"kagent\", container=\"eval-gate\"} |= \"pass_rate\" != \"\\\"hard\\\": []\" [7d])) or vector(0)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          }
        },
        {
          "type": "timeseries",
          "title": "Pass rate per agent",
          "description": "Each point is one scored run (0 to 1).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "max_over_time({namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | pass_rate!=\"\" | unwrap pass_rate [$__interval]) by (agent)",
              "legendFormat": "{{agent}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No agent scored in 7 days",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "timeFrom": "7d",
          "interval": "1h",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 14,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "timeseries",
          "title": "Eval-gate runs",
          "description": "Per hour. The gate runs after every sync of kagent's agents; most agents are unchanged and skipped.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "sum by (result) (count_over_time({namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | label_format result=`{{ if .pass_rate }}scored{{ else }}unchanged, skipped{{ end }}` [$__interval]))",
              "legendFormat": "{{result}}",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "timeFrom": "7d",
          "interval": "1h",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 10,
            "x": 14,
            "y": 5
          }
        },
        {
          "type": "table",
          "title": "Scored runs",
          "description": "Newest first: pass rate against baseline, whether it held the agent, and the git revision it scored.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=\"kagent\", container=\"eval-gate\"} | json | __error__=\"\" | event=\"eval-gate\" | pass_rate!=\"\"",
              "legendFormat": "",
              "queryType": "range"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "noValue": "No agent scored in 7 days"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "time",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "includeByName": {
                  "Time": true,
                  "agent": true,
                  "pass_rate": true,
                  "baseline": true,
                  "passed": true,
                  "total": true,
                  "held": true,
                  "regression": true,
                  "judge": true,
                  "revision": true
                },
                "indexByName": {
                  "Time": 0,
                  "agent": 1,
                  "pass_rate": 2,
                  "baseline": 3,
                  "passed": 4,
                  "total": 5,
                  "held": 6,
                  "regression": 7,
                  "judge": 8,
                  "revision": 9
                },
                "renameByName": {
                  "pass_rate": "pass rate",
                  "Time": "time"
                }
              }
            }
          ],
          "timeFrom": "7d",
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 13
          }
        },
        {
          "type": "row",
          "title": "Agent runs (kagent agents)",
          "id": 9,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Runs per agent",
          "description": "Agent turns (invoke_agent spans), counted by the collector.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (service_name) (((last_over_time(agent_runs_total[$__interval] offset -$__interval) - last_over_time(agent_runs_total[1h])) >= 0) or last_over_time(agent_runs_total[$__interval] offset -$__interval))",
              "legendFormat": "{{service_name}}",
              "instant": false,
              "range": true,
              "interval": "15m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No agent runs in this time range"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 10,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          }
        },
        {
          "type": "bargauge",
          "title": "Run duration p95 per agent",
          "description": "How long an agent turn takes, model and tool calls included (Tempo, up to 24 h).",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "refId": "A",
              "queryType": "traceql",
              "query": "{name=~\"invoke_agent .*\"} | quantile_over_time(duration, .95) by (resource.service.name)",
              "filters": [],
              "metricsQueryType": "instant",
              "limit": 20,
              "tableType": "traces"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "noValue": "No agent runs in this time range",
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "transformations": [
            {
