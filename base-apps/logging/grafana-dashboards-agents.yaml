            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 2,
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "timeseries",
          "title": "Refused tool calls (not on the allowlist)",
