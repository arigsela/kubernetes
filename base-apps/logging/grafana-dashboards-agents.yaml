        {
          "type": "text",
          "title": "Where these numbers come from",
          "options": {
            "mode": "markdown",
            "content": "The KPIs are the ones the playbook [Agent-first IDP](https://platformengineering.org/blog/agent-first-idp-how-big-tech-and-the-clouds-are-preparing-platforms-for-agents) (platformengineering.org, 2026-10-16, practice 9) asks an agent platform to report instead of portal usage.\n\n- **agent-kpis** (CronJob in `postgresql`, hourly at :05, the SELECT-only audit role): how each agent task ended, how long each approval waited, how long each pull request took to merge (GitHub). Argument-free; callers as a class, never an identity.\n- **Prometheus**: model cost and runs (the collector), admission denials (the API server).\n- **Loki**: the dispatcher's alerts and verdicts, the MCP adapters' refusals.\n\nThe eval gate's own test sessions are left out of every scenario KPI; only the count of calls an adapter refused includes them, because the adapter's log does not say who asked. A rate shows a dash when nothing is behind it, and 0 % when nothing succeeded."
          },
          "id": 12,
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 12
          }
