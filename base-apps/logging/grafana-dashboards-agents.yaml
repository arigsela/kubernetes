          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No model calls in this time range"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 14,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          }
        },
        {
          "type": "bargauge",
          "title": "Model call latency p95",
          "description": "One model call, first byte to last, as the agent saw it (Tempo, up to 24 h).",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "refId": "A",
              "queryType": "traceql",
              "query": "{name=~\"generate_content .*\"} | quantile_over_time(duration, .95) by (span.gen_ai.request.model)",
              "filters": [],
              "metricsQueryType": "instant",
              "limit": 20,
              "tableType": "traces"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "noValue": "No model calls in this time range",
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "transformations": [
            {
              "id": "renameByRegex",
              "options": {
                "regex": "^\\{.*(?:service\\.name|request\\.model|tool\\.name)=\"?([^\",}]+)\"?\\}$",
                "renamePattern": "$1"
              }
            }
          ],
          "id": 15,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          }
        },
        {
          "type": "bargauge",
          "title": "Tool calls per tool",
          "description": "Tool calls the agents made, per tool.",
          "datasource": {
            "type": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (gen_ai_tool_name) (((last_over_time(agent_tool_calls_total[$__range]) - last_over_time(agent_tool_calls_total[1d] offset $__range)) >= 0) or last_over_time(agent_tool_calls_total[$__range]))",
              "legendFormat": "{{gen_ai_tool_name}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "noValue": "No tool calls in this time range",
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 16,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 30
          }
        },
        {
          "type": "bargauge",
          "title": "Tool call latency p95",
          "description": "Per tool (Tempo, up to 24 h).",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "refId": "A",
              "queryType": "traceql",
              "query": "{name=~\"execute_tool .*\" && span.gen_ai.tool.name != \"(merged tools)\"} | quantile_over_time(duration, .95) by (span.gen_ai.tool.name)",
              "filters": [],
              "metricsQueryType": "instant",
              "limit": 20,
              "tableType": "traces"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "noValue": "No tool calls in this time range",
              "color": {
                "mode": "continuous-BlPu"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "transformations": [
            {
              "id": "renameByRegex",
              "options": {
                "regex": "^\\{.*(?:service\\.name|request\\.model|tool\\.name)=\"?([^\",}]+)\"?\\}$",
                "renamePattern": "$1"
              }
            }
          ],
          "id": 17,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 30
          }
        },
        {
          "type": "table",
          "title": "Runs over 100k input tokens",
          "description": "Agent runs whose model calls read more than 100k tokens in total. Click to open the trace.",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "refId": "A",
              "queryType": "traceql",
              "query": "{name=~\"generate_content .*\"} | sum(span.gen_ai.usage.input_tokens) > 100000",
              "filters": [],
              "limit": 20,
              "spss": 3,
              "tableType": "traces"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "noValue": "No run over 100k input tokens"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": []
          },
          "transformations": [],
          "id": 18,
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 38
          }
        },
        {
          "type": "text",
          "title": "How tokens and cost are counted",
          "options": {
            "mode": "markdown",
            "content": "The collector counts every model call's tokens (`gen_ai.usage.*` on its span) before sampling, so each call counts once.\n\nCost is an **estimate** stamped on each call at Anthropic's list prices on 2026-10-06 ($ per million tokens):\n\n| model | input | cache write | cache read | output |\n|---|---|---|---|---|\n| claude-sonnet-5-5 | 2 | 2.5 | 0.2 | 10 |\n| claude-opus-5-5 | 4 | 5 | 0.2 | 20 |\n| claude-haiku-5-5 | 0.1 | 0.125 | 0.01 | 0.5 |\n\nHaiku over 100K-token prompts: 0.5 / 0.625 / 0.05 / 2.5.\n\nOnly the kagent agents are traced; docs-checker (LangGraph) sends no traces."
          },
          "id": 19,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 38
          }
        }
      ],
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "prometheus",
            "label": "Prometheus",
            "query": "prometheus",
            "hide": 2,
            "refresh": 1,
            "current": {},
            "options": [],
            "regex": ""
          }
        ]
      },
      "annotations": {
        "list": []
      }
    }
