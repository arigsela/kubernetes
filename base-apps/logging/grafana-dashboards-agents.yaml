          }
        },
        {
          "type": "logs",
          "title": "Its logs: kagent's controller, Substrate and the sandbox",
          "description": "Lines carrying this run's trace id (controller, Substrate router and egress) or its session (Substrate, the sandbox). The TaskStore UpdateTask stream and routing debug lines are left out.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "{namespace=~\"kagent|ate-system\"} |= \"${trace_id}\" or \"session-${session}\" |~ `(?:trace_id\":\"|trace\\.id=|trace_id=)0{0,31}${trace_id}(?:[^0-9a-f]|$)|session-${session}(?:[^0-9a-f-]|$)` != \"TaskStoreService/UpdateTask\" != \"request before normalization\" != \"request after normalization\" | line_format `{{ regexReplaceAll \"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}\" __line__ \"<email>\" }}`",
              "legendFormat": "",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "prettifyLogMessage": false
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "No agent run in the last 2 days: run scripts/agent-demo.sh"
            },
            "overrides": []
          },
          "id": 22,
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 44
          }
        }
      ],
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "prometheus",
            "label": "Prometheus",
            "query": "prometheus",
            "hide": 2,
            "refresh": 1,
            "current": {},
            "options": [],
            "regex": ""
          },
          {
            "type": "query",
            "name": "trace_id",
            "label": "Run",
            "datasource": {
              "type": "prometheus"
            },
            "query": {
              "query": "query_result(sort_desc(topk(20, max by (service_name, trace_id) (agent_run_start_seconds))))",
              "refId": "trace_id"
            },
            "definition": "query_result(sort_desc(topk(20, max by (service_name, trace_id) (agent_run_start_seconds))))",
            "regex": "/service_name=\"(?<text>[^\"]+)\".*trace_id=\"0*(?<value>[0-9a-f]{1,32})\"/",
            "refresh": 1,
            "sort": 0,
            "includeAll": false,
            "multi": false,
            "allowCustomValue": true,
            "current": {},
            "options": [],
            "hide": 0,
            "description": "The newest agent runs of the last 2 days, newest first (agent_run_start_seconds). Read when the page loads."
          },
          {
            "type": "query",
            "name": "session",
            "label": "Session",
            "datasource": {
              "type": "prometheus"
            },
            "query": {
              "query": "query_result(max by (gen_ai_conversation_id) (last_over_time(agent_run_start_seconds{trace_id=~\"0*$trace_id\"}[2d])))",
              "refId": "session"
            },
            "definition": "query_result(max by (gen_ai_conversation_id) (last_over_time(agent_run_start_seconds{trace_id=~\"0*$trace_id\"}[2d])))",
            "regex": "/gen_ai_conversation_id=\"([^\"]+)\"/",
            "refresh": 2,
            "sort": 0,
            "includeAll": false,
            "multi": false,
            "current": {},
            "options": [],
            "hide": 2
          }
        ]
      },
      "annotations": {
        "list": []
      }
    }
