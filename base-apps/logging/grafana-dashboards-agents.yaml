          }
        },
        {
          "type": "stat",
          "title": "Tool calls",
          "description": "Tool calls the agent made for the latest report: GitHub reads and Loki/Prometheus queries; read-only, with no credential in its sandbox.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "last_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"answered\"` | json tool_calls | __error__=\"\" | tool_calls!=\"\" | unwrap tool_calls [$__range]) by (app)",
              "legendFormat": "",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "-",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "vertical",
            "wideLayout": true
          },
          "id": 10,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 4
          }
        },
        {
          "type": "row",
          "title": "The journey: each lane lights up in the 30 s its stage happens",
          "id": 11,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Journey",
          "description": "One lane per stage, top to bottom in the order a report travels; a lane is coloured in each 30 s its stage happened. Trigger stages: its JSON step lines (Loki). Agent and implementer calls: the collector's per-agent counters (agent_model_calls_total, agent_tool_calls_total); the browser lane counts replay_ui_steps calls. Alert signal: Taskboard's 5xx counter, the trigger's alert expression. Refused tool call: an MCP adapter's `Unknown tool` (a tool off its allowlist); a Loki/Prometheus query outside namespace taskboard comes back to the agent as a tool error instead (`ok: false` in the trigger's AGENT line). The agent lanes also show the eval gate's test sessions, and the implementer lane its work for other callers, such as resource alerts.",
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "refId": "A",
              "expr": "sum(rate(taskboard_http_requests_total{namespace=\"taskboard\", status=~\"5..\"}[$__rate_interval])) * 60",
              "legendFormat": "Alert signal: Taskboard 5xx",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "B",
              "expr": "sum(count_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"alert_issue_filed\"` [$__interval])) or vector(0)",
              "legendFormat": "Alert check files an issue",
              "queryType": "range"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "C",
              "expr": "sum(count_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"investigating\"` [$__interval])) or vector(0)",
              "legendFormat": "Trigger picks the issue",
              "queryType": "range"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "D",
              "expr": "sum(count_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"gathered\"` [$__interval])) or vector(0)",
              "legendFormat": "Gather facts: PRs, deploys, docs",
              "queryType": "range"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "E",
              "expr": "sum(count_over_time({namespace=\"kagent\", app=\"bug-investigator-trigger\"} |= `\"event\": \"recalled\"` [$__interval])) or vector(0)",
              "legendFormat": "Recall verified outcomes",
              "queryType": "range"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "refId": "F",
              "expr": "sum by () (((last_over_time(agent_model_calls_total{service_name=\"bug-investigator\"}[$__interval] offset -$__interval) - last_over_time(agent_model_calls_total{service_name=\"bug-investigator\"}[1h])) >= 0) or last_over_time(agent_model_calls_total{service_name=\"bug-investigator\"}[$__interval] offset -$__interval))",
              "legendFormat": "Agent: model calls",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
              },
              "refId": "G",
              "expr": "sum by () (((last_over_time(agent_tool_calls_total{service_name=\"bug-investigator\", gen_ai_tool_name=~\"get_file_contents|search_code|list_commits|get_commit|list_pull_requests|pull_request_read\"}[$__interval] offset -$__interval) - last_over_time(agent_tool_calls_total{service_name=\"bug-investigator\", gen_ai_tool_name=~\"get_file_contents|search_code|list_commits|get_commit|list_pull_requests|pull_request_read\"}[1h])) >= 0) or last_over_time(agent_tool_calls_total{service_name=\"bug-investigator\", gen_ai_tool_name=~\"get_file_contents|search_code|list_commits|get_commit|list_pull_requests|pull_request_read\"}[$__interval] offset -$__interval))",
              "legendFormat": "Agent: GitHub reads",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${prometheus}"
