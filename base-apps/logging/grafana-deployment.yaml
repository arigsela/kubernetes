apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: logging
  annotations:
    # local-path reclaims Delete, so an Argo prune of this PVC destroys the data
    # with it (SPEC.md §V.19). Opt out of pruning — removing this volume must be a
    # deliberate act, not a side effect of a manifest rename or a failed render.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: logging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Loki for logs
      - name: Loki
        type: loki
        # Explicit uid: Grafana alert rules reference a datasource BY UID, and an
        # auto-generated uid is not stable across a re-provision. Safe to pin — no
        # provisioned dashboard references a datasource uid (the only uid in the
        # dashboard JSON is the dashboard's own, `istio-ambient-mesh`).
        uid: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
        editable: true

      # Prometheus for metrics
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.logging.svc.cluster.local:9090
        jsonData:
          timeInterval: "15s"
          queryTimeout: "60s"
          httpMethod: POST
        editable: true
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: logging
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        # Exclude Grafana storage from Velero backup - SQLite journal files cause backup failures
        # Dashboards are provisioned from ConfigMaps, so no data loss
        backup.velero.io/backup-volumes-excludes: storage
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: grafana/grafana:11.3.9
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # Sourced from Vault (k8s-secrets/grafana) via the grafana-admin
        # ExternalSecret — no longer hardcoded. See grafana-admin-external-secret.yaml.
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        # Must be the public URL: Grafana derives the OAuth redirect_uri from
        # this. Left at localhost:3000 the GitHub round-trip breaks before it
        # starts. See SPEC.md §T.59.
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.arigsela.com"
        - name: GF_INSTALL_PLUGINS
          value: ""
        # GitHub OAuth. Direct to github.com rather than via dex: dex's
        # staticClients do not filter identities, so that route needs this same
        # role_attribute_path anyway AND would require making dex.arigsela.com
        # publicly reachable. See SPEC.md §V.68.
        #
        # TWO fail-closed gates, both required — SPEC.md §V.69:
        #   ROLE_ATTRIBUTE_STRICT=true  -> a login matching no role is DENIED.
        #     Without it the default is false and non-matching users are let in
        #     with the default org role. This host has no IP allow-list, so that
        #     would expose dashboards to every GitHub account in existence.
        #   ALLOW_SIGN_UP=false         -> only users already in grafana.db may
        #     log in, independent of the JMESPath being correct.
        # Replace both with allowed_organizations once a GitHub org exists (§T.61).
        - name: GF_AUTH_GITHUB_ENABLED
          value: "true"
        # Bootstrap complete -- user arigsela is linked (isExternal=true,
        # authLabels=[GitHub]), so closing this no longer locks anyone out.
        #
        # This gate can only ever be closed AFTER a link exists, never before:
        # Grafana 11 links an OAuth identity by auth_module+auth_id, created BY
        # signup, and oauth_allow_insecure_email_lookup is false by default so
        # pre-creating a user by email cannot link either. SPEC.md §B.10.
        #
        # Adding a future user therefore means flipping this true, letting them
        # log in once, and flipping it back.
        - name: GF_AUTH_GITHUB_ALLOW_SIGN_UP
          value: "false"
        - name: GF_AUTH_GITHUB_SCOPES
          value: "user:email,read:org"
        - name: GF_AUTH_GITHUB_AUTH_URL
          value: "https://github.com/login/oauth/authorize"
        - name: GF_AUTH_GITHUB_TOKEN_URL
          value: "https://github.com/login/oauth/access_token"
        - name: GF_AUTH_GITHUB_API_URL
          value: "https://api.github.com/user"
        - name: GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH
          value: "login == 'arigsela' && 'Admin' || ''"
        - name: GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT
          value: "true"
        - name: GF_AUTH_GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-github-oauth
              key: client-id
        - name: GF_AUTH_GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-github-oauth
              key: client-secret
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards/k8s
        - name: dashboards-istio
          mountPath: /var/lib/grafana/dashboards/istio
        # Grafana unified alerting: contact point, notification policy, alert rules.
        # Grafana reads this at startup like any other provisioning dir. A malformed
        # file here makes Grafana FAIL TO START — validate before merging. See
        # base-apps/logging/grafana-alerting.yaml.
        - name: alerting
          mountPath: /etc/grafana/provisioning/alerting
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboard-k8s-basic
      - name: dashboards-istio
        configMap:
          name: grafana-dashboard-istio-ambient
      - name: alerting
        configMap:
          name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: logging
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
