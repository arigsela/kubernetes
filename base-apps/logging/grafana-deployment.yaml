apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: logging
  annotations:
    # local-path reclaims Delete, so an Argo prune of this PVC destroys the data
    # with it (SPEC.md §V.19). Opt out of pruning — removing this volume must be a
    # deliberate act, not a side effect of a manifest rename or a failed render.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: logging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Loki for logs
      - name: Loki
        type: loki
        # Explicit uid: Grafana alert rules reference a datasource BY UID, and an
        # auto-generated uid is not stable across a re-provision. This pin is now
        # load-bearing for a provisioned dashboard too, not just alert rules: the
        # Coraza WAF dashboard (base-apps/logging/grafana-dashboard-coraza.yaml)
        # references `uid: loki` directly in five panel queries, so renaming or
        # dropping this uid would break those queries, not just alerting.
        uid: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
          # Logs to trace (beacon §T.18): a line carrying a 32-hex trace id gets a link to that
          # trace in Tempo. Three shapes: `trace_id=<id>` (beacon's services, beacon §T.43),
          # `"trace_id":"<id>"` (kagent's controller, JSON) and `trace.id=<id>` (agentgateway: the
          # MCP adapters and Substrate's router and egress). `$$` is the provisioning escape for a
          # literal `$`.
          derivedFields:
            - name: TraceID
              matcherRegex: '(?:trace_id=|"trace_id":"|trace\.id=)([0-9a-f]{32})'
              datasourceUid: tempo
              url: "$${__value.raw}"
        editable: true

      # Prometheus for metrics
      - name: Prometheus
        type: prometheus
        # Pinned to the uid Grafana derived from this name when it was first
        # provisioned without one, so pinning is a no-op. It is load-bearing: the
        # cluster-health alert rules (grafana-alerting.yaml) and two UI-created
        # dashboards ("K3S Monitoring", "Istio Workload Dashboard") reference it.
        uid: PBFA97CFB590B2093
        access: proxy
        url: http://prometheus.logging.svc.cluster.local:9090
        jsonData:
          timeInterval: "15s"
          queryTimeout: "60s"
          httpMethod: POST
        editable: true
        isDefault: true

      # Tempo for traces (beacon §T.18, base-apps/tracing/). Trace to logs: Loki lines in any
      # namespace that contain the trace id, five minutes either side of the span. Not by the
      # span's service: an agent's service name (homelab-knowledge) is no pod's `app` label, and
      # one agent run logs from kagent's controller and from Substrate (ate-system).
      # Service graph: the collector's traces_service_graph_* metrics in Prometheus (the Agent
      # Traffic dashboard and Tempo's service map in Explore).
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.tracing.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: '{namespace=~".+"} |= "$${__trace.traceId}"'
          serviceMap:
            datasourceUid: PBFA97CFB590B2093
          nodeGraph:
            enabled: true
        editable: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: logging
  labels:
    app: grafana
spec:
  replicas: 1
  # Recreate, not RollingUpdate: Grafana's state is SQLite on an RWO local-path
  # volume, and a rolling update briefly runs two Grafana processes on the same
  # database file. A rollout now costs ~20s of Grafana downtime instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        # Exclude Grafana storage from Velero backup - SQLite journal files cause backup failures
        # Dashboards are provisioned from ConfigMaps, so no data loss
        backup.velero.io/backup-volumes-excludes: storage
        # Grafana reads alerting provisioning only at startup, so a rule change in
        # grafana-alerting.yaml must restart it. sha256 of that ConfigMap's `data`
        # (json.dumps, sort_keys); tests/dashboards/test_grafana_alerting.py fails if
        # it is stale. Before this, rule changes needed a manual rollout restart.
        checksum/alerting: 95ab24605ce2a847e3022273f8c4a8aa149ab5ca4cbea9972f286b72cba4ab31
        # Same for datasource provisioning (grafana-datasources above), also read only at
        # startup; tests/dashboards/test_grafana_datasources.py fails if it is stale.
        checksum/datasources: 64923f43fb1a8a053d8ffd05c9431fb4f746d9de4ab2ad3a2bad2558b044ac82
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # Sourced from Vault (k8s-secrets/grafana) via the grafana-admin
        # ExternalSecret — no longer hardcoded. See grafana-admin-external-secret.yaml.
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        # Must be the public URL: Grafana derives the OAuth redirect_uri from
        # this. Left at localhost:3000 the GitHub round-trip breaks before it
        # starts. See SPEC.md §T.59.
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.arigsela.com"
        - name: GF_INSTALL_PLUGINS
          value: ""
        # Grafana opens on the Agent Platform dashboard (§T.135) for anyone without a home
        # dashboard of their own set in their profile or org preferences.
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /var/lib/grafana/dashboards/agents/agent-platform.json
        # GitHub OAuth. Direct to github.com rather than via dex: dex's
        # staticClients do not filter identities, so that route needs this same
        # role_attribute_path anyway AND would require making dex.arigsela.com
        # publicly reachable. See SPEC.md §V.68.
        #
        # TWO fail-closed gates, both required — SPEC.md §V.69:
        #   ROLE_ATTRIBUTE_STRICT=true  -> a login matching no role is DENIED.
        #     Without it the default is false and non-matching users are let in
        #     with the default org role. This host has no IP allow-list, so that
        #     would expose dashboards to every GitHub account in existence.
        #   ALLOW_SIGN_UP=false         -> only users already in grafana.db may
        #     log in, independent of the JMESPath being correct.
        # Replace both with allowed_organizations once a GitHub org exists (§T.61).
        # GitHub OAuth is now the ONLY way in. Both of these are required:
        # disable_login_form alone merely HIDES the UI form, while auth.basic
        # keeps /api/* accepting username and password - so the credential
        # surface would remain fully reachable from the internet and the change
        # would look complete while changing nothing.
        #
        # Held back until T62 proved role_attribute_strict actually denies:
        # inverting role_attribute_path produced a refused login with
        # [oauth.role_attribute_strict_violation] and zero Successful Login
        # events. Removing break-glass before that was verified would have risked
        # locking everyone out of an internet-facing host.
        #
        # Recovery if OAuth breaks: revert this commit, Argo re-syncs in ~2min.
        # kubectl works throughout regardless.
        #
        # NB this ends admin API access by username/password. Anything scripted
        # against Grafana's API needs a service account token instead.
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: "true"
        - name: GF_AUTH_BASIC_ENABLED
          value: "false"
        - name: GF_AUTH_GITHUB_ENABLED
          value: "true"
        # Bootstrap complete -- user arigsela is linked (isExternal=true,
        # authLabels=[GitHub]), so closing this no longer locks anyone out.
        #
        # This gate can only ever be closed AFTER a link exists, never before:
        # Grafana 11 links an OAuth identity by auth_module+auth_id, created BY
        # signup, and oauth_allow_insecure_email_lookup is false by default so
        # pre-creating a user by email cannot link either. SPEC.md §B.10.
        #
        # Adding a future user therefore means flipping this true, letting them
        # log in once, and flipping it back.
        - name: GF_AUTH_GITHUB_ALLOW_SIGN_UP
          value: "false"
        - name: GF_AUTH_GITHUB_SCOPES
          value: "user:email,read:org"
        - name: GF_AUTH_GITHUB_AUTH_URL
          value: "https://github.com/login/oauth/authorize"
        - name: GF_AUTH_GITHUB_TOKEN_URL
          value: "https://github.com/login/oauth/access_token"
        - name: GF_AUTH_GITHUB_API_URL
          value: "https://api.github.com/user"
        # Gate 1 PROVEN 2026-07-30 (SPEC.md §T.62). With this expression inverted
        # to a login that cannot match, a GitHub login was refused with
        # [oauth.role_attribute_strict_violation] and zero Successful Login
        # events -- role_attribute_strict=true genuinely denies a login that
        # resolves to no role. Do not weaken either of these two lines.
        - name: GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH
          value: "login == 'arigsela' && 'Admin' || ''"
        - name: GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT
          value: "true"
        - name: GF_AUTH_GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: grafana-github-oauth
              key: client-id
        - name: GF_AUTH_GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-github-oauth
              key: client-secret
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards/k8s
        - name: dashboards-istio
          mountPath: /var/lib/grafana/dashboards/istio
        - name: dashboards-coraza
          mountPath: /var/lib/grafana/dashboards/coraza
        - name: dashboards-agents
          mountPath: /var/lib/grafana/dashboards/agents
        # Grafana unified alerting: contact point, notification policy, alert rules.
        # Grafana reads this at startup like any other provisioning dir. A malformed
        # file here makes Grafana FAIL TO START — validate before merging. See
        # base-apps/logging/grafana-alerting.yaml.
        - name: alerting
          mountPath: /etc/grafana/provisioning/alerting
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboard-k8s-basic
      - name: dashboards-istio
        configMap:
          name: grafana-dashboard-istio-ambient
      - name: dashboards-coraza
        configMap:
          name: grafana-dashboard-coraza
      # The Agents folder: one ConfigMap per dashboard, all generated by
      # scripts/gen-agent-dashboards.py into grafana-dashboards-agents.yaml (§T.135).
      - name: dashboards-agents
        projected:
          sources:
          - configMap:
              name: grafana-dashboard-agent-platform
          - configMap:
              name: grafana-dashboard-agent-quality
          - configMap:
              name: grafana-dashboard-agent-tokens
          - configMap:
              name: grafana-dashboard-agent-traffic
          - configMap:
              name: grafana-dashboard-agent-sandboxes
          - configMap:
              name: grafana-dashboard-agent-alerts
          - configMap:
              name: grafana-dashboard-mcp
          - configMap:
              name: grafana-dashboard-model-gateway
          - configMap:
              name: grafana-dashboard-agent-kpis
      - name: alerting
        configMap:
          name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: logging
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
