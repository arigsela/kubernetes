apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-nginx
  namespace: logging
  annotations:
    # Reachable from anywhere by design -- dashboards are read from mobile, and
    # carrier IPs cannot be allow-listed. Access control is GitHub OAuth with
    # two fail-closed gates, both verified by observation 2026-07-30:
    # role_attribute_strict=true and allow_sign_up=false. SPEC.md V69 / T62.
    arigsela.com/public-by-design: "github-oauth"
    cert-manager.io/cluster-issuer: letsencrypt-route53
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - grafana.arigsela.com
    secretName: grafana-tls
  rules:
  - host: grafana.arigsela.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
