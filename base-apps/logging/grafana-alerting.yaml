---
# Grafana unified alerting (Observability O3) — the sink that was missing.
#
# WHY GRAFANA AND NOT ALERTMANAGER
#
# The obvious move was "deploy Alertmanager". It is the wrong tool here. Alertmanager
# fires on PROMETHEUS METRICS, and both things we need to alert on are LOGS:
#
#   * the agent-audit CronJob emits a JSON finding line  (O2)
#   * Falco emits JSON detections                        (O3, once it actually fires)
#
# Wiring those to Alertmanager would mean inventing a metrics pipeline — a
# Pushgateway, or an exporter — purely to carry a signal that ALREADY LANDS IN LOKI
# via Alloy. Grafana 11.3 has a full alerting engine, already runs here, and already
# has the Loki datasource. It queries logs natively. So the alert engine is the thing
# we already have, and the new component count is zero.
#
# DELIVERY
#
# Grafana POSTs to an n8n webhook, and n8n fans out to wherever you want — Slack,
# email, phone push — changeable later without touching the cluster.
#
#   The receiving workflow is GitOps-managed since 2026-07-15:
#   base-apps/n8n/workflows-configmap.yaml defines it (Webhook node on path
#   `grafana-alerts` → Slack #oncall-alerts) and base-apps/n8n/import-workflows-job.yaml
#   imports and activates it on every n8n app sync. If the workflow is ever
#   missing or inactive, Grafana's notifications 404 — the alert rules still
#   evaluate and are visible in Grafana's UI, but nothing will reach you.
#
# WHAT IS DELIBERATELY NOT SENT
#
# The agent-audit alert carries the CronJob's --summary payload: counts, agent names,
# tool names. It carries NO tool arguments, because argument redaction is only
# best-effort and this payload leaves the cluster. To see what a flagged agent
# actually ran, you go and look — behind the SELECT-only credential. See
# scripts/agent-audit.py (its module docstring holds the redaction rationale).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: logging
  labels:
    app: grafana
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: n8n
        receivers:
          - uid: n8n-webhook
            type: webhook
            settings:
              # In-cluster: no ingress, no TLS, no auth to manage. n8n decides where
              # this actually goes.
              url: http://n8n.n8n.svc.cluster.local:5678/webhook/grafana-alerts
              httpMethod: POST
            disableResolveMessage: false
          # Second copy to the dispatcher (base-apps/dispatcher/), which may add an agent
          # investigation by its table. A separate integration on purpose (§V.86): Grafana
          # delivers to both, so the dispatcher being down never costs a Slack alert.
          - uid: dispatcher-webhook
            type: webhook
            settings:
              url: http://dispatcher.dispatcher.svc.cluster.local:8080/signal/grafana
              httpMethod: POST
            disableResolveMessage: false

  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: n8n
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        # Do not nag every 4h (Grafana's default) for a finding that is a historical
        # fact — a stripped gate stays stripped until someone fixes it.
        repeat_interval: 24h

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: agent-guardrails
        folder: Agent Guardrails
        interval: 5m
        rules:
          # ------------------------------------------------------------------
          # The alert this whole pillar exists for.
          #
          # A write/destructive tool invoked with NO approval request in its session.
          # That is not hypothetical: k8s-agent executed arbitrary shell commands
          # inside the VAULT POD, reading /vault/data, 14 times on 2026-07-09, with
          # no human approval — because Argo was silently stripping requireApproval
          # on every sync. Nobody saw it for months because nothing looked.
          - uid: agent-ungated-tool
            title: Agent invoked a gated tool with NO approval
            condition: threshold
            for: 0m
            annotations:
              summary: >-
                An agent invoked a write/destructive tool without an approval, or
                the daily audit could not read the record, or it did not run at all.
                The first is what a silently-stripped requireApproval gate looks
                like; the other two mean the gate is unwatched.
              runbook: >-
                No summary line in 26h (the alert shows no data): the
                agent-audit-ungated CronJob did not run or crashed before printing
                (`kubectl get jobs -n postgresql -l app=agent-audit`, then its pod
                log). A line with `problems` set: it ran but could not read kagent's
                record (undecodable events, or no tool call recognised: the event
                shape changed after a kagent bump; see scripts/agent-audit.py,
                "kagent 1.0: the record"). Otherwise it is a finding: run
                `scripts/agent-audit.py --ungated` against the kagent_v1 database
                (SELECT-only role; `--source v010` for the 0.10 archive): it lists
                every finding, its gate outcome, and marks the triaged ones in
                scripts/agent-audit-acknowledged.yaml `ack`, so the unmarked rows
                are what fired this alert. The alert covers all history except those
                acknowledged calls. Or open https://agent-audit.arigsela.com/?days=730
                (Findings, the longest window; it still lists acknowledged calls)
                and click a finding to see its session - which agent, which tool,
                and with what (redacted) arguments, in order. Arguments are
                deliberately absent from this alert. After triage and a fix,
                acknowledge the session in that file, or move its `through` forward
                if the session is already listed.
            labels:
              severity: critical
              pillar: security
            # Fail closed. The query below returns a value whenever the daily summary
            # line exists (1 = warning, 0 = ok), so "no data" can only mean the audit
            # did not run or died before printing - and a check that did not run must
            # not look healthy. (With the old count-of-warnings query, no data was the
            # healthy case, which is why this used to be OK.)
            noDataState: Alerting
            # Error, not KeepLast: if the rule itself cannot evaluate (Loki down),
            # Grafana raises a DatasourceError alert through the same n8n route. For a
            # security rule that is wanted; see the capacity rules for the opposite.
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 93600
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
                  # Parse the JSON, do not substring-match it. The summary is
                  # emitted by json.dumps, which writes `"severity": "warning"` WITH
                  # a space after the colon — a `|= "\"severity\":\"warning\""`
                  # line filter (no space) never matches, so the first version of
                  # this rule could not fire. Verified against live Loki: the line
                  # filter returns 0, `| json | severity="warning"` returns 1.
                  #
                  # Every summary line becomes a sample (1 if severity is warning,
                  # else 0) and the max over 26h is the answer: the CronJob runs daily
                  # at 07:00, so 26h always holds the latest run plus two hours of
                  # slack for a slow pip install. Lines that are not JSON (a
                  # traceback) are dropped by __error__="". app="agent-audit" only:
                  # the on-demand archive job logs as app=agent-audit-archive.
                  # Checked against Loki 3.7.8 (the cluster's): ok line 0, warning
                  # line 1, no line in 26h no data.
                  expr: >-
                    max(max_over_time({namespace="postgresql", app="agent-audit"}
                    |= "agent-audit-ungated" | json check="check", severity="severity"
                    | check="agent-audit-ungated"
                    | label_format warning=`{{ if eq .severity "warning" }}1{{ else }}0{{ end }}`
                    | unwrap warning | __error__="" [26h]))
              - refId: threshold
                relativeTimeRange:
                  from: 93600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0

          - uid: agent-audit-risk-high
            title: Agent session scored high risk
            condition: threshold
            for: 0m
            annotations:
              summary: >-
                agent-audit-risk scored at least one kagent session `high` in the last
                day: Secrets touched, changes beyond one namespace, something a revert
                does not undo, or actions outside one coherent task. Every call may
                have been approved; this is about what the session did, not whether
                the gate fired. It also fires when Jev could not be reached (jev_errors
                above 0 in the summary line), and when the daily risk run printed no
                summary at all in 26h, because a check that did not run must not look
                healthy.
              runbook: >-
                No summary line in 26h (the alert shows no data): the agent-audit-risk
                CronJob did not run or failed before scoring (`kubectl get jobs -n
                postgresql -l app=agent-audit`, then its pod log; a database read
                error means the export step failed). The summary line names the agent,
                session id and the flags that fired (never arguments). Open
                https://agent-audit.arigsela.com/risk for the high and review sessions
                with their flags and Jev's reasons, then the session link for the
                ordered calls (or `scripts/agent-audit.py --agent <agent> --format
                json` behind the SELECT-only credential and filter on the session id).
                A `review` verdict (low Jev confidence, a Jev error or the per-run cap)
                does not fire this rule but is listed on /risk. If no session is high,
                read jev_errors in the summary line first.
            labels:
              severity: warning
              pillar: security
            # Fail closed, as agent-ungated-tool above: the query returns 0/1 whenever
            # the daily summary line exists, so no data means the run did not happen.
            noDataState: Alerting
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 93600
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
                  # Same shape as the ungated rule: parse the JSON, never substring-
                  # match it (json.dumps writes `"severity": "warning"` with a space),
                  # one 0/1 sample per summary line, max over 26h (the CronJob runs
                  # daily at 02:30).
                  expr: >-
                    max(max_over_time({namespace="postgresql", app="agent-audit"}
                    |= "agent-audit-risk" | json check="check", severity="severity"
                    | check="agent-audit-risk"
                    | label_format warning=`{{ if eq .severity "warning" }}1{{ else }}0{{ end }}`
                    | unwrap warning | __error__="" [26h]))
              - refId: threshold
                relativeTimeRange:
                  from: 93600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0

          - uid: agent-eval-regression
            title: Agent eval regression
            condition: threshold
            for: 0m
            annotations:
              summary: >-
                The evaluation gate scored an agent below its baseline, or a security-refusal
                question failed, after a sync changed the agent's definition. The log line
                names the agent, the synced revision, the judge used and the failed corpus ids.
              runbook: >-
                `kubectl -n kagent logs job/eval-gate` for the line; the failed ids are in
                tests/eval-corpus/<agent>.yaml. The revision is the commit to read (`git show`).
                A flaky question: sync the kagent-secrets app again (`argocd app sync
                kagent-secrets`); two regressions on the same hash are the signal, one is a
                notice. judge=none means no API key in the eval-gate Secret: the rubric alone
                decided (scripts/provision-eval-gate-vault.sh). To reset a baseline, delete
                the agent's key from ConfigMap eval-gate-state (base-apps/kagent/runbook.md).
            labels:
              severity: warning
              pillar: evaluation
            # Not fail-closed: the gate runs only when an agent changed, so no data is normal.
            noDataState: OK
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
                  expr: >-
                    sum(count_over_time({namespace="kagent", app="eval-gate"}
                    | json event="event", regression="regression"
                    | event="eval-gate" | regression="true" [1h]))
              - refId: threshold
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0

          - uid: substrate-certificate-expired
            title: Substrate pod certificate expired
            condition: threshold
            for: 0m
            annotations:
              summary: >-
                atenet-router logged "CertificateExpired": a Substrate pod certificate (24 h,
                refreshed by the kubelet but not reloaded by the agentgateway in the router and
                egress pods) ran out. Every new agent session fails with -32004 until the pods
                are restarted. The substrate-cert-restart CronJob should prevent this (SPEC T114).
              runbook: >-
                `kubectl -n ate-system rollout restart deployment/atenet-router
                deployment/atenet-egress`, then `kubectl -n kagent get agents` all Ready and one
                `scripts/ask-hk`. Check `kubectl -n ate-system get cronjob substrate-cert-restart`
                ran (`get jobs`); base-apps/substrate/runbook.md.
            labels:
              severity: critical
              pillar: agents
            # Not fail-closed: the line only exists when the failure happens.
            noDataState: OK
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
                  expr: >-
                    sum(count_over_time({namespace="ate-system", app="atenet-router"}
                    |= "CertificateExpired" [15m]))
              - refId: threshold
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0

          # ------------------------------------------------------------------
          # Falco. Note this alerts on SPECIFIC rule names, not on "any Falco line".
          # With priority now at `notice`, "Terminal shell in container" fires on
          # every kubectl exec and would be pure noise as a blanket alert.
          - uid: falco-sensitive-detection
            title: Falco detected a sensitive-file read or unexpected API access
            condition: threshold
            for: 0m
            annotations:
              summary: >-
                Falco fired a high-signal rule. Until 2026-07-14 Falco emitted NOTHING
                at all — its output threshold (priority: warning) silently discarded
                the NOTICE-level rules it was configured with. If this alert never
                fires again, suspect the threshold before assuming the cluster is calm.
              runbook: >-
                kubectl logs -n falco -l app.kubernetes.io/name=falco --all-containers
                | grep '"priority"'
            labels:
              severity: warning
              pillar: security
            noDataState: OK
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
                  # Same fix: parse the JSON and match the `rule` field, rather
                  # than substring-matching the rendered line. `|= "priority"` is
                  # kept only as a cheap pre-filter to skip Falco's non-JSON startup
                  # noise before `| json`.
                  #
                  # "Contact K8S API Server From Container" is excluded for the
                  # controllers that talk to the API *by design* — argo-cd (GitOps
                  # reconcile), backstage (catalog ingestor)
                  # manager), kagent (its k8s agents). They emit thousands of these
                  # events/hour and kept this alert permanently firing on benign
                  # control-plane traffic, which is just alert fatigue. The exclusion
                  # binds ONLY to that rule: LogQL groups `and` tighter than `or`, so
                  # this reads `Read-sensitive-file  OR  (Contact-API AND ns-not-a-
                  # controller)`. So a sensitive-file read STILL alerts from any
                  # namespace (incl. these four, where it matters most), and an
                  # *unexpected* container contacting the API STILL alerts — only the
                  # known controllers are silenced. Verified against live Loki: the
                  # 2658-events/h baseline drops to 0, and the sensitive-file clause
                  # is provably unaffected by the namespace filter.
                  #
                  # Agent Substrate (kagent 1.0's runtime, base-apps/substrate.yaml) adds two
                  # more controller namespaces, by design API clients: ate-system
                  # (ate-api-server, ate-controller and every atelet watch pods, WorkerPools
                  # and ClusterTrustBundles; the credential provider reads Secrets) and
                  # podcertificate-controller-system (signs PodCertificateRequests). Substrate's
                  # sandboxed worker pods run in `kagent`, already listed. Not yet measured
                  # against live Loki: Substrate is not installed when this lands.
                  #
                  # argo-workflows is deliberately NOT in that namespace list. The
                  # Argo server has no login, so anyone who reaches it can run a
                  # workflow there with cluster-wide pod read: an unexpected API
                  # call from that namespace is what this alert is for. Instead
                  # three clauses each drop one known caller, pinned to its binary
                  # (LogQL has no `not`, so each is written as its De Morgan form):
                  #   - argoexec in Argo's own wait/init containers, which every
                  #     step pod uses to report its result (about 80 per image scan);
                  #   - the workflow controller;
                  #   - image-scan's discover step, which lists pods by design.
                  # Before this, every weekly image scan fired the alert: 104 events
                  # on 2026-10-04, all of them these three. Checked against live
                  # Loki on 2026-10-05: that window drops to 0, and the
                  # sensitive-file clause still matches everything it did.
                  expr: >-
                    sum(count_over_time({namespace="falco"} |= "priority" | json
                    | (rule="Read sensitive file untrusted"
                    or rule="Contact K8S API Server From Container"
                    and output_fields_k8s_ns_name!~"argo-cd|backstage|kagent|ate-system|podcertificate-controller-system"
                    and (output_fields_k8s_ns_name!="argo-workflows"
                    or output_fields_container_name!~"wait|init"
                    or output_fields_proc_exepath!="/usr/bin/argoexec")
                    and (output_fields_k8s_ns_name!="argo-workflows"
                    or output_fields_proc_exepath!="/usr/bin/workflow-controller")
                    and (output_fields_k8s_ns_name!="argo-workflows"
                    or output_fields_k8s_pod_name!~"image-scan-[a-z0-9]+-discover-images-[0-9]+"
                    or output_fields_proc_name!="python3"))
                    [1h]))
              - refId: threshold
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0

      # ----------------------------------------------------------------------
      # Cluster health, from Prometheus (docs/plans/k8s-136-features-implementation-plan.md,
      # Phase 1). These catch the two capacity failures that were invisible until the
      # per-pod pressure panels existed: a pod starved of CPU by its own limit, and a
      # container about to be OOM-killed. Both fire per pod (one alert per series).
      #
      # datasourceUid PBFA97CFB590B2093 is the Prometheus datasource's uid, pinned in
      # grafana-deployment.yaml. It is the uid Grafana derived from the name
      # "Prometheus" when the datasource was first provisioned without one; UI-created
      # dashboards reference it, so it must not be renamed.
      - orgId: 1
        name: cluster-health
        folder: Cluster Health
        interval: 1m
        rules:
          # Backstage sat at ~23-24% CPU stall and ~61% CFS throttling on 2026-09-25: its
          # CPU limit, not the node, was the bottleneck. Nothing alerted. Threshold 20%
          # (not the planned 25%) because 25% sat just above that clearly-starved pod;
          # the next-highest pods (coroot node agents) are ~10%.
          - uid: pod-cpu-starved
            title: Pod CPU starved
            condition: threshold
            for: 30m
            annotations:
              summary: >-
                {{ $labels.namespace }}/{{ $labels.pod }} spent {{ with $values.query }}{{ .Value | printf "%.0f" }}{{ else }}n/a{{ end }}%
                of the last 5m waiting for CPU (PSI "some").
              runbook: >-
                Grafana: Cluster Overview → Pod pressure. If "Pods most CPU-throttled"
                is also high, the pod's own CPU limit is too low: raise it (git, or
                in place for stateful pods — docs/troubleshooting/in-place-resize.md).
                If throttling is low, the node is contended: check "CPU used %".
            labels:
              severity: warning
              pillar: capacity
            noDataState: OK
            # KeepLast (not Error): these query Prometheus, which is rescheduled during
            # node patching (ansible patch.yml) while the API server is down for the
            # control-plane reboot. With Error every such blip paged a DatasourceError
            # with a %!f(<nil>) body (2026-09-30 10:14-10:19). Keeping the last state
            # for a few evaluations is the right answer for a capacity signal; the
            # security rules above stay on Error because there you want to know when
            # the rule cannot evaluate.
            execErrState: KeepLast
            data:
              - refId: query
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: PBFA97CFB590B2093
                model:
                  refId: query
                  datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                  instant: true
                  range: false
                  expr: >-
                    100 * sum by (namespace, pod)
                    (rate(container_pressure_cpu_waiting_seconds_total{container!=""}[5m]))
              - refId: threshold
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 20

          # prometheus-0 peaked at 99.8% of its 2Gi limit (15-day max, 2026-09-25) with
          # no warning. Working set / limit is the right ratio: it is what the kernel
          # compares against when it OOM-kills. Containers with no limit (0) are skipped.
          - uid: container-near-memory-limit
            title: Container near memory limit
            condition: threshold
            for: 15m
            annotations:
              summary: >-
                {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is at
                {{ with $values.query }}{{ .Value | printf "%.0f" }}{{ else }}n/a{{ end }}% of its memory limit.
              runbook: >-
                Grafana: Cluster Overview → Pod pressure → Memory used vs limit. Raise the
                limit (git, or in place for stateful pods —
                docs/troubleshooting/in-place-resize.md), or find the leak.
            labels:
              severity: warning
              pillar: capacity
            noDataState: OK
            # KeepLast (not Error): these query Prometheus, which is rescheduled during
            # node patching (ansible patch.yml) while the API server is down for the
            # control-plane reboot. With Error every such blip paged a DatasourceError
            # with a %!f(<nil>) body (2026-09-30 10:14-10:19). Keeping the last state
            # for a few evaluations is the right answer for a capacity signal; the
            # security rules above stay on Error because there you want to know when
            # the rule cannot evaluate.
            execErrState: KeepLast
            data:
              - refId: query
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: PBFA97CFB590B2093
                model:
                  refId: query
                  datasource:
                    type: prometheus
                    uid: PBFA97CFB590B2093
                  instant: true
                  range: false
                  expr: >-
                    100 * max by (namespace, pod, container)
                    (container_memory_working_set_bytes{container!="",image!=""}
                    / (container_spec_memory_limit_bytes{container!="",image!=""} > 0))
              - refId: threshold
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: threshold
                  type: threshold
                  expression: query
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 90

      # ----------------------------------------------------------------------
      # Agent Substrate (kagent 1.0's runtime, base-apps/substrate/). Its CAs are valid 365
      # days and nothing renews them; when one lapses every Substrate call fails. The
      # substrate-ca-expiry CronJob (base-apps/substrate/ca-expiry-cronjob.yaml) reads the five
      # CA certificates every 6 h and logs a summary line with min_days_left.
      - orgId: 1
        name: substrate
        folder: Substrate
        interval: 1h
        rules:
          - uid: substrate-ca-expiry
            title: Substrate CA expires in under 30 days
            condition: threshold
            # 7h: the first check after install lands within 6 h. A warning 30 days ahead
            # loses nothing by waiting.
            for: 7h
            annotations:
              summary: >-
                A Substrate CA expires in {{ with $values.query }}{{ .Value | printf "%.0f" }}{{ else }}n/a{{ end }}
                days, or the check stopped reporting. When a CA lapses, pod certificates stop
                issuing and kagent's agents stop working.
              runbook: >-
                base-apps/substrate/runbook.md "Rotate the Substrate CAs":
                scripts/provision-kagent-1-0-vault.sh --rotate-cas, then restart the Substrate
                and kagent workloads in order. No data means the check stopped:
                kubectl -n ate-system get cronjob,jobs -l app.kubernetes.io/name=substrate-ca-expiry
            labels:
              severity: warning
              pillar: reliability
            # Fail closed: no summary line for 13 h is a broken check, not healthy CAs.
            noDataState: Alerting
            execErrState: Error
            data:
              - refId: query
                relativeTimeRange:
                  from: 46800
                  to: 0
                datasourceUid: loki
                model:
                  refId: query
                  datasource:
                    type: loki
                    uid: loki
                  queryType: instant
