# Gateway API replacement for this app's nginx Ingress (T56).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logging
  namespace: logging
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-grafana
  hostnames:
    - grafana.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000
