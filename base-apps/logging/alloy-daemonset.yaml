apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: logging
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      serviceAccountName: alloy
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: alloy
        image: grafana/alloy:v1.4.3
        args:
          - run
          - /etc/alloy/config.alloy
          - --server.http.listen-addr=0.0.0.0:12345
          - --storage.path=/var/lib/alloy/data
        ports:
        - containerPort: 12345
          name: http
          protocol: TCP
        env:
        # Node name, used by alloy-config.yaml to scope pod discovery to this node.
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Without this, Go sizes its heap target from the host's memory, not the cgroup:
        # next_gc sat at 527MB against this 512Mi limit, so the kernel OOM-killed Alloy
        # before the GC ever ran (86-97 restarts). Keep at ~85% of limits.memory below,
        # leaving room for non-heap RSS.
        - name: GOMEMLIMIT
          value: 440MiB
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          privileged: true
          runAsUser: 0
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: data
        emptyDir: {}
