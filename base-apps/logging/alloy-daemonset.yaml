apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: logging
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      # No nodeSelector on purpose: pod discovery is scoped to the local node
      # (alloy-config.yaml), so a node without an Alloy pod has no log collection at all.
      # Restricting this to workload=application silently dropped every pod on
      # k3s-control-01 - argo-cd, kyverno, kube-system, cert-manager, external-secrets,
      # dex, falco and atlantis among them. The toleration below already covers the
      # control-plane NoSchedule taint.
      serviceAccountName: alloy
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: alloy
        image: grafana/alloy:v1.4.3
        args:
          - run
          - /etc/alloy/config.alloy
          - --server.http.listen-addr=0.0.0.0:12345
          - --storage.path=/var/lib/alloy/data
        ports:
        - containerPort: 12345
          name: http
          protocol: TCP
        env:
        # Node name, used by alloy-config.yaml to scope pod discovery to this node.
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Without this, Go sizes its heap target from the host's memory, not the cgroup:
        # next_gc sat at 527MB against this 512Mi limit, so the kernel OOM-killed Alloy
        # before the GC ever ran (86-97 restarts). Keep at ~85% of limits.memory below,
        # leaving room for non-heap RSS.
        - name: GOMEMLIMIT
          value: 440MiB
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy/data
        # Host metrics (prometheus.exporter.unix in alloy-config.yaml) read the node's own
        # /proc, /sys and root filesystem. All read-only; HostToContainer so filesystems
        # mounted on the host after start (new local-path volumes) stay visible.
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        - name: host-root
          mountPath: /host/root
          readOnly: true
          mountPropagation: HostToContainer
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          privileged: true
          runAsUser: 0
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      # hostPath, not emptyDir: this is where Alloy keeps its log read positions
      # (loki.source.kubernetes.pods/positions.yml) and the remote_write WAL. With an
      # emptyDir every restart forgot the positions and re-read every container log on
      # the node from the start; Loki rejected the old lines as "entry too far behind"
      # (400s, nothing duplicated), but the re-read pinned Alloy at its CPU limit for
      # 10+ minutes on worker-01 (2026-09-25). ~100K per node.
      - name: data
        hostPath:
          path: /var/lib/alloy/data
          type: DirectoryOrCreate
      - name: host-proc
        hostPath:
          path: /proc
      - name: host-sys
        hostPath:
          path: /sys
      - name: host-root
        hostPath:
          path: /
