apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: backstage
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/backstage
    directory:
      # catalog-info.yaml is a Backstage entity, not a Kubernetes manifest.
      # Exclude it so Argo CD does not try to apply it and fail sync.
      exclude: '{catalog-info.yaml,mkdocs.yml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Backstage calls the kagent controller; in the mesh its calls carry its workload principal
    # (ztunnel mTLS) and traverse the kagent waypoint (V91).
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
