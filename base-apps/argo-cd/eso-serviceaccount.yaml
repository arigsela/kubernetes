---
# The identity ESO uses to read Argo CD's Slack token from Vault: Vault role `argo-cd`
# (scripts/provision-argocd-notifications-vault.sh) binds exactly this ServiceAccount, so no
# other pod in the namespace can read the path. Per-consumer, as templates/agent-identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-argo-cd
  namespace: argo-cd
