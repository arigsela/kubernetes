---
# Vault access for Argo CD's notifications token. Role `argo-cd` is bound to the
# `eso-argo-cd` ServiceAccount and its policy reads k8s-secrets/data/argo-cd only
# (scripts/provision-argocd-notifications-vault.sh creates both). The role must exist
# before this merges: an invalid store leaves the ExternalSecret unsynced and the app
# Degraded until it does.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-argo-cd
  namespace: argo-cd
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argo-cd
          serviceAccountRef:
            name: eso-argo-cd
