---
# The Secret the notifications controller reads (`$slack-token` in the Slack service of
# argocd-notifications-cm, rendered by the chart from `notifications` in
# terraform/roots/asela-cluster/argocd.tf). The chart no longer creates this Secret
# (notifications.secret.create=false); ESO owns it. The token is a copy of the bot token
# n8n and the Slack bridge use (the same Slack app) on Argo CD's own Vault path, so a
# rotation touches three paths: n8n, slack-bridge, argo-cd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications
  namespace: argo-cd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-argo-cd
    kind: SecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-token
      remoteRef:
        key: argo-cd
        property: slack-bot-token
