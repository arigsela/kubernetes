# Dex's secrets, from Vault key k8s-secrets/dex:
#   github-client-id / github-client-secret — the GitHub OAuth App you register
#     (github.com -> Settings -> Developer settings -> OAuth Apps), callback
#     https://dex.arigsela.com/callback
#   vault-client-secret — the shared secret between Dex's `vault` staticClient
#     and Vault's oidc auth config (generated during setup).
#   agent-audit-client-secret — the shared secret between Dex's `agent-audit`
#     staticClient and agent-audit-web's oauth2-proxy (the same value also lives
#     in k8s-secrets/agent-audit-web as oauth2-client-secret; rotate both).
#   jupyter-client-secret — the shared secret between Dex's `jupyter`
#     staticClient and the jupyter pod's oauth2-proxy (the same value also lives
#     in k8s-secrets/jupyter as oauth2-client-secret; rotate both).
# Consumed by the Dex Deployment via envFrom; the config.yaml references them
# as $GITHUB_CLIENT_ID / $GITHUB_CLIENT_SECRET / $VAULT_CLIENT_SECRET /
# $AGENT_AUDIT_CLIENT_SECRET / $JUPYTER_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-secrets
  namespace: dex
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: dex-secrets
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: dex
        property: github-client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: dex
        property: github-client-secret
    - secretKey: VAULT_CLIENT_SECRET
      remoteRef:
        key: dex
        property: vault-client-secret
    - secretKey: AGENT_AUDIT_CLIENT_SECRET
      remoteRef:
        key: dex
        property: agent-audit-client-secret
    - secretKey: JUPYTER_CLIENT_SECRET
      remoteRef:
        key: dex
        property: jupyter-client-secret
