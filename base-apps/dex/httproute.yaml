# Gateway API replacement for this app's nginx Ingress (T56).
# Lives in the app namespace so the backendRef is same-namespace and needs no
# second ReferenceGrant. Backend read from the LIVE Ingress, not inferred.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Dex
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: mdi-account-key
    gethomepage.dev/description: OIDC identity provider
    gethomepage.dev/pod-selector: app=dex
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-dex
  hostnames:
    - dex.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          port: 5556
