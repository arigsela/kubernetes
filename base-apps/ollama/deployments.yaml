apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  # The model is a read-only image volume (below), not a ReadWriteOnce PVC, so a new pod
  # starts next to the old one and kagent's embeddings keep working through a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      containers:
        - name: ollama
          image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
          ports:
            - containerPort: 11434
              name: http
          env:
            # Keep the embedding model resident instead of unloading it after the
            # default 5m idle. On CPU-only Ollama the cold reload of nomic-embed-text
            # took ~2m43s (measured), and was the dominant latency source for kagent
            # agents (e.g. homelab-knowledge) whenever they were used after a quiet
            # period. The model is ~274MB, so pinning it fits within the limit below.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Models come from the read-only image volume. NOPRUNE: ollama would otherwise try
            # to prune "unused" blobs at startup. /api/pull fails (read-only), by design: a
            # model changes only through a new image digest (runbook "Model update").
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NOPRUNE
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            # ollama writes its identity keypair here at startup; nothing else persists.
            - name: ollama-home
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # CPU-only embedding is CPU-bound and the node has ample headroom;
              # more cores cut warm-embed latency (was ~1-7s/call) and the one-time
              # model load on pod restart. Memory raised so the always-resident
              # model can't OOM the pod.
              cpu: "3"
              memory: 2Gi
          # Keep serving for the ~1s kube-proxy needs to drop this pod from the Service when
          # a rollout replaces it (qwen's first surge rollout lost one request without this).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        # nomic-embed-text as an OCI image, mounted read-only at /models (image volumes, GA
        # in k8s 1.36). Built by scripts/build-model-image.sh nomic-embed-text: Ollama tag
        # v1.5 with its model digest ASSERTED (kagent's stored memory vectors depend on this
        # exact model), manifest also named `latest` (what kagent asks for). Pinned by digest.
        - name: models
          image:
            reference: 852893458518.dkr.ecr.us-east-2.amazonaws.com/models/nomic-embed-text@sha256:cdde66eda3d0429d19a3e6123de84e462de33097b8d64a7b51ae8188e1abaca8
            pullPolicy: IfNotPresent
        - name: ollama-home
          emptyDir:
            sizeLimit: 64Mi
