apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: istio-istiod
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.5
    helm:
      values: |
        profile: ambient
        global:
          platform: k3s
        # Access-log format for the ingress gateway (enabled by
        # base-apps/istio-ingress/telemetry.yaml via the built-in `envoy` provider,
        # which reads this field). It is Istio 1.30's default with ONE change: the
        # path is %REQ_WITHOUT_QUERY(...)%, not %REQ(...)%. Query strings carry
        # search text (agent-audit-web's ?q=), OAuth ?code=&state= and other
        # secrets-in-URLs, and these lines sit in Loki for 30 days. Path, status,
        # source address and timing are all still logged.
        # tests/istio_logging/ pins this against Istio's default format.
        meshConfig:
          accessLogFormat: >-
            [%START_TIME%] "%REQ(:METHOD)% %REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
            %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% %CONNECTION_TERMINATION_DETAILS%
            "%UPSTREAM_TRANSPORT_FAILURE_REASON%" %BYTES_RECEIVED% %BYTES_SENT% %DURATION%
            %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% "%REQ(X-FORWARDED-FOR)%" "%REQ(USER-AGENT)%"
            "%REQ(X-REQUEST-ID)%" "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%" %UPSTREAM_CLUSTER_RAW%
            %UPSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_REMOTE_ADDRESS%
            %REQUESTED_SERVER_NAME% %ROUTE_NAME%
        pilot:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod injects a ~1460-byte caBundle into this webhook at runtime; the chart
  # ships it empty because the CA is generated in-cluster. Nothing can reconcile
  # that, so the app sat permanently OutOfSync (SPEC.md §V.47, and
  # docs/plans/argocd-drift-diagnosis.md for the evidence).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jqPathExpressions:
        # istiod writes these two at runtime. caBundle is the in-cluster CA the
        # chart cannot know; failurePolicy is flipped Ignore -> Fail once istiod
        # is ready, so Argo can never win this one.
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        # The remainder are API-server defaults absent from the rendered chart.
        - .webhooks[].clientConfig.service.port
        - .webhooks[].matchPolicy
        - .webhooks[].namespaceSelector
        - .webhooks[].objectSelector
        - .webhooks[].timeoutSeconds
        - .webhooks[].rules[].scope
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
