# base-apps/taskboard/deployment.yaml
---
# The app (§T.145): arigsela/taskboard's server.py from the generated code ConfigMap, alert-demo's
# pattern. One replica, Recreate: SQLite lives on this pod's emptyDir and the app seeds its demo
# data on start, so a restart resets the data (the evidence lives in Loki and Prometheus).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
  labels:
    app: taskboard
    app.kubernetes.io/name: taskboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
        app.kubernetes.io/name: taskboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # scripts/gen-taskboard-configmap.py writes both of these. The pod reads its code once at
        # start, so checksum/code rolls it on a code change. source-commit is the arigsela/taskboard
        # commit the pod runs: the app reports it (TASKBOARD_COMMIT below), and the commit here that
        # changed it is the deploy, live from its merge.
        checksum/code: "55c97c4eae7062a5319abdc3a3e73399f9afc4ca826d5d0cfaf4c681d209ef97"
        taskboard.arigsela.com/source-commit: "efb9ef3936a609bd6e4ed623e3fd69459b90b0ee"
    spec:
      serviceAccountName: taskboard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: taskboard
          # The dispatcher's image and digest; Renovate keeps both pinned (pinDigests for base-apps).
          image: python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          command: ["python", "-u", "/opt/taskboard/server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: /data/taskboard.db
            # The code mount is read-only; don't try to write __pycache__ next to it.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TASKBOARD_COMMIT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['taskboard.arigsela.com/source-commit']
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # No livenessProbe: a restart wipes the SQLite data mid-demo; a hung pod shows as not ready.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /opt/taskboard
              readOnly: true
            - name: data
              mountPath: /data
            # sqlite3 and tempfile write here; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: taskboard-code
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# The traffic generator: a few personas (editors, a viewer, an admin) doing ordinary work against
# the Service every few seconds and logging what each tried and got, so the logs and metrics have
# a normal baseline before a bug shows up. Same ConfigMap as the app (simulate.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-traffic
  namespace: taskboard
  labels:
    app: taskboard-traffic
    app.kubernetes.io/name: taskboard-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-traffic
  template:
    metadata:
      labels:
        app: taskboard-traffic
        app.kubernetes.io/name: taskboard-traffic
      annotations:
        # Written by scripts/gen-taskboard-configmap.py, as on the app.
        checksum/code: "55c97c4eae7062a5319abdc3a3e73399f9afc4ca826d5d0cfaf4c681d209ef97"
    spec:
      serviceAccountName: taskboard-traffic
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          command: ["python", "-u", "/opt/taskboard/simulate.py"]
          env:
            - name: TASKBOARD_URL
              value: http://taskboard.taskboard.svc.cluster.local:8080
            - name: INTERVAL_SECONDS
              value: "3"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /opt/taskboard
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: taskboard-code
