    """The archive job (S7): archive done tasks once they have been done for longer
    than ARCHIVE_DONE_AFTER_DAYS (C3). It runs once at startup and then every
    ARCHIVE_INTERVAL_SECONDS (C4) on a background thread.
    """

    import logging
    import threading
    from datetime import timedelta

    import db
    import logs
    import tasks

    log = logging.getLogger("taskboard.archive")


    def run_once(conn, after_days, now=None):
        """Archive done tasks whose done_at is before now - after_days. Returns how many."""
        now = now or tasks.utcnow()
        cutoff = now - timedelta(days=after_days)
        with db.transaction(conn):
            archived = conn.execute(
                "UPDATE tasks SET archived_at = ? WHERE status = 'done' AND archived_at IS NULL AND done_at < ?",
                (tasks.iso(now), tasks.iso(cutoff)),
            ).rowcount
        logs.event(log, "archive_run", archived=archived, threshold_days=after_days, cutoff=tasks.iso(cutoff))
        return archived


    class ArchiveJob:
        def __init__(self, run, interval_seconds):
            self._run = run
            self._interval = interval_seconds
            self._stopping = threading.Event()
            self._thread = None

        def start(self):
            if self._thread is None:
                self._thread = threading.Thread(target=self._loop, name="archive", daemon=True)
                self._thread.start()

        def stop(self):
            self._stopping.set()

        def _loop(self):
            while not self._stopping.wait(self._interval):
                try:
                    self._run()
                except Exception:
                    log.exception("archive_failed")
