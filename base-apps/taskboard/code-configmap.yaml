    """Who may do what. Rule IDs (P1, P2, ...) refer to docs/permissions.md.

    Identity is the X-User request header (no login; see the docs). Every check
    goes through can(user, action, task): POLICY says, for each action, which rule
    applies and who besides admins may do it. require() raises Forbidden naming
    that rule.
    """

    from dataclasses import dataclass

    EDITOR_ROLES = ("editor", "admin")


    @dataclass(frozen=True)
    class User:
        name: str
        role: str

        @property
        def is_admin(self):
            return self.role == "admin"

        @property
        def is_editor(self):
            return self.role == "editor"


    class Forbidden(Exception):
        def __init__(self, rule, action):
            super().__init__(f"{action} denied by {rule}")
            self.rule = rule
            self.action = action


    def identify(users, name):
        """P2: the X-User header must name a configured user. Returns None otherwise."""
        if not name or name not in users:
            return None
        return User(name, users[name])


    def _owns(user, task):
        """The task is the user's own."""
        return task["created_by"] == user.name


    def _works_on(user, task):
        """The user created the task or is assigned to it."""
        return _owns(user, task) or task["assignee"] == user.name


    # action -> (rule, who may do it besides admins). Admins may do everything.
    POLICY = {
        "read": ("P1", lambda user, task: True),
        "create": ("P3", lambda user, task: user.is_editor),
        "change_status": ("P4", lambda user, task: user.is_editor and _owns(user, task)),
        "reassign": ("P5", lambda user, task: False),
        "edit": ("P6", lambda user, task: user.is_editor and _works_on(user, task)),
        "reopen": ("S4", lambda user, task: False),
        "delete": ("P7", lambda user, task: False),
    }


    def can(user, action, task=None):
        """True if user may do action (on task, for the actions about one task)."""
        _, allowed = POLICY[action]
        return user.is_admin or allowed(user, task)


    def require(user, action, task=None):
        """Raise Forbidden, naming the rule, unless user may do action."""
        if not can(user, action, task):
            raise Forbidden(POLICY[action][0], action)
