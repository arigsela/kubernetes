    """Prometheus metrics in the text exposition format, without a client library."""

    import logging
    import threading

    log = logging.getLogger("taskboard.metrics")

    DURATION_BUCKETS = (0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0)


    def _escape(value):
        return str(value).replace("\\", "\\\\").replace("\n", "\\n").replace('"', '\\"')


    def _labels(names, values):
        if not names:
            return ""
        return "{" + ",".join(f'{n}="{_escape(v)}"' for n, v in zip(names, values)) + "}"


    def _number(value):
        if isinstance(value, float):
            return "+Inf" if value == float("inf") else repr(value)
        return str(value)


    class Counter:
        kind = "counter"

        def __init__(self, name, help_text, labelnames=()):
            self.name, self.help, self.labelnames = name, help_text, tuple(labelnames)
            self._values = {}
            self._lock = threading.Lock()

        def inc(self, *labelvalues, amount=1):
            key = tuple(str(v) for v in labelvalues)
            with self._lock:
                self._values[key] = self._values.get(key, 0) + amount

        def value(self, *labelvalues):
            return self._values.get(tuple(str(v) for v in labelvalues), 0)

        def lines(self):
            with self._lock:
                items = sorted(self._values.items())
            if not self.labelnames and not items:
                items = [((), 0)]
            for key, value in items:
                yield f"{self.name}{_labels(self.labelnames, key)} {_number(value)}"


    class Gauge:
        """A gauge whose samples come from a callback at scrape time."""

        kind = "gauge"

        def __init__(self, name, help_text, labelnames, collect):
            self.name, self.help, self.labelnames = name, help_text, tuple(labelnames)
            self.collect = collect

        def lines(self):
            for key, value in self.collect():
                yield f"{self.name}{_labels(self.labelnames, key)} {_number(value)}"


    class Histogram:
        kind = "histogram"

        def __init__(self, name, help_text, labelnames=(), buckets=DURATION_BUCKETS):
            self.name, self.help, self.labelnames = name, help_text, tuple(labelnames)
            self.buckets = tuple(buckets)
            self._values = {}  # key -> [per-bucket counts, sum, count]
            self._lock = threading.Lock()

        def observe(self, value, *labelvalues):
            key = tuple(str(v) for v in labelvalues)
            with self._lock:
                state = self._values.setdefault(key, [[0] * len(self.buckets), 0.0, 0])
                for i, bound in enumerate(self.buckets):
                    if value <= bound:
                        state[0][i] += 1
                        break
                state[1] += value
                state[2] += 1

        def lines(self):
            with self._lock:
                items = sorted((k, (list(v[0]), v[1], v[2])) for k, v in self._values.items())
            names = self.labelnames + ("le",)
            for key, (counts, total, count) in items:
                cumulative = 0
                for bound, n in zip(self.buckets, counts):
                    cumulative += n
                    yield f"{self.name}_bucket{_labels(names, key + (_number(float(bound)),))} {cumulative}"
                yield f"{self.name}_bucket{_labels(names, key + ('+Inf',))} {count}"
                yield f"{self.name}_sum{_labels(self.labelnames, key)} {_number(round(total, 6))}"
                yield f"{self.name}_count{_labels(self.labelnames, key)} {count}"


    class Registry:
        def __init__(self):
            self._metrics = []

        def _add(self, metric):
            self._metrics.append(metric)
            return metric

        def counter(self, name, help_text, labelnames=()):
            return self._add(Counter(name, help_text, labelnames))

        def gauge(self, name, help_text, labelnames, collect):
            return self._add(Gauge(name, help_text, labelnames, collect))

        def histogram(self, name, help_text, labelnames=(), buckets=DURATION_BUCKETS):
            return self._add(Histogram(name, help_text, labelnames, buckets))

        def render(self):
            out = []
            for metric in self._metrics:
                out.append(f"# HELP {metric.name} {metric.help}")
                out.append(f"# TYPE {metric.name} {metric.kind}")
                try:
                    out.extend(metric.lines())
                except Exception:
                    log.exception("metric_collect_failed", extra={"fields": {"metric": metric.name}})
            return "\n".join(out) + "\n"
