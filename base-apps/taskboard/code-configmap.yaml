    """Configuration, read once at startup from environment variables.

    Each setting has an ID (C1, C5, ...) that docs/configuration.md uses.
    """

    import os
    from dataclasses import asdict, dataclass

    DEFAULT_USERS = "dana:editor,lee:editor,priya:editor,sam:viewer,alex:admin"
    ROLES = ("viewer", "editor", "admin")
    LOG_LEVELS = ("DEBUG", "INFO", "WARNING", "ERROR")
    MAX_PAGE_SIZE = 200


    class ConfigError(ValueError):
        """A setting has a value Taskboard cannot use."""


    @dataclass(frozen=True)
    class Config:
        users: dict  # C1: name -> role
        wip_limit: int  # C2
        archive_done_after_days: int  # C3
        archive_interval_seconds: int  # C4
        page_size: int  # C5
        seed_demo_data: bool  # C6
        log_level: str  # C7
        feature_overdue_view: bool  # C8
        port: int
        db_path: str
        commit: str

        def public(self):
            """The settings as logged in config_loaded. None of them is secret."""
            values = asdict(self)
            values["users"] = ",".join(f"{name}:{role}" for name, role in self.users.items())
            return values


    def _users(text):
        users = {}
        for entry in text.split(","):
            entry = entry.strip()
            if not entry:
                continue
            name, _, role = entry.partition(":")
            name, role = name.strip(), role.strip().lower()
            if not name or role not in ROLES:
                raise ConfigError(
                    f"TASKBOARD_USERS: {entry!r} is not name:role with a role of {', '.join(ROLES)}"
                )
            users[name] = role
        if not users:
            raise ConfigError("TASKBOARD_USERS names no users")
        return users


    def _int(env, name, default, minimum=1):
        raw = env.get(name, "").strip()
        if not raw:
            return default
        try:
            value = int(raw)
        except ValueError:
            raise ConfigError(f"{name}: {raw!r} is not a whole number") from None
        if value < minimum:
            raise ConfigError(f"{name}: must be at least {minimum}, got {value}")
        return value


    def _bool(env, name, default):
        raw = env.get(name, "").strip().lower()
        if not raw:
            return default
        if raw in ("1", "true", "yes", "on"):
            return True
        if raw in ("0", "false", "no", "off"):
            return False
        raise ConfigError(f"{name}: {raw!r} is not true or false")


    def load_config(env=None):
        env = os.environ if env is None else env
        log_level = env.get("LOG_LEVEL", "").strip().upper() or "INFO"
        if log_level not in LOG_LEVELS:
            raise ConfigError(f"LOG_LEVEL: {log_level!r} is not one of {', '.join(LOG_LEVELS)}")
        return Config(
            users=_users(env.get("TASKBOARD_USERS", DEFAULT_USERS)),
            wip_limit=_int(env, "WIP_LIMIT", 3),
            archive_done_after_days=_int(env, "ARCHIVE_DONE_AFTER_DAYS", 14),
            archive_interval_seconds=_int(env, "ARCHIVE_INTERVAL_SECONDS", 60),
            page_size=min(_int(env, "PAGE_SIZE", 50), MAX_PAGE_SIZE),
            seed_demo_data=_bool(env, "SEED_DEMO_DATA", True),
            log_level=log_level,
            feature_overdue_view=_bool(env, "FEATURE_OVERDUE_VIEW", True),
            port=_int(env, "PORT", 8080),
            db_path=env.get("DB_PATH", "").strip() or "/data/taskboard.db",
            commit=env.get("TASKBOARD_COMMIT", "").strip() or "dev",
        )
