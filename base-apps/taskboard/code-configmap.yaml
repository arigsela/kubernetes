    """Traffic generator for Taskboard: a few people doing ordinary work, forever.

        TASKBOARD_URL=http://localhost:8080 INTERVAL_SECONDS=1 python3 traffic/simulate.py

    Personas (users from the default TASKBOARD_USERS):
    - dana, lee, priya (editors) look at the board and work through the tasks
      assigned to them, whoever created them: open -> in_progress -> done.
      Now and then they add a task of their own or rename one.
    - alex (admin) assigns new tasks to the editors, reassigns, sometimes reopens
      a task finished today, and deletes tasks finished today when the Done column
      gets long, so the board stays a sensible size.
    - sam (viewer) browses and now and then tries something a viewer may not do.
    - About once a minute someone opens the Overdue view (due_before=today).

    Logs one JSON line per HTTP call (msg "sim_action") on stdout. Survives
    Taskboard restarts by retrying with backoff. Standard library only.
    """

    import json
    import os
    import random
    import sys
    import time
    import urllib.error
    import urllib.request
    import uuid
    from datetime import datetime, timedelta, timezone

    EDITORS = ("dana", "lee", "priya")
    ADMIN = "alex"
    VIEWER = "sam"
    PROJECTS = ("website", "payments")
    WIP_LIMIT = 3
    MIN_ACTIVE = 12  # open + in progress: below this alex always adds a task
    MAX_ACTIVE = 24  # open + in progress: above this nobody adds tasks
    MAX_DONE = 12  # done tasks on the board: above this alex deletes some

    VERBS = ("Update", "Fix", "Review", "Write", "Test", "Draft", "Clean up", "Document", "Check", "Simplify")
    THINGS = (
        "the onboarding email",
        "checkout error messages",
        "the status page",
        "invoice totals",
        "the search results page",
        "the refund webhook",
        "dark mode colours",
        "the release checklist",
        "card expiry handling",
        "the sitemap",
        "tax rounding",
        "the password reset flow",
        "the pricing table",
        "payout reports",
    )


    def log(msg, level="INFO", **fields):
        line = {
            "time": datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
            "level": level,
            "logger": "simulate",
            "msg": msg,
            **fields,
        }
        print(json.dumps(line), flush=True)


    class Unreachable(Exception):
        """Taskboard did not answer at all (down, restarting, DNS)."""


    class Client:
        def __init__(self, base_url, timeout=10):
            self.base_url = base_url.rstrip("/")
            self.timeout = timeout

        def call(self, persona, action, method, path, body=None, expect=None):
            """One request as persona. Returns (status, parsed body or None)."""
            request_id = f"sim-{uuid.uuid4().hex[:12]}"
            headers = {"X-User": persona, "X-Request-Id": request_id, "User-Agent": "taskboard-simulate/1"}
            data = None
            if body is not None:
                data = json.dumps(body).encode()
                headers["Content-Type"] = "application/json"
            request = urllib.request.Request(self.base_url + path, data=data, headers=headers, method=method)
            started = time.monotonic()
            try:
                with urllib.request.urlopen(request, timeout=self.timeout) as response:
                    status, raw = response.status, response.read()
            except urllib.error.HTTPError as exc:
                status, raw = exc.code, exc.read()
            except (urllib.error.URLError, OSError) as exc:
                raise Unreachable(f"{type(exc).__name__}: {exc}") from None
            ms = round((time.monotonic() - started) * 1000, 1)
            try:
                payload = json.loads(raw) if raw else None
            except ValueError:
                payload = None
            fields = {
                "persona": persona,
                "action": action,
                "method": method,
                "path": path,
                "status": status,
                "ms": ms,
                "request_id": request_id,
            }
            if expect:
                fields["expect"] = expect
            if status >= 400 and isinstance(payload, dict):
                for key in ("error", "rule", "detail"):
                    if key in payload:
                        fields[key] = payload[key]
            if action in ("list_board", "overdue_view") and status == 200 and isinstance(payload, dict):
                counts = {"open": 0, "in_progress": 0, "done": 0}
                for task in payload.get("tasks", []):
                    counts[task["status"]] = counts.get(task["status"], 0) + 1
                fields["counts"] = counts
                fields["total"] = payload.get("total")
            level = "ERROR" if status >= 500 else "WARNING" if status >= 400 and not expect else "INFO"
            log("sim_action", level=level, **fields)
            return status, payload


    class Simulator:
        def __init__(self, client, rng=None, overdue_every=60.0):
            self.client = client
            self.rng = rng or random.Random()
            self.overdue_every = overdue_every
            self._last_overdue = None

        # -- helpers ---------------------------------------------------------------------------

        def board(self, persona, action="list_board", query=""):
            status, data = self.client.call(persona, action, "GET", f"/api/tasks{query}")
            return data.get("tasks", []) if status == 200 and data else []

        def title(self):
            return f"{self.rng.choice(VERBS)} {self.rng.choice(THINGS)}"

        def due_date(self):
            if self.rng.random() < 0.5:
                return None
            day = datetime.now(timezone.utc).date() + timedelta(days=self.rng.randint(-5, 10))
            return day.isoformat()

        def new_task(self, assignee):
            body = {"title": self.title(), "project": self.rng.choice(PROJECTS), "assignee": assignee}
            due = self.due_date()
            if due:
                body["due_date"] = due
            return body

        def move(self, persona, action, task, status, expect=None):
            return self.client.call(
                persona, action, "PATCH", f"/api/tasks/{task['id']}", {"status": status}, expect=expect
            )

        # -- one step ------------------------------------------------------------------------------

        def step(self):
            now = time.monotonic()
            if self._last_overdue is None or now - self._last_overdue >= self.overdue_every:
                self._last_overdue = now
                today = datetime.now(timezone.utc).date().isoformat()
                self.board(self.rng.choice(EDITORS + (ADMIN,)), "overdue_view", f"?due_before={today}")
                return
            persona = self.rng.choices(EDITORS + (ADMIN, VIEWER), weights=(3, 3, 3, 3, 1.5))[0]
            if persona == ADMIN:
                self.admin_turn(persona)
            elif persona == VIEWER:
                self.viewer_turn(persona)
            else:
                self.editor_turn(persona)

        def editor_turn(self, me):
            roll = self.rng.random()
            if roll < 0.30:
                self.board(me)
            elif roll < 0.75:
                self.work(me)
            elif roll < 0.88:
                tasks = self.board(me)
                if sum(t["status"] != "done" for t in tasks) < MAX_ACTIVE:
                    self.client.call(me, "create_task", "POST", "/api/tasks", self.new_task(me))
            elif roll < 0.95:
                tasks = self.board(me)
                if tasks:
                    task = self.rng.choice(tasks)
                    self.client.call(me, "view_task", "GET", f"/api/tasks/{task['id']}")
            else:
                mine = [t for t in self.board(me, "list_my_tasks", f"?assignee={me}") if t["status"] != "done"]
                if mine:
                    task = self.rng.choice(mine)
                    self.client.call(me, "rename_task", "PATCH", f"/api/tasks/{task['id']}", {"title": self.title()})

        def work(self, me):
            """Move one of my tasks along: finish one in progress, or start an open one."""
            mine = self.board(me, "list_my_tasks", f"?assignee={me}")
            doing = [t for t in mine if t["status"] == "in_progress"]
            todo = [t for t in mine if t["status"] == "open"]
            if doing and (len(doing) >= WIP_LIMIT or not todo or self.rng.random() < 0.5):
                self.move(me, "finish_task", self.rng.choice(doing), "done")
            elif todo:
                self.move(me, "start_task", self.rng.choice(todo), "in_progress")

        def admin_turn(self, me):
            tasks = self.board(me)
            active = [t for t in tasks if t["status"] != "done"]
            done = [t for t in tasks if t["status"] == "done"]
            # Clean-up and reopening only touch tasks finished in the last day, so the
            # board's older history stays as it is.
            since = (datetime.now(timezone.utc) - timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
            recent = [t for t in done if (t["done_at"] or "") >= since]
            roll = self.rng.random()
            if len(done) > MAX_DONE and recent:
                task = min(recent, key=lambda t: t["done_at"])
                self.client.call(me, "delete_task", "DELETE", f"/api/tasks/{task['id']}")
            elif roll < 0.55 or len(active) < MIN_ACTIVE:
                if len(active) < MAX_ACTIVE:
                    body = self.new_task(self.rng.choice(EDITORS))
                    self.client.call(me, "create_task", "POST", "/api/tasks", body)
            elif roll < 0.75:
                candidates = [t for t in active if t["status"] == "open"]
                if candidates:
                    task = self.rng.choice(candidates)
                    other = self.rng.choice([e for e in EDITORS if e != task["assignee"]] or list(EDITORS))
                    self.client.call(me, "reassign_task", "PATCH", f"/api/tasks/{task['id']}", {"assignee": other})
            elif roll < 0.82:
                if recent:
                    self.move(me, "reopen_task", self.rng.choice(recent), "open")
            elif tasks:
                task = self.rng.choice(tasks)
                self.client.call(me, "view_task", "GET", f"/api/tasks/{task['id']}")

        def viewer_turn(self, me):
            roll = self.rng.random()
            if roll < 0.40:
                self.board(me)
            elif roll < 0.60:
                tasks = self.board(me)
                if tasks:
                    self.client.call(me, "view_task", "GET", f"/api/tasks/{self.rng.choice(tasks)['id']}")
            elif roll < 0.70:
                self.client.call(me, "whoami", "GET", "/api/me")
            else:
                # a viewer trying what viewers may not do (P3, P4, P5): expected to be refused
                tasks = [t for t in self.board(me) if t["status"] == "open"]
                attempt = self.rng.random()
                if attempt < 0.5 or not tasks:
                    self.client.call(me, "create_task", "POST", "/api/tasks", self.new_task(me), expect="denied")
                elif attempt < 0.8:
                    self.move(me, "start_task", self.rng.choice(tasks), "in_progress", expect="denied")
                else:
                    task = self.rng.choice(tasks)
                    other = self.rng.choice([e for e in EDITORS if e != task["assignee"]])
                    self.client.call(
                        me, "reassign_task", "PATCH", f"/api/tasks/{task['id']}", {"assignee": other}, expect="denied"
                    )


    def main():
        url = os.environ.get("TASKBOARD_URL", "http://taskboard:8080")
        interval = float(os.environ.get("INTERVAL_SECONDS", "3"))
        seed = os.environ.get("SIM_SEED")
        rng = random.Random(int(seed)) if seed else random.Random()
        simulator = Simulator(Client(url), rng)
        log("sim_started", url=url, interval_seconds=interval)
        backoff = 1.0
        while True:
            try:
                simulator.step()
                backoff = 1.0
                time.sleep(interval * rng.uniform(0.5, 1.5))
            except Unreachable as exc:
                log("sim_unreachable", level="WARNING", url=url, error=str(exc), retry_in_seconds=backoff)
                time.sleep(backoff)
                backoff = min(backoff * 2, 30.0)
            except Exception as exc:  # keep going whatever happens
                log("sim_error", level="ERROR", error=f"{type(exc).__name__}: {exc}")
                time.sleep(interval)


    if __name__ == "__main__":
        try:
            main()
        except KeyboardInterrupt:
            sys.exit(0)
