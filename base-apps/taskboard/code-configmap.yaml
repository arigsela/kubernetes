    """SQLite connections and numbered schema migrations.

    Migrations run at startup, in order, each in its own transaction, and each one
    applied is recorded in schema_migrations and logged as migration_applied.
    """

    import logging
    import sqlite3
    from contextlib import contextmanager

    import logs

    log = logging.getLogger("taskboard.db")

    # (version, name, statements). Never edit a migration that has shipped; add a new one.
    MIGRATIONS = [
        (
            1,
            "create tasks",
            [
                """CREATE TABLE tasks (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    project TEXT NOT NULL,
                    title TEXT NOT NULL,
                    status TEXT NOT NULL,
                    assignee TEXT NOT NULL,
                    created_by TEXT NOT NULL,
                    created_at TEXT NOT NULL,
                    updated_at TEXT NOT NULL,
                    done_at TEXT,
                    due_date TEXT,
                    archived_at TEXT
                )""",
                "CREATE INDEX tasks_status ON tasks (status)",
                "CREATE INDEX tasks_assignee ON tasks (assignee)",
            ],
        ),
        (
            2,
            "create task_events",
            [
                """CREATE TABLE task_events (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    task_id INTEGER NOT NULL REFERENCES tasks (id) ON DELETE CASCADE,
                    actor TEXT NOT NULL,
                    from_status TEXT,
                    to_status TEXT NOT NULL,
                    at TEXT NOT NULL
                )""",
                "CREATE INDEX task_events_task ON task_events (task_id)",
            ],
        ),
    ]


    def connect(path):
        conn = sqlite3.connect(path, timeout=10, isolation_level=None, check_same_thread=False)
        conn.row_factory = sqlite3.Row
        conn.execute("PRAGMA foreign_keys = ON")
        return conn


    @contextmanager
    def transaction(conn):
        """BEGIN IMMEDIATE ... COMMIT, or ROLLBACK if the block raises."""
        conn.execute("BEGIN IMMEDIATE")
        try:
            yield conn
        except BaseException:
            conn.execute("ROLLBACK")
            raise
        conn.execute("COMMIT")


    def applied_versions(conn):
        return [row[0] for row in conn.execute("SELECT version FROM schema_migrations ORDER BY version")]


    def migrate(conn, now):
        conn.execute("PRAGMA journal_mode = WAL")
        conn.execute(
            "CREATE TABLE IF NOT EXISTS schema_migrations (version INTEGER PRIMARY KEY, applied_at TEXT NOT NULL)"
        )
        done = set(applied_versions(conn))
        for version, name, statements in MIGRATIONS:
            if version in done:
                continue
            with transaction(conn):
                for statement in statements:
                    conn.execute(statement)
                conn.execute(
                    "INSERT INTO schema_migrations (version, applied_at) VALUES (?, ?)", (version, now)
                )
            logs.event(log, "migration_applied", version=version, name=name)
