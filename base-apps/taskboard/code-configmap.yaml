    """Structured logs: one JSON object per line on stdout.

    Every line has time, level, logger and msg. Lines written while a request is
    being handled also carry its request_id (and trace_id when tracing is on).
    Domain events are ordinary lines whose msg names the event, with their own
    fields next to it, for example msg="status_changed", task_id=7.
    """

    import contextvars
    import json
    import logging
    import os
    import sys
    import traceback
    from datetime import datetime, timezone

    # Set by app.App.handle for the duration of one request.
    request_context = contextvars.ContextVar("request_context", default=None)


    class JsonFormatter(logging.Formatter):
        def format(self, record):
            moment = datetime.fromtimestamp(record.created, timezone.utc)
            line = {
                "time": moment.isoformat(timespec="milliseconds").replace("+00:00", "Z"),
                "level": record.levelname,
                "logger": record.name,
                "msg": record.getMessage(),
            }
            context = getattr(record, "context", None) or request_context.get()
            if context:
                for key in ("request_id", "trace_id"):
                    if context.get(key):
                        line[key] = context[key]
            line.update(getattr(record, "fields", None) or {})
            if record.exc_info and "error" not in line:
                line["error"] = describe_error(record.exc_info[1])
                line["stack"] = compact_stack(record.exc_info[2])
            return json.dumps(line, default=str)


    def setup(level="INFO"):
        handler = logging.StreamHandler(sys.stdout)
        handler.setFormatter(JsonFormatter())
        root = logging.getLogger()
        root.handlers[:] = [handler]
        root.setLevel(level)


    def event(logger, msg, level=logging.INFO, **fields):
        """Log a domain event: msg names it, fields describe it."""
        logger.log(level, msg, extra={"fields": fields, "context": dict(request_context.get() or {})})


    def describe_error(exc):
        """'ClassName: message', with the module for classes outside builtins."""
        cls = type(exc)
        name = cls.__qualname__ if cls.__module__ == "builtins" else f"{cls.__module__}.{cls.__qualname__}"
        return f"{name}: {exc}"


    def compact_stack(tb, limit=5):
        """The innermost frames as 'file.py:line function', outermost first."""
        frames = traceback.extract_tb(tb)[-limit:]
        return " > ".join(f"{os.path.basename(f.filename)}:{f.lineno} {f.name}" for f in frames)
