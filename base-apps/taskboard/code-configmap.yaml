    """Tasks in SQLite: create, read, list, change, delete."""

    from datetime import datetime, timezone

    STATUSES = ("open", "in_progress", "done")
    DEFAULT_PAGE_SIZE = 50

    COLUMNS = (
        "id",
        "project",
        "title",
        "status",
        "assignee",
        "created_by",
        "created_at",
        "updated_at",
        "done_at",
        "due_date",
        "archived_at",
    )
    _SELECT = f"SELECT {', '.join(COLUMNS)} FROM tasks"


    def utcnow():
        return datetime.now(timezone.utc)


    def iso(moment):
        return moment.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def to_dict(row):
        return {name: row[name] for name in COLUMNS}


    def get_task(conn, task_id):
        row = conn.execute(f"{_SELECT} WHERE id = ?", (task_id,)).fetchone()
        return to_dict(row) if row else None


    def list_tasks(
        conn, status=None, assignee=None, due_before=None, include_archived=False, page=1, page_size=DEFAULT_PAGE_SIZE
    ):
        clauses, params = [], []
        if not include_archived:
            clauses.append("archived_at IS NULL")
        if status:
            clauses.append("status = ?")
            params.append(status)
        if assignee:
            clauses.append("assignee = ?")
            params.append(assignee)
        if due_before:
            clauses.append("due_date < ?")
            params.append(due_before)
        where = f" WHERE {' AND '.join(clauses)}" if clauses else ""
        total = conn.execute(f"SELECT COUNT(*) FROM tasks{where}", params).fetchone()[0]
        rows = conn.execute(
            f"{_SELECT}{where} ORDER BY id LIMIT ? OFFSET ?",
            [*params, page_size, (page - 1) * page_size],
        ).fetchall()
        return {
            "tasks": [to_dict(row) for row in rows],
            "page": page,
            "page_size": page_size,
            "total": total,
        }


    def create_task(conn, *, project, title, created_by, assignee, due_date=None, now=None):
        stamp = iso(now or utcnow())
        cursor = conn.execute(
            "INSERT INTO tasks (project, title, status, assignee, created_by, created_at, updated_at, due_date)"
            " VALUES (?, ?, 'open', ?, ?, ?, ?, ?)",
            (project, title, assignee, created_by, stamp, stamp, due_date),
        )
        add_event(conn, cursor.lastrowid, created_by, None, "open", stamp)
        return get_task(conn, cursor.lastrowid)


    def update_task(conn, task, changes, actor, now=None):
        """Apply changes (field -> value) to task and return the task as stored.

        A status change sets or clears done_at and is recorded in task_events.
        Reopening an archived task brings it back to the board.
        """
        stamp = iso(now or utcnow())
        fields = dict(changes)
        if "status" in fields and fields["status"] != task["status"]:
            fields["done_at"] = stamp if fields["status"] == "done" else None
            if task["status"] == "done":
                fields["archived_at"] = None
            add_event(conn, task["id"], actor, task["status"], fields["status"], stamp)
        fields["updated_at"] = stamp
        assignments = ", ".join(f"{name} = ?" for name in fields)
        conn.execute(f"UPDATE tasks SET {assignments} WHERE id = ?", [*fields.values(), task["id"]])
        return get_task(conn, task["id"])


    def add_event(conn, task_id, actor, from_status, to_status, at):
        conn.execute(
            "INSERT INTO task_events (task_id, actor, from_status, to_status, at) VALUES (?, ?, ?, ?, ?)",
            (task_id, actor, from_status, to_status, at),
        )


    def events_for(conn, task_id):
        rows = conn.execute(
            "SELECT actor, from_status, to_status, at FROM task_events WHERE task_id = ? ORDER BY id", (task_id,)
        )
        return [{"actor": a, "from": f, "to": t, "at": at} for a, f, t, at in rows]


    def count_in_progress(conn, assignee):
        return conn.execute(
            "SELECT COUNT(*) FROM tasks WHERE assignee = ? AND status = 'in_progress'", (assignee,)
        ).fetchone()[0]


    def delete_task(conn, task_id):
        return conn.execute("DELETE FROM tasks WHERE id = ?", (task_id,)).rowcount > 0


    def count_by_status(conn):
        """Tasks on the board (not archived) by status."""
        counts = dict.fromkeys(STATUSES, 0)
        for status, count in conn.execute(
            "SELECT status, COUNT(*) FROM tasks WHERE archived_at IS NULL GROUP BY status"
        ):
            counts[status] = count
        return counts
  tracing.py: |
    """Optional OpenTelemetry spans.

    When the opentelemetry API is importable (for example through the OpenTelemetry
    operator's Python auto-instrumentation) each request gets a server span, and its
    trace_id goes into the request's log lines. Otherwise this module does nothing.
    """

    from contextlib import contextmanager

    try:
        from opentelemetry import propagate, trace
        from opentelemetry.trace import SpanKind, Status, StatusCode
    except Exception:  # not installed: tracing is off
        trace = None

    ENABLED = trace is not None


    @contextmanager
    def request_span(method, path, headers):
        if trace is None:
            yield None
            return
        tracer = trace.get_tracer("taskboard")
        parent = propagate.extract(headers)
        with tracer.start_as_current_span(
            f"{method} {path}",
            context=parent,
            kind=SpanKind.SERVER,
            record_exception=False,
            set_status_on_exception=False,
        ) as span:
            yield span


    def trace_id(span):
        if span is None:
            return None
        context = span.get_span_context()
        return format(context.trace_id, "032x") if context.is_valid else None


    def finish(span, method, route, status, user=None, error=None):
        if span is None:
            return
        span.update_name(f"{method} {route}")
        span.set_attribute("http.request.method", method)
        span.set_attribute("http.route", route)
        span.set_attribute("http.response.status_code", status)
        if user:
            span.set_attribute("enduser.id", user)
        if error is not None:
            span.record_exception(error)
            span.set_status(Status(StatusCode.ERROR, str(error)))
        elif status >= 500:
            span.set_status(Status(StatusCode.ERROR))
