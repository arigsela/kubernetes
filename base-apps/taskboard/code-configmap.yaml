    """Taskboard server entry point: python3 taskboard/server.py

    Reads its configuration from environment variables (docs/configuration.md),
    migrates and seeds the SQLite database, then serves HTTP on 0.0.0.0:$PORT.
    """

    import logging
    import signal
    import sys
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import app as application
    import config
    import logs

    log = logging.getLogger("taskboard.server")

    MAX_BODY = 1024 * 1024


    def make_handler(app):
        class Handler(BaseHTTPRequestHandler):
            server_version = "taskboard"

            def _serve(self):
                length = int(self.headers.get("Content-Length") or 0)
                body = self.rfile.read(min(length, MAX_BODY)) if length else b""
                response = app.handle(self.command, self.path, self.headers.items(), body)
                self.send_response(response.status)
                if response.body or response.status != 204:
                    self.send_header("Content-Type", response.content_type)
                for name, value in response.headers.items():
                    self.send_header(name, value)
                self.send_header("Content-Length", str(len(response.body)))
                self.end_headers()
                self.wfile.write(response.body)

            do_GET = do_POST = do_PATCH = do_PUT = do_DELETE = _serve

            def log_message(self, format, *args):
                pass  # App.handle logs every request as JSON

        return Handler


    def main():
        try:
            settings = config.load_config()
        except config.ConfigError as exc:
            logs.setup("INFO")
            logs.event(log, "config_error", level=logging.ERROR, error=str(exc))
            return 1
        logs.setup(settings.log_level)
        app = application.App(settings)
        app.start()
        server = ThreadingHTTPServer(("0.0.0.0", settings.port), make_handler(app))

        def shutdown(signum, frame):
            logs.event(log, "shutting_down", signal=signal.Signals(signum).name)
            threading.Thread(target=server.shutdown, daemon=True).start()

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT, shutdown)
        logs.event(log, "listening", port=settings.port, commit=settings.commit)
        server.serve_forever()
        app.stop()
        server.server_close()
        return 0


    if __name__ == "__main__":
        sys.exit(main())
