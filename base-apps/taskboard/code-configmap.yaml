    """The status workflow. Rule IDs (S1, S2, ...) refer to docs/statuses.md.

    Who may move a task at all is P4 (permissions.py); this module decides which
    moves exist and when a move conflicts with the state of the board.
    """

    import permissions

    # (from, to) -> the rule that allows the move
    TRANSITIONS = {
        ("open", "in_progress"): "S1",
        ("in_progress", "done"): "S2",
        ("in_progress", "open"): "S3",
        ("done", "open"): "S4",
    }


    class Conflict(Exception):
        def __init__(self, rule, detail):
            super().__init__(detail)
            self.rule = rule
            self.detail = detail


    def check_transition(user, task, to_status, assignee_in_progress, wip_limit):
        """Returns the rule that allows moving task to to_status, or None if it is already there.

        assignee_in_progress is how many tasks the task's assignee has in progress now.
        """
        from_status = task["status"]
        if from_status == to_status:
            return None
        rule = TRANSITIONS.get((from_status, to_status))
        if rule is None:
            raise Conflict("S5", f"a task cannot move from {from_status} to {to_status}")
        if rule == "S4":
            permissions.require(user, "reopen", task)
        if to_status == "in_progress" and assignee_in_progress >= wip_limit:
            raise Conflict("S6", f"{task['assignee']} already has {assignee_in_progress} tasks in progress (limit {wip_limit})")
        return rule
