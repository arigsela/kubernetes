    "use strict";

    // The board page. Every request names the picked user in X-User (docs/permissions.md).

    const state = {
      user: readUser(),
      view: "board", // or "overdue"
      me: null,
    };

    function readUser() {
      try {
        return localStorage.getItem("taskboard.user") || "dana";
      } catch (e) {
        return "dana";
      }
    }

    function saveUser(name) {
      try {
        localStorage.setItem("taskboard.user", name);
      } catch (e) {
        /* private window: keep it for this page only */
      }
    }

    async function api(method, path, body) {
      const options = { method, headers: { "X-User": state.user } };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const response = await fetch(path, options);
      let data = null;
      if (response.status !== 204) {
        try {
          data = await response.json();
        } catch (e) {
          data = null;
        }
      }
      if (!response.ok) {
        throw new Error(describeError(response.status, data));
      }
      return data;
    }

    function describeError(status, data) {
      if (!data) return `Request failed (${status})`;
      switch (data.error) {
        case "forbidden":
          return `Not allowed (rule ${data.rule})`;
        case "unauthorized":
          return `${state.user} is not a Taskboard user`;
        case "conflict":
          return `${data.detail} (rule ${data.rule})`;
        case "internal":
          return `Something went wrong. Request id: ${data.request_id}`;
        default:
          return data.detail || data.error || `Request failed (${status})`;
      }
    }

    function today() {
      return new Date().toISOString().slice(0, 10); // UTC, like the server
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function say(text, ok) {
      const message = document.getElementById("message");
      message.textContent = text || "";
      message.className = ok ? "ok" : "";
    }

    async function loadMe() {
      state.me = await api("GET", "/api/me");
      const picker = document.getElementById("user");
      const assignee = document.querySelector("#new-task select[name=assignee]");
      picker.replaceChildren();
      assignee.replaceChildren();
      for (const user of state.me.users) {
        const option = el("option", `${user.name} (${user.role})`);
        option.value = user.name;
        option.selected = user.name === state.user;
        picker.append(option);
        if (user.role !== "viewer") {
          const choice = el("option", user.name);
          choice.value = user.name;
          choice.selected = user.name === state.user;
          assignee.append(choice);
        }
      }
      const features = state.me.features || {};
      document.getElementById("show-overdue").hidden = !features.overdue_view;
    }

    async function loadBoard() {
      const overdue = state.view === "overdue";
      const query = overdue ? `?due_before=${today()}` : "";
      const data = await api("GET", `/api/tasks${query}`);
      let shown = data.tasks;
      if (overdue) shown = shown.filter((task) => task.status !== "done");
      const note = overdue
        ? `Overdue: not done and due before ${today()}. ${shown.length} task(s).`
        : `${data.tasks.length} of ${data.total} task(s).`;
      document.getElementById("view-note").textContent = note;
      render(shown);
    }

    function render(tasks) {
      for (const column of document.querySelectorAll(".column")) {
        const cards = column.querySelector(".cards");
        cards.replaceChildren();
        for (const task of tasks.filter((t) => t.status === column.dataset.status)) {
          cards.append(card(task));
        }
      }
    }

    function card(task) {
      const node = el("div", null, "card");
      node.append(el("div", task.title, "title"));
      const meta = el("div", `#${task.id} · ${task.project} · ${task.assignee}`, "meta");
      if (task.due_date) {
        const late = task.status !== "done" && task.due_date < today();
        meta.append(" · ", el("span", `due ${task.due_date}`, late ? "late" : ""));
      }
      node.append(meta);
      const actions = el("div", null, "actions");
      const moves = {
        open: [["Start", "in_progress"]],
        in_progress: [["Done", "done"], ["Back to open", "open"]],
        done: [["Reopen", "open"]],
      }[task.status];
      for (const [label, status] of moves) {
        actions.append(button(label, () => move(task, status)));
      }
      if (state.me && state.me.role === "admin") {
        actions.append(button("Delete", () => remove(task)));
      }
      node.append(actions);
      return node;
    }

    function button(label, onClick) {
      const node = el("button", label);
      node.type = "button";
      node.addEventListener("click", onClick);
      return node;
    }

    async function move(task, status) {
      try {
        await api("PATCH", `/api/tasks/${task.id}`, { status });
        say(`#${task.id} moved to ${status.replace("_", " ")}`, true);
      } catch (e) {
        say(e.message);
      }
      await refresh();
    }

    async function remove(task) {
      try {
        await api("DELETE", `/api/tasks/${task.id}`);
        say(`#${task.id} deleted`, true);
      } catch (e) {
        say(e.message);
      }
      await refresh();
    }

    async function refresh() {
      try {
        await loadBoard();
      } catch (e) {
        say(e.message);
      }
    }

    function setView(view) {
      state.view = view;
      document.getElementById("show-board").classList.toggle("active", view === "board");
      document.getElementById("show-overdue").classList.toggle("active", view === "overdue");
      say("");
      refresh();
    }

    document.getElementById("user").addEventListener("change", async (event) => {
      state.user = event.target.value;
      saveUser(state.user);
      say("");
      await start();
    });

    document.getElementById("show-board").addEventListener("click", () => setView("board"));
    document.getElementById("show-overdue").addEventListener("click", () => setView("overdue"));

    document.getElementById("new-task").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const body = {
        title: form.title.value.trim(),
        project: form.project.value,
        assignee: form.assignee.value,
      };
      if (form.due_date.value) body.due_date = form.due_date.value;
      try {
        const task = await api("POST", "/api/tasks", body);
        say(`#${task.id} created`, true);
        form.title.value = "";
        form.due_date.value = "";
      } catch (e) {
        say(e.message);
      }
      await refresh();
    });

    async function start() {
      try {
        await loadMe();
        await loadBoard();
      } catch (e) {
        say(e.message);
      }
    }

    start();
  app.py: |
    """Taskboard HTTP application: routing, handlers and request telemetry.

    App.handle() takes a method, target, headers and body and returns a Response,
    so tests can call it directly. server.py adapts it to http.server.
    """

    import json
    import logging
    import os
    import re
    import time
    import uuid
    from contextlib import contextmanager
    from dataclasses import dataclass, field
    from datetime import date, datetime
    from urllib.parse import parse_qs, urlsplit

    import archive
    import db
    import logs
    import metrics
    import permissions
    import seed
    import tasks
    import tracing
    import workflow

    log = logging.getLogger("taskboard.http")
    events = logging.getLogger("taskboard.tasks")
    access_log = logging.getLogger("taskboard.permissions")
    config_log = logging.getLogger("taskboard.config")

    _REQUEST_ID = re.compile(r"^[A-Za-z0-9._:-]{1,64}$")
    _DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
    # Routes whose request lines are logged at DEBUG unless they fail (probes and scrapes).
    _QUIET_ROUTES = {"/healthz", "/metrics"}
    _HERE = os.path.dirname(os.path.abspath(__file__))
    _STATIC = {"/": ("index.html", "text/html; charset=utf-8"), "/app.js": ("app.js", "text/javascript; charset=utf-8")}


    class HttpError(Exception):
        def __init__(self, status, error, **extra):
            super().__init__(error)
            self.status = status
            self.body = {"error": error, **extra}


    @dataclass
    class Response:
        status: int
        body: bytes = b""
        content_type: str = "application/json"
        headers: dict = field(default_factory=dict)


    def json_response(status, payload):
        return Response(status, json.dumps(payload).encode())


    @dataclass
    class Request:
        method: str
        path: str
        query: dict
        headers: dict
        body: bytes
        request_id: str
        route: str = "unmatched"
        user: str | None = None
        role: str | None = None
        task_id: int | None = None

        def param(self, name, default=None):
            values = self.query.get(name)
            return values[-1] if values else default

        def json(self):
            if not self.body:
                return {}
            try:
                data = json.loads(self.body)
            except ValueError:
                raise HttpError(400, "bad_request", detail="body is not valid JSON") from None
            if not isinstance(data, dict):
                raise HttpError(400, "bad_request", detail="body must be a JSON object")
            return data


    def _text(data, name, required=False, limit=200):
        value = data.get(name)
        if value is None:
            if required:
                raise HttpError(400, "bad_request", detail=f"{name} is required")
            return None
        if not isinstance(value, str) or not value.strip():
            raise HttpError(400, "bad_request", detail=f"{name} must be a non-empty string")
        if len(value) > limit:
            raise HttpError(400, "bad_request", detail=f"{name} is longer than {limit} characters")
        return value.strip()


    def _reject_unknown(data, allowed):
        unknown = sorted(set(data) - set(allowed))
        if unknown:
            raise HttpError(400, "bad_request", detail=f"unknown field(s): {', '.join(unknown)}")


    def _int_param(value, name, minimum=1):
        try:
            number = int(value)
        except (TypeError, ValueError):
            raise HttpError(400, "bad_request", detail=f"{name} must be a whole number") from None
        if number < minimum:
            raise HttpError(400, "bad_request", detail=f"{name} must be at least {minimum}")
        return number


    def _is_date(value):
        if not _DATE.match(value):
            return False
        try:
            date.fromisoformat(value)
        except ValueError:
            return False
        return True


    def _bool_param(value, name):
        if value.lower() in ("true", "1", "yes"):
            return True
        if value.lower() in ("false", "0", "no", ""):
            return False
        raise HttpError(400, "bad_request", detail=f"{name} must be true or false")


    class App:
        def __init__(self, config):
            self.config = config
            self.registry = metrics.Registry()
            self.requests_total = self.registry.counter(
                "taskboard_http_requests_total",
                "HTTP requests by method, route template and status code.",
                ("method", "route", "status"),
            )
            self.request_seconds = self.registry.histogram(
                "taskboard_http_request_duration_seconds",
                "HTTP request duration in seconds by route template.",
                ("route",),
            )
            self.permission_denied_total = self.registry.counter(
                "taskboard_permission_denied_total",
                "Requests refused by a permission rule (401 for P2, 403 otherwise).",
                ("rule",),
            )
            self.status_changes_total = self.registry.counter(
                "taskboard_status_changes_total", "Task status changes.", ("from", "to")
            )
            self.conflicts_total = self.registry.counter(
                "taskboard_conflicts_total", "Status changes refused by a workflow rule (409).", ("rule",)
            )
            self.archive_runs_total = self.registry.counter("taskboard_archive_runs_total", "Archive job runs.")
            self.tasks_archived_total = self.registry.counter(
                "taskboard_tasks_archived_total", "Done tasks archived by the archive job."
            )
            self.registry.gauge(
                "taskboard_tasks", "Tasks on the board by status (archived tasks excluded).", ("status",), self._task_counts
            )
            self.registry.gauge(
                "taskboard_build_info",
                "Always 1; the commit label names the Taskboard commit that is running.",
                ("commit",),
                lambda: [((config.commit,), 1)],
            )
            self._routes = []
            self._static = {}
            for path, (name, content_type) in _STATIC.items():
                with open(os.path.join(_HERE, name), "rb") as f:
                    self._static[path] = Response(200, f.read(), content_type, {"Cache-Control": "no-cache"})
            for method, template, handler in (
                ("GET", "/", self._page),
                ("GET", "/app.js", self._page),
                ("GET", "/healthz", self._healthz),
                ("GET", "/metrics", self._metrics),
                ("GET", "/api/me", self._me),
                ("GET", "/api/tasks", self._list_tasks),
                ("POST", "/api/tasks", self._create_task),
                ("GET", "/api/tasks/{id}", self._get_task),
                ("PATCH", "/api/tasks/{id}", self._update_task),
                ("DELETE", "/api/tasks/{id}", self._delete_task),
            ):
                pattern = re.compile("^" + template.replace("{id}", r"(?P<id>\d+)") + "$")
                self._routes.append((method, template, pattern, handler))
            self._archive_job = archive.ArchiveJob(self.archive_now, config.archive_interval_seconds)

        # -- lifecycle -----------------------------------------------------------------

        def start(self):
            """Log the configuration, migrate and seed the database, then start the archive job."""
            logs.event(config_log, "config_loaded", **self.config.public())
            with self.connection() as conn:
                db.migrate(conn, tasks.iso(tasks.utcnow()))
                if self.config.seed_demo_data:
                    seed.seed_if_empty(conn, self.config.users)
            self.archive_now()
            self._archive_job.start()

        def stop(self):
            self._archive_job.stop()

        def archive_now(self, now=None):
            """One run of the archive job (S7). Returns how many tasks it archived."""
            with self.connection() as conn:
                archived = archive.run_once(conn, self.config.archive_done_after_days, now)
            self.archive_runs_total.inc()
            self.tasks_archived_total.inc(amount=archived)
            return archived

        @contextmanager
        def connection(self):
            conn = db.connect(self.config.db_path)
            try:
                yield conn
            finally:
                conn.close()

        # -- request handling ------------------------------------------------------------

        def handle(self, method, target, headers, body=b""):
            started = time.perf_counter()
            headers = {str(k).lower(): v for k, v in dict(headers).items()}
            parts = urlsplit(target)
            incoming_id = headers.get("x-request-id", "")
            request_id = incoming_id if _REQUEST_ID.match(incoming_id) else uuid.uuid4().hex[:16]
            req = Request(method, parts.path, parse_qs(parts.query), headers, body, request_id)
            req.user = headers.get("x-user") or None
            context = {"request_id": request_id}
            token = logs.request_context.set(context)
            error = None
            try:
                with tracing.request_span(method, parts.path, headers) as span:
                    context["trace_id"] = tracing.trace_id(span)
                    try:
                        response = self._dispatch(req)
                    except HttpError as exc:
                        response = json_response(exc.status, exc.body)
                    except permissions.Forbidden as exc:
                        self._denied(req, exc.rule, exc.action)
                        response = json_response(403, {"error": "forbidden", "rule": exc.rule})
                    except workflow.Conflict as exc:
                        self.conflicts_total.inc(exc.rule)
                        logs.event(events, "conflict", rule=exc.rule, user=req.user, task_id=req.task_id, detail=exc.detail)
                        response = json_response(409, {"error": "conflict", "rule": exc.rule, "detail": exc.detail})
                    except Exception as exc:  # anything else is a bug: log it and answer 500
                        error = exc
                        response = json_response(500, {"error": "internal", "request_id": request_id})
                    tracing.finish(span, method, req.route, response.status, req.user, error)
                duration = time.perf_counter() - started
                self._log_request(req, parts.query, response.status, duration, error)
            finally:
                logs.request_context.reset(token)
            self.requests_total.inc(method, req.route, response.status)
            self.request_seconds.observe(duration, req.route)
            response.headers["X-Request-Id"] = request_id
            return response

        def _dispatch(self, req):
            allowed = []
            for method, template, pattern, handler in self._routes:
                match = pattern.match(req.path)
                if not match:
                    continue
                req.route = template
                if method == req.method:
                    if template.startswith("/api/"):
                        return handler(req, self._identify(req), **match.groupdict())
                    return handler(req, **match.groupdict())
                allowed.append(method)
            if allowed:
                raise HttpError(405, "method_not_allowed", allowed=allowed)
            raise HttpError(404, "not_found")

        def _log_request(self, req, query, status, duration, error):
            fields = {
                "user": req.user,
                "role": req.role,
                "method": req.method,
                "route": req.route,
                "path": req.path,
                "query": query or None,
                "status": status,
                "duration_ms": round(duration * 1000, 2),
            }
            if req.task_id is not None:
                fields["task_id"] = req.task_id
            if error is not None:
                fields["error"] = logs.describe_error(error)
                fields["stack"] = logs.compact_stack(error.__traceback__)
            if status >= 500:
                level = logging.ERROR
            elif status >= 400:
                level = logging.WARNING
            elif req.route in _QUIET_ROUTES:
                level = logging.DEBUG
            else:
                level = logging.INFO
            logs.event(log, "request", level=level, **fields)

        def _identify(self, req):
            """P2: every /api/ request names a configured user in X-User."""
            user = permissions.identify(self.config.users, req.user)
            if user is None:
                self._denied(req, "P2", "identify")
                raise HttpError(401, "unauthorized", rule="P2")
            req.role = user.role
            return user

        def _denied(self, req, rule, action):
            self.permission_denied_total.inc(rule)
            logs.event(
                access_log,
                "permission_denied",
                level=logging.WARNING,
                rule=rule,
                user=req.user,
                role=req.role,
                action=action,
                task_id=req.task_id,
            )

        def _task_counts(self):
            with self.connection() as conn:
                counts = tasks.count_by_status(conn)
            return [((status,), count) for status, count in counts.items()]

        # -- handlers ----------------------------------------------------------------------

        def _page(self, req):
            page = self._static[req.path]
            return Response(page.status, page.body, page.content_type, dict(page.headers))

        def _healthz(self, req):
            with self.connection() as conn:
                conn.execute("SELECT 1").fetchone()
            return json_response(200, {"status": "ok", "commit": self.config.commit})

        def _metrics(self, req):
            return Response(200, self.registry.render().encode(), "text/plain; version=0.0.4; charset=utf-8")

        def _me(self, req, user):
            users = [{"name": name, "role": role} for name, role in self.config.users.items()]
            features = {"overdue_view": self.config.feature_overdue_view}
            return json_response(200, {"user": user.name, "role": user.role, "users": users, "features": features})

        def _list_tasks(self, req, user):
            permissions.require(user, "read")
            status = req.param("status")
            if status is not None and status not in tasks.STATUSES:
                raise HttpError(400, "bad_request", detail=f"status must be one of {', '.join(tasks.STATUSES)}")
            due_before = req.param("due_before")
            if due_before is not None and not _is_date(due_before):
                raise HttpError(400, "bad_request", detail="due_before must be a date, YYYY-MM-DD")
            include_archived = _bool_param(req.param("include_archived", "false"), "include_archived")
            page = _int_param(req.param("page", "1"), "page")
            with self.connection() as conn:
                result = tasks.list_tasks(
                    conn,
                    status=status,
                    assignee=req.param("assignee"),
                    due_before=due_before,
                    include_archived=include_archived,
                    page=page,
                    page_size=self.config.page_size,
                )
            return json_response(200, result)

        def _get_task(self, req, user, id):
            req.task_id = int(id)
            permissions.require(user, "read")
            with self.connection() as conn:
                task = self._load(conn, req.task_id)
                task["events"] = tasks.events_for(conn, req.task_id)
            return json_response(200, task)

        def _create_task(self, req, user):
            permissions.require(user, "create")
            data = req.json()
            _reject_unknown(data, ("project", "title", "assignee", "due_date"))
            title = _text(data, "title", required=True)
            project = _text(data, "project", limit=60) or "general"
            created_by = user.name
            assignee = _text(data, "assignee", limit=60) or created_by
            self._check_assignee(assignee)
            due_date = self._due_date(data.get("due_date"))
            with self.connection() as conn, db.transaction(conn):
                task = tasks.create_task(
                    conn, project=project, title=title, created_by=created_by, assignee=assignee, due_date=due_date
                )
            req.task_id = task["id"]
            logs.event(events, "task_created", task_id=task["id"], project=project, assignee=assignee, created_by=created_by)
            return json_response(201, task)

        def _update_task(self, req, user, id):
            req.task_id = int(id)
            data = req.json()
            _reject_unknown(data, ("status", "assignee", "title", "due_date"))
            changes = {}
            if "status" in data:
                if data["status"] not in tasks.STATUSES:
                    raise HttpError(400, "bad_request", detail=f"status must be one of {', '.join(tasks.STATUSES)}")
                changes["status"] = data["status"]
            if "assignee" in data:
                changes["assignee"] = _text(data, "assignee", required=True, limit=60)
                self._check_assignee(changes["assignee"])
            if "title" in data:
                changes["title"] = _text(data, "title", required=True)
            if "due_date" in data:
                changes["due_date"] = self._due_date(data["due_date"])
            if not changes:
                raise HttpError(400, "bad_request", detail="nothing to change")
            with self.connection() as conn, db.transaction(conn):
                task = self._load(conn, req.task_id)
                if "status" in changes:
                    permissions.require(user, "change_status", task)
                    in_progress = tasks.count_in_progress(conn, task["assignee"])
                    if not workflow.check_transition(user, task, changes["status"], in_progress, self.config.wip_limit):
                        del changes["status"]  # already there
                if "assignee" in changes:
                    permissions.require(user, "reassign", task)
                if "title" in changes or "due_date" in changes:
                    permissions.require(user, "edit", task)
                updated =tasks.update_task(conn, task, changes, actor=user.name) if changes else task
            if updated["status"] != task["status"]:
                self.status_changes_total.inc(task["status"], updated["status"])
                logs.event(
                    events,
                    "status_changed",
                    task_id=task["id"],
                    actor=user.name,
                    assignee=task["assignee"],
                    created_by=task["created_by"],
                    **{"from": task["status"], "to": updated["status"]},
                )
            if updated["assignee"] != task["assignee"]:
                logs.event(
                    events, "task_reassigned", task_id=task["id"], actor=user.name, **{"from": task["assignee"], "to": updated["assignee"]}
                )
            return json_response(200, updated)

        def _delete_task(self, req, user, id):
            req.task_id = int(id)
            permissions.require(user, "delete")
            with self.connection() as conn, db.transaction(conn):
                self._load(conn, req.task_id)
                tasks.delete_task(conn, req.task_id)
            logs.event(events, "task_deleted", task_id=req.task_id, actor=user.name)
            return Response(204)

        # -- helpers -------------------------------------------------------------------------

        def _load(self, conn, task_id):
            task = tasks.get_task(conn, task_id)
            if task is None:
                raise HttpError(404, "not_found", task_id=task_id)
            return task

        def _check_assignee(self, name):
            if self.config.users.get(name) not in permissions.EDITOR_ROLES:
                raise HttpError(400, "bad_request", detail=f"assignee {name!r} is not an editor or admin")

        def _due_date(self, value):
            """The due date as stored: YYYY-MM-DD (docs/api.md).

            A date and time (2026-10-31T17:00) is accepted too; only its date is kept.
            """
            if value is None:
                return None
            if isinstance(value, str):
                text = value.strip()
                if _is_date(text):
                    return text
                try:
                    return datetime.fromisoformat(text).date().isoformat()
                except ValueError:
                    pass
            raise HttpError(400, "bad_request", detail="due_date must be a date, YYYY-MM-DD")
