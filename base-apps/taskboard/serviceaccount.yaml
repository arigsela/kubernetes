# base-apps/taskboard/serviceaccount.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskboard
  namespace: taskboard
  labels:
    app: taskboard
automountServiceAccountToken: false   # it never talks to the API server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskboard-traffic
  namespace: taskboard
  labels:
    app: taskboard-traffic
automountServiceAccountToken: false   # it only calls the taskboard Service
