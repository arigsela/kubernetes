# What kagent's ModelConfigs point at (baseUrl http://model-gateway.model-gateway.svc.cluster.local:8080).
# One replica (deployment.yaml), so nothing to pin.
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: model-gateway
  labels:
    app: model-gateway
spec:
  type: ClusterIP
  selector:
    app: model-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
