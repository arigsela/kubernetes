# The gateway talks to nothing in the Kubernetes API: no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-gateway
  namespace: model-gateway
automountServiceAccountToken: false
---
# External Secrets' identity for this namespace's Vault reads (Vault role model-gateway:
# kagent-anthropic, model-gateway-keys, model-gateway-db; scripts/provision-model-gateway-vault.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-model-gateway
  namespace: model-gateway
