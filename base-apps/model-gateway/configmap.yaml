# The model gateway's config (agentgateway v1.6.0, standalone). GENERATED by
# scripts/gen-model-budgets.py from base-apps/model-gateway/budgets.yaml and the collector's prices:
# edit those, then run `scripts/gen-model-budgets.py --write`. Spec §3.1a, §3.2.
#
# Two listeners in one process. The front (8080), which Substrate's egress connects to, proxies to
# the llm listener (127.0.0.1:8081), which checks the group's virtual key and its daily budget and
# swaps in the real key. The front exists for one rule: it marks the gateway's own budget refusal
# x-should-retry: false, so a blocked agent fails at once instead of sleeping until midnight.
# $MODEL_GATEWAY_KEY_* are expanded from the environment (Secret model-gateway-env) when the
# gateway reads this file, and the database password comes from PGPASSWORD: no secret is in git or
# in the gateway's startup log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-config
  namespace: model-gateway
  labels:
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/part-of: model-gateway
data:
  config.yaml: |
    config:
      statsAddr: 0.0.0.0:15020
      readinessAddr: 0.0.0.0:15021
      database:
        url: postgres://model_gateway@postgresql.postgresql.svc.cluster.local:5432/model_gateway?sslmode=disable
      modelCatalog:
        - inline:
            providers:
              anthropic:
                models:
                  claude-haiku-5-5:
                    rates:
                      input: '0.1'
                      output: '0.5'
                      cacheRead: '0.01'
                      cacheWrite: '0.125'
                    tiers:
                      - contextOver: 100000
                        rates:
                          input: '0.5'
                          output: '2.5'
                          cacheRead: '0.05'
                          cacheWrite: '0.625'
                  claude-sonnet-5-5:
                    rates:
                      input: '2.0'
                      output: '10.0'
                      cacheRead: '0.2'
                      cacheWrite: '2.5'
      metrics:
        fields:
          add:
            group: default(apiKey.group, "")
    binds:
      - port: 8080
        listeners:
          - name: front
            protocol: HTTP
            routes:
              - name: budget-listener
                policies:
                  transformations:
                    response:
                      set:
                        x-should-retry: 'response.code == 429 && !("request-id" in response.headers) ? "false" : ("x-should-retry" in response.headers ? response.headers["x-should-retry"]
                          : "")'
                backends:
                  - host: 127.0.0.1:8081
                    weight: 100
    gateways:
      llm:
        port: 8081
        bindAddress: 127.0.0.1
    llm:
      gateways: llm
      models:
        - name: claude-haiku-5-5
          provider: anthropic
          passthrough: detect
          params:
            apiKey: &id001
              file: /var/run/model-gateway/anthropic/api-key
        - name: claude-sonnet-5-5
          provider: anthropic
          passthrough: detect
          params:
            apiKey: *id001
      policies:
        apiKey:
          mode: strict
          location:
            header:
              name: x-api-key
          keys:
            - key: $MODEL_GATEWAY_KEY_HK
              metadata:
                name: hk
                group: hk
              allowedModels:
                - claude-sonnet-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 6.0
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_BUILD
              metadata:
                name: build
                group: build
              allowedModels:
                - claude-sonnet-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 10.0
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_IMPLEMENTER
              metadata:
                name: implementer
                group: implementer
              allowedModels:
                - claude-sonnet-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 4.0
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_RESTARTER
              metadata:
                name: restarter
                group: restarter
              allowedModels:
                - claude-sonnet-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 4.0
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_DOCS_CHECKER
              metadata:
                name: docs-checker
                group: docs-checker
              allowedModels:
                - claude-sonnet-5-5
                - claude-haiku-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 2.5
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_BUG_INVESTIGATOR
              metadata:
                name: bug-investigator
                group: bug-investigator
              allowedModels:
                - claude-sonnet-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 8.0
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_K8S_READER
              metadata:
                name: k8s-reader
                group: k8s-reader
              allowedModels:
                - claude-haiku-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 0.5
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_SKILL_SUGGESTER
              metadata:
                name: skill-suggester
                group: skill-suggester
              allowedModels:
                - claude-haiku-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 0.5
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_DCC
              metadata:
                name: dcc
                group: dcc
              allowedModels:
                - claude-haiku-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 0.5
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: $MODEL_GATEWAY_KEY_UI_DEFAULT
              metadata:
                name: ui-default
                group: ui-default
              allowedModels:
                - claude-haiku-5-5
              budgets:
                - name: daily
                  limit:
                    unit: USD
                    amount: 0.5
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
    frontendPolicies:
      tracing:
        host: otel-collector.tracing.svc.cluster.local:4317
        protocol: grpc
        randomSampling: 'true'
        resources:
          service.name: '"model-gateway"'
