# The model gateway (spec §3): agentgateway v1.6.0, our own static image (the MCP adapters' one,
# images/agentgateway/), on the generated configmap.yaml.
#
# ONE replica, on purpose (final review I1, spec §3.1a). Sharing budget counts between replicas
# through Postgres failed in about one local proof run in three, and nothing can keep two replicas
# in an active/standby split: Substrate's egress, the only client, restarts twice a day
# (substrate cert-restart-cronjob), so ClientIP affinity would re-pick a replica every 12 hours.
# One replica counts exactly. A config change rolls with maxSurge 1 / maxUnavailable 0, so the new
# pod serves before the old one drains; a node drain or a crash is a short outage of every
# group on the gateway ("Model gateway down" alerts after 5 minutes). No PodDisruptionBudget: with
# one replica it would block every node drain.
#
# The image is FROM scratch: no shell, so httpGet probes. Read-only root, an emptyDir at /tmp,
# UID 65532 (the image's user), as the local proof ran it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: model-gateway
  labels:
    app: model-gateway
    app.kubernetes.io/name: model-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
        app.kubernetes.io/name: model-gateway
      annotations:
        # sha256 of configmap.yaml's data (scripts/gen-model-budgets.py writes it): a budget change
        # rolls the pods. agentgateway also watches its file, but a rollout is the reviewed path.
        checksum/config: 06e89cba731703b7d8ea2915186985744988936fba6688d708b5374237bf187a
        # The gateway reads its keys from the environment once, at start. After
        # scripts/provision-model-gateway-vault.sh --rotate <group>, bump this (a pull request) so the
        # pods restart on the new key (runbook, "Rotate a virtual key").
        model-gateway.homelab/keys-rotated-at: "never"
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: model-gateway
      automountServiceAccountToken: false
      nodeSelector:
        node.kubernetes.io/workload: application
      # A model stream at maxTokens 16000 runs well past agentgateway's default 5 s drain, and a
      # stream cut mid-way is not retried (final review I2). agentgateway drains for
      # TERMINATION_GRACE_PERIOD_SECONDS - 5, then closes what is left before the kubelet's SIGKILL.
      terminationGracePeriodSeconds: 180
      # The image is FROM scratch: no trust store, so agentgateway (rustls-native-certs) could not
      # verify api.anthropic.com (live 2026-10-23: every call 503 "invalid peer certificate:
      # UnknownIssuer"). Copy the CA bundle of the repo's pinned alpine into an emptyDir the gateway
      # reads through SSL_CERT_FILE. A new bundle comes with an alpine bump (Renovate). Local proof
      # check 14 runs both cases against the real API.
      initContainers:
        - name: ca-bundle
          image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["cp", "/etc/ssl/certs/ca-certificates.crt", "/ca/ca-certificates.crt"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/agentgateway:v1.6.0@sha256:083adf216093ed57813debcfdbb5f6aa9cb119741b373455233f6c0605faca2d
          args: ["-f", "/config/config.yaml"]
          # MODEL_GATEWAY_KEY_<GROUP> (expanded into configmap.yaml) and PGPASSWORD (the database
          # login; the URL in the config carries none, because the startup log prints it).
          envFrom:
            - secretRef:
                name: model-gateway-env
          env:
            - name: TERMINATION_GRACE_PERIOD_SECONDS
              value: "180"   # = terminationGracePeriodSeconds (tests/model-gateway)
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 15020
              name: metrics
            - containerPort: 15021
              name: ready
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: anthropic
              mountPath: /var/run/model-gateway/anthropic
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: ca-bundle
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: model-gateway-config
        - name: anthropic
          secret:
            secretName: model-gateway-anthropic
            items:
              - key: api-key
                path: api-key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: ca-bundle
          emptyDir:
            sizeLimit: 4Mi
