# The real Anthropic key: the same Vault entry kagent reads today (k8s-secrets/kagent-anthropic).
# Mounted as a file the gateway reads (params.apiKey.file in configmap.yaml) and watches, so a
# rotated key is picked up without a restart. Once every group uses the gateway the kagent copy
# goes (spec §4, last step) and this is the only copy outside eval-gate's judge key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-gateway-anthropic
  namespace: model-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-model-gateway
    kind: SecretStore
  target:
    name: model-gateway-anthropic
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kagent-anthropic
        property: anthropic-api-key
