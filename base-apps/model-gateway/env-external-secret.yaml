# The gateway's environment: each group's virtual key (expanded into configmap.yaml) and the
# database password (sqlx reads PGPASSWORD). GENERATED by scripts/gen-model-budgets.py from
# budgets.yaml: a new group gets its key here. Vault: k8s-secrets/model-gateway-keys (one
# property per group) and k8s-secrets/model-gateway-db (scripts/provision-model-gateway-vault.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-gateway-env
  namespace: model-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-model-gateway
    kind: SecretStore
  target:
    name: model-gateway-env
    creationPolicy: Owner
  data:
    - secretKey: MODEL_GATEWAY_KEY_HK
      remoteRef:
        key: model-gateway-keys
        property: hk
    - secretKey: MODEL_GATEWAY_KEY_BUILD
      remoteRef:
        key: model-gateway-keys
        property: build
    - secretKey: MODEL_GATEWAY_KEY_IMPLEMENTER
      remoteRef:
        key: model-gateway-keys
        property: implementer
    - secretKey: MODEL_GATEWAY_KEY_RESTARTER
      remoteRef:
        key: model-gateway-keys
        property: restarter
    - secretKey: MODEL_GATEWAY_KEY_DOCS_CHECKER
      remoteRef:
        key: model-gateway-keys
        property: docs-checker
    - secretKey: MODEL_GATEWAY_KEY_K8S_READER
      remoteRef:
        key: model-gateway-keys
        property: k8s-reader
    - secretKey: MODEL_GATEWAY_KEY_SKILL_SUGGESTER
      remoteRef:
        key: model-gateway-keys
        property: skill-suggester
    - secretKey: MODEL_GATEWAY_KEY_DCC
      remoteRef:
        key: model-gateway-keys
        property: dcc
    - secretKey: MODEL_GATEWAY_KEY_UI_DEFAULT
      remoteRef:
        key: model-gateway-keys
        property: ui-default
    - secretKey: PGPASSWORD
      remoteRef:
        key: model-gateway-db
        property: password
