# base-apps/slack-bridge/external-secret.yaml
---
# The two Slack tokens (§T.120). bot-token (xoxb-…) posts, reacts and reads the channels the
# app is in; app-token (xapp-…, scope connections:write) can only open the Socket Mode
# connection. Neither can decide anything: a decision needs a click Slack attributes to the
# owner's user id. Both are written by scripts/provision-slack-bridge-vault.sh, never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-bridge
  namespace: slack-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-slack-bridge
    kind: SecretStore
  target:
    name: slack-bridge
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: slack-bridge
        property: bot-token
    - secretKey: app-token
      remoteRef:
        key: slack-bridge
        property: app-token
