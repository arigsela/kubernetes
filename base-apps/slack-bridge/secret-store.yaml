# base-apps/slack-bridge/secret-store.yaml
---
# One store, one role, one key (§T.120): slack-bridge → k8s-secrets/slack-bridge only. The bot
# token is a COPY of n8n's (same Slack app), on its own path: a consumer reads only its own
# path (agent-identity invariant 1). The role must exist before this merges
# (scripts/provision-slack-bridge-vault.sh): a SecretStore whose role does not exist fails the
# whole app sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-slack-bridge
  namespace: slack-bridge
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: slack-bridge
          serviceAccountRef:
            name: eso-slack-bridge
