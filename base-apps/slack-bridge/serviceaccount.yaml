# base-apps/slack-bridge/serviceaccount.yaml
# The bridge's identity on the agent platform (§V.98): its projected token (audience kagent)
# is verified by the mesh, so a Slack conversation is owned by
# system:serviceaccount:slack-bridge:slack-bridge, never by the dispatcher and never by the
# UI's shared identity. The same principal is the only one admitted to the dispatcher's
# decide port (base-apps/dispatcher/authorization-policy.yaml).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-bridge
  namespace: slack-bridge
  labels:
    app.kubernetes.io/part-of: agent-guardrails
automountServiceAccountToken: false   # the projected token in deployment.yaml is the only one it needs
---
# ESO's identity for the two Slack tokens: Vault role slack-bridge binds this SA and nothing
# else (scripts/provision-slack-bridge-vault.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-slack-bridge
  namespace: slack-bridge
  labels:
    app.kubernetes.io/part-of: agent-guardrails
