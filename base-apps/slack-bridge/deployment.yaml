# base-apps/slack-bridge/deployment.yaml
---
# One replica, on purpose twice over: Socket Mode delivers each envelope to ONE connection
# (a second replica would split the stream), and the thread→session map and the pending
# buttons live in memory (a restart forgets them; the thread's first reply carries the
# session id for ask-hk).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-bridge
  namespace: slack-bridge
  labels:
    app: slack-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slack-bridge
  template:
    metadata:
      labels:
        app: slack-bridge
      annotations:
        # The pod reads the code ConfigMap once at start; Argo CD updates a ConfigMap in place
        # and nothing restarts the pod, so this checksum changes the pod template instead.
        # scripts/gen-slack-bridge-configmap.py writes it; tests/slack_bridge/test_manifests.py
        # fails if it is stale.
        checksum/code: "f71ae6c7e75fdca4dc4fa4c0753029a5e90c7a6909541ac8f67dc8fa25fc91bf"
    spec:
      serviceAccountName: slack-bridge
      automountServiceAccountToken: false   # never talks to the API server; the projected token below is for kagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slack-bridge
          # Renovate pins the digest on its next run (kubernetes manager, pinDigests for base-apps).
          image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          command: ["python", "-u", "/opt/slack-bridge/slack_bridge.py"]
          env:
            # The ONE Slack user the bridge answers and the email the dispatcher records as
            # the approver when a button is pressed (§V.98). Not secrets; in git on purpose.
            - name: OWNER_SLACK_USER_ID
              value: "U09M73ZPE77"
            - name: OWNER_EMAIL
              value: "arigsela@gmail.com"
            # The zone the owner speaks in. The first message of every session tells the agent,
            # so "the alert last night at 11pm" is a time it can look up; unset = nothing said.
            - name: OWNER_TIMEZONE
              value: "America/New_York"
            - name: DEFAULT_AGENT
              value: homelab-knowledge
            # The agents a first word `name:` may pick. Every one of them, including the two
            # that can act: the owner chose approvals in Slack (design conversation 2026-10-14).
            - name: AGENTS
              value: "homelab-knowledge,k8s-reader,k8s-agent,istio-agent,implementer,restarter,skill-suggester"
            - name: KAGENT_A2A_BASE
              value: http://kagent-controller.kagent.svc.cluster.local:8083
            - name: DISPATCHER_DECIDE_BASE
              value: http://dispatcher-decide.dispatcher.svc.cluster.local:8082
            # ask-hk's default. A deep investigation outlived 300s on 2026-10-15; the stream
            # gives the thread the session id in the first second either way.
            - name: A2A_TIMEOUT
              value: "900"
            - name: PORT
              value: "8080"
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-bridge
                  key: bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-bridge
                  key: app-token
          ports:
            - name: http
              containerPort: 8080
          # /readyz is 503 until Slack has said `hello` on the socket and again after the link
          # drops; nothing routes to the pod, this is for `kubectl get pods` and the runbook.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /opt/slack-bridge
              readOnly: true
            - name: kagent-token
              mountPath: /var/run/kagent
              readOnly: true
            - name: eval-release
              mountPath: /etc/eval-release
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: slack-bridge-code
        # Written by the eval-gate Job after each scored run (V99, base-apps/kagent/eval-release-
        # rbac.yaml): release.json names the agents held after an eval regression. Optional so the
        # pod starts before the first run; absent = unknown = send, logged.
        - name: eval-release
          configMap:
            name: eval-release
            optional: true
        # Projected token, audience kagent, rotated by the kubelet before it expires; the mesh
        # verifies it and sets X-User-Id to this service account (V91, V92). Read on every
        # send, never cached.
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent
                  expirationSeconds: 3600
                  path: token
