# Lets the ingress Gateway in istio-ingress read this namespace's TLS secret (V63).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-n8n-tls
  namespace: n8n
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-ingress
  to:
    - group: ""
      kind: Secret
      name: n8n-tls
