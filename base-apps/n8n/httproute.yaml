# n8n serves two postures on one hostname from one backend: an allow-listed admin
# UI at / and publicly-reachable webhook endpoints. Routing is identical for
# both; the distinction is enforced in the AuthorizationPolicy by path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: n8n
    gethomepage.dev/group: Automation
    gethomepage.dev/icon: n8n.png
    gethomepage.dev/description: Workflow automation
    gethomepage.dev/pod-selector: app=n8n
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-n8n
  hostnames:
    - n8n.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: n8n
          port: 5678
