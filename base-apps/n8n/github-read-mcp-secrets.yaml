# base-apps/n8n/github-read-mcp-secrets.yaml
# PAT B for the read-only GitHub MCP server (github-read-mcp.yaml), n8n bug-investigator POC
# (§T.152, Decision 4). A fine-grained token on arigsela/taskboard with Contents, Pull requests
# and Metadata READ only (arigsela/kubernetes is public).
#
# Its own Vault identity, per the agent-identity contract (templates/agent-identity/README.md,
# invariant 1): Vault path k8s-secrets/n8n-github-read-mcp (property github-token), a policy
# reading only that path, Kubernetes-auth role n8n-github-read-mcp bound to the ESO
# ServiceAccount below. Never the shared `n8n` key or the namespace's vault-backend store.
# scripts/provision-n8n-bug-investigator-vault.sh writes the policy, the role and the token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-n8n-github-read-mcp
  namespace: n8n
  labels:
    app.kubernetes.io/part-of: n8n
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-n8n-github-read-mcp
  namespace: n8n
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "k8s-secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "n8n-github-read-mcp"
          serviceAccountRef:
            name: "eso-n8n-github-read-mcp"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-github-read-mcp-token
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-n8n-github-read-mcp
    kind: SecretStore
  target:
    name: n8n-github-read-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_PERSONAL_ACCESS_TOKEN
      remoteRef:
        key: n8n-github-read-mcp
        property: github-token
