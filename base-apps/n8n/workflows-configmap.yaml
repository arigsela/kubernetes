# GitOps-managed n8n workflows.
#
# n8n stores workflows in its Postgres database, not on disk, so they can't be
# applied as Kubernetes resources directly. Instead this ConfigMap holds the
# workflow JSON, and the n8n Deployment's `import-workflows` initContainer
# imports it into the database with the n8n CLI at pod start. The import upserts
# by the workflow's fixed "id", so re-running is a no-op when nothing changed.
#
# WHY an initContainer and not a PreSync Job: n8n registers webhook routes for
# active workflows only at STARTUP. Importing in an initContainer ties the import
# to the pod lifecycle, so the main container always boots with the workflow
# active and its webhook registered. To make a workflow EDIT take effect, the pod
# must roll — the Deployment carries a `checksum/workflows` pod annotation for
# exactly that: bump it (sha256 of every workflow here; the one-liner is in the
# annotation's comment) when editing here, or
# `kubectl rollout restart deploy/n8n -n n8n`.
#
# wan-ip-rotated.json — the endpoint base-apps/wan-ip-monitor posts to
# (http://n8n.n8n.svc.cluster.local:5678/webhook/wan-ip-rotated). It receives
# BOTH outcomes: a successful reconcile ("event": "wan-ip-reconciled") and a
# crashed run ("event": "wan-ip-monitor-failed", carrying error_type/error).
# Deliberately minimal — one Webhook node, no routing. Before this existed the
# URL 404'd and reconcile.py's notify() swallowed the failure, so a broken WAN
# reconcile was invisible until a protected host started timing out; the value
# here is that the POST lands somewhere durable and visible in n8n's execution
# list. Fan-out to Slack can be added later by wiring nodes after the webhook,
# exactly as grafana-alerts.json does.
#
# grafana-alerts.json — the alert-delivery endpoint Grafana depends on
# (base-apps/logging/grafana-alerting.yaml posts to
# http://n8n.n8n.svc.cluster.local:5678/webhook/grafana-alerts). Three nodes:
#   Webhook (POST /webhook/grafana-alerts)
#     → Code (format Grafana's unified-alerting payload into a Slack message)
#     → HTTP Request (Slack chat.postMessage to #oncall-alerts).
# Slack auth deliberately avoids n8n's encrypted credential store (credential
# objects can't be imported declaratively without sharing the encryption key
# material in Git): the HTTP node reads {{ $env.SLACK_BOT_TOKEN }}, injected
# into the n8n Deployment from the n8n-secrets Secret (Vault key n8n,
# property slack-bot-token).
#
# interview-janitor.json — where the interview-labs janitor (a GitHub Actions
# workflow in a private repo) checks in on every run:
# https://n8n.arigsela.com/webhook/interview-janitor. Its caller runs outside the
# cluster, so the request crosses the Gateway's public webhook path and the WAF,
# and the workflow authenticates it: the X-Janitor-Token header must equal
# $env.INTERVIEW_JANITOR_TOKEN (Vault key n8n, property interview-janitor-token).
# With no token configured, every call is rejected.
#   Webhook (POST /webhook/interview-janitor, answers with the last node)
#     → Code (check the token, record the check-in in the workflow's static
#       data, format the message)
#     → IF findings ("post" not false in the body)
#         yes → HTTP Request (Slack chat.postMessage to #oncall-alerts)
#               → Code (fail unless Slack answered ok)
#         no  → Code (answer ok; all-clear runs never reach Slack)
#   Schedule (every 6 h) → Code (janitor silent 30 h or more? at most one
#     alert a day) → the same Slack post.
# Answering with the last node is what tells the caller it worked: a bad token
# or a Slack error comes back as a 500, which fails the janitor run. Static data
# may not survive a re-import; the watchdog then restarts its clock rather than
# alerting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-workflows
  namespace: n8n
data:
  grafana-alerts.json: |
    {
      "id": "grafana-alerts-slack",
      "name": "Grafana Alerts to Slack",
      "active": true,
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "grafana-alerts",
            "options": {}
          },
          "id": "b1f6c1e0-4a6e-4a01-8000-000000000001",
          "name": "Grafana Webhook",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [0, 0],
          "webhookId": "b1f6c1e0-4a6e-4a01-8000-00000000000a"
        },
        {
          "parameters": {
            "jsCode": "const p = $json.body ?? $json;\nconst status = (p.status || 'unknown').toUpperCase();\nconst emoji = p.status === 'resolved' ? ':white_check_mark:' : ':rotating_light:';\nconst lines = (p.alerts || []).map((a) => {\n  const name = (a.labels && a.labels.alertname) || 'unknown-alert';\n  const sev = a.labels && a.labels.severity ? ' [' + a.labels.severity + ']' : '';\n  const summary = (a.annotations && (a.annotations.summary || a.annotations.description)) || '';\n  return emoji + ' *' + name + '*' + sev + ' (' + a.status + ') ' + summary;\n});\nconst text = ['*Grafana: ' + (p.title || status) + '*', ...lines].join('\\n');\nreturn [{ json: { slack: { channel: '#oncall-alerts', text: text, unfurl_links: false } } }];"
          },
          "id": "b1f6c1e0-4a6e-4a01-8000-000000000002",
          "name": "Format Alert",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [220, 0]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "https://slack.com/api/chat.postMessage",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                {
                  "name": "Authorization",
                  "value": "=Bearer {{ $env.SLACK_BOT_TOKEN }}"
                },
                {
                  "name": "Content-Type",
                  "value": "application/json"
                }
              ]
            },
            "sendBody": true,
            "specifyBody": "json",
            "jsonBody": "={{ JSON.stringify($json.slack) }}",
            "options": {}
          },
          "id": "b1f6c1e0-4a6e-4a01-8000-000000000003",
          "name": "Post to Slack",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [440, 0]
        }
      ],
      "connections": {
        "Grafana Webhook": {
          "main": [[{ "node": "Format Alert", "type": "main", "index": 0 }]]
        },
        "Format Alert": {
          "main": [[{ "node": "Post to Slack", "type": "main", "index": 0 }]]
        }
      },
      "settings": { "executionOrder": "v1" }
    }
  wan-ip-rotated.json: |
    {
      "id": "wan-ip-rotated",
      "name": "WAN IP Monitor Notifications",
      "active": true,
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "wan-ip-rotated",
            "options": {}
          },
          "id": "c2a7d2f1-5b7f-4b12-9111-000000000001",
          "name": "WAN IP Webhook",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [0, 0],
          "webhookId": "c2a7d2f1-5b7f-4b12-9111-00000000000a"
        }
      ],
      "connections": {},
      "settings": { "executionOrder": "v1" }
    }
  image-scan-report.json: |
    {
      "id": "image-scan-report",
      "name": "Image Vulnerability Scan Report",
      "active": true,
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "image-scan-report",
            "options": {}
          },
          "id": "d3b8e3f2-6c8f-4c23-a222-000000000001",
          "name": "Scan Webhook",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [0, 0],
          "webhookId": "d3b8e3f2-6c8f-4c23-a222-00000000000a"
        },
        {
          "parameters": {
            "jsCode": "const p = $json.body ?? $json;\nconst n = p.actionable || 0;\nconst head = n > 0\n  ? ':shield: *Image scan: ' + n + ' fixable finding(s) in our images*'\n  : ':shield: *Image scan: no fixable findings in our images*';\nconst foot = '_' + (p.scanned || 0) + ' images scanned'\n  + (p.failed ? ', ' + p.failed + ' failed' : '')\n  + ' — full report in S3 (workflow ' + (p.workflow || 'unknown') + ')_';\nconst text = [head, p.text || '', foot].filter(Boolean).join('\\n');\nreturn [{ json: { slack: { channel: '#oncall-alerts', text: text, unfurl_links: false } } }];"
          },
          "id": "d3b8e3f2-6c8f-4c23-a222-000000000002",
          "name": "Format Scan Report",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [220, 0]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "https://slack.com/api/chat.postMessage",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "Authorization", "value": "=Bearer {{ $env.SLACK_BOT_TOKEN }}" },
                { "name": "Content-Type", "value": "application/json" }
              ]
            },
            "sendBody": true,
            "specifyBody": "json",
            "jsonBody": "={{ JSON.stringify($json.slack) }}",
            "options": {}
          },
          "id": "d3b8e3f2-6c8f-4c23-a222-000000000003",
          "name": "Post Scan to Slack",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [440, 0]
        }
      ],
      "connections": {
        "Scan Webhook": {
          "main": [[{ "node": "Format Scan Report", "type": "main", "index": 0 }]]
        },
        "Format Scan Report": {
          "main": [[{ "node": "Post Scan to Slack", "type": "main", "index": 0 }]]
        }
      },
      "settings": { "executionOrder": "v1" }
    }
  interview-janitor.json: |
    {
      "id": "interview-janitor",
      "name": "Interview Janitor to Slack",
      "active": true,
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "interview-janitor",
            "responseMode": "lastNode",
            "options": {}
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000001",
          "name": "Janitor Webhook",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [0, 0],
          "webhookId": "e4c9f4a3-7d9a-4d34-b333-00000000000a"
        },
        {
          "parameters": {
            "jsCode": "const req = $input.first().json;\nconst expected = String($env.INTERVIEW_JANITOR_TOKEN || '');\nconst given = String((req.headers || {})['x-janitor-token'] || '');\nlet diff = expected.length < 32 || given.length !== expected.length ? 1 : 0;\nfor (let i = 0; i < expected.length; i++) diff |= expected.charCodeAt(i) ^ given.charCodeAt(i);\nif (diff !== 0) throw new Error('unauthorized: missing or wrong X-Janitor-Token');\nconst p = req.body || {};\nconst sd = $getWorkflowStaticData('global');\nsd.lastSeen = new Date().toISOString();\nsd.lastTitle = String(p.title || '').slice(0, 200);\ndelete sd.lastAlert;\nif (p.post === false) return [{ json: { post: 'no' } }];\nconst esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');\nconst title = esc(String(p.title || 'Interview sandbox').slice(0, 200));\nconst body = esc(String(p.text || '').slice(0, 3000)).replace(/```/g, \"'''\");\nconst url = String(p.url || '');\nconst link = /^https:\\/\\/github\\.com\\/arigsela\\/[\\w.-]+\\/actions\\/runs\\/\\d+$/.test(url) ? '\\n<' + url + '|Open the GitHub run>' : '';\nconst text = ':broom: *' + title + '*' + (body ? '\\n```' + body + '```' : '') + link;\nreturn [{ json: { post: 'yes', slack: { channel: '#oncall-alerts', text: text, unfurl_links: false } } }];"
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000002",
          "name": "Check Token and Format",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [220, 0]
        },
        {
          "parameters": {
            "conditions": {
              "options": { "version": 2, "leftValue": "", "caseSensitive": true, "typeValidation": "strict" },
              "conditions": [
                {
                  "id": "post-to-slack",
                  "leftValue": "={{ $json.post }}",
                  "rightValue": "yes",
                  "operator": { "type": "string", "operation": "equals" }
                }
              ],
              "combinator": "and"
            },
            "options": {}
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000005",
          "name": "Findings?",
          "type": "n8n-nodes-base.if",
          "typeVersion": 2.2,
          "position": [440, 0]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "https://slack.com/api/chat.postMessage",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "Authorization", "value": "=Bearer {{ $env.SLACK_BOT_TOKEN }}" },
                { "name": "Content-Type", "value": "application/json" }
              ]
            },
            "sendBody": true,
            "specifyBody": "json",
            "jsonBody": "={{ JSON.stringify($json.slack) }}",
            "options": {}
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000003",
          "name": "Post Janitor to Slack",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [660, -100]
        },
        {
          "parameters": {
            "jsCode": "const r = $input.first().json;\nif (r.ok !== true) throw new Error('Slack did not accept the message: ' + (r.error || 'no error given'));\nreturn [{ json: { ok: true, posted: true } }];"
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000004",
          "name": "Check Slack Reply",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [880, -100]
        },
        {
          "parameters": {
            "jsCode": "return [{ json: { ok: true, posted: false } }];"
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000006",
          "name": "Checked In",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [660, 100]
        },
        {
          "parameters": {
            "rule": {
              "interval": [{ "field": "cronExpression", "expression": "0 */6 * * *" }]
            }
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000007",
          "name": "Every 6 Hours",
          "type": "n8n-nodes-base.scheduleTrigger",
          "typeVersion": 1.2,
          "position": [220, -300]
        },
        {
          "parameters": {
            "jsCode": "const sd = $getWorkflowStaticData('global');\nconst now = Date.now();\nif (!sd.lastSeen) {\n  sd.lastSeen = new Date(now).toISOString();\n  sd.lastTitle = '(watch started: no check-in recorded yet)';\n  return [];\n}\nconst silentH = Math.floor((now - Date.parse(sd.lastSeen)) / 3600000);\nif (silentH < 30) return [];\nif (sd.lastAlert && now - Date.parse(sd.lastAlert) < 24 * 3600000) return [];\nsd.lastAlert = new Date(now).toISOString();\nconst esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');\nconst text = ':warning: *Interview sandbox: janitor silent for ' + silentH + ' h*\\n'\n  + 'No check-in since ' + sd.lastSeen + ' (' + esc(sd.lastTitle || 'unknown') + '). '\n  + 'The daily run (11:00 UTC) should check in every day: look at the janitor workflow in GitHub Actions '\n  + '(late, failed, or not scheduled). Repeats daily while silent.';\nreturn [{ json: { slack: { channel: '#oncall-alerts', text: text, unfurl_links: false } } }];"
          },
          "id": "e4c9f4a3-7d9a-4d34-b333-000000000008",
          "name": "Janitor Silent?",
          "type": "n8n-nodes-base.code",
          "typeVersion": 2,
          "position": [440, -300]
        }
      ],
      "connections": {
        "Janitor Webhook": {
          "main": [[{ "node": "Check Token and Format", "type": "main", "index": 0 }]]
        },
        "Check Token and Format": {
          "main": [[{ "node": "Findings?", "type": "main", "index": 0 }]]
        },
        "Findings?": {
          "main": [
            [{ "node": "Post Janitor to Slack", "type": "main", "index": 0 }],
            [{ "node": "Checked In", "type": "main", "index": 0 }]
          ]
        },
        "Post Janitor to Slack": {
          "main": [[{ "node": "Check Slack Reply", "type": "main", "index": 0 }]]
        },
        "Every 6 Hours": {
          "main": [[{ "node": "Janitor Silent?", "type": "main", "index": 0 }]]
        },
        "Janitor Silent?": {
          "main": [[{ "node": "Post Janitor to Slack", "type": "main", "index": 0 }]]
        }
      },
      "settings": { "executionOrder": "v1" }
    }
