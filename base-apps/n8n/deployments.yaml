apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  # A rollout takes ~20 minutes: the init container makes 3 n8n CLI calls per workflow (~47 s
  # each on these nodes; 8 workflows since the bug-investigator POC, §T.152), then the probes
  # wait 240 s. The default 600 s deadline marked every rollout ProgressDeadlineExceeded and Argo
  # showed n8n Degraded until the new pod was Ready. 30 minutes covers it; a stuck init still fails.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
      annotations:
        # Roll the pod when the workflow JSON changes so the import initContainer
        # re-imports it and n8n re-registers its webhooks at startup. Value is
        # the sha256 (first 16 hex chars) of every workflow in
        # workflows-configmap.yaml, concatenated in sorted-key order:
        #   python3 -c "import hashlib,yaml; d=yaml.safe_load(open('base-apps/n8n/workflows-configmap.yaml'))['data']; print(hashlib.sha256(''.join(d[k] for k in sorted(d)).encode()).hexdigest()[:16])"
        # (It covered grafana-alerts.json alone until wan-ip-rotated.json was
        # added; a per-file checksum would not roll the pod when a NEW workflow
        # appears, which is exactly when the import has to re-run.) If you edit
        # or add a workflow, recompute this — else the pod won't roll and the
        # change won't take effect. (Or just
        # `kubectl rollout restart deploy/n8n -n n8n`.)
        checksum/workflows: "ddafb39eddd4a254"
        # The n8n bug-investigator POC workflows (§T.152): sha256 (first 16 hex) of both keys of
        # bug-investigator-workflow-configmap.yaml in sorted-key order. Generated: run
        # scripts/gen-n8n-bug-investigator-workflow.py --repo-root . --write after any change.
        checksum/bug-investigator-workflow: "b3c4af476c183022"
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      # Set ownership for the mounted volume
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      # Import + activate the GitOps-managed workflows into n8n's database BEFORE
      # the main container starts. n8n registers webhook routes for active
      # workflows only at STARTUP, so tying the import to the pod lifecycle here
      # guarantees the main container boots with the workflow active and its
      # webhook registered. (This replaced a per-sync PreSync Job that re-ran on
      # unrelated app syncs and left the webhook active-in-DB but unregistered
      # whenever the pod didn't happen to restart — a real 404 we hit in prod.)
      #
      # Per workflow: unpublish, import, publish (§T.151). Importing over an ACTIVE workflow
      # makes the CLI deactivate it through a permission check as the owner, and that check
      # fails ("You do not have permission to deactivate this workflow", exit 1) on a database
      # whose n8n server has never started: a fresh install whose init is retried, e.g. after a
      # node drain, would never come up. Unpublishing first means the import never deactivates
      # anything. Tested locally on 2.45.5 and Postgres 16.4: the old import +
      # `update:workflow --active=true` pair fails that case and this loop passes; on this
      # instance's real state both pass. `update:workflow` is also deprecated in 2.45.
      # `unpublish || echo` allows the first import, when the workflow is not in the database
      # yet (exit 1, "not found"); any other problem surfaces at the import that follows
      # (set -e). publish without --versionId publishes the version just imported. Each CLI
      # call boots n8n (~47 s on these nodes), so 6 workflows x 3 calls keep a new pod in
      # Init for ~14 min (~9 min with the old pair); the old pod serves until it is Ready.
      # A new workflow: add `<ConfigMap key without .json>:<workflow id>` to the list and
      # recompute checksum/workflows above.
      - name: import-workflows
        image: n8nio/n8n:2.45.5@sha256:9f6d0a5987ab5a297c4b0b38fbf1a22285dd1364551478e93f03d506908fa74c
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          for wf in \
            grafana-alerts:grafana-alerts-slack \
            wan-ip-rotated:wan-ip-rotated \
            image-scan-report:image-scan-report \
            interview-janitor:interview-janitor \
            newsletter-digest-send:qX9W779auOovEQe9 \
            agent-findings:agent-findings; do
            file=${wf%%:*}
            id=${wf#*:}
            n8n unpublish:workflow --id="$id" || echo "$id: not in the database yet (first import)"
            n8n import:workflow --input="/workflows/$file.json"
            n8n publish:workflow --id="$id"
          done
          # BEGIN bug-investigator POC (generated by scripts/gen-n8n-bug-investigator-workflow.py, §T.152)
          # The n8n bug-investigator POC, the child first so it exists when the parent calls it. In a
          # subshell with `|| exit 1` per step: a failure is reported and skipped, so it can stop
          # neither the workflows above nor the pod. State: imported and published.
          (
            for wf in \
              bug-investigator-run:bug-investigator-n8n-poc-run \
              bug-investigator:bug-investigator-n8n-poc; do
              file=${wf%%:*}
              id=${wf#*:}
              n8n unpublish:workflow --id="$id" || echo "$id: not in the database yet (first import)"
              n8n import:workflow --input="/workflows-bug-investigator/$file.json" || exit 1
              n8n publish:workflow --id="$id" || exit 1
            done
          ) || echo "bug-investigator POC import failed; the other workflows are unaffected" >&2
          # END bug-investigator POC
        env:
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-host
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-port
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-name
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-password
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key
        # Keep the CLI's scratch settings dir off the shared PVC.
        - name: N8N_USER_FOLDER
          value: /tmp/n8n
        volumeMounts:
        - name: workflows
          mountPath: /workflows
          readOnly: true
        # The n8n bug-investigator POC workflows (§T.152), imported by the generated block above.
        - name: bug-investigator-workflow
          mountPath: /workflows-bug-investigator
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      containers:
      - name: n8n
        # 2.45.5 (2026-10-28): the first 2.x release that fixes GHSA-gx3v-3x3v-f8r5 (expression
        # isolation) and GHSA-f2cw-9483-7vcp (GraphicsMagick). Same tag as the init container,
        # which runs the database migrations first. Migrations are one-way, so dump the database
        # before an upgrade (runbook, "Upgrade n8n"). Never bump n8n without running the init
        # script on the new version: it drives the n8n CLI, which changes between minor versions
        # (promotion denies base-apps/n8n for that reason).
        image: n8nio/n8n:2.45.5@sha256:9f6d0a5987ab5a297c4b0b38fbf1a22285dd1364551478e93f03d506908fa74c
        env:
        # Database Configuration
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-host
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-port
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-name
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-password
        # n8n Core Configuration
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key

        # Slack bot token for GitOps-managed workflows (workflows-configmap.yaml).
        # Read inside workflow expressions as {{ $env.SLACK_BOT_TOKEN }} so no
        # n8n credential object (encrypted, DB-resident, un-importable) is needed.
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: slack-bot-token

        # Shared secret the interview-janitor workflow checks callers against
        # (X-Janitor-Token header). Optional so n8n still starts while the Vault
        # property is missing; the workflow then rejects every call.
        - name: INTERVIEW_JANITOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: interview-janitor-token
              optional: true

        # Fine-grained GitHub token (Actions: Read and write on
        # arigsela/interview-labs only) the interview-janitor workflow uses to
        # start the janitor through workflow_dispatch. Optional for the same
        # reason; without it every start fails and is posted to #oncall-alerts.
        - name: INTERVIEW_JANITOR_GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: interview-janitor-gh-token
              optional: true

        # The n8n bug-investigator POC's GitHub token (PAT A, §T.152): the Code nodes pick, gather,
        # verify and post on arigsela/taskboard with it. Its own Vault identity
        # (bug-investigator-secrets.yaml), not n8n-secrets. Optional, so n8n starts before the
        # token exists; n8n reads env once at start, so roll the pod after a rotation.
        - name: BUG_INVESTIGATOR_GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-bug-investigator-gh
              key: token
              optional: true

        # n8n blocks $env access in expressions by default; without this the
        # grafana-alerts workflow dies with "ExpressionError: access to env
        # vars denied" (observed on first live execution). Trade-off: any
        # workflow author can read this pod's env (DB creds, encryption key) —
        # acceptable here because the editor UI is IP-allowlisted + basic-auth
        # and this is a single-operator instance.
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "false"

        # UPDATED: Webhook URL (changed to HTTPS)
        - name: WEBHOOK_URL
          value: "https://n8n.arigsela.com/"

        # UPDATED: Protocol changed from http to https
        - name: N8N_PROTOCOL
          value: "https"

        # NEW: Hostname configuration
        - name: N8N_HOST
          value: "n8n.arigsela.com"

        - name: N8N_PORT
          value: "5678"
        - name: N8N_LOG_LEVEL
          value: "info"

        # Trust proxy for X-Forwarded-For headers (required behind nginx ingress)
        - name: N8N_PROXY_HOPS
          value: "1"

        # Enforce correct file permissions for settings
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "true"

        # Execution Settings
        - name: EXECUTIONS_DATA_SAVE_ON_ERROR
          value: "all"
        - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
          value: "all"
        - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
          value: "true"

        # 🔒 NEW: BASIC AUTHENTICATION CONFIGURATION
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: basic-auth-user
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: basic-auth-password
        ports:
        - containerPort: 5678
          name: http
        resources:
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # /healthz only says the process is alive. When n8n loses its database it keeps
        # answering /healthz 200 while every real request is "503 Database is not
        # ready!", and it does not reconnect on its own (2026-09-29 20:51: the plain
        # postgresql pod was evicted during a node drain; n8n stayed broken 16h until
        # the pod was deleted by hand). /healthz/readiness checks the DB connection.
        # Liveness: 18 x 10s = 3 min of DB unavailability before a restart, enough to
        # ride out the ~2-3 min a node reboot takes; readiness pulls the pod out of the
        # Service after 30s so the gateway returns a clean 503 instead of n8n's.
        livenessProbe:
          httpGet:
            path: /healthz/readiness
            port: 5678
          initialDelaySeconds: 240
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: 5678
          initialDelaySeconds: 240
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc
      - name: workflows
        configMap:
          name: n8n-workflows
      - name: bug-investigator-workflow
        configMap:
          name: n8n-workflow-bug-investigator
