# base-apps/n8n/bug-investigator-secrets.yaml
# PAT A for the n8n bug-investigator POC workflows (§T.152, Decision 4): the token the Code
# nodes use to pick, gather, verify and post on arigsela/taskboard. A fine-grained token with
# Issues read/write and Contents, Pull requests and Metadata read. n8n's Deployment reads it as
# env BUG_INVESTIGATOR_GH_TOKEN (optional, so n8n starts before the token exists).
#
# Its own Vault identity, per the agent-identity contract (templates/agent-identity/README.md,
# invariant 1): Vault path k8s-secrets/n8n-bug-investigator (property gh-token), a policy
# reading only that path, Kubernetes-auth role n8n-bug-investigator bound to the ESO
# ServiceAccount below. Never the shared `n8n` key or the namespace's vault-backend store, so
# n8n-secrets is untouched. scripts/provision-n8n-bug-investigator-vault.sh writes the policy,
# the role and the token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-n8n-bug-investigator
  namespace: n8n
  labels:
    app.kubernetes.io/part-of: n8n
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-n8n-bug-investigator
  namespace: n8n
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "k8s-secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "n8n-bug-investigator"
          serviceAccountRef:
            name: "eso-n8n-bug-investigator"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-bug-investigator-gh
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-n8n-bug-investigator
    kind: SecretStore
  target:
    name: n8n-bug-investigator-gh
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: n8n-bug-investigator
        property: gh-token
