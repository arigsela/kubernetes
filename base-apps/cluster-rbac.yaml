apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: cluster-rbac
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/cluster-rbac
  destination:
    server: https://kubernetes.default.svc
    # Objects here are cluster-scoped (ClusterRoleBindings) or name their own namespace
    # (eval-gate-argocd-read.yaml: a Role in argo-cd); this default namespace is required
    # by Argo but unused.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
