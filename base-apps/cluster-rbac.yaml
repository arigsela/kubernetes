apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: cluster-rbac
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/cluster-rbac
  destination:
    server: https://kubernetes.default.svc
    # Every object here is cluster-scoped (ClusterRoleBindings); the namespace is required
    # by Argo but unused.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
