# Access control for the ingress Gateway. THIS IS THE SECURITY BOUNDARY.
#
# Istio ALLOW policies are deny-by-default for the workloads they select: any
# request not matching a rule below is refused. So this single object is both the
# default-deny and the allow-list, and every host added to the Gateway is denied
# until it is named here deliberately.
#
# Deliberately introduced BEFORE the remaining 18 hosts rather than after. The
# Gateway currently has no protection but is only reachable on :18443, which the
# router does not forward. At cutover it moves to :443, which IS forwarded - so
# the allow-lists have to exist before that moment, not be retrofitted at it.
#
# 10.0.0.0/8 is DELIBERATELY NOT CARRIED OVER from the nginx allow-lists (V66).
# It contains the pod network 10.42.0.0/16 and the node network, so under any
# SNAT it would make arbitrary internet traffic look allow-listed - failing OPEN
# and silently (B9). It also turns out to be unnecessary: the router hairpin-NATs
# LAN traffic to the public address, verified in nginx's own access log, where
# requests from LAN host 10.0.1.182 arrive as the WAN address. Nothing is lost.
#
# THE WAN ADDRESS IS DYNAMIC AND HAS ROTATED ONCE ALREADY:
# 73.7.190.154 -> 76.97.4.210 (2026-08-12). It is residential Comcast, so expect
# this again. The symptom is total loss of every host in this file at once: the
# Route 53 A records (21 of them, NOT Terraform-managed - hand-edited via the
# AWS API) keep pointing at the dead address, so requests time out; fix only DNS
# and every host then returns 403 from this policy instead. BOTH have to move
# together. REPLACE the old /32 here, never append: the old address is returned
# to the ISP pool and reassigned, and leaving it listed grants a stranger the
# allow-list. Re-verify the hairpin claim above after any such rotation -
# confirmed still true on 2026-08-12 (LAN curl arrived as 76.97.4.210).
#
# ipBlocks, not remoteIpBlocks: the Gateway runs hostNetwork so the packet source
# IS the client (R35). remoteIpBlocks would need XFF trust, which is V56's hazard
# and pointless with no proxy in front.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
  action: ALLOW
  rules:
    # coroot - restricted, mirroring its nginx whitelist-source-range minus the
    # 10.0.0.0/8 entry.
    - to:
        - operation:
            hosts:
              - coroot.arigsela.com
              - coroot.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - argocd.arigsela.com
              - argocd.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - rollouts.arigsela.com
              - rollouts.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - argo-workflows.arigsela.com
              - argo-workflows.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
  # atlantis additionally allows GitHub webhook ranges (IPv4 + IPv6).
    - to:
        - operation:
            hosts:
              - atlantis.arigsela.com
              - atlantis.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
              - 192.30.252.0/22
              - 185.199.108.0/22
              - 140.82.112.0/20
              - 143.55.64.0/20
              - 2a0a:a440::/29
              - 2606:50c0::/32
    - to:
        - operation:
            hosts:
              - backstage.arigsela.com
              - backstage.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - dex.arigsela.com
              - dex.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - kagent.arigsela.com
              - kagent.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - oncall-crewai.arigsela.com
              - oncall-crewai.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    - to:
        - operation:
            hosts:
              - vault.arigsela.com
              - vault.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # grafana.arigsela.com - PUBLIC BY DESIGN (github-oauth). No `from` clause, so any
      # source is permitted. Reachable from anywhere by design - dashboards are read from mobile and carrier
      # IPs cannot be allow-listed. Access control is GitHub OAuth with two
      # fail-closed gates, both verified by observation (V69/T62).
    - to:
        - operation:
            hosts:
              - grafana.arigsela.com
              - grafana.arigsela.com:*
    # oncall.arigsela.com - RESTRICTED 2026-08-11. Was PUBLIC BY DESIGN
    # (slack-events-api) with no `from` clause.
    #
    # THIS PAUSES THE SLACK EVENTS API INTEGRATION. Slack posts callbacks from
    # AWS addresses it does not publish as a stable set, so there is no allow-list
    # that keeps Slack working - the choice is public or paused, and paused was
    # chosen deliberately. If Slack event handling is wanted back, DELETE THIS
    # `from` BLOCK; nothing else needs to change. The failure mode meanwhile is
    # silent from Slack's side (it just retries and gives up), so do not expect an
    # alert to tell you the integration is off.
    #
    # Why: with no allow-list this host took 373 requests in a ~1h window, ALL of
    # them GET scanner traffic hunting web shells (/wp-content/plugins/hellopress/
    # wp_filemanager.php, /coffee.php, /mgrr.php ...) and ZERO POSTs, i.e. no Slack
    # traffic at all. The app held up - 193x404, 177x301, and the only three 200s
    # were `GET /` - so this is not incident response, it is removing an
    # internet-facing surface that was earning nothing.
    #
    # It stays inside the Coraza WAF's scope regex (rule 9000) deliberately: it is
    # the most-probed host on this Gateway, the allow-list and the WAF are
    # independent controls, and leaving it covered means protection is already in
    # place if the `from` block above is ever removed to bring Slack back.
    - to:
        - operation:
            hosts:
              - oncall.arigsela.com
              - oncall.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # weather-kitchen - restricted.
    - to:
        - operation:
            hosts:
              - weather-kitchen.arigsela.com
              - weather-kitchen.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # chores (donetick) - restricted. Note this makes a phone-first chore tracker
      # unreachable from mobile data; carrier NAT is not allow-listable.
    - to:
        - operation:
            hosts:
              - chores.arigsela.com
              - chores.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # homepage — restricted. The dashboard enumerates every service in the
    # homelab and Homepage itself ships no authentication (upstream states none
    # is planned), so the allow-list is the ONLY control here.
    - to:
        - operation:
            hosts:
              - home.arigsela.com
              - home.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # n8n WEBHOOK paths - public by design. Webhooks arrive from arbitrary
      # external services and cannot be allow-listed; each workflow authenticates
      # its own. Scoped to the webhook paths ONLY, so the admin UI is untouched.
    - to:
        - operation:
            hosts:
              - n8n.arigsela.com
              - n8n.arigsela.com:*
            paths:
              - /webhook
              - /webhook/*
              - /webhook-test
              - /webhook-test/*
              - /mcp-server
              - /mcp-server/*
    # n8n everything else (the admin UI) - restricted.
    - to:
        - operation:
            hosts:
              - n8n.arigsela.com
              - n8n.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # kagent-mcp - restricted. Basic auth dropped (T52); the allow-list is now the
      # only control, which is why it must be right.
    - to:
        - operation:
            hosts:
              - kagent-mcp.arigsela.com
              - kagent-mcp.arigsela.com:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 170.85.56.189/32
              - 170.85.130.202/32
              - 104.28.177.82/32
    # vault.local / vault.10.0.1.110 - CORRECTED 2026-08-11. This rule previously
      # had no `from:` clause on the premise that these are "LAN-only names, no
      # public DNS, no TLS... an IP rule here would be theatre rather than
      # control." That premise was WRONG: Host-header routing needs no DNS at
      # all. Confirmed live against the cluster:
      #
      #   curl -H 'Host: vault.local' http://73.7.190.154/v1/sys/health
      #   -> HTTP 200 {"initialized":true,"sealed":false,...}
      #
      # base-apps/vault/httproute-internal.yaml binds these hostnames to
      # vault:8200 with PathPrefix: /, so with no `from:` clause the ENTIRE
      # Vault API was reachable from the public internet in cleartext (Vault
      # runs tls_disable: 1). No allow-list, no TLS, no auth gate ahead of it.
      #
      # 76.97.4.210/32 covers the hairpin path: the router hairpin-NATs LAN
      # traffic to the public address, so this single /32 is how ALL observed
      # traffic arrives, LAN included (see the /8-vs-hairpin note above).
      # 10.0.1.0/24 covers direct LAN access to 10.0.1.110 (not hairpinned),
      # which base-apps/dex/configmap.yaml's OIDC callback
      # (https://vault.local/ui/vault/auth/oidc/oidc/callback) depends on - the
      # operator must keep reaching Vault from the LAN. Note this is
      # 10.0.1.0/24, NOT 10.0.0.0/8: the /8 form contains the pod network
      # 10.42.0.0/16 and was deliberately excluded repo-wide (§B.9/§V.66); the
      # /24 does not contain it and is safe to allow-list directly.
      #
      # The other three /32s used throughout this file (170.85.56.189,
      # 170.85.130.202, 104.28.177.82) are DELIBERATELY NOT included here.
      # Those are remote networks where `vault.local` cannot resolve at all, so
      # adding them would only re-open a Host-header path to cleartext Vault
      # with no working use case behind it. Do not "fix" this apparent
      # inconsistency with the other rules in this file - it is intentional.
    - to:
        - operation:
            hosts:
              - vault.local
              - vault.local:*
              - vault.10.0.1.110
              - vault.10.0.1.110:*
      from:
        - source:
            ipBlocks:
              - 76.97.4.210/32
              - 10.0.1.0/24
