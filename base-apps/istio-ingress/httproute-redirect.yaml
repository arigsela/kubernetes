# Every plain-HTTP request redirects to HTTPS, replacing the
# force-ssl-redirect annotation carried by 21 Ingress manifests (R30).
# Attaches only to the :8080 listener; HTTPS traffic is untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: main
      sectionName: http
  rules:
      # matches is stated explicitly even though "/" is the default: omitting it
      # lets the API server default it, which then reads as drift against git.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
