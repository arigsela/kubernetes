# Staging ports are 18080/18443, NOT 8080/8443: ingress-nginx already binds
# hostPort 8443 on k3s-control-01 alongside 80 and 443, so the obvious choice
# collided with the very thing this replaces. Verified free before picking.
#
# One HTTPS listener per hostname, each with its own certificateRef, because
# these are per-host certificates rather than a wildcard.
#
# The certificates stay in their app namespaces and are reached by
# ReferenceGrant (V63). The alternative - reissuing all 20 into this namespace -
# would mean another ~20 ACME issuances in the same week T49 already spent ~20,
# against a 50/week limit per registered domain.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-options
  listeners:
    # Catches every host on plain HTTP; the redirect HTTPRoute attaches here.
    - name: http
      protocol: HTTP
      port: 18080
      allowedRoutes:
        namespaces:
          from: All
    - name: https-coroot
      protocol: HTTPS
      port: 18443
      hostname: coroot.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: coroot-tls
            namespace: coroot
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd
      protocol: HTTPS
      port: 18443
      hostname: argocd.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-tls
            namespace: argo-cd
      allowedRoutes:
        namespaces:
          from: All
    - name: https-rollouts
      protocol: HTTPS
      port: 18443
      hostname: rollouts.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argo-rollouts-tls
            namespace: argo-rollouts
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argo-workflows
      protocol: HTTPS
      port: 18443
      hostname: argo-workflows.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argo-workflows-tls
            namespace: argo-workflows
      allowedRoutes:
        namespaces:
          from: All
    - name: https-atlantis
      protocol: HTTPS
      port: 18443
      hostname: atlantis.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: atlantis-tls
            namespace: atlantis
      allowedRoutes:
        namespaces:
          from: All
    - name: https-backstage
      protocol: HTTPS
      port: 18443
      hostname: backstage.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: backstage-tls
            namespace: backstage
      allowedRoutes:
        namespaces:
          from: All
    - name: https-dex
      protocol: HTTPS
      port: 18443
      hostname: dex.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dex-tls
            namespace: dex
      allowedRoutes:
        namespaces:
          from: All
    - name: https-kagent
      protocol: HTTPS
      port: 18443
      hostname: kagent.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kagent-tls
            namespace: kagent
      allowedRoutes:
        namespaces:
          from: All
    - name: https-oncall-crewai
      protocol: HTTPS
      port: 18443
      hostname: oncall-crewai.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: oncall-crewai-frontend-tls
            namespace: oncall-crewai
      allowedRoutes:
        namespaces:
          from: All
    - name: https-vault
      protocol: HTTPS
      port: 18443
      hostname: vault.arigsela.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vault-arigsela-tls
            namespace: vault
      allowedRoutes:
        namespaces:
          from: All
