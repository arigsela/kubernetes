# Access logging for the ingress Gateway.
#
# Istio gateways log nothing by default. ingress-nginx logged every request, and
# that log has already earned its keep twice today: it identified the real client
# addresses reaching the cluster (R25), and it proved the router hairpin-NATs LAN
# traffic to the public address - which is what made dropping 10.0.0.0/8 from the
# allow-lists a free change rather than a guess (V66).
#
# An internet-facing edge with no request log is not operable. It is also the
# only direct way to observe what source address arrives, which V61 requires
# knowing rather than assuming.
#
# FORMAT: the built-in `envoy` provider takes its line format from
# meshConfig.accessLogFormat in base-apps/istio-istiod.yaml - Istio's default with
# the query string stripped (%REQ_WITHOUT_QUERY%), because URLs carry search text
# and OAuth codes and these lines live in Loki for 30 days. Keep the provider the
# built-in `envoy` with no LogFormat of its own, or that format is bypassed
# (tests/istio_logging/ checks both).
#
# TRACING (beacon §T.20): the same resource, not a second namespace-wide Telemetry (two would
# conflict). Every host on the Gateway is traced, to the `otel-tracing` provider
# (base-apps/istio-istiod.yaml). 100%, deliberately (beacon §V.43): the Gateway's sampling
# decision travels downstream in `traceparent`, and an app that follows its parent's decision
# (kagent, Substrate) would silently lose the unsampled share of its own traces. The collector
# samples instead, and strips query strings first: Envoy's `http.url` keeps them, which this
# access log's format deliberately does not (beacon §V.42, beacon §R.42).
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: gateway-access-logs
  namespace: istio-ingress
spec:
  accessLogging:
    - providers:
        - name: envoy
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100
