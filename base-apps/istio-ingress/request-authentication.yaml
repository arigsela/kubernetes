# base-apps/istio-ingress/request-authentication.yaml
# Token verification at the edge for the agent API host (V91). Same two issuers as the kagent
# waypoint (base-apps/kagent/request-authentication.yaml): Dex for humans, the Kubernetes
# service account issuer for automations. This object only rejects INVALID tokens; the
# kagent-mcp rule in authorizationpolicy.yaml is what requires one. The token is forwarded, so
# the waypoint verifies it a second time on the way to the controller: two independent checks
# on the external path. Other hosts are untouched: a request to them with no token passes here
# and is judged by their own allow-list rules as before.
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: gateway-kagent-callers
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
  jwtRules:
    - issuer: https://dex.arigsela.com
      jwksUri: https://dex.arigsela.com/keys
      audiences: ["kubernetes"]
      forwardOriginalToken: true
    - issuer: https://kubernetes.default.svc.cluster.local
      # Inline, as on the waypoint: istiod cannot verify the API server's certificate when it
      # fetches /openid/v1/jwks. Public keys; refresh with `kubectl get --raw /openid/v1/jwks`
      # when k3s rotates the service-account signing key (keep both files identical).
      jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"BBNzB3N5yJuPKQs3OHZwaoUun7YR66d0OdoSgXsIwzg","alg":"RS256","n":"wcgYlH31ADlLEonXo1Hga-ZjBK7sg3bFgcuFrTblCKFp3QuIt0N_ew4UWnzZcigQ7Xav4XHFgLnWUDFoMNqPkI0eqrH8r0rJCbsDR9N5yHPLcJUXsZo8sQln41_uDCEq1sc7rbdZWIpb-S7Jl07_V9tlu0RIKtS10NjeOsHFf1W9aM4kysR0DXuRQDxoL_5gTTwgPNlUwWMkWL0JN--etn4Qj2Q0QPGQZA_cwV6xDJBoRU_RoZIEzqFUfbwDkpGglLajlwiKiw2o-qEwVKLXgSXEweAvgeR3uURCCjzg4bkEQKeCMAvnH7b03MSnQVi1BTrjFR7uRVHhYTOpd-Td-Q","e":"AQAB"}]}'
      audiences: ["kagent"]
      forwardOriginalToken: true
