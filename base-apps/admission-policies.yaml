apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: admission-policies
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/arigsela/kubernetes
    targetRevision: main
    path: base-apps/admission-policies
    directory:
      # catalog-info.yaml and mkdocs.yml are Backstage/TechDocs files, not manifests.
      exclude: '{catalog-info.yaml,mkdocs.yml}'
  destination:
    server: https://kubernetes.default.svc
    # Every object here is cluster-scoped (ValidatingAdmissionPolicy, bindings); the
    # namespace is required by Argo but unused.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
