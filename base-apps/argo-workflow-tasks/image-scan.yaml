# Weekly container image vulnerability scan.
#
# Design: docs/superpowers/specs/2026-08-17-image-vulnerability-scanning-design.md
#
# Scans EVERY running image (~75) and reports all of it to S3, but alerts only on
# the handful we build ourselves (ECR). Scanning everything and alerting on
# everything would surface hundreds of CVEs in upstream images we cannot patch,
# and a report nobody acts on gets ignored — at which point it is worse than
# nothing, because it is assumed to be watching.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-scan
  namespace: argo-workflows
spec:
  entrypoint: main
  serviceAccountName: argo-workflow

  # Bounds concurrent scan pods. Peak temp disk is roughly four scans' worth
  # rather than seventy-five. See sizeLimit on the emptyDir below.
  parallelism: 4

  # Keep a quarter's worth of history for trend, then let them go.
  ttlStrategy:
    secondsAfterCompletion: 7776000
  # OnWorkflowCompletion, NOT OnWorkflowSuccess. This workflow fails by design
  # whenever there is anything actionable (§3.6), which — at 386 findings on the
  # first run — means every week until those images are rebuilt. Collecting pods
  # only on success would therefore never collect them: ~79 pods per run against
  # a 90-day TTL is over a thousand pods before anything reaps them.
  #
  # Safe because the chart sets artifactRepository.archiveLogs: true, so each
  # pod's logs are in S3 and stay readable from the Argo UI after the pod is
  # gone. Do not "fix" this back to OnWorkflowSuccess to make failed runs
  # debuggable — the logs outlive the pods already.
  podGC:
    strategy: OnWorkflowCompletion

  arguments:
    parameters:
      # Images matching this prefix are "ours" and are the only ones that alert.
      - name: owned-image-prefix
        value: "852893458518.dkr.ecr."
      - name: n8n-webhook
        value: "http://n8n.n8n.svc.cluster.local:5678/webhook/image-scan-report"
      - name: report-bucket
        value: "asela-argo-workflows-artifacts"
      - name: report-prefix
        value: "cve-reports/"

  templates:
    - name: main
      dag:
        tasks:
          - name: discover
            template: discover-images
          - name: scan
            template: scan-image
            dependencies: [discover]
            # Fan out: one scan pod per distinct image.
            withParam: "{{tasks.discover.outputs.result}}"
            arguments:
              parameters:
                - name: image
                  value: "{{item}}"
          - name: report
            template: aggregate
            dependencies: [scan]

    # ---------------------------------------------------------------- discover
    - name: discover-images
      # Emits a JSON array of distinct images, which withParam fans out over.
      # Requires ClusterRole/argo-workflow-pod-reader (serviceaccount.yaml).
      #
      # Talks to the Kubernetes API directly rather than shelling out to kubectl,
      # deliberately. The obvious `bitnami/kubectl` is gone — Bitnami withdrew its
      # public Docker Hub catalog, and `bitnami/kubectl:1.30` now 404s on pull.
      # (base-apps/argo-workflow-tasks/cluster-health-check.yaml still references
      # it and is broken for the same reason.) The official replacement,
      # registry.k8s.io/kubectl, is distroless — no shell — so a `script` block
      # cannot run there either.
      #
      # Using the API from python:3.12-slim removes the third-party image
      # dependency altogether, reuses the image the aggregate step already needs,
      # and asks for exactly the access the ClusterRole grants.
      script:
        image: python:3.12-slim
        command: [python3]
        source: |
          import json, ssl, urllib.request

          SA = "/var/run/secrets/kubernetes.io/serviceaccount"
          token = open(f"{SA}/token").read().strip()
          ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")

          images, cont = set(), ""
          while True:
              url = "https://kubernetes.default.svc/api/v1/pods?limit=500"
              if cont:
                  url += f"&continue={cont}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              page = json.load(urllib.request.urlopen(req, context=ctx, timeout=60))
              for pod in page.get("items", []):
                  spec = pod.get("spec", {})
                  # initContainers too: a vulnerable init image runs in the same
                  # pod and is no less present for finishing early.
                  for c in (spec.get("containers") or []) + (spec.get("initContainers") or []):
                      if c.get("image"):
                          images.add(c["image"])
              cont = page.get("metadata", {}).get("continue") or ""
              if not cont:
                  break

          print(json.dumps(sorted(images)))
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}

    # -------------------------------------------------------------------- scan
    - name: scan-image
      inputs:
        parameters:
          - name: image
      # A flaky registry pull must not lose the whole run. Individual failures
      # are tolerated by the aggregate step, which reports them as unscanned —
      # silence about an unscanned image is the failure mode worth avoiding.
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
        backoff:
          duration: "30s"
          factor: "2"
      script:
        image: aquasec/trivy:0.74.0
        command: [sh]
        source: |
          set -eo pipefail
          IMAGE="{{inputs.parameters.image}}"
          # Trivy does NOT create parent directories for --output and fails with
          # "no such file or directory" if they are missing. The emptyDir mounts
          # at /tmp, so /tmp/out has to be made here.
          mkdir -p /tmp/out
          echo "scanning ${IMAGE}" >&2
          # Full severity set here; filtering to what we alert on happens at
          # aggregate time so the S3 report keeps everything.
          # --quiet suppresses the DB-download progress bar, which otherwise
          # buries real errors under megabytes of carriage returns in the logs.
          trivy image \
            --quiet \
            --format json \
            --output /tmp/out/report.json \
            --scanners vuln \
            --timeout 15m \
            "${IMAGE}" >&2
        env:
          # Trivy reads registry credentials from a docker config. ecr-registry
          # is a dockerconfigjson refreshed hourly into EVERY namespace by
          # base-apps/ecr-auth/cronjobs.yaml, so no new credential is minted.
          - name: DOCKER_CONFIG
            value: /docker
          - name: TRIVY_CACHE_DIR
            value: /tmp/cache
        volumeMounts:
          - name: scratch
            mountPath: /tmp
          - name: ecr
            mountPath: /docker
            readOnly: true
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "1", memory: 2Gi}
      volumes:
        # emptyDir sizeLimit IS enforced by kubelet — a pod exceeding it is
        # evicted rather than filling the node. This is the control the
        # local-path PVC in base-apps/jupyter deliberately cannot provide, and
        # it is why no node pinning is needed here.
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: ecr
          secret:
            secretName: ecr-registry
            items:
              - key: .dockerconfigjson
                path: config.json
      outputs:
        artifacts:
          - name: report
            path: /tmp/out/report.json
            # Absent on scan failure; the aggregate step treats a missing
            # report as "unscanned" rather than "clean".
            optional: true
            # Argo tar+gzips artifacts by default. The aggregate step reads
            # these as plain JSON, so store them raw.
            archive:
              none: {}

    # --------------------------------------------------------------- aggregate
    - name: aggregate
      inputs:
        artifacts:
          - name: reports
            path: /reports
            # All per-image reports from this workflow's artifact repository
            # prefix. keyFormat is set chart-side in base-apps/argo-workflows.yaml.
            s3:
              key: "{{workflow.namespace}}/{{workflow.name}}"
            optional: true
      script:
        image: python:3.12-slim
        command: [python3]
        source: |
          import subprocess, sys
          # python:3.12-slim has no boto3. Guarded: an install failure here must
          # not fail this step, because render.py's own S3 block only degrades
          # to a warning if `import boto3` fails -- but check_call raises, and
          # this runs before that try/except, outside its protection. Unguarded,
          # a PyPI outage would kill the whole aggregate step and take the Slack
          # alert POST down with it, which is exactly the failure mode publish()
          # is designed to survive (see the comment above that block).
          try:
              subprocess.check_call([sys.executable, "-m", "pip", "install",
                                     "--quiet", "--disable-pip-version-check", "boto3"])
          except Exception as exc:
              print(f"WARNING: boto3 install failed, S3 publish will be skipped: {exc}",
                    file=sys.stderr)

          import runpy
          sys.argv = [
              "render.py",
              "--reports", "/reports",
              "--out", "/tmp/out",
              "--owned-prefix", "{{workflow.parameters.owned-image-prefix}}",
              "--webhook", "{{workflow.parameters.n8n-webhook}}",
              "--workflow-name", "{{workflow.name}}",
              "--bucket", "{{workflow.parameters.report-bucket}}",
              "--prefix", "{{workflow.parameters.report-prefix}}",
              "--date", "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}",
          ]
          runpy.run_path("/app/render.py", run_name="__main__")
        env:
          # Already has write on asela-argo-workflows-artifacts: it is the
          # artifact repository credential from base-apps/argo-workflows.yaml.
          # Keys are username / attribute.secret -- there is no attribute.id.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: argo-workflows-s3-creds
                key: username
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: argo-workflows-s3-creds
                key: attribute.secret
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"
        volumeMounts:
          - name: out
            mountPath: /tmp/out
          - name: script
            mountPath: /app
            readOnly: true
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 1Gi}
      volumes:
        - name: out
          emptyDir:
            sizeLimit: 1Gi
        - name: script
          configMap:
            name: cve-report
      outputs:
        artifacts:
          - name: full-report
            path: /tmp/out/full-report.json
            # Raw JSON, not a tarball. This is the artifact a human or a
            # notebook fetches from S3 to answer "what is the posture of
            # everything" (design §3.2); shipping it gzipped would mean
            # unpacking before every query for no benefit.
            archive:
              none: {}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-scan
  namespace: argo-workflows
spec:
  # Sunday 04:00 UTC. Clear of every other schedule in the repo: ecr-auth
  # (hourly), agent-audit (01:30, 07:00), CNPG backup (02:00), wan-ip-monitor
  # (every 12h).
  schedules:
    - "0 4 * * 0"
  timezone: UTC
  concurrencyPolicy: Forbid
  # A scan that did not run is not an emergency; skip rather than pile up.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  workflowSpec:
    workflowTemplateRef:
      name: image-scan
