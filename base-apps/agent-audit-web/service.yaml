apiVersion: v1
kind: Service
metadata:
  name: agent-audit-web
  namespace: agent-audit
  labels:
    app: agent-audit-web
    app.kubernetes.io/name: agent-audit-web
spec:
  type: ClusterIP
  selector:
    app: agent-audit-web
  ports:
    # oauth2-proxy. The app's own port (8000, loopback) is deliberately absent.
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
