# Gateway API replacement for this app's nginx Ingress (T56).
# Lives in the app namespace so the backendRef is same-namespace and needs no
# second ReferenceGrant. Backend read from the LIVE Ingress, not inferred.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oncall-crewai
  namespace: oncall-crewai
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Oncall CrewAI
    gethomepage.dev/group: AI & Agents
    gethomepage.dev/icon: mdi-account-group
    gethomepage.dev/description: Multi-agent incident response
    gethomepage.dev/pod-selector: app=crewai-frontend
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-oncall-crewai
  hostnames:
    - oncall-crewai.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: crewai-frontend
          port: 80
