# Gateway API replacement for this app's nginx Ingress (T56).
# Lives in the app namespace so the backendRef is same-namespace and needs no
# second ReferenceGrant. Backend read from the LIVE Ingress, not inferred.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis
  namespace: atlantis
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Atlantis
    gethomepage.dev/group: GitOps & Delivery
    gethomepage.dev/icon: mdi-terraform
    gethomepage.dev/description: Terraform PR automation
    gethomepage.dev/pod-selector: app=atlantis
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-atlantis
  hostnames:
    - atlantis.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: atlantis
          port: 4141
