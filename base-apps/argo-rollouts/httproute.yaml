# Gateway API replacement for this app's nginx Ingress (T56).
# Lives in the app namespace so the backendRef is same-namespace and needs no
# second ReferenceGrant. Backend read from the LIVE Ingress, not inferred.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo Rollouts
    gethomepage.dev/group: GitOps & Delivery
    gethomepage.dev/icon: mdi-rocket-launch
    gethomepage.dev/description: Progressive delivery
    gethomepage.dev/pod-selector: app.kubernetes.io/name=argo-rollouts
spec:
  parentRefs:
    - name: main
      namespace: istio-ingress
      sectionName: https-rollouts
  hostnames:
    - rollouts.arigsela.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-rollouts-dashboard
          port: 3100
