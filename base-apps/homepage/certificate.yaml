apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homepage-tls
  namespace: homepage
spec:
  secretName: homepage-tls
  dnsNames:
    - home.arigsela.com
  issuerRef:
    # Not letsencrypt-prod: its only solver is http01.ingress.class=nginx, which
    # nothing satisfies since the Istio cutover.
    name: letsencrypt-route53
    kind: ClusterIssuer
