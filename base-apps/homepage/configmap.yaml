# ALL NINE FILES MUST EXIST, even empty ones: Homepage expects the full set
# and cannot create a missing one (see the proxmox.yaml note at the bottom).
#
# These are mounted as individual subPath files (see deployments.yaml), and
# Kubernetes NEVER propagates ConfigMap updates into subPath mounts. Editing
# this file therefore syncs cleanly and changes NOTHING until the pod restarts.
# After any edit here, recompute the checksum in deployments.yaml:
#   shasum -a 256 base-apps/homepage/configmap.yaml | cut -c1-16
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    headerStyle: boxed
    # dot = a coloured indicator instead of the default response-time text.
    statusStyle: dot
    # EVERY group below must carry a `tab:`. Homepage shows any group WITHOUT
    # one on ALL tabs — so a single missing `tab:` silently duplicates that
    # group across every tab rather than erroring.
    # Tab order follows the order groups appear here.
    layout:
      GitOps & Delivery:
        tab: Infra
        style: row
        columns: 3
      Automation:
        tab: Infra
        style: row
        columns: 2
      Observability:
        tab: Infra
        style: row
        columns: 2
      Platform:
        tab: Infra
        style: row
        columns: 3
      Cloud & Code:
        tab: Infra
      AI & Agents:
        tab: Home
        style: row
        columns: 4
      Home:
        tab: Home
        style: row
        columns: 2
      Media:
        tab: Home
        style: row
        columns: 3

  kubernetes.yaml: |
    # cluster: use the in-cluster ServiceAccount.
    # gateway: discover tiles from Gateway API HTTPRoute annotations.
    # ingress/traefik stay off — this cluster uses neither.
    mode: cluster
    gateway: true
    ingress: false

  # Only widget-bearing tiles live here. Link-only tiles are discovered from
  # gethomepage.dev/* annotations on each app's own httproute.yaml. The split
  # exists because Homepage substitutes {{HOMEPAGE_VAR_*}} in config files but
  # not in annotations — a credential must never appear in an annotation.
  services.yaml: |
    - GitOps & Delivery:
        - Argo CD:
            href: https://argocd.arigsela.com
            description: GitOps continuous delivery
            icon: argo-cd.png
            widget:
              # Driven by Prometheus rather than an Argo CD API token: creating
              # an apiKey account means editing argocd-cm, and this repo's
              # Terraform module writes to the deprecated server.config.* path
              # the chart ignores. See templates/agent-docs/README.md.
              type: prometheusmetric
              url: http://prometheus.logging.svc.cluster.local:9090
              # count() over a selector that matches NO series returns an empty
              # vector, not 0 — and Homepage's prometheusmetric widget renders an
              # empty result as "-", identically to a broken/misspelled label.
              # `or vector(0)` forces the filtered queries to resolve to a real
              # 0 in the healthy state, so "-" stays reserved for "the query
              # itself is broken." Do not simplify this away.
              metrics:
                - label: Apps
                  query: count(argocd_app_info)
                - label: Synced
                  query: count(argocd_app_info{sync_status="Synced"}) or vector(0)
                - label: OutOfSync
                  query: count(argocd_app_info{sync_status="OutOfSync"}) or vector(0)
                - label: Degraded
                  query: count(argocd_app_info{health_status="Degraded"}) or vector(0)

    - Observability:
        - Grafana:
            href: https://grafana.arigsela.com
            description: Dashboards and alerting
            icon: grafana.png
            widget:
              # customapi + Bearer, NOT the built-in `grafana` widget: that one
              # speaks only basic auth, and this Grafana runs with
              # GF_AUTH_BASIC_ENABLED=false (GitHub OAuth is the only way in).
              # `format: size` returns the length of the root JSON array.
              type: customapi
              url: http://grafana.logging.svc.cluster.local:3000/api/alertmanager/grafana/api/v2/alerts
              headers:
                Authorization: "Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}"
              mappings:
                - label: Firing
                  format: size

    # Everything here runs on the Windows/WSL2 box at 10.0.1.200, NOT in the
    # cluster. It is reachable from pods only because WSL2 mirrored networking
    # is enabled — see runbook.md. The host needs a DHCP reservation: these IPs
    # are hardcoded, so a lease change blanks every widget in this group while
    # the links keep working.
    - Media:
        - Plex:
            href: http://10.0.1.200:32401/web
            description: Media server
            icon: plex.png
            widget:
              type: plex
              url: http://10.0.1.200:32401
              key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
        - qBittorrent:
            href: http://10.0.1.200:8080
            description: Torrent client
            icon: qbittorrent.png
            widget:
              # qBittorrent has no API key — it authenticates with the WebUI
              # username and password. "Bypass authentication for clients on
              # localhost" does not help: the pod is not localhost.
              type: qbittorrent
              url: http://10.0.1.200:8080
              username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
        - Sonarr:
            href: http://10.0.1.200:8989
            description: TV library manager
            icon: sonarr.png
            widget:
              type: sonarr
              url: http://10.0.1.200:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            href: http://10.0.1.200:7878
            description: Movie library manager
            icon: radarr.png
            widget:
              type: radarr
              url: http://10.0.1.200:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Jellyseerr:
            href: http://10.0.1.200:5055
            description: Media requests
            icon: jellyseerr.png
            widget:
              # `seerr`, not `jellyseerr`: Jellyseerr and Overseerr merged into
              # Seerr upstream. `jellyseerr` still works as an alias today but
              # is legacy, so prefer the canonical type.
              type: seerr
              url: http://10.0.1.200:5055
              key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  # Bookmark groups sit in the same `layout:` block as service groups and need
  # a `tab:` there too (see settings.yaml above), or they render on every tab.
  bookmarks.yaml: |
    - Cloud & Code:
        - GitHub:
            - abbr: GH
              href: https://github.com/arigsela/kubernetes
        - Actions:
            - abbr: CI
              href: https://github.com/arigsela/kubernetes/actions
        - AWS:
            - abbr: AW
              href: https://console.aws.amazon.com/
        - Route 53:
            - abbr: 53
              href: https://console.aws.amazon.com/route53/v2/hostedzones
  docker.yaml: ""
  custom.css: ""
  custom.js: ""

  # NINE files, not eight. Homepage copies any missing config file from
  # /app/src/skeleton at startup — but because these are subPath mounts,
  # /app/config is not writable, so the copy fails with EACCES and the
  # container exits 1. proxmox.yaml is unused here and stays empty, but it
  # MUST exist or the pod CrashLoopBackOffs. Verified against the v1.13.2
  # skeleton, which contains: bookmarks, custom.css, custom.js, docker,
  # kubernetes, proxmox, services, settings, widgets.
  proxmox.yaml: ""
