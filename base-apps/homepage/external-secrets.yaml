apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: homepage-secrets
    creationPolicy: Owner
  data:
    - secretKey: plex-token
      remoteRef:
        key: homepage
        property: plex-token
    # A dedicated Grafana SERVICE ACCOUNT token (Viewer), NOT the admin
    # credentials in base-apps/logging/grafana-admin-external-secret.yaml.
    # Homepage is unauthenticated; admin creds must not sit in its environment.
    # A token rather than a username/password because that Grafana runs with
    # GF_AUTH_BASIC_ENABLED=false — see grafana-deployment.yaml.
    - secretKey: grafana-token
      remoteRef:
        key: homepage
        property: grafana-token
    # Media stack on the WSL2 host (10.0.1.200). Added by
    # scripts/provision-homepage-media-vault.sh, which PATCHES the same
    # k8s-secrets/homepage secret rather than replacing it.
    - secretKey: qbittorrent-username
      remoteRef:
        key: homepage
        property: qbittorrent-username
    - secretKey: qbittorrent-password
      remoteRef:
        key: homepage
        property: qbittorrent-password
    - secretKey: sonarr-key
      remoteRef:
        key: homepage
        property: sonarr-key
    - secretKey: radarr-key
      remoteRef:
        key: homepage
        property: radarr-key
    - secretKey: seerr-key
      remoteRef:
        key: homepage
        property: seerr-key
