# kagent 1.0.0-alpha14 CRDs: api.kagent.dev/v1alpha3 (Agent, AgentTemplate, Harness, ModelConfig,
# ModelProviderConfig, RemoteMCPServer, SandboxTemplate). The kmcp subchart and `mcpservers.kagent.dev`
# are gone since alpha14 (kagent#3223); the three MCP servers are plain Deployments since §T.126, so
# pruning that CRD removes nothing that is used.
# Moves only with the kagent chart and Substrate (renovate.json5 group kagent-substrate).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kagent-crds
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: kagent-crds
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 1.0.0-alpha14
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
