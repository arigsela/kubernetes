# kagent 1.0.0-alpha11 CRDs: api.kagent.dev/v1alpha3 (Agent, AgentTemplate, Harness, ModelConfig,
# ModelProviderConfig, RemoteMCPServer, SandboxTemplate) plus the kmcp-crds subchart
# (mcpservers.kagent.dev, kmcp.enabled defaults to true). Merged at the cutover, after the 0.10
# CRDs are gone (plan Task 5.3 PR C): 0.10 and 1.x both own mcpservers.kagent.dev (SPEC §R.44).
# Moves only with the kagent chart and Substrate (renovate.json5 group kagent-substrate).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kagent-crds
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: kagent-crds
    repoURL: ghcr.io/kagent-dev/kagent/helm
    targetRevision: 1.0.0-alpha11
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
