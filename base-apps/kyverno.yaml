apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kyverno
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # 3.9.1 = Kyverno v1.19.1. v1.19 deprecates kyverno.io/v1 ClusterPolicy and
    # Policy (removed in v1.20). None are left: every policy moved to native admission
    # policies (base-apps/admission-policies/, SPEC T80) and Kyverno only reports, so
    # v1.20's removal no longer blocks a bump.
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      values: |
        admissionController:
          replicas: 1
          container:
            extraArgs:
              forceFailurePolicyIgnore: "true"
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        # Background and cleanup controllers OFF (2026-10-07). Kyverno is
        # reporting-only (SPEC §T.72, §T.80): 0 ClusterPolicy, 0 CleanupPolicy and
        # no cleanup.kyverno.io/ttl labels, so neither controller has any work
        # (generate/mutateExisting; TTL and cleanup policies). Each still held
        # 80-125Mi (mostly its binary's page cache) against a 128Mi limit.
        # Re-enable before adding a generate, mutateExisting or cleanup policy.
        # The cleanup controller creates its two webhook configs and TLS Secrets
        # at runtime, outside the chart; delete those by hand once the
        # Deployment is pruned (see the PR that made this change).
        backgroundController:
          enabled: false
        cleanupController:
          enabled: false
        reportsController:
          # 256Mi limit, not the chart's 128Mi (2026-10-09). Unlike the two
          # controllers above, this one has work (VAP reports, hourly background
          # scan), so it stays on. Its Go heap is 30-44Mi and RSS a flat ~62Mi,
          # but since the 2026-09-30 node reboot ~50Mi of its binary's page cache
          # is charged to the pod. Limits count page cache, so the working set sat
          # at 113-118Mi, on the 90% line of "Container near memory limit".
          # Requests stay at the chart's 64Mi (about the RSS); Helm merges maps.
          resources:
            limits:
              memory: 256Mi
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        webhooksCleanup:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                - kube-system
                - argo-cd
                - kyverno
        # CRD-migration hook OFF. It cannot succeed under Argo CD: Argo runs the
        # chart's post-upgrade hooks as PostSync waves and deletes the weight-100
        # ServiceAccount/RBAC (hook-succeeded) as soon as they exist, before the
        # weight-200 Job runs, so the Job's token is rejected (401 Unauthorized)
        # and no retry pod can start. Helm only deletes after the whole phase.
        # Nothing to migrate today: every kyverno CRD has storedVersions equal to
        # its storage version (checked 2026-09-24). A future bump that changes a
        # storage version (SPEC §T.80) must check storedVersions and run
        # `kyverno migrate` itself.
        crds:
          migration:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # The API server defaults spec.conversion to {strategy: None} on every CRD the
  # chart ships, which the chart itself omits — Argo can never converge on it.
  # Verified across all 11 drifting CRDs against kyverno 3.7.1; 3.9.1 renders the
  # same 22 CRDs, but adds the empty-annotations bug below.
  #
  # Note: preserveUnknownFields is NOT listed. Unlike argo-rollouts, this chart
  # does not set it, so there is nothing to ignore. Only evidenced fields here.
  # See docs/plans/argocd-drift-diagnosis.md (SPEC.md §V.47).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        # The real cause, per `argocd app diff`: kyverno 3.7.1 renders
        # `metadata.labels: {}` on exactly 11 of its 22 CRDs — an empty map the
        # API server drops, so Argo diffs {} against absent forever. Those 11 are
        # precisely the CRDs that were OutOfSync. An upstream chart bug; nothing
        # here can reconcile it. Still present in 3.9.1 (same 11 CRDs).
        - .metadata.labels
        # 3.9.1's new kyverno-api subchart has the same bug for annotations: its
        # 11 policies.kyverno.io CRDs render `metadata.annotations: {}`, which
        # kept the app OutOfSync and self-heal re-syncing. Ignored only when
        # empty, so a real annotation change on any CRD still shows as drift.
        - .metadata.annotations | select(. == {})
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
