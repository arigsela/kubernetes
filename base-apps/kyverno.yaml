apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: kyverno
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # 3.9.1 = Kyverno v1.19.1. v1.19 deprecates kyverno.io/v1 ClusterPolicy and
    # Policy (still served; removed in v1.20) — all 9 in base-apps/kyverno-policies/
    # use it, so they must move to policies.kyverno.io before the next minor.
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      values: |
        admissionController:
          replicas: 1
          container:
            extraArgs:
              forceFailurePolicyIgnore: "true"
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        backgroundController:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        cleanupController:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        reportsController:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        webhooksCleanup:
          nodeSelector:
            node.kubernetes.io/workload: infrastructure
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                - kube-system
                - argo-cd
                - kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # The API server defaults spec.conversion to {strategy: None} on every CRD the
  # chart ships, which the chart itself omits — Argo can never converge on it.
  # Verified across all 11 drifting CRDs against kyverno 3.7.1; 3.9.1 renders the
  # same 22 CRDs the same way.
  #
  # Note: preserveUnknownFields is NOT listed. Unlike argo-rollouts, this chart
  # does not set it, so there is nothing to ignore. Only evidenced fields here.
  # See docs/plans/argocd-drift-diagnosis.md (SPEC.md §V.47).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        # The real cause, per `argocd app diff`: kyverno 3.7.1 renders
        # `metadata.labels: {}` on exactly 11 of its 22 CRDs — an empty map the
        # API server drops, so Argo diffs {} against absent forever. Those 11 are
        # precisely the CRDs that were OutOfSync. An upstream chart bug; nothing
        # here can reconcile it. Still present in 3.9.1 (same 11 CRDs).
        - .metadata.labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
