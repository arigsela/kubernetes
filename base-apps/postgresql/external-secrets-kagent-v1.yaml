# The kagent 1.0 database identity, as consumed by the init-kagent-v1-db Job in THIS namespace.
#
# Same Vault key and role as the 0.10 credential (k8s-secrets/kagent-db, role kagent-db, the
# eso-kagent-db ServiceAccount and vault-kagent-db SecretStore already here), new properties
# with a v1- prefix, so kagent 1.0 adds no Vault role or policy. The 0.10 properties (db-url,
# db-user, db-password, db-name) and the 0.10 `kagent` database are untouched: that database
# becomes the read-only archive at cutover.
# v1-readwrite-* since §T.127 (kagent#3160: owner login migrates, read/write login serves).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-v1-db-credentials
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kagent-db
    kind: SecretStore
  target:
    name: kagent-v1-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db-name
      remoteRef:
        key: kagent-db
        property: v1-db-name
    - secretKey: user
      remoteRef:
        key: kagent-db
        property: v1-user
    - secretKey: password
      remoteRef:
        key: kagent-db
        property: v1-password
    - secretKey: readwrite-user
      remoteRef:
        key: kagent-db
        property: v1-readwrite-user
    - secretKey: readwrite-password
      remoteRef:
        key: kagent-db
        property: v1-readwrite-password
