---
# Creates the SELECT-only Postgres role the agent-audit tool logs in as.
#
# An audit tool with write access to the database it audits is not an audit tool.
# This role can read kagent's event/session/task tables and nothing else — it
# cannot INSERT, UPDATE, DELETE, or DDL, and the grants are revoked-then-granted
# so re-running this Job cannot silently accumulate privilege.
#
# The password comes from Vault via kagent-audit-credentials (its own ESO
# ServiceAccount, SecretStore, Vault role and per-consumer key — the agent-identity
# contract). It is never in git.
#
# Two databases, one role. kagent 0.10's `kagent` (schema public) is the read-only
# archive since the kagent 1.0 cutover; kagent 1.0's `kagent_v1` keeps its tables in
# schema `kagent`. The role gets SELECT on both (scripts/agent-audit.py --source).
#
# Idempotent: safe to re-run. Runs as a Sync hook on every sync (see below).
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kagent-audit-role
  namespace: postgresql
  annotations:
    # After init-kagent-db AND init-kagent-v1-db, wave 1 (the kagent_v1 grants below need the
    # database and its schema to exist; in the same wave, a clean-database sync could skip them).
    argocd.argoproj.io/sync-wave: "2"
    # Sync hook, not a desired-state resource — same rationale as
    # init-kagent-db: a self-deleting Job in desired state leaves the app
    # permanently OutOfSync/Missing between syncs.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: init-kagent-audit-role
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      restartPolicy: OnFailure
      containers:
        - name: init-kagent-audit-role
          image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              PG_HOST="postgresql.postgresql.svc.cluster.local"
              PG_PORT="5432"

              ESCAPED_PASSWORD=$(echo "$AUDIT_PASSWORD" | sed "s/'/''/g")

              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$POSTGRES_USER"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              # Create (or re-password) the audit login role. NOSUPERUSER/NOCREATEDB/
              # NOCREATEROLE/NOINHERIT are explicit rather than relying on defaults.
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" \
                -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -v audit_user="$AUDIT_USER" \
                -v audit_password="$ESCAPED_PASSWORD" <<'EOSQL'
                SELECT format(
                  'CREATE ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
                  :'audit_user', :'audit_password')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'audit_user')\gexec

                SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
                  :'audit_user', :'audit_password')
                WHERE EXISTS (SELECT FROM pg_roles WHERE rolname = :'audit_user')\gexec
              EOSQL

              # Grant READ-ONLY on the kagent database. Revoke first so a re-run
              # cannot accumulate privilege, and so tightening this list actually
              # tightens it.
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" \
                -U "$POSTGRES_USER" -d "$AUDIT_DB" \
                -v audit_user="$AUDIT_USER" \
                -v audit_db="$AUDIT_DB" <<'EOSQL'
                -- start from nothing, then grant only SELECT
                REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM :"audit_user";
                REVOKE ALL PRIVILEGES ON SCHEMA public FROM :"audit_user";

                GRANT CONNECT ON DATABASE :"audit_db" TO :"audit_user";
                GRANT USAGE ON SCHEMA public TO :"audit_user";
                GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"audit_user";

                -- kagent's controller owns and migrates these tables; new ones must
                -- also be readable, but still only SELECT. Default privileges apply
                -- to objects CREATED BY a given role, so they must name the role that
                -- creates the tables - the database owner (kagent) - not the admin
                -- running this Job. Without FOR ROLE they covered only tables the
                -- admin creates, i.e. none. (The admin is a superuser, so it may.)
                SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT ON TABLES TO %I',
                  pg_get_userbyid(datdba), :'audit_user')
                FROM pg_database WHERE datname = current_database()\gexec
              EOSQL

              # kagent 1.0: database kagent_v1, schema kagent, same SELECT-only shape.
              # kagent's controller runs its migrations after SET ROLE kagent_owner (chart
              # value database.postgres.role), so kagent_owner owns every table there, not
              # the database owner: default privileges must name it (verified against
              # kagent v1.0.0-alpha11's migrations). Like 0.10's public schema, this covers
              # every table in the schema, the memory table included.
              #
              # Skipped, not failed, while the Vault property or the database is missing:
              # a failed hook would block every postgresql sync. The audit CronJobs then
              # fail to read and the fail-closed Grafana rules fire instead. A clean-database
              # kagent alpha bump that recreates schema kagent drops these grants with it;
              # the next postgresql sync re-runs this hook and restores them.
              if [ -z "${AUDIT_DB_V1:-}" ]; then
                echo "audit-database-v1 is not set (Vault property db-name-v1): skipping the kagent 1.0 grants"
              elif [ "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" \
                    -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -v audit_db="$AUDIT_DB_V1" <<'EOCHECK'
                SELECT count(*) FROM pg_database WHERE datname = :'audit_db';
              EOCHECK
                    )" != "1" ]; then
                echo "database '$AUDIT_DB_V1' does not exist yet: skipping the kagent 1.0 grants"
              else
                PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$PG_HOST" -p "$PG_PORT" \
                  -U "$POSTGRES_USER" -d "$AUDIT_DB_V1" \
                  -v audit_user="$AUDIT_USER" \
                  -v audit_db="$AUDIT_DB_V1" \
                  -v kagent_schema="$KAGENT_V1_SCHEMA" \
                  -v owner_role="$KAGENT_V1_OWNER_ROLE" <<'EOSQL'
                REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA :"kagent_schema" FROM :"audit_user";
                REVOKE ALL PRIVILEGES ON SCHEMA :"kagent_schema" FROM :"audit_user";

                GRANT CONNECT ON DATABASE :"audit_db" TO :"audit_user";
                GRANT USAGE ON SCHEMA :"kagent_schema" TO :"audit_user";
                GRANT SELECT ON ALL TABLES IN SCHEMA :"kagent_schema" TO :"audit_user";

                ALTER DEFAULT PRIVILEGES FOR ROLE :"owner_role" IN SCHEMA :"kagent_schema"
                  GRANT SELECT ON TABLES TO :"audit_user";
              EOSQL
                echo "SELECT-only access to '$AUDIT_DB_V1' schema '$KAGENT_V1_SCHEMA' granted"
              fi

              echo "kagent audit role '$AUDIT_USER' created with SELECT-only access to '$AUDIT_DB'"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: n8n-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: n8n-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: database-name
            - name: AUDIT_USER
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-user
            - name: AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-password
            - name: AUDIT_DB
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-database
            # kagent 1.0's database. optional: the hook skips the 1.0 grants (instead of
            # failing every postgresql sync) until Vault holds db-name-v1.
            - name: AUDIT_DB_V1
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-database-v1
                  optional: true
            # kagent chart values database.postgres.schema / database.postgres.role.
            - name: KAGENT_V1_SCHEMA
              value: kagent
            - name: KAGENT_V1_OWNER_ROLE
              value: kagent_owner
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
