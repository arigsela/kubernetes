# CloudNativePG cluster backing chores-tracker (and originally n8n).
#
# Adopted into GitOps on 2026-07-15. This Cluster has run since 2025-12-03,
# created by a since-deleted Argo CD Application named "postgresql-cnpg"
# (its stale tracking-id was still on the live object). It was the only
# production database in the cluster with no manifest in Git. The spec below
# is a faithful copy of the live object's last-applied configuration, so
# adoption is a no-op apply.
#
# Notes:
#   - bootstrap.initdb only runs at first creation and is ignored for the
#     existing cluster; it is kept so a from-scratch rebuild reproduces the
#     same initial state. The bootstrap database/owner is `n8n` (historical:
#     the cluster was created for n8n, which today uses the plain postgresql
#     Deployment instead).
#   - The `chores_tracker` database and `chores_user` role were created
#     manually inside this cluster and are intentionally not declared here;
#     see base-apps/chores-tracker-backend/crossplane_resources.yaml.
#   - Backup credentials come from the postgresql-backup-credentials Secret
#     (see external-secrets-cnpg-backup.yaml, which has a known sync issue).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-cluster
  namespace: postgresql
spec:
  # Two instances (2026-09-30): primary + one streaming replica, one per worker.
  # With a single instance the operator's primary PDB (minAvailable 1) could never
  # be satisfied, so `kubectl drain` / ansible patch.yml failed on the primary's
  # node ("Cannot evict pod as it would violate the pod's disruption budget",
  # 2026-09-29). With a replica the operator switches the primary over before the
  # drain and the database stays up through a worker reboot. Replication is
  # asynchronous (CNPG default): a planned switchover loses nothing; an unplanned
  # primary crash could lose the last transactions.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  # Shutdown waits at most 30s for clients to leave (smart), then disconnects
  # them and checkpoints (fast). The default 180s turned the 1.30.1 operator
  # upgrade into a ~3m15s outage: donetick's pooled connections never leave on
  # their own (SPEC.md §T.69, §T.83). The instance manager reads this at
  # shutdown time and it is not part of the pod spec, so changing it does not
  # restart the primary. Must stay below maxStopDelay (default 1800s).
  smartShutdownTimeout: 30
  # Placement: any `application` worker (both k3s-worker-01 and -02), never the
  # control plane (SPEC.md §T.27, §T.37), and never two instances on one node
  # (required anti-affinity on hostname, so a node reboot cannot take both).
  #
  # History: 2026-07-28 the single instance was relocated from k3s-control-01 to
  # k3s-worker-01 via §V.43's three phases and pinned there by hostname. Lessons
  # that still apply (§R.8, §B.5): changing `affinity` DOES restart the primary
  # even though the docs do not list it, and a restarted primary can only
  # schedule onto the node that holds its local-path PV. The selector below still
  # matches k3s-worker-01, so the restart this change triggers is in place.
  # Volumes are node-bound local-path: the operator never moves one, it promotes
  # the replica that lives elsewhere.
  affinity:
    nodeSelector:
      node.kubernetes.io/workload: application
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://mysql-backups-asela-cluster/postgresql/
      data:
        compression: gzip
      wal:
        compression: gzip
        maxParallel: 2
      s3Credentials:
        accessKeyId:
          name: postgresql-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgresql-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: postgresql-backup-credentials
          key: AWS_REGION
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: postgresql-credentials
  managed:
    roles:
      # superuser/createdb/createrole are omitted, not set to false: the CNPG
      # webhook strips explicit-false defaults, so declaring them makes Argo
      # see a permanent live-vs-Git diff (observed after adoption).
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: postgresql-credentials
      # Owns the `donetick` database (donetick-database.yaml). Its passwordSecret
      # is kubernetes.io/basic-auth, which CNPG requires and the n8n entry above
      # does not satisfy — see external-secrets-donetick.yaml.
      #
      # DECLARED BUT NOT ENFORCED. The operator never reconciled this entry, so
      # the role was created by hand on 2026-08-03 to unblock the deploy. The
      # declaration is kept so a working reconciler adopts the role instead of
      # conflicting with it. Until then a Vault rotation does NOT reach Postgres:
      # docs/troubleshooting/cnpg-managed-roles-inert.md
      - name: donetick
        ensure: present
        login: true
        passwordSecret:
          name: donetick-db-credentials
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      checkpoint_completion_target: "0.9"
      default_statistics_target: "100"
      effective_cache_size: 512MB
      effective_io_concurrency: "200"
      maintenance_work_mem: 64MB
      max_connections: "100"
      random_page_cost: "1.1"
      shared_buffers: 256MB
      wal_buffers: 16MB
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: local-path
