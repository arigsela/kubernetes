# CloudNativePG cluster backing chores-tracker (and originally n8n).
#
# Adopted into GitOps on 2026-07-15. This Cluster has run since 2025-12-03,
# created by a since-deleted Argo CD Application named "postgresql-cnpg"
# (its stale tracking-id was still on the live object). It was the only
# production database in the cluster with no manifest in Git. The spec below
# is a faithful copy of the live object's last-applied configuration, so
# adoption is a no-op apply.
#
# Notes:
#   - bootstrap.initdb only runs at first creation and is ignored for the
#     existing cluster; it is kept so a from-scratch rebuild reproduces the
#     same initial state. The bootstrap database/owner is `n8n` (historical:
#     the cluster was created for n8n, which today uses the plain postgresql
#     Deployment instead).
#   - The `chores_tracker` database and `chores_user` role were created
#     manually inside this cluster and are intentionally not declared here;
#     see base-apps/chores-tracker-backend/crossplane_resources.yaml.
#   - Backup credentials come from the postgresql-backup-credentials Secret
#     (see external-secrets-cnpg-backup.yaml, which has a known sync issue).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-cluster
  namespace: postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  # Pinned to k3s-worker-01, off the control plane (SPEC.md §T.27, §T.37).
  #
  # Previously `node.kubernetes.io/workload: infrastructure` — a label only k3s-control-01
  # carries — so the only PostgreSQL instance ran on the single control-plane node, on a
  # node-bound local-path volume with no replica.
  #
  # That blocked the upgrade outright rather than merely widening its blast radius:
  # enablePDB is true, so the operator's PDB reports ALLOWED DISRUPTIONS 0 for a
  # single-instance cluster and draining its host node can never complete (§R.10, §V.42).
  #
  # Relocated 2026-07-28 via §V.43's three phases — broaden, relocate by cordon and
  # scale-to-2 with switchover, then narrow. Changing this selector DOES restart the
  # primary (§R.8, §B.5), and a restarted primary cannot schedule away from its own PV, so
  # narrowing this value before the data has moved will take the database down.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: k3s-worker-01
  backup:
    barmanObjectStore:
      destinationPath: s3://mysql-backups-asela-cluster/postgresql/
      data:
        compression: gzip
      wal:
        compression: gzip
        maxParallel: 2
      s3Credentials:
        accessKeyId:
          name: postgresql-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgresql-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: postgresql-backup-credentials
          key: AWS_REGION
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: postgresql-credentials
  managed:
    roles:
      # superuser/createdb/createrole are omitted, not set to false: the CNPG
      # webhook strips explicit-false defaults, so declaring them makes Argo
      # see a permanent live-vs-Git diff (observed after adoption).
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: postgresql-credentials
      # Owns the `donetick` database (donetick-database.yaml). Its passwordSecret
      # is kubernetes.io/basic-auth, which CNPG requires and the n8n entry above
      # does not satisfy — see external-secrets-donetick.yaml.
      - name: donetick
        ensure: present
        login: true
        passwordSecret:
          name: donetick-db-credentials
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      checkpoint_completion_target: "0.9"
      default_statistics_target: "100"
      effective_cache_size: 512MB
      effective_io_concurrency: "200"
      maintenance_work_mem: 64MB
      max_connections: "100"
      random_page_cost: "1.1"
      shared_buffers: 256MB
      wal_buffers: 16MB
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: local-path
