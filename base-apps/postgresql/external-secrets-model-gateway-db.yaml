# The model gateway's Postgres login password, for init-model-gateway-db (§T.137). The gateway reads
# the same Vault entry into its own namespace (base-apps/model-gateway/env-external-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-gateway-db
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-model-gateway-db
    kind: SecretStore
  target:
    name: model-gateway-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: model-gateway-db
        property: password
