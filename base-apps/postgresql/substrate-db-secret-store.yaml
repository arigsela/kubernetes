# Path-scoped SecretStore for Substrate's database credential, in the postgresql namespace.
# Authenticates as eso-substrate against Vault role `substrate`. That role's policy also reads
# k8s-secrets/substrate-cas (one role for all of Substrate, to keep the Vault surface small);
# the only ExternalSecret here reads substrate-db.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-substrate
  namespace: postgresql
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: substrate
          serviceAccountRef:
            name: eso-substrate
