# Prepares database `substrate` for Agent Substrate on this (pgvector) Postgres. ateapi never
# provisions an external database; the operator creates the identities first
# (docs/postgres.md @ kagent-dev/substrate v0.5.0-alpha2, "Operator Provisioned BYO DB").
#
# The DO block below is upstream's own setup script, pkg/postgressetup/setup.sql @ v0.5.0-alpha2
# (Apache-2.0), unchanged except that it is fed our names and passwords: NOLOGIN roles
# substrate_owner / substrate_readwrite, schema `substrate` owned by substrate_owner, NOINHERIT
# login users substrate_owner_user / substrate_readwrite_user, and the owner's default
# privileges so every table a migration creates is readable/writable by the runtime role.
# Additions around it: the database itself, and CONNECT for the two logins only.
#
# Idempotent (re-runs on every postgresql sync; passwords follow Vault k8s-secrets/substrate-db).
# A conflicting existing role or schema fails the Job loudly. After changing ONLY this file,
# sync the postgresql app once by hand (hook-only changes do not trigger auto-sync).
#
# Wave 1 / activeDeadlineSeconds: same reasons as init-kagent-v1-db.
apiVersion: batch/v1
kind: Job
metadata:
  name: init-substrate-db
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: init-substrate-db
    spec:
      nodeSelector:
        node.kubernetes.io/workload: application
      restartPolicy: OnFailure
      containers:
        - name: init-substrate-db
          image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              PG_HOST="postgresql.postgresql.svc.cluster.local"
              PG_PORT="5432"
              export PGPASSWORD="$POSTGRES_PASSWORD"

              until pg_isready -h "$PG_HOST" -p "$PG_PORT" -U "$POSTGRES_USER"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              psql --no-psqlrc -v ON_ERROR_STOP=1 -h "$PG_HOST" -p "$PG_PORT" \
                -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v substrate_db="$SUBSTRATE_DB" <<'EOSQL'
              SELECT format('CREATE DATABASE %I', :'substrate_db')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'substrate_db')\gexec
              EOSQL

              psql --no-psqlrc -v ON_ERROR_STOP=1 -h "$PG_HOST" -p "$PG_PORT" \
                -U "$POSTGRES_USER" -d "$SUBSTRATE_DB" \
                --set=substrate_schema=substrate \
                --set=substrate_owner_role=substrate_owner \
                --set=substrate_owner_user="$OWNER_USER" \
                --set=substrate_owner_password="$OWNER_PASSWORD" \
                --set=substrate_readwrite_role=substrate_readwrite \
                --set=substrate_readwrite_user="$READWRITE_USER" \
                --set=substrate_readwrite_password="$READWRITE_PASSWORD" <<'EOSQL'
              BEGIN;
              -- ---- upstream pkg/postgressetup/setup.sql @ v0.5.0-alpha2, verbatim ----
              SELECT
                  set_config('agent_substrate.setup_schema', :'substrate_schema', true) AS schema,
                  set_config('agent_substrate.setup_owner_role', :'substrate_owner_role', true) AS owner_role,
                  set_config('agent_substrate.setup_owner_user', :'substrate_owner_user', true) AS owner_user,
                  set_config('agent_substrate.setup_owner_password', :'substrate_owner_password', true) AS owner_password,
                  set_config('agent_substrate.setup_readwrite_role', :'substrate_readwrite_role', true) AS readwrite_role,
                  set_config('agent_substrate.setup_readwrite_user', :'substrate_readwrite_user', true) AS readwrite_user,
                  set_config('agent_substrate.setup_readwrite_password', :'substrate_readwrite_password', true) AS readwrite_password
              \gset

              DO $setup$
              DECLARE
                  schema_name text := current_setting('agent_substrate.setup_schema');
                  owner_role text := current_setting('agent_substrate.setup_owner_role');
                  owner_user text := current_setting('agent_substrate.setup_owner_user');
                  owner_password text := NULLIF(current_setting('agent_substrate.setup_owner_password'), '');
                  readwrite_role text := current_setting('agent_substrate.setup_readwrite_role');
                  readwrite_user text := current_setting('agent_substrate.setup_readwrite_user');
                  readwrite_password text := NULLIF(current_setting('agent_substrate.setup_readwrite_password'), '');
                  managed record;
                  role_attrs record;
                  schema_owner text;
              BEGIN
                  PERFORM pg_advisory_xact_lock(hashtextextended('agent-substrate:setup:' || schema_name, 0));

                  FOR managed IN SELECT * FROM (VALUES
                      (owner_role, false, NULL::text),
                      (readwrite_role, false, NULL::text),
                      (owner_user, true, owner_password),
                      (readwrite_user, true, readwrite_password)
                  ) AS roles(name, can_login, password) LOOP
                      SELECT rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolinherit
                        INTO role_attrs FROM pg_roles WHERE rolname = managed.name;
                      IF NOT FOUND THEN
                          IF managed.can_login THEN
                              EXECUTE format('CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', managed.name);
                          ELSE
                              EXECUTE format('CREATE ROLE %I NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', managed.name);
                          END IF;
                      ELSIF role_attrs.rolcanlogin <> managed.can_login OR role_attrs.rolsuper
                         OR role_attrs.rolcreatedb OR role_attrs.rolcreaterole OR role_attrs.rolreplication
                         OR (managed.can_login AND role_attrs.rolinherit) THEN
                          RAISE EXCEPTION 'managed PostgreSQL role "%" conflicts with the required attributes', managed.name;
                      END IF;
                      IF managed.can_login THEN
                          EXECUTE format('ALTER ROLE %I PASSWORD %L', managed.name, managed.password);
                      END IF;
                  END LOOP;

                  EXECUTE format('GRANT %I TO %I', owner_role, owner_user);
                  EXECUTE format('GRANT %I TO %I', readwrite_role, readwrite_user);

                  SELECT pg_get_userbyid(nspowner) INTO schema_owner FROM pg_namespace WHERE nspname = schema_name;
                  IF NOT FOUND THEN
                      EXECUTE format('CREATE SCHEMA %I AUTHORIZATION %I', schema_name, owner_role);
                  ELSIF schema_owner <> owner_role THEN
                      RAISE EXCEPTION 'PostgreSQL schema "%" is owned by "%", not "%"', schema_name, schema_owner, owner_role;
                  END IF;

                  REVOKE CREATE ON SCHEMA public FROM PUBLIC;
                  EXECUTE format('REVOKE ALL ON SCHEMA %I FROM PUBLIC', schema_name);
                  EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', schema_name, readwrite_role);
                  EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', owner_role, schema_name, readwrite_role);
                  EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', owner_role, schema_name, readwrite_role);
                  EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT EXECUTE ON ROUTINES TO %I', owner_role, schema_name, readwrite_role);
                  EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE ON TYPES TO %I', owner_role, schema_name, readwrite_role);
              END
              $setup$;
              -- ---- end of upstream setup.sql ----

              -- Ours: the database admits only Substrate's two logins. Passwords must not be
              -- empty here (upstream's empty password means certificate auth, which we do not use).
              DO $connect$
              BEGIN
                  IF current_setting('agent_substrate.setup_owner_password') = ''
                     OR current_setting('agent_substrate.setup_readwrite_password') = '' THEN
                      RAISE EXCEPTION 'Substrate login password is empty (Vault substrate-db)';
                  END IF;
                  EXECUTE format('REVOKE CONNECT, TEMPORARY ON DATABASE %I FROM PUBLIC', current_database());
                  EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I, %I', current_database(),
                                 current_setting('agent_substrate.setup_owner_user'),
                                 current_setting('agent_substrate.setup_readwrite_user'));
              END
              $connect$;
              COMMIT;
              EOSQL

              echo "substrate database ready: roles substrate_owner/substrate_readwrite, schema substrate"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: n8n-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: n8n-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: database-name
            - name: SUBSTRATE_DB
              valueFrom:
                secretKeyRef:
                  name: substrate-db-credentials
                  key: db-name
            - name: OWNER_USER
              valueFrom:
                secretKeyRef:
                  name: substrate-db-credentials
                  key: owner-user
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-db-credentials
                  key: owner-password
            - name: READWRITE_USER
              valueFrom:
                secretKeyRef:
                  name: substrate-db-credentials
                  key: readwrite-user
            - name: READWRITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-db-credentials
                  key: readwrite-password
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
