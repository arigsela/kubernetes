# base-apps/postgresql/external-secrets-beacon-db.yaml (beacon §T.15)
# The two login passwords, for init-beacon-roles.yaml to set on the roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-db-credentials
  namespace: postgresql
  annotations:
    # THE WAY TO RE-RUN init-beacon-roles (beacon §V.37, beacon §B.8): bump this number in a PR.
    # Sync hooks run only inside a sync, and Argo auto-syncs only when desired state differs
    # from the cluster; a hook's own annotations and *.md files are not desired state, so
    # changing them merges without running anything. This annotation is real desired state,
    # so a bump makes the postgresql app OutOfSync and its auto-sync runs every hook. Use it
    # after scripts/provision-beacon-vault.sh --rotate-db, or when the hook skipped.
    beacon.arigsela.com/rerun-init-beacon-roles: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-beacon-db
    kind: SecretStore
  target:
    name: beacon-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: owner-password
      remoteRef:
        key: beacon-db
        property: owner-password
    - secretKey: app-password
      remoteRef:
        key: beacon-db
        property: app-password
