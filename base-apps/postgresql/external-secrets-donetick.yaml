---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-db-credentials
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-donetick-db
    kind: SecretStore
  target:
    name: donetick-db-credentials
    creationPolicy: Owner
    # The type is load-bearing. CNPG requires a role's passwordSecret to be
    # kubernetes.io/basic-auth with username/password keys; given anything else
    # it creates the role WITHOUT a password and logs nothing. (The older n8n
    # managed role points at an Opaque secret — do not copy it.)
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Upstream's managed-role example carries this. It did NOT make the
          # role reconcile here (see docs/troubleshooting/cnpg-managed-roles-inert.md),
          # but the secret is meant to be watched, so it belongs in Git rather
          # than as a label someone added live and ESO later stripped.
          cnpg.io/reload: "true"
      data:
        username: "donetick"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: donetick-db
        property: db-password
