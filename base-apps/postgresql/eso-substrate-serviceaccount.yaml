# Dedicated ESO ServiceAccount for Substrate's database credential, in the postgresql namespace.
# The Vault kubernetes-auth role `substrate` is bound to this SA name in ate-system,
# podcertificate-controller-system and postgresql (scripts/provision-kagent-1-0-vault.sh).
#
# Why a copy lives here: init-substrate-db runs in this namespace and needs the Substrate login
# passwords to create the roles. Same credential ate-api-server consumes in ate-system.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-substrate
  namespace: postgresql
