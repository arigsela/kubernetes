            - name: AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-password
            - name: AUDIT_DB
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-database-v1
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-audit-risk-credentials
                  key: typesafe-api-key
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agent-audit-s3-creds
                  key: username
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-audit-s3-creds
                  key: attribute.secret
            volumeMounts:
            - name: code
              mountPath: /opt/audit
              readOnly: true
            - name: scratch
              mountPath: /scratch
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                - ALL
          volumes:
          - name: code
            configMap:
              name: agent-audit-code
          - name: scratch
            emptyDir:
              sizeLimit: 256Mi

