apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-audit-risk
  namespace: postgresql
  labels:
    app: agent-audit
spec:
  schedule: 30 2 * * *
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 7
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: agent-audit
        spec:
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: application
          containers:
          - name: agent-audit-risk
            image: python:3.12-slim
            command:
            - /bin/sh
            - -c
            args:
            - 'set -eu

              pip install --quiet --no-cache-dir --target=/scratch/pylib ''psycopg[binary]==3.2.3'' ''pyyaml==6.0.2'' ''boto3==1.35.71''

              export PYTHONPATH=/scratch/pylib

              export AGENT_AUDIT_DSN="postgresql://${AUDIT_USER}:${AUDIT_PASSWORD}@postgresql.postgresql.svc.cluster.local:5432/${AUDIT_DB}"

              export KEY="dt=$(date -u +%Y-%m-%d)/$(date -u +%H%M%S)-risk.jsonl"

              python /opt/audit/agent-audit.py --source v1 --export --since 25h > /scratch/record.jsonl

              set +e

              python /opt/audit/agent-audit-risk.py --records /scratch/record.jsonl --out /scratch/risk.jsonl --taxonomy /opt/audit/agent-capability-taxonomy.yaml --max-sessions 50

              RC=$?

              set -e

              [ -s /scratch/risk.jsonl ] || exit $RC

              echo "uploading $(wc -l < /scratch/risk.jsonl) risk records to ${KEY}" >&2

              python -c "import boto3,os;boto3.client(''s3'',aws_access_key_id=os.environ[''AWS_ACCESS_KEY_ID''],aws_secret_access_key=os.environ[''AWS_SECRET_ACCESS_KEY''],region_name=''us-east-1'').upload_file(''/scratch/risk.jsonl'',''asela-agent-audit-record'', os.environ[''KEY''])"

              echo "uploaded s3://asela-agent-audit-record/${KEY}" >&2

              exit $RC

              '
            env:
            - name: HOME
              value: /scratch
            - name: PIP_CACHE_DIR
              value: /scratch/.cache
            - name: AUDIT_USER
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
