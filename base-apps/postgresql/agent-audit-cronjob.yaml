apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-audit-export
  namespace: postgresql
  labels:
    app: agent-audit
spec:
  schedule: 30 1 * * *
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: agent-audit
        spec:
          restartPolicy: Never
          nodeSelector:
            node.kubernetes.io/workload: application
          containers:
          - name: agent-audit-export
            image: python:3.12-slim
            command:
            - /bin/sh
            - -c
            args:
            - 'set -eu

              pip install --quiet --no-cache-dir --target=/scratch/pylib ''psycopg[binary]==3.2.3'' ''pyyaml==6.0.2'' ''boto3==1.35.71''

              export PYTHONPATH=/scratch/pylib

              export AGENT_AUDIT_DSN="postgresql://${AUDIT_USER}:${AUDIT_PASSWORD}@postgresql.postgresql.svc.cluster.local:5432/${AUDIT_DB}"

              export KEY="dt=$(date -u +%Y-%m-%d)/$(date -u +%H%M%S).jsonl"

              python /opt/audit/agent-audit.py --source v1 --export --since 25h > /scratch/record.jsonl

              echo "exporting $(wc -l < /scratch/record.jsonl) records to ${KEY}"

              python -c "import boto3,os;boto3.client(''s3'',aws_access_key_id=os.environ[''AWS_ACCESS_KEY_ID''],aws_secret_access_key=os.environ[''AWS_SECRET_ACCESS_KEY''],region_name=''us-east-1'').upload_file(''/scratch/record.jsonl'',''asela-agent-audit-record'', os.environ[''KEY''])"

              echo "uploaded s3://asela-agent-audit-record/${KEY}"

              '
            env:
            - name: HOME
              value: /scratch
            - name: PIP_CACHE_DIR
              value: /scratch/.cache
            - name: AUDIT_USER
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-user
            - name: AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-password
            - name: AUDIT_DB
              valueFrom:
                secretKeyRef:
                  name: kagent-audit-credentials
                  key: audit-database-v1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agent-audit-s3-creds
                  key: username
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-audit-s3-creds
                  key: attribute.secret
            volumeMounts:
            - name: code
              mountPath: /opt/audit
              readOnly: true
            - name: scratch
              mountPath: /scratch
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                - ALL
          volumes:
          - name: code
            configMap:
              name: agent-audit-code
          - name: scratch
            emptyDir:
              sizeLimit: 256Mi

