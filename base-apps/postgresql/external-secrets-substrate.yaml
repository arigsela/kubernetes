# Substrate's database identity, as consumed by the init-substrate-db Job in THIS namespace.
# Vault key k8s-secrets/substrate-db (scripts/provision-kagent-1-0-vault.sh). ate-system builds
# its connection strings from the same properties (base-apps/substrate/external-secret-postgres.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-db-credentials
  namespace: postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-substrate
    kind: SecretStore
  target:
    name: substrate-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db-name
      remoteRef:
        key: substrate-db
        property: db-name
    - secretKey: owner-user
      remoteRef:
        key: substrate-db
        property: owner-user
    - secretKey: owner-password
      remoteRef:
        key: substrate-db
        property: owner-password
    - secretKey: readwrite-user
      remoteRef:
        key: substrate-db
        property: readwrite-user
    - secretKey: readwrite-password
      remoteRef:
        key: substrate-db
        property: readwrite-password
