# base-apps/postgresql/beacon-db-secret-store.yaml (beacon §T.15)
# Vault role beacon-db (scripts/provision-beacon-vault.sh) binds eso-beacon-db here AND in
# namespace beacon. It reads k8s-secrets/beacon-db only, never beacon's signing key.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-beacon-db
  namespace: postgresql
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: k8s-secrets
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: beacon-db
          serviceAccountRef:
            name: eso-beacon-db
