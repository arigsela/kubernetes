# .github/promotion-policy.yaml
# Promotion policy (ADP path 5): the one class of pull request that merges WITHOUT a human.
# Read by scripts/promote.py at the PR's base ref (main), which the PR cannot change, so it cannot
# loosen its own promotion. Spec: docs/superpowers/specs/2026-10-12-signal-dispatch-and-promotion-design.md
# (§V.89, §V.90). Changing this file is itself `review:read` (.github/**) and never `auto`.
version: 1
auto:                                   # merged by .github/workflows/promote.yaml, no human
  authors: ["arigsela-renovate[bot]"]   # the API login; `gh` shows app/arigsela-renovate
  # triage found nothing to read. The label alone is not enough: the classifier can also
  # emit skip, so promote.py re-derives triage's deterministic always_skip from the diff
  # (every file docs, or only image:/tag: value lines changed, <= 4 lines in total) and
  # requires it.
  require_labels: ["review:skip"]
  deny_prefixes:                        # never automatic, whatever triage said (path starts-with)
    - terraform/                        # applies before merge, via Atlantis
    - .github/                          # the workflows and the policies themselves
    - renovate.json5                    # configures the very author this class trusts
    - base-apps/crossplane              # provider package bumps are not image-tag bumps
    - appsets/
    - ansible/
    - node-config/
    - base-apps/vault                   # covers vault.yaml and vault/
    - base-apps/postgresql
    - base-apps/kagent
    - base-apps/substrate
    - base-apps/admission-policies
    - base-apps/istio-
    - base-apps/dex
    - base-apps/cluster-rbac
    - base-apps/dispatcher
    # n8n's init container drives the n8n CLI on every start and its migrations are one-way:
    # a bump needs the script rehearsed on the new version and a DB dump first (§T.151).
    - base-apps/n8n
  max_changed_files: 2
  merge_method: rebase                  # the only method the main ruleset allows
owner:                                  # everything else; the triage label says how closely to read
  approvers: ["arigsela"]
auto_docs:                              # second class (2026-10-13): the owner's documentation
  # Every changed file is docs (`*.md` or under `docs/`, triage's always_skip.paths), by the
  # owner, labelled review:skip, every check green. The agent-instruction files are denied:
  # they steer what the coding agent does next, so a human reads every change to them.
  authors: ["arigsela"]
  require_labels: ["review:skip"]
  deny_prefixes:
    - .github/
    - .claude/
    - CLAUDE.md
    - AGENTS.md
    - templates/                        # the contracts new apps and agents are generated from
  max_changed_files: 10
