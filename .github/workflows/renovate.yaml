# Weekly Renovate run for this repo. How to operate it: docs/platform/renovate.md.
# Why: docs/plans/cve-remediation-automation-implementation-plan.md (Phase 2).
#
# Renovate only opens and updates PRs; the owner merges. Its configuration is
# renovate.json5 at the repo root, read from main. Writes use a token minted
# from the arigsela-renovate GitHub App (installed on this repo only), so the
# workflow's own GITHUB_TOKEN stays read-only.
name: Renovate

on:
  schedule:
    # Mondays 05:00 UTC, the morning after the Sunday 04:00 image scan.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "none = real run; lookup/full = log what it would do and write nothing"
        type: choice
        options: [none, lookup, full]
        default: none
      logLevel:
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint a token from the Renovate GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: arigsela
          repositories: kubernetes

      # Only set when asked: an empty RENOVATE_DRY_RUN is not "off".
      - name: Dry-run mode
        if: inputs.dryRun == 'lookup' || inputs.dryRun == 'full'
        run: echo "RENOVATE_DRY_RUN=${{ inputs.dryRun }}" >> "$GITHUB_ENV"

      - name: Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.137.0
        env:
          RENOVATE_REPOSITORIES: arigsela/kubernetes
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commit through the GitHub API, so commits are signed and attributed
          # to the App rather than to a made-up git identity.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
