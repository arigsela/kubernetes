destination:
  namespace: crossplane-system
  server: https://kubernetes.default.svc
project: default
source:
  path: base-apps/crossplane-system
  repoURL: https://github.com/arigsela/kubernetes
  targetRevision: main
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
  - CreateNamespace=true
