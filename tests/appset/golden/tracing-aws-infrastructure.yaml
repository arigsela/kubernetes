destination:
  namespace: tracing
  server: https://kubernetes.default.svc
project: default
source:
  path: base-apps/tracing-aws-infrastructure
  repoURL: https://github.com/arigsela/kubernetes
  targetRevision: main
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
  - ServerSideApply=true
