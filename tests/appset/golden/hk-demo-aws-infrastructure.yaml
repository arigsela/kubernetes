destination:
  namespace: hk-demo
  server: https://kubernetes.default.svc
project: default
source:
  path: base-apps/hk-demo-aws-infrastructure
  repoURL: https://github.com/arigsela/kubernetes
  targetRevision: main
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
  - ServerSideApply=true
