apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    crossplane.io/composition-resource-name: dump-nightly
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: demo
  name: beacon-dump-nightly
  namespace: tenant-demo
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          annotations:
            instrumentation.opentelemetry.io/inject-python: 'false'
          labels:
            app: beacon-dump
            app.kubernetes.io/name: beacon-dump
            app.kubernetes.io/part-of: beacon
            backstage.io/kubernetes-id: beacon-dump
            beacon.arigsela.com/tenant: demo
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/sh
            - -c
            - 'set -eu

              key="${KEY:-${KEY_PREFIX}$(date -u +%Y-%m-%dT%H%M%SZ).dump}"

              aws s3 cp /dump/beacon.dump "s3://$BUCKET/$key" --only-show-errors

              size=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --query
              ContentLength --output text)

              test "$size" -gt 0

              echo "dump verified: s3://$BUCKET/$key ($size bytes)"

              '
            env:
            - name: BUCKET
              value: beacon-tenant-demo-3f1c2a9e
            - name: KEY_PREFIX
              value: nightly/
            - name: AWS_REGION
              value: us-east-2
            - name: HOME
              value: /tmp
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: username
                  name: beacon-s3
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: attribute.secret
                  name: beacon-s3
            image: public.ecr.aws/aws-cli/aws-cli:2.37.13@sha256:d32864c20087d486f5988c3e70817d67a73f584a47535cada9ad97e0ea1e5196
            name: upload
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /dump
              name: dump
              readOnly: true
            - mountPath: /tmp
              name: tmp
          initContainers:
          - command:
            - /bin/sh
            - -c
            - "set -eu\n# k3s's network policy controller admits a new pod about a\
              \ second after it starts, and refuses it\n# until then; pg_dump would\
              \ connect at once. Wait up to a minute (beacon \xA7B.28).\ntries=0\n\
              until pg_isready --quiet --timeout=5; do\n  tries=$((tries + 1))\n \
              \ test \"$tries\" -lt 30 || { echo \"database not reachable\" >&2; exit\
              \ 1; }\n  sleep 2\ndone\npg_dump --format=custom --no-owner --file=/dump/beacon.dump\n\
              # A dump that does not list is not a backup (beacon \xA7V.12).\npg_restore\
              \ --list /dump/beacon.dump > /dev/null\ntest -s /dump/beacon.dump\n"
            env:
            - name: PGHOST
              value: beacon-db-rw.tenant-demo.svc.cluster.local
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: beacon
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: beacon-db-superuser
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: beacon-db-superuser
            image: ghcr.io/cloudnative-pg/postgresql:16.4
            name: pg-dump
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 26
              runAsUser: 26
            volumeMounts:
            - mountPath: /dump
              name: dump
          nodeSelector:
            node.kubernetes.io/workload: application
          restartPolicy: Never
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: beacon-dump
          volumes:
          - emptyDir:
              sizeLimit: 1Gi
            name: dump
          - emptyDir:
              sizeLimit: 64Mi
            name: tmp
  schedule: 40 2 * * *
  successfulJobsHistoryLimit: 1
  suspend: false
---
