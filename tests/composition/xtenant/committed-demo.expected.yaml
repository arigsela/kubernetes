    crossplane.io/composition-resource-name: generated-secrets
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: demo
  name: beacon-db-secrets
  namespace: tenant-demo
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: beacon-db-passwords
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: beacon-signing-key
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: beacon-db-secrets
