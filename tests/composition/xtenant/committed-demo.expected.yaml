apiVersion: v1
data:
  beacon-flags.json: "{\n  \"$schema\": \"https://flagd.dev/schema/v0/flags.json\"\
    ,\n  \"flags\": {\n    \"checkerSlowProbe\": {\n      \"state\": \"ENABLED\",\n\
    \      \"variants\": {\n        \"off\": 0.0,\n        \"slow\": 5.0\n      },\n\
    \      \"defaultVariant\": \"off\"\n    },\n    \"checkerFalseDown\": {\n    \
    \  \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n \
    \       \"on\": true\n      },\n      \"defaultVariant\": \"off\"\n    },\n  \
    \  \"notifierReceiverFail\": {\n      \"state\": \"ENABLED\",\n      \"variants\"\
    : {\n        \"off\": false,\n        \"on\": true\n      },\n      \"defaultVariant\"\
    : \"off\"\n    },\n    \"apiDbPoolExhaust\": {\n      \"state\": \"ENABLED\",\n\
    \      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      },\n\
    \      \"defaultVariant\": \"off\"\n    },\n    \"apiSlowQuery\": {\n      \"\
    state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0.0,\n        \"\
    slow\": 2.0\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"tenantFloodIngest\"\
    : {\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0.0,\n\
    \        \"flood\": 10.0\n      },\n      \"defaultVariant\": \"off\"\n    },\n\
    \    \"schedulerStall\": {\n      \"state\": \"ENABLED\",\n      \"variants\"\
    : {\n        \"off\": false,\n        \"on\": true\n      },\n      \"defaultVariant\"\
    : \"off\"\n    }\n  }\n}"
kind: ConfigMap
metadata:
