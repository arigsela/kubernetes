apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-push
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: demo
  name: beacon-vault-push
  namespace: tenant-demo
spec:
  data:
  - match:
      remoteRef:
        property: owner-password
        remoteKey: tenants/tenant-demo/db
      secretKey: password
  - match:
      remoteRef:
        property: app-password
        remoteKey: tenants/tenant-demo/db
      secretKey: app-password
  - match:
      remoteRef:
        property: signing-key
        remoteKey: tenants/tenant-demo/signing
      secretKey: signing-key
  - match:
      remoteRef:
        property: dsn
        remoteKey: tenants/tenant-demo/api
      secretKey: dsn
  - match:
      remoteRef:
        property: signing_key
        remoteKey: tenants/tenant-demo/api
      secretKey: signing-key
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
  - kind: SecretStore
    name: vault-backend
  selector:
    secret:
      name: beacon-db-secrets
  template:
    data:
      dsn: postgresql://beacon_app:{{ index . "app-password" }}@beacon-db-rw.tenant-demo.svc.cluster.local:5432/beacon
    engineVersion: v2
    mergePolicy: Merge
  updatePolicy: Replace
