apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: iam-policy
  labels:
    app.kubernetes.io/component: iam-policy
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: acme-co
  name: beacon-tenant-acme-co-s3
spec:
  forProvider:
    description: 'beacon tenant acme-co: its own bucket only'
    policy: '{"Version": "2012-10-17", "Statement": [{"Sid": "TenantBucket", "Effect":
      "Allow", "Action": ["s3:ListBucket", "s3:GetObject", "s3:PutObject"], "Resource":
      ["arn:aws:s3:::beacon-tenant-acme-co-0b5e9d72", "arn:aws:s3:::beacon-tenant-acme-co-0b5e9d72/*"]}]}'
    tags:
      Environment: homelab
      ManagedBy: Crossplane
      Name: beacon tenant acme-co
      Project: beacon
      Purpose: beacon tenant dumps
      Tenant: acme-co
  providerConfigRef:
    name: default
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-push
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: acme-co
  name: beacon-vault-push
  namespace: tenant-acme-co
spec:
  data:
  - match:
      remoteRef:
        property: owner-password
        remoteKey: tenants/tenant-acme-co/db
      secretKey: password
  - match:
      remoteRef:
        property: app-password
        remoteKey: tenants/tenant-acme-co/db
      secretKey: app-password
  - match:
      remoteRef:
        property: signing-key
        remoteKey: tenants/tenant-acme-co/signing
      secretKey: signing-key
  - match:
      remoteRef:
        property: dsn
        remoteKey: tenants/tenant-acme-co/api
      secretKey: dsn
  - match:
      remoteRef:
        property: signing_key
        remoteKey: tenants/tenant-acme-co/api
      secretKey: signing-key
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
  - kind: SecretStore
    name: vault-backend
  selector:
    secret:
      name: beacon-db-secrets
  template:
    data:
      dsn: postgresql://beacon_app:{{ index . "app-password" }}@beacon-db-rw.tenant-acme-co.svc.cluster.local:5432/beacon
    engineVersion: v2
    mergePolicy: Merge
  updatePolicy: Replace
