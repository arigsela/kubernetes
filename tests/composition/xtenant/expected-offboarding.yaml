apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    crossplane.io/composition-resource-name: database
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: acme-co
  name: beacon-db
  namespace: tenant-acme-co
spec:
  bootstrap:
    initdb:
      database: beacon
      owner: beacon_owner
      secret:
        name: beacon-db-secrets
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: beacon
      beacon.arigsela.com/tenant: acme-co
      istio.io/dataplane-mode: none
  instances: 1
  postgresql:
    parameters:
      max_connections: '40'
      shared_buffers: 64MB
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  storage:
    size: 1Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    crossplane.io/composition-resource-name: generated-secrets
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: crossplane
    app.kubernetes.io/part-of: beacon
    beacon.arigsela.com/tenant: acme-co
  name: beacon-db-secrets
  namespace: tenant-acme-co
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: beacon-db-passwords
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: beacon-signing-key
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Owner
    name: beacon-db-secrets
    template:
      data:
        app-password: '{{ index . "app-password" }}'
        password: '{{ index . "owner-password" }}'
        signing-key: '{{ index . "signing-key" }}'
        username: beacon_owner
      engineVersion: v2
      type: kubernetes.io/basic-auth
---
