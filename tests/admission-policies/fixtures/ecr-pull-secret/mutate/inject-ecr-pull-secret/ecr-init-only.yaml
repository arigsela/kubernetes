# Only an init container pulls from ECR.
apiVersion: v1
kind: Pod
metadata:
  name: ecr-init-only
  namespace: admission-test
  annotations:
    test.homelab/expect-pull-secrets: ecr-registry
spec:
  containers:
  - name: app
    resources: &id001
      limits:
        cpu: 10m
        memory: 16Mi
    image: busybox:1.37
  initContainers:
  - name: init
    resources: *id001
    image: 852893458518.dkr.ecr.us-east-2.amazonaws.com/app:1.0.0
