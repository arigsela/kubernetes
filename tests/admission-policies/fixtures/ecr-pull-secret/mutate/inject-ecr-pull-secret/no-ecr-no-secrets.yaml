# No ECR reference and no secrets: stays without imagePullSecrets.
apiVersion: v1
kind: Pod
metadata:
  name: no-ecr-no-secrets
  namespace: admission-test
  annotations:
    test.homelab/expect-pull-secrets: ''
spec:
  containers:
  - name: app
    resources:
      limits:
        cpu: 10m
        memory: 16Mi
    image: busybox:1.37
