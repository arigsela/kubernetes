# The 1.0 approval pattern: one server bound twice, read tools ungated, every mutating tool in the requireApproval: true binding.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: good-split-bindings
  namespace: kagent
  labels:
    capability.homelab/class: admin
spec:
  modelConfig:
    name: anthropic-claude-haiku-5-5
  systemPrompt: fixture
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        requireApproval: false
        tools:
          - k8s_get_resources
          - k8s_describe_resource
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        requireApproval: true
        tools:
          - k8s_delete_resource
          - k8s_label_resource
