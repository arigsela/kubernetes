# rule 4: write agent binds a destructive tool. (from tests/agent-capability/kyverno/bad-agents.yaml)
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: bad-write-binds-destructive
  namespace: kagent
  labels:
    capability.homelab/class: write
spec:
  declarative:
    tools:
    - type: McpServer
      mcpServer:
        name: kagent-tool-server
        toolNames:
        - k8s_get_resources
        - k8s_execute_command
        requireApproval:
        - k8s_execute_command
