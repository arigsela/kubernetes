# rule 5: requireApproval omitted defaults to false, so the write tool is ungated.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: bad-approval-omitted
  namespace: kagent
  labels:
    capability.homelab/class: write
spec:
  modelConfig:
    name: anthropic-claude-haiku-5-5
  systemPrompt: fixture
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_patch_resource
