# rule 3: read agent binds a destructive tool. (ported from the retired Kyverno CLI suite)
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: bad-read-binds-destructive
  namespace: kagent
  labels:
    capability.homelab/class: read
spec:
  declarative:
    tools:
    - type: McpServer
      mcpServer:
        name: kagent-tool-server
        toolNames:
        - k8s_get_resources
        - k8s_delete_resource
        requireApproval:
        - k8s_delete_resource
