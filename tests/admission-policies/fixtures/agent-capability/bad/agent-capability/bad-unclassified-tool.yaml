# rule 2: binds a tool absent from the taxonomy (fail-closed). (ported from the retired Kyverno CLI suite)
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: bad-unclassified-tool
  namespace: kagent
  labels:
    capability.homelab/class: admin
spec:
  declarative:
    tools:
    - type: McpServer
      mcpServer:
        name: kagent-tool-server
        toolNames:
        - k8s_get_resources
        - k8s_brand_new_tool_from_chart_bump
