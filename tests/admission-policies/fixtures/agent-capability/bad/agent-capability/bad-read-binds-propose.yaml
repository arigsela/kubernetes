# rule 3: a read template binds a propose tool.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: bad-read-binds-propose
  namespace: kagent
  labels:
    capability.homelab/class: read
spec:
  modelConfig:
    name: anthropic-claude-haiku-5-5
  systemPrompt: fixture
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: agent-docs
        requireApproval: false
        tools:
          - get_file_contents
          - create_pull_request
