# tests/admission-policies/fixtures/crds/xtenants.yaml
# The CRD Crossplane generates from base-apps/crossplane-compositions/xrd-tenant.yaml, minus the
# spec.crossplane fields Crossplane adds: the harness has no Crossplane, and xtenant-guard reads
# only metadata.name, spec.offboard and status.backup. tests/beacon/test_tenants.py
# test_v30_fixture_crd_matches_xrd keeps spec and status identical to the XRD's.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xtenants.platform.arigsela.com
spec:
  group: platform.arigsela.com
  scope: Cluster
  names:
    kind: XTenant
    plural: xtenants
    singular: xtenant
    listKind: XTenantList
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - tenantId
            properties:
              tenantId:
                type: string
                description: "The tenant's id in beacon's pooled database (the pending row its signup\
                  \ created). The bucket name carries its first 8 hex digits (beacon \xA7V.49)."
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: tenantId is immutable
              offboard:
                type: boolean
                default: false
                description: "true starts offboarding (beacon \xA7T.27): the tenant's workers stop and\
                  \ its database is dumped to its bucket and verified; status.backup records it. Only\
                  \ then may the XR be deleted."
          status:
            type: object
            properties:
              backup:
                type: string
                description: s3:// URI of the verified offboarding dump. Set by the composition from the
                  offboard Job, read by the delete guard.
