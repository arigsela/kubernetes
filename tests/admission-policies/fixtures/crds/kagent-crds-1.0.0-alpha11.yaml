                    type: boolean
                  version:
                    description: Version identifies the controller capability catalog
                      entry.
                    minLength: 1
                    type: string
                required:
                - approvals
                - checkpoint
                - dedicatedAgentTools
                - inputRequired
                - interruption
                - maxNativeAgentDepth
                - mcpInjection
