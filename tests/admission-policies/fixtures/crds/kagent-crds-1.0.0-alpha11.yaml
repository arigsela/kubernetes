                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - snapshotPolicy
                - workerPoolRef
                type: object
                x-kubernetes-validations:
                - message: workerPoolRef name must not be empty
                  rule: self.workerPoolRef.name.size() > 0
              workload:
                description: HarnessWorkload identifies the immutable runtime image
                  used by a Harness.
                properties:
                  args:
                    description: Args overrides the image command arguments when set.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  command:
                    description: Command overrides the image entrypoint when set.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  image:
                    description: Image is an OCI image reference pinned by sha256
                      digest.
                    pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                    type: string
                required:
                - image
                type: object
            required:
