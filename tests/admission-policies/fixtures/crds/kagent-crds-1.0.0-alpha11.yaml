            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec pairs portable behavior with a runner. References are local to the
              Agent's namespace, including references nested in inline specs.
            properties:
              harness:
                description: HarnessSpec defines a reusable runtime and its infrastructure
                  policy.
                properties:
                  byo:
                    description: BYOHarness selects an image that implements kagent's
                      private A2A contract.
                    type: object
                  claude:
                    description: ClaudeHarness selects the Claude runtime adapter.
                    type: object
                  codex:
                    description: CodexHarness selects the Codex runtime adapter.
                    type: object
                  env:
                    items:
                      description: RuntimeEnvVar configures one literal runtime environment
                        variable.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        value:
                          description: Value is a literal value, including an empty
                            string.
                          type: string
