apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: modelconfigs.api.kagent.dev
spec:
  group: api.kagent.dev
  names:
    categories:
    - kagent
    kind: ModelConfig
    listKind: ModelConfigList
    plural: modelconfigs
    shortNames:
    - mc
    singular: modelconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: ModelConfig is the Schema for the modelconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelConfigSpec defines the desired state of ModelConfig.
            properties:
              anthropic:
                description: Anthropic-specific configuration
                properties:
                  baseUrl:
                    description: Base URL for the Anthropic API (overrides default)
                    type: string
                  cacheTTL:
                    default: 5m
                    description: |-
                      CacheTTL controls how long Anthropic retains a cached prefix when
                      PromptCaching is enabled. Only meaningful when PromptCaching is true.

                        - "5m" (default): the standard 5-minute cache. Each cache hit refreshes
                          the window, so an agent loop whose calls are less than 5 minutes
                          apart keeps its prefix cached for the whole task.
                        - "1h": the extended 1-hour cache, useful for tasks whose model calls
                          are spaced more than 5 minutes apart.

                      NOTE: "1h" is NOT strictly better than "5m". 1-hour cache writes are
                      billed at a higher per-token rate than 5-minute writes. Only choose
                      "1h" when calls are spaced far enough apart that a 5-minute cache would
                      expire between them; otherwise the higher write cost is wasted. See the
                      Anthropic prompt-caching docs above.
                    enum:
                    - 5m
                    - 1h
                    type: string
                  maxTokens:
                    description: Maximum tokens to generate
                    type: integer
                  promptCaching:
                    default: false
                    description: |-
                      PromptCaching enables Anthropic prompt caching by marking the reusable
                      prefix of every Messages API request with `cache_control` breakpoints:
                      the last tool definition, the last system prompt block and the last
                      content block of the most recent conversation turn. Anthropic caches the
                      prefix up to each breakpoint and bills a cache hit at a fraction of the
                      normal input price on later requests within the TTL. Because the
                      conversation breakpoint moves with every turn, each call of an agent
                      loop reads the whole previous history from the cache and writes only
                      the new turn.

                      Recommended for tool-using agents that make many model calls per task
                      with a stable system prompt and tool set — without it the full history
                      is billed as fresh input on every call. Cache writes are billed at a
                      premium over normal input, so a prefix has to be read at least once to
                      pay off, and each model has a minimum cacheable prefix (1024–4096
                      tokens depending on the model) below which the markers are silently
                      ignored.

                      See https://platform.claude.com/docs/en/build-with-claude/prompt-caching
                      for the current list of supported models, minimum prefix sizes and
                      pricing.
                    type: boolean
                  temperature:
                    description: Temperature for sampling
                    type: string
                  topK:
                    description: Top-k sampling parameter
                    type: integer
                  topP:
                    description: Top-p sampling parameter
                    type: string
                type: object
              anthropicVertexAI:
                description: Anthropic-specific configuration
                properties:
                  location:
                    description: The project location
                    type: string
                  maxTokens:
                    description: Maximum tokens to generate
                    type: integer
                  projectID:
                    description: The project ID
                    type: string
                  stopSequences:
                    description: Stop sequences
                    items:
                      type: string
                    type: array
                  temperature:
                    description: Temperature
                    type: string
                  topK:
                    description: Top-k sampling parameter
                    type: string
                  topP:
                    description: Top-p sampling parameter
                    type: string
                required:
                - location
                - projectID
                type: object
              apiKeyPassthrough:
                description: |-
                  APIKeyPassthrough enables forwarding the Bearer token from incoming A2A requests
                  directly to the LLM provider as the API key. This is useful for organizations
                  with federated identity that want to avoid separate secret management.
                  Mutually exclusive with apiKeySecret.
                type: boolean
              apiKeySecret:
                description: |-
                  The name of the secret that contains the API key. Must be a reference to the name of a secret in the same namespace as the referencing ModelConfig.
                  For the SAPAICore provider, the secret must contain two keys: "client_id" and "client_secret"
                  (the OAuth2 client credentials for SAP AI Core). The apiKeySecretKey field is not used for SAPAICore.
                type: string
              apiKeySecretKey:
                description: |-
                  The key in the secret that contains the API key.
                  Not used for the SAPAICore provider (which always reads "client_id" and "client_secret" from the secret).
                type: string
              azureOpenAI:
                description: Azure OpenAI-specific configuration
                properties:
                  apiVersion:
                    description: API version for the Azure OpenAI API
                    type: string
                  azureAdToken:
                    description: Azure AD token for authentication
                    type: string
                  azureDeployment:
                    description: Deployment name for the Azure OpenAI API
                    type: string
                  azureEndpoint:
                    description: Endpoint for the Azure OpenAI API
                    type: string
                  maxTokens:
                    description: Maximum tokens to generate
                    type: integer
                  temperature:
                    description: Temperature for sampling
                    type: string
                  topP:
                    description: Top-p sampling parameter
                    type: string
                required:
                - apiVersion
                - azureEndpoint
                type: object
              bedrock:
                description: AWS Bedrock-specific configuration
                properties:
                  additionalModelRequestFields:
                    description: |-
                      AdditionalModelRequestFields passes model-specific parameters to Bedrock's
                      additionalModelRequestFields in the Converse API. Use this for provider-specific
                      options that are not part of the standard InferenceConfiguration block, such as
