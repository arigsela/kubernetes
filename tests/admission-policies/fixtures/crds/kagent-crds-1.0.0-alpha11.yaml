                    - message: overlapSize requires compactionInterval
                      rule: '!has(self.overlapSize) || has(self.compactionInterval)'
                  memory:
                    description: Memory enables long-term memory for agents using
                      this Harness.
                    properties:
                      modelConfigRef:
                        description: ModelConfigRef references the embedding ModelConfig
                          in the Harness namespace.
                        properties:
                          name:
