# Pod: privileged app container.
apiVersion: v1
kind: Pod
metadata:
  name: priv-pod
  namespace: team-a
  labels:
    app.kubernetes.io/name: priv-pod
spec:
  containers:
  - name: app
    image: registry.local:5000/app:1.2.3
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      privileged: true
