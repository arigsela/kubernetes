# StatefulSet: untagged image (implicitly latest).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: latest-statefulset
  namespace: team-a
  labels:
    app.kubernetes.io/name: latest-statefulset
spec:
  selector:
    matchLabels:
      app: latest-statefulset
  template:
    metadata:
      labels:
        app: latest-statefulset
    spec:
      containers:
      - name: app
        image: nginx
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
