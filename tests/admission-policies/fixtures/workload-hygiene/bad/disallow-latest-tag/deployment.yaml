# Deployment: ':latest' on an init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-deployment
  namespace: team-a
  labels:
    app.kubernetes.io/name: latest-deployment
spec:
  selector:
    matchLabels:
      app: latest-deployment
  template:
    metadata:
      labels:
        app: latest-deployment
    spec:
      initContainers:
      - name: init
        image: busybox:latest
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: app
        image: registry.local:5000/app:1.2.3
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
