# Deployment: CPU limit only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limits-deployment
  namespace: team-a
  labels:
    app.kubernetes.io/name: limits-deployment
spec:
  selector:
    matchLabels:
      app: limits-deployment
  template:
    metadata:
      labels:
        app: limits-deployment
    spec:
      containers:
      - name: app
        image: registry.local:5000/app:1.2.3
        resources:
          limits:
            cpu: 100m
