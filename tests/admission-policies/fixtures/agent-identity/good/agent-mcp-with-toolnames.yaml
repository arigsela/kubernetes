# McpServer tool refs that list their tools explicitly.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: good-agent
  namespace: kagent
spec:
  type: Declarative
  declarative:
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames: [k8s_get_resources]
      - type: Agent
        agent:
          name: k8s-reader
