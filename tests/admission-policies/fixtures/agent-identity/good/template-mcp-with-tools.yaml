# MCP bindings that list their tools explicitly. Good fixtures must pass EVERY policy.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: good-template-tools
  namespace: kagent
  labels:
    capability.homelab/class: read
spec:
  modelConfig:
    name: anthropic-claude-haiku-5-5
  systemPrompt: fixture
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        requireApproval: false
        tools:
          - k8s_get_resources
    - subAgent:
        name: reader
        description: fixture subagent
        templateRef:
          name: k8s-reader
