# No tools at all: an implicit bind-all. Valid class, so ONLY the identity rule fires.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: bad-missing-tools
  namespace: kagent
  labels:
    capability.homelab/class: read
spec:
  modelConfig:
    name: anthropic-claude-haiku-5-5
  systemPrompt: fixture
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        requireApproval: false
