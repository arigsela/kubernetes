# No toolNames at all: an implicit bind-all.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: bad-no-toolnames
  namespace: kagent
  labels:
    capability.homelab/class: read   # valid class: violate ONLY the toolNames rule
spec:
  type: Declarative
  declarative:
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
