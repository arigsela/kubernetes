# The original Kyverno rule's case.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-broad
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: bad-broad
  data:
    - secretKey: token
      remoteRef:
        key: kagent-anthropic
        property: api-key
