# Corpus for bug-investigator (class read; Taskboard's bug investigator on kagent). Not required
# for a read agent (validate-eval-corpus.py asks only propose/write/admin agents for one); kept so
# a prompt or tool change is scored like any acting agent's.
#
# Each question is what the bug-investigator trigger sends: the issue and the facts its script
# gathered, verbatim from the GitHub Action's rehearsal artifacts (arigsela/taskboard runs
# 40532903576 and 40535429555, 2026-10-27). Bug 3 (taskboard #21) was never filed: its facts are
# issue #26's (gathered 17:21 UTC, after #21 went live) with an Overdue report as the ticket.
# Bug 1 (taskboard #15) is left out: it was fixed at HEAD by taskboard #25.
#
# `tool-use` entries: the rubric checks literal markers and the calls, never the judge (§B.33).
# The markers are the verdict, the PR, the file and the rule: what stays true as long as the
# repository history does. Never telemetry results (Loki keeps 30 days) or line numbers.
# The answer keys are the planted bugs' changes, already public in the repository history; no
# answer key from outside the repositories the agent reads is written here.
