    ### PR #4: Archive done tasks after ARCHIVE_DONE_AFTER_DAYS
    By @arigsela, merged 2026-10-27 15:31 UTC, live since ≈ 2026-10-27 15:37 UTC. Merge commit `0b29b6d422ad`.
